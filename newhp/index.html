<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Homepage</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <button class="menu-trigger" id="menuTrigger">
        <span></span><span></span><span></span>
    </button>

    <div class="side-menu" id="sideMenu">
        <div class="side-menu-header">
            <button id="menuClose" class="menu-close">✕</button>
        </div>
        
        <nav class="side-nav">
            <ul class="side-nav-links">
                <li><a href="#home" data-i18n="nav_home"></a></li>
                <li><a href="#about" data-i18n="nav_about"></a></li>
                <li><a href="#projects" data-i18n="nav_projects"></a></li>
                <li><a href="#contact" data-i18n="nav_contact"></a></li>
            </ul>
        </nav>

        <hr class="side-divider">

        <div class="settings">
            <h3 data-i18n="settings_title"></h3>
            
            <div class="setting-item">
                <span data-i18n="mode_label"></span>
                <div class="switch-container">
                    <input type="checkbox" id="themeToggle" class="switch-input">
                    <label for="themeToggle" class="switch-label">
                        <span class="switch-circle"></span>
                    </label>
                </div>
            </div>

            <div class="setting-item flex-column">
                <span data-i18n="lang_label"></span>
                <div class="lang-selector" id="langSelector">
                    <button data-lang="ja" class="lang-btn">JP</button>
                    <button data-lang="en" class="lang-btn">EN</button>
                    <button data-lang="zh-CN" class="lang-btn">简体</button>
                    <button data-lang="zh-TW" class="lang-btn">繁體</button>
                </div>
            </div>
        </div>
    </div>

    <div class="overlay" id="overlay"></div>

    <header>
        <h1 data-i18n="site_title"></h1>
        <nav class="nav-container">
            <ul class="nav-links" id="navLinks">
                <li><a href="#home" data-i18n="nav_home"></a></li>
                <li><a href="#about" data-i18n="nav_about"></a></li>
                <li><a href="#projects" data-i18n="nav_projects"></a></li>
                <li><a href="#contact" data-i18n="nav_contact"></a></li>
                <li><a href="#etc" data-i18n="nav_etc"></a></li>
            </ul>
            <div class="scroll-indicator" id="scrollIndicator">
                <span>&rsaquo;</span>
            </div>
        </nav>
    </header>

    <main>
        <section id="home" class="tab-content active">
            <h2 data-i18n="nav_home"></h2>
            <p data-i18n="home_text"></p>

            <div class="news-container">
                <h1 data-i18n="news"></h1>
                <div class="news-scroll">
                    <section class="news-item">
                        <img src="image/home1.jpg" alt="1">
                        <h3>Blank</h3>
                    </section>
                    <section class="news-item">
                        <img src="image/home2.jpg" alt="2">
                        <h3>Blank</h3>
                    </section>
                    <section class="news-item">
                        <img src="image/home3.jpg" alt="3">
                        <h3>Blank</h3>
                    </section>
                    <section class="news-item">
                        <img src="image/home4.jpg" alt="4">
                        <h3>Blank</h3>
                    </section>
                </div>
            </div>
        </section>

        <section id="about" class="tab-content">
            <h2 data-i18n="nav_about"></h2>
            <p data-i18n="about_text"></p><br>
        </section>

        <section id="projects" class="tab-content">
            <h2 data-i18n="nav_projects"></h2>
            <p data-i18n="projects_text"></p><br>
        </section>

        <section id="contact" class="tab-content">
            <h2 data-i18n="nav_contact"></h2>
            <p data-i18n="contact_text"></p><br>
           <h2>X</h2>
           <a href="https://x.com/account">account</a><br>
           <a href="https://x.com/account">account</a><br>
           <a href="https://x.com/account">account</a><br>
           <h2>Blue Sky</h2>
           <a href="https://bsky.app/profile/account.bsky.social">account</a><br>
           <h2>Discord</h2>
           <a href="https://discord.com/user/account">account</a><br>
           <h2>Reddit</h2>
           <a href="https://reddit.com/account">account</a><br>
           <h2>note</h2>
           <a href="https://note.com/account">account</a><br>
           <h2>youtube</h2>
           <a href="https://youtube.com/account">account</a><br>
           <h2>spotify</h2>
           <a href="https://spotify.com/account">account</a><br>
        </section>
    </main>

    <footer>
        <p>© 2026 Your Name</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
