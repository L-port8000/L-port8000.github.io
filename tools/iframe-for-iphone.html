        toast('インポートしました（' + done.join(' / ') + '）');
        return true;
      }

      function pickImportFile() {
        const input = document.createElement('input');
        input.type = 'file';
        input.accept = '.json,application/json';
        input.style.display = 'none';
        input.addEventListener('change', () => {
          const file = input.files && input.files[0];
          input.remove();
          if (!file) return;
          const reader = new FileReader();
          reader.onload = () => importFromText(String(reader.result || ''));
          reader.onerror = () => toast('ファイルを読み込めませんでした');
          reader.readAsText(file);
        });
        document.body.appendChild(input);
        input.click();
      }

      function copyJsonSheet() {
        const area = document.getElementById('jsonArea');
        if (!area || !area.value) { toast('コピーする内容がありません'); return; }
        area.focus();
        area.select();
        let copied = false;
        try { copied = document.execCommand('copy'); } catch (_) { copied = false; }
        if (copied) { toast('コピーしました'); return; }
        if (navigator.clipboard) {
          navigator.clipboard.writeText(area.value)
            .then(() => toast('コピーしました'))
            .catch(() => toast('コピーできませんでした。手動で選択してください'));
        } else {
          toast('コピーできませんでした。手動で選択してください');
        }
      }

      function importJsonSheet() {
        const area = document.getElementById('jsonArea');
        const text = area ? area.value.trim() : '';
        if (!text) { toast('JSONが空です'); return; }
        if (importFromText(text)) { state.overlay = null; renderOverlay(); }
      }

      /* ---- 二本指ピンチズーム ---- */
      function touchDistance(t1, t2) {
        return Math.hypot(t1.clientX - t2.clientX, t1.clientY - t2.clientY) || 1;
      }

      function canCustomZoom() {
        return !!(state.settings.pinchZoom && !INTERNAL_URLS.includes(activeTab().url));
      }

      function initGestures() {
        document.addEventListener('touchstart', event => {
          if (event.touches && event.touches.length === 2 && canCustomZoom()) {
            pinchState = { distance: touchDistance(event.touches[0], event.touches[1]), zoom: activeTab().zoom };
          } else {
            pinchState = null;
          }
        }, { passive: true });

        document.addEventListener('touchmove', event => {
          if (!pinchState || !event.touches || event.touches.length !== 2) return;
          const distance = touchDistance(event.touches[0], event.touches[1]);
          setZoom(pinchState.zoom * (distance / pinchState.distance));
          if (event.cancelable) event.preventDefault();
        }, { passive: false });

        document.addEventListener('touchend', () => { if (pinchState) persist(); pinchState = null; }, { passive: true });
        document.addEventListener('touchcancel', () => { if (pinchState) persist(); pinchState = null; }, { passive: true });

        document.addEventListener('gesturestart', event => {
          if (!canCustomZoom()) return;
          safariPinch = { zoom: activeTab().zoom, scale: event.scale || 1 };
          event.preventDefault();
        });
        document.addEventListener('gesturechange', event => {
          if (!safariPinch) return;
          setZoom(safariPinch.zoom * ((event.scale || 1) / safariPinch.scale));
          event.preventDefault();
        });
        document.addEventListener('gestureend', () => { if (safariPinch) persist(); safariPinch = null; });

        window.addEventListener('wheel', event => {
          if (!event.ctrlKey || !canCustomZoom()) return;
          event.preventDefault();
          setZoom(activeTab().zoom * (event.deltaY < 0 ? 1.12 : 1 / 1.12));
        }, { passive: false });

        window.addEventListener('resize', () => { layoutAll(); });
        window.addEventListener('orientationchange', () => { setTimeout(layoutAll, 250); });
      }

      function renderSuggestions(value) {
        const root = document.getElementById('suggestions');
        if (!root) return;
        const query = String(value || '').trim().toLowerCase();
        if (!query) { root.innerHTML = ''; return; }
        const combined = [
          ...state.bookmarks.map(item => ({ ...item, kind: 'ブックマーク' })),
          ...state.historyItems.map(item => ({ ...item, kind: '履歴' }))
        ];
        const seen = new Set();
        const found = combined.filter(item => {
          if (seen.has(item.url)) return false;
          const match = item.title.toLowerCase().includes(query) || item.url.toLowerCase().includes(query);
          if (match) seen.add(item.url);
          return match;
        }).slice(0, 6);
        root.innerHTML = found.map(item => `
          <button type="button" class="suggestion" data-action="navigate" data-url="${encoded(item.url)}">${siteIcon(item.url)}<span class="suggestion-copy"><strong>${esc(item.title)}</strong><small>${esc(displayUrl(item.url))}</small></span><span class="suggestion-kind">${item.kind}</span></button>`).join('');
      }

      async function shareCurrent() {
        const tab = activeTab();
        if (navigator.share) {
          try { await navigator.share({ title: tab.title, url: tab.url }); return; } catch (error) { if (error && error.name === 'AbortError') return; }
        }
        state.overlay = 'share';
        renderOverlay();
      }

      async function copyCurrentUrl() {
        const text = activeTab().url;
        try {
          await navigator.clipboard.writeText(text);
        } catch (_) {
          const textarea = document.createElement('textarea');
          textarea.value = text;
          textarea.style.position = 'fixed';
          textarea.style.opacity = '0';
          document.body.appendChild(textarea);
          textarea.select();
          document.execCommand('copy');
          textarea.remove();
        }
        state.overlay = null;
        renderOverlay();
        toast('アドレスをコピーしました');
      }

      document.addEventListener('submit', event => {
        if (event.target.id !== 'addressForm') return;
        event.preventDefault();
        const input = document.getElementById('addressInput');
        navigate(input ? input.value : state.addressDraft);
      });

      document.addEventListener('focusin', event => {
        if (event.target.id !== 'addressInput') return;
        state.addressFocused = true;
        const tab = activeTab();
        state.addressDraft = INTERNAL_URLS.includes(tab.url) ? '' : tab.url;
        event.target.value = state.addressDraft;
        requestAnimationFrame(() => event.target.select());
        renderSuggestions(event.target.value);
      });

      document.addEventListener('focusout', event => {
        if (event.target.id !== 'addressInput') return;
        setTimeout(() => {
          state.addressFocused = false;
          const input = document.getElementById('addressInput');
          if (input) input.value = displayUrl(activeTab().url);
          renderSuggestions('');
        }, 120);
      });

      document.addEventListener('input', event => {
        if (event.target.id === 'addressInput') {
          state.addressDraft = event.target.value;
          renderSuggestions(event.target.value);
        }
        if (event.target.id === 'zoomRange') setZoomAll(Number(event.target.value) / 100);
        if (event.target.id === 'heightRange') setAppHeight(Number(event.target.value));
        if (event.target.id === 'contentRange') setContentOffsetY(Number(event.target.value));
      });

      document.addEventListener('change', event => {
        if (event.target.id === 'addressPosition') {
          setAddressPosition(event.target.value);
        }
        if (event.target.id === 'proxySelect') {
          state.settings.proxyId = event.target.value;
          persist();
          toast('接続方法を変更しました');
        }
        if (event.target.id === 'importMode') {
          state.settings.importMode = event.target.value;
          persist();
        }
      });

      document.addEventListener('click', event => {
        const button = event.target.closest('[data-action]');
        if (!button || button.disabled) return;
        const action = button.dataset.action;
        if (action === 'close-overlay' && event.target.closest('[data-panel]') && button === event.target.closest('.overlay')) return;

        if (action === 'back') goHistory(-1);
        if (action === 'forward') goHistory(1);
        if (action === 'reload') { state.overlay = null; renderOverlay(); reload(); }
        if (action === 'stop') finishLoading();
        if (action === 'share') shareCurrent();
        if (action === 'bookmarks') { state.overlay = 'bookmarks'; renderOverlay(); }
        if (action === 'tabs') { state.overlay = 'tabs'; renderOverlay(); }
        if (action === 'page-menu') { state.overlay = state.overlay === 'page' ? null : 'page'; renderChrome(); renderOverlay(); }
        if (action === 'close-overlay') { state.overlay = null; renderChrome(); renderOverlay(); }
        if (action === 'navigate') navigate(decodeURIComponent(button.dataset.url || ''));
        if (action === 'focus-address') { const input = document.getElementById('addressInput'); input && input.focus(); }
        if (action === 'zoom-out') setZoom(activeTab().zoom / 1.2);
        if (action === 'zoom-in') setZoom(activeTab().zoom * 1.2);
        if (action === 'zoom-reset') setZoom(1);
        if (action === 'zoom-step') setZoomAll(sliderZoom() + Number(button.dataset.step) / 100);
        if (action === 'zoom-set') setZoomAll(Number(button.dataset.step) / 100);
        if (action === 'height-step') setAppHeight(clampOffset(state.settings.heightOffset) + Number(button.dataset.step));
        if (action === 'height-set') setAppHeight(Number(button.dataset.step));
        if (action === 'content-step') setContentOffsetY(clampOffset(state.settings.contentOffsetY) + Number(button.dataset.step));
        if (action === 'content-set') setContentOffsetY(Number(button.dataset.step));
        if (action === 'toggle-zoomfit') { state.settings.zoomFit = !state.settings.zoomFit; layoutAll(); refreshInternal(activeTab()); persist(); }
        if (action === 'toggle-pinch') { state.settings.pinchZoom = !state.settings.pinchZoom; refreshInternal(activeTab()); persist(); }
        if (action === 'data-sheet') { state.overlay = 'data'; renderOverlay(); }
        if (action === 'toggle-export') {
          const key = button.dataset.key;
          if (key) state.exportSections[key] = !state.exportSections[key];
          renderOverlay();
        }
        if (action === 'export-file') exportSelected();
        if (action === 'export-show') showSelectedJSON();
        if (action === 'import-pick') pickImportFile();
        if (action === 'import-paste') { state.jsonTitle = 'JSONを貼り付けてインポート'; state.jsonText = ''; state.overlay = 'json'; renderOverlay(); }
        if (action === 'json-copy') copyJsonSheet();
        if (action === 'json-import') importJsonSheet();
        if (action === 'toggle-bookmark') toggleBookmark();
        if (action === 'start') navigate(START_URL);
        if (action === 'settings') navigate(SETTINGS_URL);
        if (action === 'open-history') navigate(HISTORY_URL);
        if (action === 'toggle-dark') {
          state.settings.darkMode = !state.settings.darkMode;
          state.overlay = null;
          applyTheme(); renderChrome(); renderOverlay();
          refreshInternal(activeTab());
          persist();
        }
        if (action === 'toggle-downloads') { state.settings.allowDownloads = !state.settings.allowDownloads; renderStage(); refreshInternal(activeTab()); persist(); }
        if (action === 'toggle-popups') { state.settings.blockPopups = !state.settings.blockPopups; renderStage(); refreshInternal(activeTab()); persist(); }
        if (action === 'clear-history') { state.historyItems = []; renderStage(); refreshInternal(activeTab()); persist(); toast('履歴を消去しました'); }
        if (action === 'delete-history') { state.historyItems = state.historyItems.filter(item => item.id !== button.dataset.id); renderStage(); refreshInternal(activeTab()); persist(); }
        if (action === 'delete-bookmark') { state.bookmarks = state.bookmarks.filter(item => item.id !== button.dataset.id); renderOverlay(); persist(); }
        if (action === 'copy-url') copyCurrentUrl();
        if (action === 'duplicate-tab') addTab(activeTab().url);
        if (action === 'new-tab') addTab();
        if (action === 'switch-tab') switchTab(button.dataset.id);
        if (action === 'close-tab') closeTab(button.dataset.id);
        if (action === 'private') {
          state.privateMode = !state.privateMode;
          applyTheme();
          renderOverlay();
          if (activeTab().url === START_URL) refreshInternal(activeTab());
        }
      });

      initGestures();
      shell();
    })();
  </script>
</body>
</html>
