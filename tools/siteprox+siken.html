header{

.container{

.controls{

input,select{
  background:var(--panel);
  border:1px solid var(--border);
  color:white;
  padding:12px 14px;
  border-radius:10px;
  outline:none;
}

input:focus,
select:focus{
  border-color:var(--accent);
}

.list{
  display:flex;
  flex-direction:column;
  gap:10px;
}

.proxy-row{
  display:grid;

  grid-template-columns:
  2fr
  1fr
  1.2fr
  0.7fr
  0.7fr
  1fr
  0.8fr

  align-items:center;

  gap:14px;

  background:var(--panel);

  border:1px solid var(--border);

.proxy-row:hover{

.domain{

}

.type{

}

.speed{

}

.region{

.youtube-ok{

}

.youtube-mid{
  color:#facc15;
  font-weight:600;
}

.youtube-ng{

}

.status-up{
  color:var(--success);
  font-weight:600;
}

.status-down{
  color:var(--danger);
  font-weight:600;
}

.actions{
  display:flex;
  gap:8px;
}

button{
  border:none;
  background:#1e293b;
  color:white;
  padding:9px 12px;
  border-radius:8px;
  cursor:pointer;
  transition:0.2s;
  font-size:13px;
}

button:hover{
  background:#334155;
}

#overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.85);
  display:none;
  z-index:9999;
  padding:20px;
}

#frameWrap{
  width:100%;
  height:100%;
  background:white;
  border-radius:14px;
  overflow:hidden;
  position:relative;
}

#frame{
  width:100%;
  height:100%;
  border:none;
}

#closeBtn{
  position:absolute;
  top:12px;
  right:12px;

  width:40px;
  height:40px;

  border-radius:10px;

  background:rgba(0,0,0,0.5);
}

.mobile-label{
  display:none;
}

@media(max-width:1200px){

  .proxy-row{
    grid-template-columns:1fr;
    gap:8px;
  }

  .mobile-label{
    display:inline;
    color:var(--muted);
    margin-right:6px;
  }

  .actions{
    margin-top:6px;
  }

}

async function check(domain){

function buildTypeFilter(){

)].sort();

types.forEach(t=>{

document.createElement("option");

opt.value=t;
opt.textContent=t;

select.appendChild(opt);

});

}

function buildRegionFilter(){

document.getElementById("regionFilter");

[...new Set(
proxies.map(p=>p.region)
)].sort();

opt.value=r;
opt.textContent=r;

select.appendChild(opt);

});

}
