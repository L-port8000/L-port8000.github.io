<html lang="ja">
<head>
<meta charset="UTF-8">
<title>PDF画像抽出</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

<style>
body {
    font-family: sans-serif;
    padding: 30px;
    background:#f8f9fa;
    color:#333;
}

.card {
    max-width: 700px;
    margin:auto;
    background:white;
    padding:25px;
    border-radius:12px;
    box-shadow:0 4px 20px rgba(0,0,0,0.08);
}

.control-group {
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
    margin-bottom:20px;
}

label {
    font-size:0.85rem;
    font-weight:bold;
    margin-bottom:5px;
    display:block;
}

select,input {
    width:100%;
    padding:10px;
    border:1px solid #ddd;
    border-radius:6px;
}

button {
    width:100%;
    padding:12px;
    background:#007bff;
    color:white;
    border:none;
    border-radius:6px;
    font-weight:bold;
    cursor:pointer;
}

button:hover { background:#0056b3; }

#status {
    margin:15px 0;
    text-align:center;
    color:#666;
}

.image-row {
    display:flex;
    align-items:center;
    margin-bottom:15px;
    gap:10px;
}

.image-row img {
    max-width:70%;
    border:1px solid #ddd;
    border-radius:6px;
}

.download-btn {
    background:#28a745;
}

#bulk-download {
    margin-top:20px;
}
</style>
</head>

<body>

<div class="card">
<h2>PDF画像抽出ツール</h2>

<div class="control-group">
    <div>
        <label>PDFファイル</label>
        <input type="file" id="file" accept="application/pdf">
    </div>
    <div>
        <label>ターゲット解像度（フォールバック用）</label>
        <select id="res-select">
            <option value="720">720p</option>
            <option value="1080" selected>1080p</option>
            <option value="1440">1440p</option>
            <option value="2160">2160p</option>
        </select>
    </div>
</div>

<button id="extract">画像抽出</button>

<div id="status">ファイルを選択してください</div>
<div id="images"></div>

<button id="bulk-download" style="display:none;">一括ダウンロード</button>
</div>

<script>
const pdfjsLib = window['pdfjs-dist/build/pdf'];
pdfjsLib.GlobalWorkerOptions.workerSrc =
'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

const extractBtn = document.getElementById("extract");
const fileInput = document.getElementById("file");
const imagesDiv = document.getElementById("images");
const status = document.getElementById("status");
const bulkBtn = document.getElementById("bulk-download");
const resSelect = document.getElementById("res-select");

let extractedImages = [];

extractBtn.onclick = async () => {
    const file = fileInput.files[0];
    if (!file) {
        status.innerText = "ファイルを選択してください";
        return;
    }

    const targetHeight = parseInt(resSelect.value);

    imagesDiv.innerHTML = "";
    extractedImages = [];
    bulkBtn.style.display = "none";

    status.innerText = "PDF解析中...";

    const reader = new FileReader();

    reader.onload = async function() {
        try {
            const pdf = await pdfjsLib.getDocument(new Uint8Array(this.result)).promise;

            for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
                status.innerText = `ページ ${pageNum} 処理中...`;

                let foundImage = false;

                const page = await pdf.getPage(pageNum);
                const ops = await page.getOperatorList();

                for (let i = 0; i < ops.fnArray.length; i++) {

                    if (ops.fnArray[i] === pdfjsLib.OPS.paintImageXObject) {

                        try {
                            const imgName = ops.argsArray[i][0];
                            const img = await page.objs.get(imgName);

                            const canvas = document.createElement("canvas");
                            const ctx = canvas.getContext("2d");

                            canvas.width = img.width;
                            canvas.height = img.height;

                            if (img instanceof ImageData) {
                                ctx.putImageData(img, 0, 0);
                            } else if (img.data) {
                                const imageData = new ImageData(
                                    new Uint8ClampedArray(img.data),
                                    img.width,
                                    img.height
                                );
                                ctx.putImageData(imageData, 0, 0);
                            } else {
                                continue;
                            }

                            const url = canvas.toDataURL("image/png");

                            extractedImages.push(url);
                            addImage(url, extractedImages.length);

                            foundImage = true;

                        } catch (e) {}
                    }
                }

                if (!foundImage) {
                    const baseViewport = page.getViewport({ scale: 1.0 });
                    const scale = targetHeight / baseViewport.height;
                    const viewport = page.getViewport({ scale });

                    const canvas = document.createElement("canvas");
                    const ctx = canvas.getContext("2d");

                    canvas.width = viewport.width;
                    canvas.height = viewport.height;

                    await page.render({ canvasContext: ctx, viewport }).promise;

                    const quality = targetHeight >= 1440 ? 0.95 : 0.85;
                    const url = canvas.toDataURL("image/jpeg", quality);

                    extractedImages.push(url);
                    addImage(url, extractedImages.length);
                }
            }

            status.innerText = "完了！";
            bulkBtn.style.display = "block";

        } catch (e) {
            console.error(e);
            status.innerText = "エラー：PDFを処理できませんでした";
        }
    };

    reader.readAsArrayBuffer(file);
};

function addImage(src, index) {
    const row = document.createElement("div");
    row.className = "image-row";

    const img = document.createElement("img");
    img.src = src;

    const btn = document.createElement("button");
    btn.innerText = "ダウンロード";
    btn.className = "download-btn";

    btn.onclick = () => {
        const a = document.createElement("a");
        a.href = src;
        a.download = `image_${index}.jpg`;
        a.click();
    };

    row.appendChild(img);
    row.appendChild(btn);
    imagesDiv.appendChild(row);
}

bulkBtn.onclick = async () => {
    const zip = new JSZip();

    extractedImages.forEach((img, i) => {
        const base64 = img.split(",")[1];
        zip.file(`image_${i+1}.jpg`, base64, { base64: true });
    });

    const blob = await zip.generateAsync({ type: "blob" });

    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "images.zip";
    a.click();
};
</script>

</body>
</html>
