<html lang="ja"><head><meta charset="UTF-8">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,'Hiragino Sans',sans-serif;background:#000;}
:root{--bg:#1c1c1e;--card:#2c2c2e;--sub:#ebebf5aa;--blue:#0a84ff;--sep:#38383a;--red:#ff453a;}
.phone{width:100%;max-width:393px;margin:0 auto;background:var(--bg);color:#fff;min-height:820px;position:relative;overflow:hidden;}
.sb{display:flex;justify-content:space-between;align-items:center;padding:15px 20px 4px;font-size:15px;font-weight:700;}
.sb .ic{display:flex;gap:5px;align-items:center;font-size:13px;font-weight:500;}
.nav{display:flex;justify-content:space-between;align-items:center;padding:4px 16px 8px;}
.nav .bk{color:var(--blue);font-size:16px;display:flex;align-items:center;gap:2px;cursor:pointer;}
.nav .ti{font-size:17px;font-weight:600;text-align:center;flex:1;}
.nav .ri{color:var(--blue);font-size:15px;min-width:44px;text-align:right;}
.seg-wrap{margin:4px 16px 0;}
.seg-bg{background:#3a3a3c;border-radius:9px;padding:2px;display:flex;}
.sb-btn{flex:1;padding:6px 0;border:none;border-radius:7px;font-size:15px;font-weight:500;cursor:pointer;background:transparent;color:#8e8e93;}
.sb-btn.on{background:#636366;color:#fff;}
.sc{overflow-y:auto;padding-bottom:40px;}
.sh{padding:12px 16px 4px;}
.sh .l{font-size:12px;color:var(--sub);}
.sh .sl{font-size:13px;color:var(--sub);margin-top:1px;}
.sh .bg{font-size:36px;font-weight:700;letter-spacing:-1.5px;line-height:1.1;margin-top:1px;}
.cw{padding:2px 0 2px 8px;}
.sep{height:.5px;background:var(--sep);}
.cr{display:flex;gap:12px;padding:8px 16px 6px;flex-wrap:wrap;}
.ci{display:flex;align-items:flex-start;gap:5px;}
.cd{width:8px;height:8px;border-radius:2px;flex-shrink:0;margin-top:3px;}
.cn{font-size:11px;font-weight:500;}
.ct{font-size:13px;font-weight:500;color:#fff;margin-top:1px;}
.tr{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;}
.ut{padding:6px 16px;font-size:12px;color:var(--sub);}
.ah{display:flex;justify-content:space-between;align-items:center;padding:10px 16px 4px;}
.ah .t{font-size:15px;}
.ah a{color:var(--blue);font-size:14px;cursor:pointer;}
.ar{display:flex;align-items:center;gap:12px;padding:9px 16px;border-bottom:.5px solid var(--sep);}
.ar:last-child{border-bottom:none;}
.ai{width:38px;height:38px;border-radius:9px;overflow:hidden;flex-shrink:0;background:#3a3a3c;display:flex;align-items:center;justify-content:center;font-size:20px;}
.ai img{width:100%;height:100%;object-fit:cover;}
.an{flex:1;min-width:0;}
.an .nm{font-size:15px;}
.bw{height:2px;background:#ffffff15;border-radius:1px;margin-top:5px;}
.bf{height:2px;border-radius:1px;background:#636366;}
.at{font-size:13px;color:var(--sub);white-space:nowrap;}
.cv{color:#ffffff25;font-size:20px;line-height:1;}
.toast{position:absolute;bottom:16px;left:50%;transform:translateX(-50%) translateY(40px);background:#30d158;color:#fff;padding:7px 20px;border-radius:20px;font-size:13px;font-weight:600;opacity:0;transition:all .3s;pointer-events:none;white-space:nowrap;z-index:200;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.ld{position:absolute;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:300;color:var(--sub);font-size:14px;flex-direction:column;gap:10px;}
.sp2{position:absolute;top:0;left:0;right:0;bottom:0;background:var(--bg);z-index:100;overflow-y:auto;transform:translateX(-100%);transition:transform .28s cubic-bezier(.4,0,.2,1);}
.sp2.open{transform:translateX(0);}
.ss{margin:12px 16px 0;}
.sl2{font-size:12px;color:var(--sub);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px;padding:0 4px;}
.sh2{font-size:11px;color:var(--sub);padding:2px 4px 0;opacity:.7;}
.sc2{background:var(--card);border-radius:10px;overflow:hidden;}
.sr{display:flex;align-items:center;padding:9px 13px;gap:10px;border-bottom:.5px solid var(--sep);}
.sr:last-child{border-bottom:none;}
.sr label{font-size:13px;color:var(--sub);min-width:96px;flex-shrink:0;}
.sr input,.sr select{flex:1;background:#ffffff10;border:.5px solid #ffffff20;border-radius:7px;color:#fff;padding:4px 9px;font-size:13px;min-width:0;outline:none;}
.sr input[type=number]{flex:none;width:68px;}
.abt{display:block;width:calc(100% - 32px);margin:14px 16px;background:var(--blue);color:#fff;border:none;border-radius:12px;padding:12px;font-size:16px;font-weight:600;cursor:pointer;}
.asr{display:grid;grid-template-columns:40px 1fr 58px 18px;gap:6px;align-items:center;padding:9px 13px;border-bottom:.5px solid var(--sep);}
.asr:last-child{border-bottom:none;}
.asi{width:36px;height:36px;border-radius:8px;overflow:hidden;background:#3a3a3c;display:flex;align-items:center;justify-content:center;font-size:18px;cursor:pointer;border:.5px dashed #ffffff30;flex-shrink:0;}
.asi img{width:100%;height:100%;object-fit:cover;}
.asi2{display:flex;flex-direction:column;gap:4px;min-width:0;}
.asi2 input,.asi2 select{background:#ffffff10;border:.5px solid #ffffff20;border-radius:6px;color:#fff;padding:3px 7px;font-size:12px;width:100%;outline:none;}
.db{color:var(--red);font-size:17px;cursor:pointer;text-align:center;}
.ab{background:#ffffff10;border:.5px solid #ffffff30;border-radius:8px;color:var(--blue);font-size:14px;padding:8px;cursor:pointer;margin:7px 16px 0;width:calc(100% - 32px);}
.hg{display:grid;grid-template-columns:1fr 1fr;gap:5px;padding:9px 13px;}
.hc{display:flex;align-items:center;gap:5px;}
.hc label{color:var(--sub);font-size:12px;width:32px;flex-shrink:0;}
.hc input{background:#ffffff10;border:.5px solid #ffffff20;border-radius:5px;color:#fff;padding:3px 6px;font-size:12px;width:52px;outline:none;}
.hc input:disabled{opacity:.25;pointer-events:none;}
.wg{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;padding:9px 13px;}
.wc{display:flex;flex-direction:column;align-items:center;gap:2px;}
.wc .wl{font-size:11px;color:var(--sub);}
.wc input{background:#ffffff10;border:.5px solid #ffffff20;border-radius:5px;color:#fff;padding:3px 2px;font-size:11px;width:100%;text-align:center;outline:none;}
.wc input:disabled{opacity:.25;pointer-events:none;}
</style>
</head><body>
<div class="phone">
  <div class="ld" id="ld">

    <span>読み込み中...</span>

  <div class="sb"><span id="clk">16:57</span><span class="ic"><svg width="16" height="11" viewBox="0 0 16 11" fill="white"><rect x="0" y="3" width="2.5" height="8" rx=".8"/><rect x="4.3" y="1.5" width="2.5" height="9.5" rx=".8"/><rect x="8.6" y="0" width="2.5" height="11" rx=".8"/><rect x="12.9" y="0" width="2.5" height="11" rx=".8" opacity=".28"/></svg>4G<svg width="25" height="12" viewBox="0 0 25 12" fill="none"><rect x=".5" y=".5" width="22" height="11" rx="2.5" stroke="white" stroke-opacity=".35"/><rect x="1.5" y="1.5" width="17" height="9" rx="1.8" fill="white"/><rect x="24" y="3.5" width="1.5" height="5" rx=".75" fill="white" opacity=".4"/></svg></span></div>
  <div class="nav">
    <div class="bk" onclick="openS()"><svg width="9" height="15" viewBox="0 0 9 15" fill="none"><path d="M7.5 1.5L1.5 7.5l6 6" stroke="#0a84ff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>設定</div>
    <div class="ti" id="dtitle">すべてのデバイス</div>
    <div class="ri">デバイス</div>
  </div>
  <div class="seg-wrap"><div class="seg-bg">

  </div></div>
  <div class="sc">
    <div id="tW" style="display:none;">
      <div class="sh"><div class="l">スクリーンタイム</div><div class="sl" id="wSub">1日の平均</div><div class="bg" id="wBig">--</div></div>
      <div class="cw"><canvas id="wChart" height="95" style="cursor:pointer;"></canvas></div>
      <div class="cr" id="wLeg"></div>
      <div class="sep"></div>
      <div class="tr"><span style="font-size:15px;color:var(--sub);">スクリーンタイムの合計</span><span style="font-size:15px;font-weight:600;" id="wTot">--</span></div>
      <div class="sep"></div>
      <div class="ut" id="wUpd">前回のアップデート：--</div>
      <div class="sep"></div>
      <div class="ah"><span class="t">よく使われたもの</span><a>カテゴリを表示</a></div>
      <div id="alW"></div>
    </div>
    <div id="tD">
      <div class="sh"><div class="l">スクリーンタイム</div><div class="sl" id="todLbl">今日、--</div><div class="bg" id="dBig">--</div></div>
      <div class="cw"><canvas id="wChartD" height="80"></canvas></div>
      <div style="height:.5px;background:var(--sep);margin:2px 16px;"></div>
      <div class="cw"><canvas id="dChart" height="105"></canvas></div>
      <div class="cr" id="dLeg"></div>

      <div class="ut" id="dUpd">前回のアップデート：--</div>

  </div>
  <div class="toast" id="toast">保存しました ✓</div>

  <div class="sp2" id="sp2">
    <div class="sb"><span id="sclk">16:57</span><span class="ic">4G<svg width="25" height="12" viewBox="0 0 25 12" fill="none"><rect x=".5" y=".5" width="22" height="11" rx="2.5" stroke="white" stroke-opacity=".35"/><rect x="1.5" y="1.5" width="17" height="9" rx="1.8" fill="white"/><rect x="24" y="3.5" width="1.5" height="5" rx=".75" fill="white" opacity=".4"/></svg></span></div>
    <div class="nav">
      <div class="bk" onclick="closeS()"><svg width="9" height="15" viewBox="0 0 9 15" fill="none"><path d="M7.5 1.5L1.5 7.5l6 6" stroke="#0a84ff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>戻る</div>
      <div class="ti">スクリーンタイム設定</div><div></div>
    </div>
    <div style="overflow-y:auto;padding-bottom:40px;">
      <div class="ss"><div class="sl2">デバイス名・日時</div><div class="sc2">
        <div class="sr"><label>デバイス名</label><input id="c_dev" value="すべてのデバイス"></div>
        <div class="sr"><label>今日の日付</label><input id="c_date" value="10月31日"></div>
        <div class="sr"><label>今日の曜日</label><select id="c_day"><option value="0">日曜日</option><option value="1">月曜日</option><option value="2">火曜日</option><option value="3">水曜日</option><option value="4">木曜日</option><option value="5">金曜日</option><option value="6" selected>土曜日</option></select></div>
        <div class="sr"><label>現在の時刻</label><input type="number" min="0" max="23" id="c_hr" value="16"><span style="color:var(--sub);font-size:13px;flex-shrink:0;">時まで表示</span></div>

        <div class="sc2" style="margin-top:5px;"><div class="sr"><label>範囲（分）</label><input type="number" min="1" max="300" id="c_rng" value="30"><span style="color:var(--sub);font-size:13px;flex-shrink:0;">± 分以内</span></div></div></div>
      <div class="ss"><div class="sl2">時間帯別（分）空欄=自動生成</div><div class="sc2" style="margin-top:5px;"><div class="hg" id="hGrid"></div></div></div>
      <div class="ss"><div class="sl2">曜日別合計（分）空欄=自動生成</div><div class="sh2">当日・未来は自動（設定不可）</div><div class="sc2" style="margin-top:5px;"><div class="wg" id="wGrid"></div></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script>
const DAYS=['日','月','火','水','木','金','土'];
const SK='st_v10';

// ─── カテゴリ定義 ───
// ゲーム:オレンジ / ソーシャル:青 / エンタメ:オレンジ(同色) / 仕事:緑 / 読書:紫 / その他:水色
const CATS=[
  {k:'game',  lb:'ゲーム',             col:'#ff9f0a'},
  {k:'social',lb:'ソーシャル',          col:'#0a84ff'},
  {k:'ent',   lb:'エンターテインメント', col:'#ff9f0a'},
  {k:'work',  lb:'仕事効率化',          col:'#30d158'},
  {k:'read',  lb:'読書・辞書',          col:'#bf5af2'},
  {k:'other', lb:'その他',             col:'#5ac8fa'},
];
// カテゴリ正規化（未設定のみotherに）
const nc=c=>(!c)?'other':c;

let S={
  device:'すべてのデバイス',date:'10月31日',upd:'今日 16:56',
  day:6,hr:16,rng:30,
  hourly:Array(24).fill(null),
  weekly:Array(7).fill(null),
  apps:[
    {name:'DQウォーク',mins:210,img:null,cat:'game'},
    {name:'Yahoo!',    mins:38, img:null,cat:'social'},
    {name:'Google',    mins:25, img:null,cat:'work'},
    {name:'LINE',      mins:13, img:null,cat:'social'},
    {name:'Pokémon GO',mins:10, img:null,cat:'game'},
  ]
};
let wAuto=null,selDay=null,CH={w:null,wd:null,d:null};

const fm=m=>{m=Math.round(m);if(m<=0)return '0分';if(m<60)return m+'分';const h=Math.floor(m/60),r=m%60;return r?h+'時間'+r+'分':h+'時間';};
const totM=()=>S.apps.reduce((a,b)=>a+b.mins,0);

function ratios(){
  const tm=totM();
  const bk={game:0,social:0,ent:0,work:0,read:0,other:0};
  S.apps.forEach(a=>{const k=nc(a.cat);bk[k]=(bk[k]||0)+a.mins;});
  if(tm===0)return{game:.2,social:.15,ent:.15,work:.15,read:.15,other:.2};
  const r={};CATS.forEach(c=>r[c.k]=(bk[c.k]||0)/tm);return r;
}

const rnd=range=>Math.floor(Math.random()*(range*2+1))-range;

function genWAuto(){
  const tm=totM(),cd=S.day,rg=S.rng||30;
  return Array.from({length:7},(_,i)=>{
    if(i>cd)return 0;
    if(i===cd)return tm;
    return Math.max(10,tm+rnd(rg));
  });
}
function resW(){
  if(!wAuto)wAuto=genWAuto();
  const tm=totM(),cd=S.day;
  return S.weekly.map((v,i)=>{
    if(i>cd)return 0;
    if(i===cd)return tm;
    return(v!==null&&v!=='')?Number(v):wAuto[i];
  });
}
function resH(){
  const tm=totM(),ch=S.hr;
  const w=[0,0,0,.2,0,.2,1,3.5,6,9,12,17,15,11,8,6,9,12,15,10,6,3.5,1.5,.5];
  const c=w.map((v,i)=>i<=ch?v:0),s=c.reduce((a,b)=>a+b,0);
  const base=s>0?c.map(v=>Math.min(60,Math.max(0,Math.round(v/s*tm)))):Array(24).fill(0);
  return S.hourly.map((v,i)=>{
    if(i>ch)return 0;
    return(v!==null&&v!=='')?Number(v):base[i];
  });
}

const avgP={id:'avgP',afterDraw(chart){
  const p=chart.options?.plugins?.avgP;
  if(!p?.show||!p.val)return;
  const{ctx,chartArea:ca,scales}=chart;
  const yp=scales.y.getPixelForValue(p.val);
  if(yp<ca.top||yp>ca.bottom)return;
  ctx.save();
  ctx.setLineDash([3,3]);ctx.strokeStyle='rgba(255,255,255,.38)';ctx.lineWidth=.8;
  ctx.beginPath();ctx.moveTo(ca.left,yp);ctx.lineTo(ca.right,yp);ctx.stroke();
  ctx.setLineDash([]);ctx.fillStyle='rgba(235,235,245,.52)';
  ctx.font='9px -apple-system,sans-serif';ctx.textAlign='right';ctx.textBaseline='bottom';
  ctx.fillText('平均',ca.right-3,yp-1);ctx.restore();
}};

function bldW(cid,wkly,avg,lid,bH,inter){
  const el=document.getElementById(cid);if(!el)return;
  const ck=cid==='wChart'?'w':cid==='wChartD'?'wd':'d';
  if(CH[ck]){CH[ck].destroy();CH[ck]=null;}
  const R=ratios(),vv=wkly.filter(v=>v>0),yMax=(vv.length?Math.max(...vv):300)*1.28;
  const cd=S.day,showAvg=inter&&selDay===null;
  const ds=CATS.map(c=>({
    data:wkly.map(v=>Math.round(v*(R[c.k]||0))),
    backgroundColor:wkly.map((v,i)=>{
      if(v===0)return 'transparent';
      if(inter)return(selDay===null||i===selDay)?c.col:'#3a3a3c';
      return i===cd?c.col:'#3a3a3c';
    }),
    stack:'s',barThickness:bH||22,borderWidth:0,borderRadius:0,
  }));
  const opts={
    responsive:true,maintainAspectRatio:false,
    plugins:{legend:{display:false},tooltip:{enabled:false},avgP:{show:showAvg,val:avg}},
    scales:{
      x:{ticks:{color:'#ebebf5aa',font:{size:11}},grid:{display:false},border:{display:false}},
      y:{position:'right',min:0,max:yMax,grid:{display:false},border:{display:false},
        ticks:{color:'#ebebf5aa',font:{size:9},maxTicksLimit:3,
          callback:v=>{if(v===0)return '0';const h=Math.floor(v/60);return(h>=1&&v%60===0)?h+'時間':null;}}}
    }
  };
  if(inter){
    opts.onClick=(ev,els)=>{
      if(!els.length)return;
      const idx=els[0].index;if(wkly[idx]===0)return;
      selDay=selDay===idx?null:idx;
      const w2=resW(),pW=w2.filter(v=>v>0);
      const a2=pW.length?Math.round(pW.reduce((a,b)=>a+b,0)/pW.length):0;
      bldW('wChart',w2,a2,'wLeg',22,true);updWHead(w2,a2);
    };
    opts.onHover=(ev,els)=>{if(ev.native)ev.native.target.style.cursor=(els.length&&wkly[els[0].index]>0)?'pointer':'default';};
  }
  CH[ck]=new Chart(el.getContext('2d'),{type:'bar',plugins:[avgP],data:{labels:DAYS,datasets:ds},options:opts});
  if(lid)updWLeg(wkly);
}

function updWHead(wkly,avg){
  const sub=document.getElementById('wSub'),big=document.getElementById('wBig');
  if(!sub||!big)return;
  if(selDay===null){sub.textContent='1日の平均';big.textContent=fm(avg);}
  else{sub.textContent=DAYS[selDay]+'曜日';big.textContent=fm(wkly[selDay]||0);}
}
function updWLeg(wkly){
  const el=document.getElementById('wLeg');if(!el)return;
  const idx=selDay!==null?selDay:S.day,v=wkly[idx]||0,R=ratios();
  const lbl=selDay!==null?DAYS[selDay]+'曜日':'今日';
  // 同色のゲーム+エンタメはまとめて表示しない（重複排除）
  const seen=new Set();
  const items=CATS.filter(c=>{
    if((R[c.k]||0)<=0)return false;
    if(seen.has(c.col)){return false;}
    seen.add(c.col);return true;
  }).slice(0,3);
  el.innerHTML=`<div style="font-size:11px;color:var(--sub);width:100%;margin-bottom:2px;">${lbl}</div>`+
    items.map(c=>`<div class="ci"><div class="cd" style="background:${c.col};"></div>
    <div><div class="cn" style="color:${c.col};">${c.lb}</div>
    <div class="ct">${fm(v*(R[c.k]||0))}</div></div></div>`).join('');
}

function bldD(){
  const el=document.getElementById('dChart');if(!el)return;
  if(CH.d){CH.d.destroy();CH.d=null;}
  const H=resH(),R=ratios();
  CH.d=new Chart(el.getContext('2d'),{
    type:'bar',
    data:{labels:Array.from({length:24},(_,i)=>[0,6,12,18].includes(i)?i+'時':''),
      datasets:CATS.map(c=>({
        data:H.map(v=>Math.round(v*(R[c.k]||0))),
        backgroundColor:H.map(v=>v>0?c.col:'transparent'),
        stack:'s',barThickness:10,borderWidth:0,borderRadius:0,
      }))
    },
    options:{responsive:true,maintainAspectRatio:false,
      plugins:{legend:{display:false},tooltip:{enabled:false}},
      scales:{
        x:{ticks:{color:'#ebebf5aa',font:{size:10},maxRotation:0},grid:{display:false},border:{display:false}},
        y:{position:'right',min:0,max:68,border:{display:false},
          grid:{color:ctx=>{const v=ctx.tick?.value;return(v===30||v===60)?'#ffffff18':'transparent';},drawTicks:false},
          ticks:{color:'#ebebf5aa',font:{size:9},values:[0,30,60],
            callback:v=>{if(v===0)return '0';if(v===30)return '30分';if(v===60)return '60分';return null;}}}
      }}
  });
  const bk=S.apps.reduce((acc,a)=>{const k=nc(a.cat);acc[k]=(acc[k]||0)+a.mins;return acc;},{});
  const seen=new Set();
  document.getElementById('dLeg').innerHTML=CATS.filter(c=>{
    if(!bk[c.k])return false;
    if(seen.has(c.col))return false;
    seen.add(c.col);return true;
  }).map(c=>`<div class="ci"><div class="cd" style="background:${c.col};"></div>
    <div><div class="cn" style="color:${c.col};">${c.lb}</div>
    <div class="ct">${fm(bk[c.k])}</div></div></div>`).join('');
}

function rndApps(){
  ['W','D'].forEach(s=>{
    const el=document.getElementById('al'+s);if(!el)return;
    const mult=s==='W'?7:1;
    const mx=S.apps.reduce((a,b)=>Math.max(a,b.mins*mult),1);
    el.innerHTML=S.apps.map(a=>{
      const d=a.mins*mult,p=Math.round(d/mx*100);
      const ic=a.img?`<img src="${a.img}" alt="">`:(a.name.charAt(0));
      return `<div class="ar"><div class="ai">${ic}</div>
        <div class="an"><div class="nm">${a.name}</div>
        <div class="bw"><div class="bf" style="width:${p}%;"></div></div></div>
        <div class="at">${fm(d)}</div><div class="cv">›</div></div>`;
    }).join('');
  });
}

function renderAll(){
  const wkly=resW(),pW=wkly.filter(v=>v>0);
  const wTot=pW.reduce((a,b)=>a+b,0),wAvg=pW.length?Math.round(wTot/pW.length):0;
  document.getElementById('dtitle').textContent=S.device;
  updWHead(wkly,wAvg);
  document.getElementById('wTot').textContent=fm(wTot);
  document.getElementById('dBig').textContent=fm(totM());
  document.getElementById('todLbl').textContent='今日、'+S.date;
  document.getElementById('wUpd').textContent='前回のアップデート：'+S.upd;
  document.getElementById('dUpd').textContent='前回のアップデート：'+S.upd;
  bldW('wChart',wkly,wAvg,'wLeg',22,true);
  bldW('wChartD',wkly,wAvg,null,20,false);
  bldD();rndApps();
}

function swTab(t){
  const w=t==='week';
  document.getElementById('tW').style.display=w?'block':'none';
  document.getElementById('tD').style.display=w?'none':'block';
  document.getElementById('btnW').classList.toggle('on',w);
  document.getElementById('btnD').classList.toggle('on',!w);
  setTimeout(()=>{
    const wk=resW(),pW=wk.filter(v=>v>0),av=pW.length?Math.round(pW.reduce((a,b)=>a+b,0)/pW.length):0;
    if(w)bldW('wChart',wk,av,'wLeg',22,true);
    else{bldW('wChartD',wk,av,null,20,false);bldD();}
  },30);
}

async function save(){
  try{await window.storage.set(SK,JSON.stringify(S));showT();}catch(e){console.error(e);}
}
async function load(){
  try{
    const r=await window.storage.get(SK);
    if(r?.value){
      const sv=JSON.parse(r.value);
      S={...S,...sv};
      if(!Array.isArray(S.hourly)||S.hourly.length!==24)S.hourly=Array(24).fill(null);
      if(!Array.isArray(S.weekly)||S.weekly.length!==7)S.weekly=Array(7).fill(null);
      if(!Array.isArray(S.apps))S.apps=[];
      if(!S.rng)S.rng=30;
    }
  }catch(e){}
}
function showT(){const t=document.getElementById('toast');t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2000);}

function buildS(){
  document.getElementById('c_dev').value=S.device;
  document.getElementById('c_date').value=S.date;
  document.getElementById('c_day').value=String(S.day);
  document.getElementById('c_hr').value=String(S.hr);
  document.getElementById('c_upd').value=S.upd;
  document.getElementById('c_rng').value=String(S.rng||30);
  document.getElementById('hGrid').innerHTML=Array.from({length:24},(_,i)=>{
    const af=i>S.hr,v=S.hourly[i];
    return `<div class="hc"><label style="${af?'opacity:.3':''}">${i}時</label>
      <input type="number" min="0" max="120" id="hh${i}" value="${(!af&&v!==null)?v:''}" placeholder="自動" ${af?'disabled':''}></div>`;
  }).join('');
  document.getElementById('wGrid').innerHTML=DAYS.map((d,i)=>{
    const lk=i>=S.day,v=S.weekly[i];
    return `<div class="wc"><span class="wl" style="${lk?'opacity:.3':''}">${d}</span>
      <input type="number" min="0" id="ww${i}" value="${(!lk&&v!==null)?v:''}"
        placeholder="${i===S.day?'当日':i>S.day?'未来':'自動'}" ${lk?'disabled':''}></div>`;
  }).join('');
  buildAS();
}
function buildAS(){
  document.getElementById('aList').innerHTML=S.apps.map((a,i)=>`
    <div class="asr" id="ar${i}">
      <div class="asi" onclick="pickI(${i})">${a.img?`<img src="${a.img}">`:(a.name.charAt(0))}
        <input type="file" accept="image/*" id="fi${i}" style="display:none;" onchange="hImg(${i},this)"></div>
      <div class="asi2">
        <input type="text" id="an${i}" value="${a.name}" placeholder="アプリ名">
        <select id="ac${i}">
          <option value="game"   ${nc(a.cat)==='game'?'selected':''}>🎮 ゲーム（オレンジ）</option>
          <option value="social" ${nc(a.cat)==='social'?'selected':''}>💬 ソーシャル（青）</option>
          <option value="ent"    ${nc(a.cat)==='ent'?'selected':''}>🎬 エンタメ（オレンジ）</option>
          <option value="work"   ${nc(a.cat)==='work'?'selected':''}>💼 仕事効率化（緑）</option>
          <option value="read"   ${nc(a.cat)==='read'?'selected':''}>📚 読書（紫）</option>
          <option value="other"  ${nc(a.cat)==='other'?'selected':''}>📱 その他（水色）</option>
        </select>
      </div>
      <input type="number" min="0" id="am${i}" value="${a.mins}"
        style="background:#ffffff10;border:.5px solid #ffffff20;border-radius:6px;color:#fff;padding:4px 7px;font-size:12px;outline:none;">
      <div class="db" onclick="delApp(${i})">×</div>
    </div>`).join('');
}
function pickI(i){document.getElementById('fi'+i).click();}
function hImg(i,inp){
  const f=inp.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=e=>{
    S.apps[i].img=e.target.result;
    const b=document.querySelector(`#ar${i} .asi`);
    b.innerHTML=`<img src="${e.target.result}"><input type="file" accept="image/*" id="fi${i}" style="display:none;" onchange="hImg(${i},this)">`;
  };r.readAsDataURL(f);
}
function addApp(){S.apps.push({name:'新しいアプリ',mins:0,img:null,cat:'other'});buildAS();}
function delApp(i){S.apps.splice(i,1);buildAS();}

async function applyAll(){
  S.device=document.getElementById('c_dev').value;
  S.date=document.getElementById('c_date').value;
  S.day=parseInt(document.getElementById('c_day').value);
  S.hr=parseInt(document.getElementById('c_hr').value);
  S.upd=document.getElementById('c_upd').value;
  S.rng=Math.max(1,parseInt(document.getElementById('c_rng').value)||30);
  for(let i=0;i<24;i++){const v=document.getElementById('hh'+i)?.value?.trim();S.hourly[i]=(v===''||v==null)?null:parseInt(v);}
  for(let i=0;i<7;i++){
    if(i>=S.day){S.weekly[i]=null;continue;}
    const v=document.getElementById('ww'+i)?.value?.trim();S.weekly[i]=(v===''||v==null)?null:parseInt(v);
  }
  S.apps=S.apps.map((a,i)=>({...a,name:document.getElementById('an'+i)?.value||a.name,mins:parseInt(document.getElementById('am'+i)?.value||0),cat:document.getElementById('ac'+i)?.value||a.cat}));
  wAuto=null;selDay=null;
  await save();closeS();renderAll();
}
function openS(){buildS();document.getElementById('sp2').classList.add('open');}
function closeS(){document.getElementById('sp2').classList.remove('open');}
function tick(){const n=new Date(),h=String(n.getHours()).padStart(2,'0'),m=String(n.getMinutes()).padStart(2,'0'),t=h+':'+m;document.getElementById('clk').textContent=t;document.getElementById('sclk').textContent=t;}
tick();setInterval(tick,15000);
async function init(){
  await load();wAuto=genWAuto();
  document.getElementById('ld').style.display='none';
  swTab('day');renderAll();
}
init();
</script>
</body>
</html>
