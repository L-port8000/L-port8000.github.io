  <style>

:root {
  --bg: #16171a;
  --bg-deep: #0d0d0f;
  --surface: #1f2126;
  --surface-2: #2a2c33;
  --border: rgba(255, 255, 255, 0.08);
  --border-strong: rgba(255, 255, 255, 0.14);
  --text: #f5f6f7;
  --text-muted: #9aa0a8;
  --text-dim: #6b7280;
  --primary: #c8f94a;            /* lime */
  --primary-foreground: #1a1f0a;
  --primary-soft: rgba(200, 249, 74, 0.15);
  --primary-border: rgba(200, 249, 74, 0.4);
  --danger: #ff6b6b;
  --danger-soft: rgba(255, 107, 107, 0.12);
  --shadow-1: 0 1px 2px rgba(0, 0, 0, 0.3);
  --shadow-2: 0 4px 20px rgba(0, 0, 0, 0.4);
  --shadow-glow: 0 0 0 4px var(--primary-soft);
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 16px;
  --radius-xl: 20px;
  --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue",
    Arial, "Hiragino Sans", "Noto Sans JP", sans-serif;
  --font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html,
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-sans);
  font-size: 16px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  -webkit-tap-highlight-color: transparent;
  min-height: 100vh;
  overscroll-behavior: none;
}

body {
  padding-top: env(safe-area-inset-top);
  padding-bottom: env(safe-area-inset-bottom);
}

button {
  font-family: inherit;
  cursor: pointer;
  border: none;
  background: none;
  color: inherit;
}

img {
  display: block;
  max-width: 100%;
}

svg {
  width: 100%;
  height: 100%;
}

input[type="range"] {
  -webkit-appearance: none;
  appearance: none;
  background: transparent;
  width: 100%;
}

/* Scrollbar */
::-webkit-scrollbar {
  width: 8px;
  height: 8px;
}
::-webkit-scrollbar-track {
  background: transparent;
}
::-webkit-scrollbar-thumb {
  background: var(--surface-2);
  border-radius: 4px;
}
::-webkit-scrollbar-thumb:hover {
  background: var(--border-strong);
}

/* ============================================================ App shell === */

#app {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  max-width: 100vw;
  overflow-x: hidden;
}

.app-header {
  position: sticky;
  top: 0;
  z-index: 30;
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  background: rgba(22, 23, 26, 0.85);
  border-bottom: 1px solid var(--border);
  padding: 0.75rem 1rem;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 1rem;
}

.brand {
  display: flex;
  align-items: center;
  gap: 0.625rem;
}

.brand-icon {
  width: 36px;
  height: 36px;
  border-radius: 11px;
  background: var(--primary-soft);
  border: 1px solid var(--primary-border);
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--primary);
}
.brand-icon svg {
  width: 20px;
  height: 20px;
}

.brand-text h1 {
  font-size: 1rem;
  font-weight: 600;
  letter-spacing: -0.01em;
  line-height: 1.1;
}
.brand-text p {
  font-size: 11px;
  color: var(--text-muted);
  line-height: 1.1;
}

.header-meta {
  display: flex;
  align-items: center;
  gap: 0.5rem;
}

.count-pill {
  display: inline-flex;
  align-items: center;
  gap: 0.4rem;
  background: var(--surface);
  border: 1px solid var(--border);
  padding: 0.25rem 0.625rem;
  border-radius: 999px;
  font-size: 12px;
  color: var(--text-muted);
}
.count-pill svg {
  width: 14px;
  height: 14px;
  color: var(--primary);
}
.count-pill span {
  font-variant-numeric: tabular-nums;
}

#main {
  flex: 1;
  display: flex;
  flex-direction: column;
  padding-bottom: 5rem;
}

.tab-content {
  flex: 1;
  display: flex;
  flex-direction: column;
}
.tab-content[hidden] {
  display: none;
}

/* ============================================================ Bottom nav == */

.bottom-nav {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  z-index: 30;
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  background: rgba(22, 23, 26, 0.92);
  border-top: 1px solid var(--border);
  display: grid;
  grid-template-columns: 1fr 1fr;
  padding: 0.5rem 1rem max(env(safe-area-inset-bottom), 0.5rem) 1rem;
}

.tab-btn {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0.125rem;
  padding: 0.375rem 0;
  font-size: 12px;
  font-weight: 500;
  color: var(--text-muted);
  transition: color 0.15s ease;
}
.tab-btn:hover {
  color: var(--text);
}
.tab-btn.active {
  color: var(--primary);
}
.tab-btn.active::after {
  content: "";
  position: absolute;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 32px;
  height: 2px;
  border-radius: 1px;
  background: var(--primary);
}
.tab-icon {
  width: 24px;
  height: 24px;
  position: relative;
}
.tab-icon.relative {
  position: relative;
}
.badge {
  position: absolute;
  top: -6px;
  right: -8px;
  min-width: 16px;
  height: 16px;
  padding: 0 4px;
  border-radius: 8px;
  background: var(--primary);
  color: var(--primary-foreground);
  font-size: 10px;
  line-height: 16px;
  font-family: var(--font-mono);
  font-weight: 600;
  text-align: center;
}


.home {
  flex: 1;
  display: flex;
  flex-direction: column;
  padding: 2rem 1.25rem 1.5rem;
  max-width: 480px;
  margin: 0 auto;
  width: 100%;
}

.hero {
  text-align: center;
  margin-bottom: 2rem;
}
.hero-icon {
  width: 80px;
  height: 80px;
  margin: 0 auto 1.25rem;
  border-radius: 20px;
  background: linear-gradient(135deg, rgba(200, 249, 74, 0.18), rgba(200, 249, 74, 0.03));
  border: 1px solid var(--primary-border);
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--primary);
}
.hero-icon svg {
  width: 40px;
  height: 40px;
}
.hero h2 {
  font-size: 1.5rem;
  font-weight: 600;
  letter-spacing: -0.02em;
  margin-bottom: 0.5rem;
}
.hero p {
  font-size: 0.875rem;
  color: var(--text-muted);
  line-height: 1.6;
}

.actions-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 1.25rem;
  box-shadow: var(--shadow-1);
  display: flex;
  flex-direction: column;
  gap: 0.75rem;
}

.divider {
  display: flex;
  align-items: center;
  gap: 0.75rem;
  color: var(--text-muted);
  font-size: 12px;
}
.divider::before,
.divider::after {
  content: "";
  flex: 1;
  height: 1px;
  background: var(--border);
}

  <script>
(function () {
  "use strict";


  const $ = (sel, root = document) => root.querySelector(sel);
  const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));

  function createElement(tag, attrs = {}, children = []) {
    const el = document.createElement(tag);
    Object.entries(attrs).forEach(([k, v]) => {
      if (k === "class") el.className = v;
      else if (k === "style" && typeof v === "object") Object.assign(el.style, v);
      else if (k.startsWith("data-")) el.setAttribute(k, v);
      else if (k === "html") el.innerHTML = v;
      else el[k] = v;
    });
    (Array.isArray(children) ? children : [children]).forEach((c) => {
      if (c == null) return;
      if (typeof c === "string") el.appendChild(document.createTextNode(c));
      else el.appendChild(c);
    });
    return el;
  }

  function svgIcon(pathD, opts = {}) {
    const ns = "http://www.w3.org/2000/svg";
    const svg = document.createElementNS(ns, "svg");
    svg.setAttribute("viewBox", "0 0 24 24");
    svg.setAttribute("fill", "none");
    svg.setAttribute("stroke", "currentColor");
    svg.setAttribute("stroke-width", String(opts.strokeWidth ?? 2));
    svg.setAttribute("stroke-linecap", "round");
    svg.setAttribute("stroke-linejoin", "round");
    if (opts.size) {
      svg.style.width = opts.size + "px";
      svg.style.height = opts.size + "px";
    }
    opts.paths.forEach((d) => {
      const p = document.createElementNS(ns, opts.pathTag ?? "path");
      if (opts.pathTag === "rect" || opts.pathTag === "circle") {
        // not used here
      } else {
        p.setAttribute("d", d);
      }
      svg.appendChild(p);
    });
    return svg;
  }

  function toast(message, type = "info") {
    const container = $("#toaster");
    const t = createElement("div", { class: `toast ${type}` }, [
      createElement("span", { class: "toast-dot" }),
      document.createTextNode(message),
    ]);
    container.appendChild(t);
    setTimeout(() => t.remove(), 3000);
  }

  function debounce(fn, ms) {
    let timer = null;
    return function (...args) {
      clearTimeout(timer);
      timer = setTimeout(() => fn.apply(this, args), ms);
    };
  }

  function loadImageToCanvas(src) {
    return new Promise((resolve, reject) => {
      if (src instanceof HTMLCanvasElement) return resolve(src);
      const img = new Image();
      img.crossOrigin = "anonymous";
      img.onload = () => {
        const canvas = document.createElement("canvas");
        canvas.width = img.naturalWidth;
        canvas.height = img.naturalHeight;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0);
        if (src instanceof Blob) URL.revokeObjectURL(img.src);
        resolve(canvas);
      };
      img.onerror = () => reject(new Error("画像を読み込めませんでした"));
      if (src instanceof Blob) img.src = URL.createObjectURL(src);
      else img.src = src;
    });
  }

  function downscaleCanvas(src, maxLong) {
    const long = Math.max(src.width, src.height);
    if (long <= maxLong) return { canvas: src, scale: 1 };
    const scale = maxLong / long;
    const w = Math.max(1, Math.round(src.width * scale));
    const h = Math.max(1, Math.round(src.height * scale));
    const out = document.createElement("canvas");
    out.width = w;
    out.height = h;
    const ctx = out.getContext("2d");
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = "high";
    ctx.drawImage(src, 0, 0, w, h);
    return { canvas: out, scale };
  }


  function gaussianSolve(A, b) {
    const n = b.length;
    for (let i = 0; i < n; i++) A[i].push(b[i]);
    for (let i = 0; i < n; i++) {
      let maxRow = i;
      let maxVal = Math.abs(A[i][i]);
      for (let k = i + 1; k < n; k++) {
        const v = Math.abs(A[k][i]);
        if (v > maxVal) { maxVal = v; maxRow = k; }
      }
      if (maxRow !== i) { const tmp = A[i]; A[i] = A[maxRow]; A[maxRow] = tmp; }
      const pivot = A[i][i];
      if (Math.abs(pivot) < 1e-12) throw new Error("Singular matrix");
      for (let k = i + 1; k < n; k++) {
        const factor = A[k][i] / pivot;
        for (let j = i; j <= n; j++) A[k][j] -= factor * A[i][j];
      }
    }
    const x = new Array(n).fill(0);
    for (let i = n - 1; i >= 0; i--) {
      let s = A[i][n];
      for (let j = i + 1; j < n; j++) s -= A[i][j] * x[j];
      x[i] = s / A[i][i];
    }
    return x;
  }

  function computeHomography(src, dst) {
    const A = [];
    const b = [];
    for (let i = 0; i < 4; i++) {
      const sx = src[i].x, sy = src[i].y, dx = dst[i].x, dy = dst[i].y;
      A.push([sx, sy, 1, 0, 0, 0, -dx * sx, -dx * sy]); b.push(dx);
      A.push([0, 0, 0, sx, sy, 1, -dy * sx, -dy * sy]); b.push(dy);
    }
    const h = gaussianSolve(A, b);
    return [h[0], h[1], h[2], h[3], h[4], h[5], h[6], h[7], 1];
  }

  function warpPerspective(source, srcCorners, outWidth, outHeight) {
    const dstCorners = [
      { x: 0, y: 0 },
      { x: outWidth, y: 0 },
      { x: outWidth, y: outHeight },
      { x: 0, y: outHeight },
    ];
    const H = computeHomography(dstCorners, srcCorners);
    const [h0, h1, h2, h3, h4, h5, h6, h7, h8] = H;

    const srcCtx = source.getContext("2d", { willReadFrequently: true });
    const srcImg = srcCtx.getImageData(0, 0, source.width, source.height);
    const srcData = srcImg.data;
    const srcW = source.width;
    const srcH = source.height;

    const out = document.createElement("canvas");
    out.width = outWidth;
    out.height = outHeight;
    const outCtx = out.getContext("2d");
    const outImg = outCtx.createImageData(outWidth, outHeight);
    const outData = outImg.data;

    for (let y = 0; y < outHeight; y++) {
      for (let x = 0; x < outWidth; x++) {
        const w = h6 * x + h7 * y + h8;
        const sx = (h0 * x + h1 * y + h2) / w;
        const sy = (h3 * x + h4 * y + h5) / w;
        const outIdx = (y * outWidth + x) * 4;
        const x0 = Math.floor(sx), y0 = Math.floor(sy);
        const x1 = x0 + 1, y1 = y0 + 1;
        if (x0 < 0 || y0 < 0 || x1 >= srcW || y1 >= srcH) {
          outData[outIdx] = outData[outIdx + 1] = outData[outIdx + 2] = 255;
          outData[outIdx + 3] = 255;
          continue;
        }
        const fx = sx - x0, fy = sy - y0;
        const i00 = (y0 * srcW + x0) * 4;
        const i01 = (y0 * srcW + x1) * 4;
        const i10 = (y1 * srcW + x0) * 4;
        const i11 = (y1 * srcW + x1) * 4;
        const w00 = (1 - fx) * (1 - fy), w01 = fx * (1 - fy);
        const w10 = (1 - fx) * fy, w11 = fx * fy;
        for (let c = 0; c < 3; c++) {
          outData[outIdx + c] =
            srcData[i00 + c] * w00 + srcData[i01 + c] * w01 +
            srcData[i10 + c] * w10 + srcData[i11 + c] * w11;
        }
        outData[outIdx + 3] = 255;
      }
    }
    outCtx.putImageData(outImg, 0, 0);
    return out;
  }

  function computeOutputSize(corners, maxLong = 1600) {
    const side = (a, b) => Math.hypot(b.x - a.x, b.y - a.y);
    const top = side(corners[0], corners[1]);
    const right = side(corners[1], corners[2]);
    const bottom = side(corners[2], corners[3]);
    const left = side(corners[3], corners[0]);
    let width = Math.round((top + bottom) / 2);
    let height = Math.round((left + right) / 2);
    if (width <= 0 || height <= 0) {
      width = maxLong;
      height = Math.round(maxLong * 1.414);
    }
    const long = Math.max(width, height);
    if (long > maxLong) {
      const scale = maxLong / long;
      width = Math.round(width * scale);
      height = Math.round(height * scale);
    }
    return { width, height };
  }


  function toGrayscale(imgData) {
    const { data, width, height } = imgData;
    const gray = new Uint8ClampedArray(width * height);
    for (let i = 0; i < width * height; i++) {
      const r = data[i * 4], g = data[i * 4 + 1], b = data[i * 4 + 2];
      gray[i] = (r * 0.299 + g * 0.587 + b * 0.114) | 0;
    }
    return gray;
  }

  function otsuThreshold(gray) {
    const histogram = new Array(256).fill(0);
    for (let i = 0; i < gray.length; i++) histogram[gray[i]]++;
    const total = gray.length;
    let sumAll = 0;
    for (let i = 0; i < 256; i++) sumAll += i * histogram[i];
    let sumBg = 0, weightBg = 0, maxVar = -1, threshold = 127;
    for (let t = 0; t < 256; t++) {
      weightBg += histogram[t];
      if (weightBg === 0) continue;
      const weightFg = total - weightBg;
      if (weightFg === 0) break;
      sumBg += t * histogram[t];
      const meanBg = sumBg / weightBg;
      const meanFg = (sumAll - sumBg) / weightFg;
      const variance = weightBg * weightFg * (meanBg - meanFg) * (meanBg - meanFg);
      if (variance > maxVar) { maxVar = variance; threshold = t; }
    }
    return threshold;
  }

  function connectedComponents(mask, width, height) {
    const labels = new Int32Array(width * height);
    let nextLabel = 1;
    const parent = [0];
    const find = (x) => {
      let root = x;
      while (parent[root] !== root) root = parent[root];
      while (parent[x] !== root) { const next = parent[x]; parent[x] = root; x = next; }
      return root;
    };
    const union = (a, b) => {
      const ra = find(a), rb = find(b);
      if (ra !== rb) parent[Math.max(ra, rb)] = Math.min(ra, rb);
    };
    for (let y = 0; y < height; y++) {
      for (let x = 0; x < width; x++) {
        const i = y * width + x;
        if (!mask[i]) continue;
        const left = x > 0 ? labels[i - 1] : 0;
        const up = y > 0 ? labels[i - width] : 0;
        if (left === 0 && up === 0) {
          labels[i] = nextLabel; parent.push(nextLabel); nextLabel++;
        } else if (left !== 0 && up === 0) labels[i] = left;
        else if (left === 0 && up !== 0) labels[i] = up;
        else {
          labels[i] = Math.min(left, up);
          if (left !== up) union(left, up);
        }
      }
    }
    const rootMap = new Map();
    let count = 0;
    for (let i = 0; i < labels.length; i++) {
      if (labels[i] === 0) continue;
      const root = find(labels[i]);
      let newLabel = rootMap.get(root);
      if (newLabel === undefined) { count++; newLabel = count; rootMap.set(root, newLabel); }
      labels[i] = newLabel;
    }
    return { labels, count };
  }

  /** Detect 4 paper corners. Returns [TL, TR, BR, BL] in source coords. */
  function detectPaperCorners(canvas) {
    const { canvas: small, scale } = downscaleCanvas(canvas, 400);
    const ctx = small.getContext("2d", { willReadFrequently: true });
    const img = ctx.getImageData(0, 0, small.width, small.height);
    const gray = toGrayscale(img);
    const t = otsuThreshold(gray);
    const mask = new Uint8Array(gray.length);
    for (let i = 0; i < gray.length; i++) mask[i] = gray[i] > t ? 1 : 0;
    const { labels, count } = connectedComponents(mask, small.width, small.height);
    if (count === 0) return fallbackCorners(canvas);
    const sizes = new Array(count + 1).fill(0);
    for (let i = 0; i < labels.length; i++) if (labels[i] > 0) sizes[labels[i]]++;
    let bestLabel = 1;
    for (let l = 2; l <= count; l++) if (sizes[l] > sizes[bestLabel]) bestLabel = l;
    let minX = small.width, minY = small.height, maxX = 0, maxY = 0;
    let topPt = { x: 0, y: small.height }, rightPt = { x: 0, y: 0 };
    let bottomPt = { x: 0, y: 0 }, leftPt = { x: small.width, y: 0 };
    for (let y = 0; y < small.height; y++) {
      for (let x = 0; x < small.width; x++) {
        if (labels[y * small.width + x] !== bestLabel) continue;
        if (x < minX) minX = x;
        if (x > maxX) maxX = x;
        if (y < minY) minY = y;
        if (y > maxY) maxY = y;
        if (y < topPt.y) topPt = { x, y };
        if (x > rightPt.x) rightPt = { x, y };
        if (y > bottomPt.y) bottomPt = { x, y };
        if (x < leftPt.x) leftPt = { x, y };
      }
    }
    if (maxX === 0) return fallbackCorners(canvas);
    const cx = (minX + maxX) / 2, cy = (minY + maxY) / 2;
    const points = [topPt, rightPt, bottomPt, leftPt];
    const ordered = points
      .map((p) => ({ p, angle: Math.atan2(p.y - cy, p.x - cx) }))
      .sort((a, b) => a.angle - b.angle);
    const tlScore = (p) => p.x + p.y;
    let bestStart = 0, bestScore = Infinity;
    for (let i = 0; i < 4; i++) {
      const s = tlScore(ordered[i].p);
      if (s < bestScore) { bestScore = s; bestStart = i; }
    }
    const sorted = [0, 1, 2, 3].map((k) => ordered[(bestStart + k) % 4].p);
    return sorted.map((p) => ({ x: p.x / scale, y: p.y / scale }));
  }

  function fallbackCorners(canvas) {
    const w = canvas.width, h = canvas.height;
    const ix = w * 0.1, iy = h * 0.1;
    return [
      { x: ix, y: iy },
      { x: w - ix, y: iy },
      { x: w - ix, y: h - iy },
      { x: ix, y: h - iy },
    ];
  }

  /* ============================================================ enhance ===== */

  function enhancePencil(source, brightness = 0, contrast = 0) {
    const ctx = source.getContext("2d", { willReadFrequently: true });
    const img = ctx.getImageData(0, 0, source.width, source.height);
    const data = img.data;
    const w = source.width, h = source.height;
    const gray = new Float32Array(w * h);
    for (let i = 0; i < w * h; i++) {
      const r = data[i * 4], g = data[i * 4 + 1], b = data[i * 4 + 2];
      gray[i] = r * 0.299 + g * 0.587 + b * 0.114;
    }
    // Sauvola adaptive threshold via integral images.
    const win = 15;
    const k = 0.2;
    const R = 128;
    const integral = new Float64Array((w + 1) * (h + 1));
    const integralSq = new Float64Array((w + 1) * (h + 1));
    for (let y = 0; y < h; y++) {
      for (let x = 0; x < w; x++) {
        const v = gray[y * w + x];
        const i = (y + 1) * (w + 1) + (x + 1);
        integral[i] = v + integral[y * (w + 1) + (x + 1)] + integral[(y + 1) * (w + 1) + x] - integral[y * (w + 1) + x];
        integralSq[i] = v * v + integralSq[y * (w + 1) + (x + 1)] + integralSq[(y + 1) * (w + 1) + x] - integralSq[y * (w + 1) + x];
      }
    }
    const out = ctx.createImageData(w, h);
    const outData = out.data;
    for (let y = 0; y < h; y++) {
      for (let x = 0; x < w; x++) {
        const x0 = Math.max(0, x - win), x1 = Math.min(w - 1, x + win);
        const y0 = Math.max(0, y - win), y1 = Math.min(h - 1, y + win);
        const area = (x1 - x0 + 1) * (y1 - y0 + 1);
        const sum = integral[(y1 + 1) * (w + 1) + (x1 + 1)] - integral[y0 * (w + 1) + (x1 + 1)] - integral[(y1 + 1) * (w + 1) + x0] + integral[y0 * (w + 1) + x0];
        const sumSq = integralSq[(y1 + 1) * (w + 1) + (x1 + 1)] - integralSq[y0 * (w + 1) + (x1 + 1)] - integralSq[(y1 + 1) * (w + 1) + x0] + integralSq[y0 * (w + 1) + x0];
        const mean = sum / area;
        const variance = Math.max(0, sumSq / area - mean * mean);
        const stddev = Math.sqrt(variance);
        const t = mean * (1 + k * (stddev / R - 1));
        const v = gray[y * w + x];
        const outIdx = (y * w + x) * 4;
        if (v < t) {
          const strength = Math.min(255, Math.round(255 * (t - v) / Math.max(1, t)));
          const darkness = Math.min(255, strength * 2);
          outData[outIdx] = outData[outIdx + 1] = outData[outIdx + 2] = 255 - darkness;
        } else {
          outData[outIdx] = outData[outIdx + 1] = outData[outIdx + 2] = 255;
        }
        outData[outIdx + 3] = 255;
      }
    }
    if (brightness !== 0 || contrast !== 0) {
      const c = contrast > 0 ? 1 + contrast / 100 : 1 / (1 - contrast / 100);
      const lut = new Uint8ClampedArray(256);
      for (let i = 0; i < 256; i++) {
        lut[i] = (i - 127.5) * c + 127.5 + (brightness / 100) * 255;
      }
      for (let i = 0; i < outData.length; i += 4) {
        outData[i] = lut[outData[i]];
        outData[i + 1] = lut[outData[i + 1]];
        outData[i + 2] = lut[outData[i + 2]];
      }
    }
    const result = document.createElement("canvas");
    result.width = w;
    result.height = h;
    result.getContext("2d").putImageData(out, 0, 0);
    return result;
  }

  function enhanceOriginal(source, brightness = 0, contrast = 0) {
    const out = document.createElement("canvas");
    out.width = source.width;
    out.height = source.height;
    const ctx = out.getContext("2d");
    const b = brightness / 100;
    const c = contrast > 0 ? 1 + contrast / 100 : 1 / (1 - contrast / 100);
    ctx.filter = `brightness(${1 + b}) contrast(${c}) saturate(1.1)`;
    ctx.drawImage(source, 0, 0);
    ctx.filter = "none";
    return out;
  }

  function enhancePopup(source, brightness = 0, contrast = 0) {
    const ctx = source.getContext("2d", { willReadFrequently: true });
    const img = ctx.getImageData(0, 0, source.width, source.height);
    const data = img.data;
    const w = source.width, h = source.height;
    const histogram = new Array(256).fill(0);
    const gray = new Float32Array(w * h);
    for (let i = 0; i < w * h; i++) {
      const r = data[i * 4], g = data[i * 4 + 1], b = data[i * 4 + 2];
      const v = r * 0.299 + g * 0.587 + b * 0.114;
      gray[i] = v;
      histogram[Math.min(255, Math.round(v))]++;
    }
    const total = w * h;
    let paperWhite = 220;
    let acc = 0;
    for (let v = 255; v >= 0; v--) {
      acc += histogram[v];
      if (acc >= total * 0.15) { paperWhite = v; break; }
    }
    if (paperWhite < 120) paperWhite = 220;
    const out = ctx.createImageData(w, h);
    const outData = out.data;
    const c = 1 + contrast / 100;
    const b = brightness / 100;
    for (let i = 0; i < w * h; i++) {
      const v = gray[i];
      let r = data[i * 4], g = data[i * 4 + 1], bC = data[i * 4 + 2];
      if (v >= paperWhite - 5) {
        r = g = bC = 255;
      } else {
        const norm = (v - paperWhite * 0.2) / (paperWhite * 0.8);
        const dark = Math.max(0, Math.min(1, 1 - norm));
        const boosted = 255 * (1 - Math.pow(dark, 1 / c));
        const keepColour = 0.5;
        const avg = boosted;
        r = (1 - keepColour) * avg + keepColour * (r * c);
        g = (1 - keepColour) * avg + keepColour * (g * c);
        bC = (1 - keepColour) * avg + keepColour * (bC * c);
        r = Math.max(0, Math.min(255, r + b * 100));
        g = Math.max(0, Math.min(255, g + b * 100));
        bC = Math.max(0, Math.min(255, bC + b * 100));
      }
      outData[i * 4] = r;
      outData[i * 4 + 1] = g;
      outData[i * 4 + 2] = bC;
      outData[i * 4 + 3] = 255;
    }
    const result = document.createElement("canvas");
    result.width = w;
    result.height = h;
    result.getContext("2d").putImageData(out, 0, 0);
    return result;
  }

  function enhanceScan(source, mode, brightness = 0, contrast = 0) {
    if (mode === "pencil") return enhancePencil(source, brightness, contrast);
    if (mode === "original") return enhanceOriginal(source, brightness, contrast);
    return enhancePopup(source, brightness, contrast);
  }

  function canvasToBlob(canvas, type = "image/png", quality = 0.92) {
    return new Promise((resolve, reject) => {
      canvas.toBlob(
        (blob) => (blob ? resolve(blob) : reject(new Error("toBlob failed"))),
        type,
        quality
      );
    });
  }

  function makeThumbnail(source, maxLong = 384) {
    const scale = Math.min(1, maxLong / Math.max(source.width, source.height));
    const w = Math.max(1, Math.round(source.width * scale));
    const h = Math.max(1, Math.round(source.height * scale));
    const out = document.createElement("canvas");
    out.width = w;
    out.height = h;
    const ctx = out.getContext("2d");
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = "high";
    ctx.drawImage(source, 0, 0, w, h);
    return out;
  }

  /* ============================================================ IndexedDB */

  const DB_NAME = "paper-scan-db";
  const DB_VERSION = 1;
  const STORE = "scans";
  let dbPromise = null;

  function openDb() {
    if (dbPromise) return dbPromise;
    dbPromise = new Promise((resolve, reject) => {
      const req = indexedDB.open(DB_NAME, DB_VERSION);
      req.onupgradeneeded = () => {
        const db = req.result;
        if (!db.objectStoreNames.contains(STORE)) {
          db.createObjectStore(STORE, { keyPath: "id" });
        }
      };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
    return dbPromise;
  }

  function txReq(store, mode) {
    return new Promise((resolve, reject) => {
      const req = store._req;
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }

  async function dbPut(record) {
    const db = await openDb();
    return new Promise((resolve, reject) => {
      const t = db.transaction(STORE, "readwrite");
      t.objectStore(STORE).put(record);
      t.oncomplete = () => resolve();
      t.onerror = () => reject(t.error);
    });
  }

  async function dbGetAll() {
    const db = await openDb();
    return new Promise((resolve, reject) => {
      const t = db.transaction(STORE, "readonly");
      const req = t.objectStore(STORE).getAll();
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }

  async function dbGet(id) {
    const db = await openDb();
    return new Promise((resolve, reject) => {
      const t = db.transaction(STORE, "readonly");
      const req = t.objectStore(STORE).get(id);
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }

  async function dbDelete(id) {
    const db = await openDb();
    return new Promise((resolve, reject) => {
      const t = db.transaction(STORE, "readwrite");
      t.objectStore(STORE).delete(id);
      t.oncomplete = () => resolve();
      t.onerror = () => reject(t.error);
    });
  }

  async function dbUpdateTitle(id, title) {
    const record = await dbGet(id);
    if (!record) return;
    record.title = title;
    await dbPut(record);
  }

  let cameraStream = null;
  let cameraVideo = null;
  let cameraTorchSupported = false;

  async function startCamera(viewport) {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      showCameraError(viewport, "このブラウザではカメラ API が利用できません。ファイルから読み込めます。");
      return;
    }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: { ideal: "environment" }, width: { ideal: 1920 }, height: { ideal: 1080 } },
        audio: false,
      });
      cameraStream = stream;
      const video = document.createElement("video");
      video.autoplay = true;
      video.playsInline = true;
      video.muted = true;
      video.className = "camera-video";
      video.srcObject = stream;
      viewport.appendChild(video);
      cameraVideo = video;
      await video.play().catch(() => {});
      // Reticle overlay
      const reticle = createElement("div", { class: "camera-reticle" });
      reticle.innerHTML = `
        <div class="frame">
          <p class="hint">紙の四隅をフレーム内に収めてください</p>
          <div class="box"></div>
          <span class="bracket"></span>
          <span class="bracket tr"></span>
          <span class="bracket br"></span>
          <span class="bracket bl"></span>
        </div>
      `;
      viewport.appendChild(reticle);
      // Detect torch support
      const track = stream.getVideoTracks()[0];
      const caps = (track.getCapabilities && track.getCapabilities()) || {};
      cameraTorchSupported = Boolean(caps.torch);
      const torchBtn = $("#camera-torch");
      if (torchBtn) torchBtn.disabled = !cameraTorchSupported;
      const shutter = $("#camera-shutter");
      if (shutter) shutter.disabled = false;
    } catch (err) {
      let msg = "カメラを起動できませんでした。ファイルから読み込めます。";
      if (err.name === "NotAllowedError" || err.name === "SecurityError") {
        msg = "カメラの使用が許可されていません。ブラウザの設定から許可してください。";
      } else if (err.name === "NotFoundError" || err.name === "OverconstrainedError") {
        msg = "カメラが見つかりませんでした。ファイルから読み込めます。";
      }
      showCameraError(viewport, msg);
    }
  }

  function showCameraError(viewport, msg) {
    viewport.innerHTML = "";
    const err = createElement("div", { class: "camera-error" });
    err.innerHTML = `
      <div class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg></div>
      <p>${msg}</p>
    `;
    const pickBtn = createElement("button", { class: "btn btn-primary btn-lg" });
    pickBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></svg> 画像を選択';
    pickBtn.onclick = () => $("#file-input").click();
    err.appendChild(pickBtn);
    viewport.appendChild(err);
  }

  async function toggleTorch(btn) {
    if (!cameraStream) return;
    const track = cameraStream.getVideoTracks()[0];
    if (!track) return;
    try {
      const caps = track.getCapabilities && track.getCapabilities();
      if (!caps.torch) {
        toast("このデバイスではフラッシュを利用できません", "error");
        return;
      }
      const next = btn.dataset.state === "off";
      await track.applyConstraints({ advanced: [{ torch: next }] });
      btn.dataset.state = next ? "on" : "off";
      btn.classList.toggle("torch-on", next);
      // Update icon
      btn.innerHTML = next
        ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>'
        : '<svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z" opacity="0.5"/><line x1="3" y1="3" x2="21" y2="21" stroke="rgba(255,255,255,0.4)"/></svg>';
    } catch (err) {
      toast("フラッシュの切り替えに失敗しました", "error");

  }

  function renderCropEditor(wrap) {
    cropWrap = wrap;
    cropDataUrl = state.sourceCanvas.toDataURL("image/jpeg", 0.85);
    cropImg = new Image();
    cropImg.draggable = false;
    cropImg.src = cropDataUrl;
    cropImg.onload = () => {
      const aspect = state.sourceCanvas.width / state.sourceCanvas.height;
      const parent = wrap.parentElement;
      const maxW = parent.clientWidth - 32;
      const maxH = parent.clientHeight - 32;
      let w, h;
      if (maxW / aspect <= maxH) {
        w = maxW;
        h = maxW / aspect;
      } else {
        h = maxH;
        w = maxH * aspect;
      }
      wrap.style.width = w + "px";
      wrap.style.height = h + "px";
      wrap.style.aspectRatio = aspect;
      cropDisplaySize = { w, h };
      // SVG overlay
      cropOverlay = document.createElementNS("http://www.w3.org/2000/svg", "svg");
      cropOverlay.setAttribute("class", "crop-overlay");
      cropOverlay.setAttribute("viewBox", `0 0 ${w} ${h}`);
      cropOverlay.setAttribute("preserveAspectRatio", "none");
      cropOverlay.innerHTML = `
        <defs>
          <mask id="cropMask">
            <rect x="0" y="0" width="${w}" height="${h}" fill="white"/>
            <polygon id="cropPolyMask" fill="black"/>
          </mask>
        </defs>
        <rect x="0" y="0" width="${w}" height="${h}" fill="black" fill-opacity="0.45" mask="url(#cropMask)"/>
        <polygon id="cropPoly" fill="none" stroke="var(--primary)" stroke-width="2" stroke-dasharray="6 4"/>
        <line id="cropLine1" stroke="var(--primary)" stroke-width="0.5" stroke-opacity="0.4"/>
        <line id="cropLine2" stroke="var(--primary)" stroke-width="0.5" stroke-opacity="0.4"/>
      `;
      wrap.appendChild(cropImg);
      wrap.appendChild(cropOverlay);
      // Create handles
      cropHandles = [];
      for (let i = 0; i < 4; i++) {
        const h = createElement("button", { class: "crop-handle", ariaLabel: `コーナー ${i + 1}` });
        h.innerHTML = '<span class="dot"></span>';
        h.dataset.idx = i;
        h.addEventListener("pointerdown", (e) => {
          e.preventDefault();
          cropActiveIdx = i;
        });
        wrap.appendChild(h);
        cropHandles.push(h);
      }
      renderCropPolygon();
    };
  }

  function renderCropPolygon() {
    if (!cropOverlay || !cropDisplaySize.w) return;
    const toDisplay = (p) => ({
      x: (p.x / state.sourceCanvas.width) * cropDisplaySize.w,
      y: (p.y / state.sourceCanvas.height) * cropDisplaySize.h,
    });
    const disp = state.corners.map(toDisplay);
    const points = disp.map((p) => `${p.x},${p.y}`).join(" ");
    $("#cropPoly", cropOverlay).setAttribute("points", points);
    $("#cropPolyMask", cropOverlay).setAttribute("points", points);
    $("#cropLine1", cropOverlay).setAttribute("x1", disp[0].x);
    $("#cropLine1", cropOverlay).setAttribute("y1", disp[0].y);
    $("#cropLine1", cropOverlay).setAttribute("x2", disp[2].x);
    $("#cropLine1", cropOverlay).setAttribute("y2", disp[2].y);
    $("#cropLine2", cropOverlay).setAttribute("x1", disp[1].x);
    $("#cropLine2", cropOverlay).setAttribute("y1", disp[1].y);
    $("#cropLine2", cropOverlay).setAttribute("x2", disp[3].x);
    $("#cropLine2", cropOverlay).setAttribute("y2", disp[3].y);
    cropHandles.forEach((handle, i) => {
      handle.style.left = disp[i].x + "px";
      handle.style.top = disp[i].y + "px";
    });
  }

  // Pointer move handler for crop handles
  document.addEventListener("pointermove", (e) => {
    if (cropActiveIdx === null || !cropWrap) return;
    const rect = cropWrap.getBoundingClientRect();
    let x = e.clientX - rect.left;
    let y = e.clientY - rect.top;
    x = Math.max(0, Math.min(rect.width, x));
    y = Math.max(0, Math.min(rect.height, y));
    state.corners[cropActiveIdx] = {
      x: (x / cropDisplaySize.w) * state.sourceCanvas.width,
      y: (y / cropDisplaySize.h) * state.sourceCanvas.height,
    };
    renderCropPolygon();
  });
  document.addEventListener("pointerup", () => {
    cropActiveIdx = null;
  });

  /* ============================================================ enhance === */

  function openEnhanceStage() {
    state.stage = "enhance";
    // Warp once
    const { width, height } = computeOutputSize(state.corners, 1600);
    state.warpedCanvas = warpPerspective(state.sourceCanvas, state.corners, width, height);
    state.enhanceMode = "pencil";
    state.enhanceBrightness = 0;
    state.enhanceContrast = 0;
    const overlay = $("#stage-overlay");
    overlay.classList.remove("is-camera");
    overlay.hidden = false;
    overlay.innerHTML = "";
    overlay.appendChild(buildEnhanceHeader());
    const body = createElement("div", { class: "enhance-preview-wrap" });
    const img = new Image();
    img.id = "enhance-preview";
    body.appendChild(img);
    const busy = createElement("div", { class: "enhance-busy-indicator", id: "enhance-busy", hidden: true });
    busy.innerHTML = '<span class="dot"></span> 補正中';
    body.appendChild(busy);
    overlay.appendChild(body);
    overlay.appendChild(buildEnhanceFooter());
    renderEnhancePreview();
  }

  function buildEnhanceHeader() {
    const header = createElement("div", { class: "stage-header" });
    const back = createElement("button", { class: "btn btn-ghost btn-sm" });
    back.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg> 切り取り';
    back.onclick = () => openCropStage();
    const title = createElement("div", { class: "title" });
    title.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.9 5.8a2 2 0 0 0 1.3 1.3L21 12l-5.8 1.9a2 2 0 0 0-1.3 1.3L12 21l-1.9-5.8a2 2 0 0 0-1.3-1.3L3 12l5.8-1.9a2 2 0 0 0 1.3-1.3z"/></svg> 補正';
    const exportBtn = createElement("button", { class: "btn btn-ghost btn-sm text-primary" });
    exportBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg> PNG';
    exportBtn.onclick = () => exportEnhancedPng();
    header.appendChild(back);
    header.appendChild(title);
    header.appendChild(exportBtn);
    return header;
  }

  function buildEnhanceFooter() {
    const footer = createElement("div", { class: "stage-footer" });
    // Mode grid
    const grid = createElement("div", { class: "mode-grid" });
    ["pencil", "original", "popup"].forEach((m) => {
      const card = createElement("button", { class: "mode-card" + (m === state.enhanceMode ? " active" : ""), dataMode: m });
      card.innerHTML = `<span class="name">${MODE_LABELS[m].title}</span><span class="desc">${MODE_LABELS[m].desc}</span>`;
      card.onclick = () => {
        state.enhanceMode = m;
        $$(".mode-card", footer).forEach((c) => c.classList.toggle("active", c.dataset.mode === m));
        renderEnhancePreview();
      };
      grid.appendChild(card);
    });
    footer.appendChild(grid);
    // Sliders
    const sliders = createElement("div", { class: "enhance-sliders" });
    sliders.appendChild(buildSliderRow("明るさ", state.enhanceBrightness, -50, 50, (v) => {
      state.enhanceBrightness = v;
      renderEnhancePreview();
    }));
    sliders.appendChild(buildSliderRow("コントラスト", state.enhanceContrast, -50, 50, (v) => {
      state.enhanceContrast = v;
      renderEnhancePreview();
    }));
    footer.appendChild(sliders);
    // Save button
    const save = createElement("button", { class: "btn btn-primary", style: { width: "100%", marginTop: "0.75rem" } });
    save.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg> ギャラリーに保存';
    save.onclick = () => saveEnhanced();
    footer.appendChild(save);
    return footer;
  }

  function buildSliderRow(label, value, min, max, onChange) {
    const row = createElement("div", { class: "slider-row" });
    const lbl = createElement("span", { class: "label" }, [label]);
    const input = createElement("input", { type: "range", min, max, step: 1, value });
    const val = createElement("span", { class: "value" }, [value > 0 ? `+${value}` : String(value)]);
    input.addEventListener("input", () => {
      const v = parseInt(input.value, 10);
      val.textContent = v > 0 ? `+${v}` : String(v);
      onChange(v);
    });
    row.appendChild(lbl);
    row.appendChild(input);
    row.appendChild(val);
    return row;
  }

  const renderEnhancePreview = debounce(() => {
    if (!state.warpedCanvas) return;
    const busy = $("#enhance-busy");
    if (busy) busy.hidden = false;
    const img = $("#enhance-preview");
    if (img) img.style.filter = "brightness(0.7)";
    setTimeout(() => {
      try {
        const enhanced = enhanceScan(state.warpedCanvas, state.enhanceMode, state.enhanceBrightness, state.enhanceContrast);
        img.src = enhanced.toDataURL("image/jpeg", 0.92);
        img.style.filter = "";
      } catch (err) {
        console.error(err);
      } finally {
        if (busy) busy.hidden = true;
      }
    }, 50);
  }, 120);

  async function saveEnhanced() {
    try {
      const enhanced = enhanceScan(state.warpedCanvas, state.enhanceMode, state.enhanceBrightness, state.enhanceContrast);
      const pngBlob = await canvasToBlob(enhanced, "image/png");
      const thumbCanvas = makeThumbnail(enhanced, 384);
      const thumbBlob = await canvasToBlob(thumbCanvas, "image/jpeg", 0.85);
      const id = `scan-${Date.now()}-${Math.random().toString(36).slice(2, 8)}`;
      const now = new Date();
      const title = `Scan ${now.getMonth() + 1}/${String(now.getDate()).padStart(2, "0")} ${String(now.getHours()).padStart(2, "0")}:${String(now.getMinutes()).padStart(2, "0")}`;
      await dbPut({
        id, title, createdAt: Date.now(),
        enhanceMode: state.enhanceMode,
        width: enhanced.width, height: enhanced.height,
        imageBlob: pngBlob, thumbBlob,
      });
      toast("ギャラリーに保存しました", "success");
      closeStage();
      setTab("gallery");
      refreshCount();
    } catch (err) {
      console.error(err);
      toast("保存に失敗しました", "error");
    }
  }

  async function exportEnhancedPng() {
    try {
      const enhanced = enhanceScan(state.warpedCanvas, state.enhanceMode, state.enhanceBrightness, state.enhanceContrast);
      const blob = await canvasToBlob(enhanced, "image/png");
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `paperscan-${Date.now()}.png`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
      toast("PNG画像をダウンロードしました", "success");
    } catch (err) {
      toast("エクスポートに失敗しました", "error");
    }
  }

  /* ============================================================ stage util */

  function closeStage() {
    stopCamera();
    state.stage = "home";
    state.sourceCanvas = null;
    state.corners = null;
    state.warpedCanvas = null;
    const overlay = $("#stage-overlay");
    overlay.classList.remove("is-camera");
    overlay.hidden = true;
    overlay.innerHTML = "";
    cropWrap = null;
    cropImg = null;
    cropOverlay = null;
    cropHandles = [];
    cropActiveIdx = null;
  }

  /* ============================================================ capture flow */

  async function handleCaptured(canvas) {
    state.sourceCanvas = canvas;
    try {
      state.corners = detectPaperCorners(canvas);
    } catch (err) {
      console.warn(err);
      state.corners = [
        { x: 0, y: 0 },
        { x: canvas.width, y: 0 },
        { x: canvas.width, y: canvas.height },
        { x: 0, y: canvas.height },
      ];
      toast.info("自動検出に失敗したので四隅を手動で調整してください", "info");
    }
    openCropStage();
  }

  function onFilePicked(e) {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    loadImageToCanvas(file)
      .then(handleCaptured)
      .catch((err) => toast(err.message || "画像を読み込めませんでした", "error"));
    e.target.value = "";
  }

  /* ============================================================ gallery === */

  async function refreshGallery() {
    const root = $("#gallery-root");
    if (!root) return;
    // Show spinner
    root.innerHTML = `<div class="gallery-loading"><span class="dot"></span>読み込み中…</div>`;
    try {
      const records = await dbGetAll();
      records.sort((a, b) => b.createdAt - a.createdAt);
      state.scans = records;
      // Revoke old URLs
      Object.values(state.thumbUrls).forEach((url) => URL.revokeObjectURL(url));
      state.thumbUrls = {};
      if (records.length === 0) {
        root.innerHTML = `
          <div class="gallery-empty">
            <div class="icon-wrap"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></svg></div>
            <p>まだ保存されたスキャンはありません</p>
            <p class="sub">「スキャン」タブから紙の絵を取り込んでください</p>
          </div>
        `;
        return;
      }
      const grid = createElement("div", { class: "gallery-grid" });
      records.forEach((scan) => {
        const thumbUrl = URL.createObjectURL(scan.thumbBlob);
        state.thumbUrls[scan.id] = thumbUrl;
        const card = createElement("button", { class: "gallery-card", dataId: scan.id });
        const date = new Date(scan.createdAt);
        const modeLabel = MODE_LABELS[scan.enhanceMode]?.title ?? scan.enhanceMode;
        card.innerHTML = `
          <img src="${thumbUrl}" alt="${escapeHtml(scan.title)}" loading="lazy"/>
          <div class="meta">
            <p class="title">${escapeHtml(scan.title)}</p>
            <p class="sub">${modeLabel} · ${date.getMonth() + 1}月${date.getDate()}日</p>
          </div>
          <span class="dim">${scan.width}×${scan.height}</span>
        `;
        card.onclick = () => openViewer(scan.id);
        grid.appendChild(card);
      });
      root.innerHTML = "";
      root.appendChild(grid);
    } catch (err) {
      console.error(err);
      root.innerHTML = `<div class="gallery-empty"><p>読み込みに失敗しました</p></div>`;
    }
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, (c) => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
    }[c]));
  }

  /* ============================================================ viewer === */

  async function openViewer(id) {
    const scan = state.scans.find((s) => s.id === id);
    if (!scan) return;
    state.viewerId = id;
    if (state.viewerUrl) URL.revokeObjectURL(state.viewerUrl);
    state.viewerUrl = URL.createObjectURL(scan.imageBlob);
    $("#viewer-image").src = state.viewerUrl;
    $("#viewer-title").textContent = scan.title;
    const date = new Date(scan.createdAt);
    const modeLabel = MODE_LABELS[scan.enhanceMode]?.title ?? scan.enhanceMode;
    $("#viewer-meta").textContent = `${modeLabel} · ${date.toLocaleString("ja-JP")}`;
    $("#viewer-title-input").value = scan.title;
    $("#viewer-edit-form").hidden = true;
    $("#viewer").hidden = false;
    $("#viewer").setAttribute("aria-hidden", "false");
  }

  function closeViewer() {
    $("#viewer").hidden = true;
    $("#viewer").setAttribute("aria-hidden", "true");
    if (state.viewerUrl) URL.revokeObjectURL(state.viewerUrl);
    state.viewerUrl = null;
    state.viewerId = null;
  }

  async function exportFromViewer() {
    const scan = state.scans.find((s) => s.id === state.viewerId);
    if (!scan) return;
    const url = URL.createObjectURL(scan.imageBlob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `${scan.title.replace(/[\\/:*?"<>|]/g, "_")}.png`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
    toast("PNGをダウンロードしました", "success");
  }

  async function deleteFromViewer() {
    if (!state.viewerId) return;
    if (!confirm("このスキャンを削除しますか？")) return;
    await dbDelete(state.viewerId);
    closeViewer();
    refreshGallery();
    refreshCount();
    toast("削除しました", "success");
  }

  function startViewerEdit() {
    $("#viewer-edit-form").hidden = false;
    $("#viewer-title-input").focus();
    $("#viewer-title-input").select();
  }

  async function saveViewerTitle() {
    const t = $("#viewer-title-input").value.trim();
    if (!t || !state.viewerId) return;
    await dbUpdateTitle(state.viewerId, t);
    $("#viewer-title").textContent = t;
    $("#viewer-edit-form").hidden = true;
    const scan = state.scans.find((s) => s.id === state.viewerId);
    if (scan) scan.title = t;
    refreshGallery();
    toast("タイトルを更新しました", "success");
  }

  /* ============================================================ init ===== */

  function init() {
    // Tab buttons
    $$(".tab-btn").forEach((btn) => {
      btn.addEventListener("click", () => setTab(btn.dataset.tab));
    });
    // Home buttons
    $("#btn-camera").addEventListener("click", openCameraStage);
    $("#btn-pick").addEventListener("click", () => $("#file-input").click());
    $("#file-input").addEventListener("change", onFilePicked);
    // Viewer buttons
    $("#viewer-close").addEventListener("click", closeViewer);
    $("#viewer-edit").addEventListener("click", startViewerEdit);
    $("#viewer-rename").addEventListener("click", startViewerEdit);
    $("#viewer-save-title").addEventListener("click", saveViewerTitle);
    $("#viewer-title-input").addEventListener("keydown", (e) => {
      if (e.key === "Enter") saveViewerTitle();
      if (e.key === "Escape") $("#viewer-edit-form").hidden = true;
    });
    $("#viewer-export").addEventListener("click", exportFromViewer);
    $("#viewer-delete").addEventListener("click", deleteFromViewer);
    // Escape closes viewer
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") {
        if (!$("#viewer").hidden) closeViewer();
        else if (!$("#stage-overlay").hidden && state.stage !== "camera") closeStage();
      }
    });
    // Initial count
    refreshCount();
    // Service worker
    if ("serviceWorker" in navigator) {
      (function(){ var swSrc="// PaperScan single-file SW: runtime cache-first for same-origin GET.\nconst CACHE = \"paperscan-v1\";\nself.addEventListener(\"install\", (e) => { self.skipWaiting(); });\nself.addEventListener(\"activate\", (e) => {\n  e.waitUntil(caches.keys().then((ks) =>\n    Promise.all(ks.filter((k) => k !== CACHE).map((k) => caches.delete(k)))\n  ).then(() => self.clients.claim()));\n});\nself.addEventListener(\"fetch\", (e) => {\n  const r = e.request;\n  if (r.method !== \"GET\") return;\n  const u = new URL(r.url);\n  if (u.origin !== self.location.origin) return;\n  e.respondWith(\n    caches.open(CACHE).then((cache) =>\n      cache.match(r).then((hit) =>\n        hit || fetch(r).then((res) => {\n          if (res.ok && res.type === \"basic\") cache.put(r, res.clone());\n          return res;\n        }).catch(() => hit)\n      )\n    )\n  );\n});"; try{ var blob=new Blob([swSrc],{type:'text/javascript'}); var url=URL.createObjectURL(blob); navigator.serviceWorker.register(url).catch(function(err){ console.warn('SW registration failed:', err); }); }catch(e){ console.warn('SW init failed:', e); } })()
    }
  }

  document.addEventListener("DOMContentLoaded", init);
})();

</script>
</body>
</html>
