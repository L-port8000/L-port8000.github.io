<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>o - Multi-Gateway Browser</title>
<link rel="icon" href="../icon.png">
<style>
:root { --bg-color: #f0f0f4; --toolbar-bg: #f9f9fb; --text-color: #000; --border-color: #d0d0d7; --accent: #0060df; --warning: #f39c12; }
body.dark-mode { --bg-color: #1c1b22; --toolbar-bg: #2b2a33; --text-color: #fbfbfe; --border-color: #52525e; --accent: #00ddff; --warning: #ffb444; }
body { margin: 0; font-family: system-ui, sans-serif; background: var(--bg-color); color: var(--text-color); display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

#progress-container { position: absolute; top: 0; left: 0; width: 100%; height: 2px; z-index: 1000; pointer-events: none; }
#progress-bar { width: 0%; height: 100%; background: var(--accent); transition: width 0.3s ease; }



#tabs-bar { display: flex; background: var(--bg-color); padding: 5px 5px 0 5px; gap: 4px; border-bottom: 1px solid var(--border-color); overflow-x: auto; min-height: 35px; scrollbar-width: none; }
#tabs-bar::-webkit-scrollbar { display: none; }
.tab { padding: 6px 12px; background: rgba(0,0,0,0.05); border-radius: 8px 8px 0 0; cursor: pointer; min-width: 140px; max-width: 200px; display: flex; align-items: center; font-size: 11px; border: 1px solid var(--border-color); border-bottom: none; white-space: nowrap; transition: 0.2s; }
.tab.active { background: var(--toolbar-bg); font-weight: bold; border-top: 2px solid var(--accent); }
.tab img { width: 14px; height: 14px; margin-right: 6px; border-radius: 2px; }
.tab-title { flex: 1; overflow: hidden; text-overflow: ellipsis; }
.close-btn { margin-left: 8px; opacity: 0.3; font-size: 14px; }
.close-btn:hover { color: red; opacity: 1; }
#chrome { background: var(--toolbar-bg); border-bottom: 1px solid var(--border-color); padding: 8px; display: flex; gap: 8px; align-items: center; z-index: 10; }
#url { flex: 1; padding: 8px 15px; border-radius: 20px; border: 1px solid var(--border-color); background: var(--bg-color); color: var(--text-color); font-size: 13px; }
#bookmark-bar { background: var(--toolbar-bg); padding: 4px 10px; display: flex; gap: 10px; border-bottom: 1px solid var(--border-color); font-size: 11px; overflow-x: auto; min-height: 20px; }
.bm-item { display: flex; align-items: center; gap: 4px; cursor: pointer; padding: 4px 8px; border-radius: 4px; white-space: nowrap; max-width: 150px; }
.bm-item:hover { background: rgba(0,0,0,0.05); }
.bm-item img { width: 12px; height: 12px; }
.star-btn { font-size: 20px; cursor: pointer; color: #ccc; }
.star-btn.active { color: #f1c40f; }
#main-container { display: flex; flex: 1; overflow: hidden; position: relative; }
#view { flex: 1; background: white; position: relative; }
.page-element { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; display: none; background: white; }
.page-element.active { display: block; }
.settings-page { padding: 40px 20px; overflow-y: auto; box-sizing: border-box; background: var(--bg-color) !important; }
.card { background: var(--toolbar-bg); padding: 20px; border-radius: 12px; border: 1px solid var(--border-color); max-width: 600px; margin: 0 auto 20px; color: var(--text-color); }
.proxy-item { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; padding-bottom: 12px; border-bottom: 1px solid var(--border-color); }
.status-connected { color: #28a745; font-weight: bold; font-size: 13px; margin-right: 8px; }
button { padding: 6px 12px; cursor: pointer; border-radius: 4px; border: 1px solid var(--border-color); background: rgba(0,0,0,0.05); color: inherit; display: flex; align-items: center; justify-content: center; }
button:disabled { opacity: 0.3; cursor: default; }
select, input[type="text"] { padding: 8px; border-radius: 4px; border: 1px solid var(--border-color); background: var(--bg-color); color: var(--text-color); }

#view-mode-btn svg { width: 18px; height: 18px; fill: currentColor; }
#view-mode-btn.embed-mode { color: var(--warning); border-color: var(--warning); background: rgba(243,156,18,0.1); }

#fs-close-btn { position: fixed; top: 15px; right: 15px; z-index: 9999; width: 32px; height: 32px; background: rgba(0,0,0,0.3); color: white; border: none; border-radius: 50%; cursor: pointer; display: none; opacity: 0.2; transition: 0.3s; font-size: 18px; line-height: 1; }
#fs-close-btn:hover { opacity: 1; background: rgba(220,53,69,0.9); }
:fullscreen #tabs-bar, :fullscreen #chrome, :fullscreen #bookmark-bar { display: none !important; }
:fullscreen #fs-close-btn { display: flex; align-items: center; justify-content: center; }

/* プロファイル作成ダイアログ */
#profile-modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 2000; align-items: center; justify-content: center; }
#profile-modal.open { display: flex; }
#profile-modal-box { background: var(--toolbar-bg); padding: 24px; border-radius: 12px; border: 1px solid var(--border-color); min-width: 300px; color: var(--text-color); }
#profile-modal-box h3 { margin: 0 0 16px; }
#profile-modal-box input { width: 100%; box-sizing: border-box; margin-bottom: 12px; }
#profile-modal-box .modal-btns { display: flex; gap: 8px; justify-content: flex-end; }
</style>
</head>
<body>

<div id="progress-container"><div id="progress-bar"></div></div>
<button id="fs-close-btn" onclick="exitFullscreen()">×</button>

<!-- プロファイルモーダル -->
<div id="profile-modal">
  <div id="profile-modal-box">
    <h3>新規プロファイル</h3>
    <input id="profile-name-input" type="text" placeholder="プロファイル名">
    <div class="modal-btns">
      <button onclick="closeProfileModal()">キャンセル</button>
      <button onclick="confirmCreateProfile()" style="background:var(--accent);color:#fff;border-color:var(--accent);">作成</button>
    </div>
  </div>
</div>

<div id="tabs-bar"></div>
<div id="chrome">
    <button id="btn-back" onclick="navBack()">◀</button>
    <button id="btn-forward" onclick="navForward()">▶</button>
    <button onclick="navReload()">⟳</button>
    <button onclick="goHome()">◻️</button>
    <span id="star-btn" class="star-btn" onclick="toggleBookmark()">★</span>
    <input id="url" placeholder="URLを入力してEnter">
    <button onclick="go()">Go</button>
    <button id="view-mode-btn" onclick="toggleViewMode()" title="表示モード切替 (iframe / embed)">
        <svg viewBox="0 0 24 24"><path d="M3 13h12v-2H3v2zm0 4h12v-2H3v2zm0-8h12V7H3v2zm14 8l5-5-5-5v10z"/></svg>
    </button>
    <button onclick="toggleFullscreen()">⛶</button>
    <button onclick="openSettings()">⚙️</button>
</div>
<div id="bookmark-bar"></div>

<div id="main-container">
    <div id="view"></div>
</div>

<script>
/* ======================================================
   プロキシ定義
====================================================== */
const PROXIES = {
    1:  { name: "55games - 1",  url: "https://55gms.com/embed.html#",  info: "US - NY elite" },
    2:  { name: "55games - 2",  url: "https://55gms.me/embed.html#",   info: "US - NY elite" },
    3:  { name: "55games - 3",  url: "https://55gms.app/embed.html#",  info: "US - NY elite" },
    4:  { name: "55games - 4",  url: "https://algebra.learnnexus.xyz/embed.html#",  info: "US - NY elite" },
    5:  { name: "55games - 5",  url: "https://biology.learnnexus.xyz/embed.html#",  info: "US - NY elite" },
    6:  { name: "Workers - 1",  url: "https://sk.skkatoo.workers.dev/-----",        info: "US - SF Non-anony" },
    7:  { name: "Workers - 2",  url: "https://black-resonance-5407.cvfr.workers.dev/-----", info: "US - SF Non-anony" },
    8:  { name: "Workers - 3",  url: "https://loli.loli12.workers.dev/-----",       info: "US - SF Non-anony" },
    9:  { name: "Workers - 4",  url: "https://loli.xianyu1.workers.dev/-----",      info: "US - SF Non-anony" },
    10: { name: "Workers - 5",  url: "https://lucky-mountain-6e91.networkfreedom.workers.dev/-----", info: "US - SF Non-anony" },
    11: { name: "Workers - 6",  url: "https://proxy.dijkstra.workers.dev/-----",    info: "US - SF Non-anony" },
    12: { name: "Workers - 7",  url: "https://b.007.workers.dev/-----",             info: "US - SF Non-anony" },
    13: { name: "Workers - 8",  url: "https://1.wv1.workers.dev/-----",             info: "US - SF Non-anony" },
    14: { name: "Workers - 9",  url: "https://proxy.fan.workers.dev/-----",         info: "US - SF Non-anony" },
    15: { name: "Workers - 10", url: "https://jsproxy1.jimmytinsley.workers.dev/-----", info: "US - SF Non-anony" },
    16: { name: "Workers - 11", url: "https://proxy.rdr.workers.dev/-----",         info: "US - SF Non-anony" },
    17: { name: "Workers - 12", url: "https://proxy.thiruhostinger.workers.dev/?url=", info: "US - SF Non-anony" },
    18: { name: "Workers - 13", url: "https://lucky-mountain-6e91.networkfreedom.workers.dev/-----", info: "US - SF Non-anony" },
    19: { name: "Workers - 14", url: "https://tohyotalk.habataku.workers.dev/-----",info: "US - SF Non-anony" },
    20: { name: "Workers - 15", url: "https://little-credit-fc7d.sfzanghao.workers.dev/-----", info: "US - SF Non-anony" },
    21: { name: "Workers - 16", url: "https://proxy.thiruhostinger.workers.dev/?url=", info: "US - SF Non-anony" }
};

const SANDBOX_SETTINGS = "allow-forms allow-modals allow-orientation-lock allow-pointer-lock allow-presentation allow-same-origin allow-scripts allow-storage-access-by-user-activation";

/* ======================================================
   プロファイル管理
====================================================== */
const DEFAULT_PROFILE_SETTINGS = () => ({
    homeUrl: "https://google.com/?igu=1",
    darkMode: false,
    bookmarks: [],
    viewMode: "iframe",
    activeProxyId: null
});

function loadProfiles() {
    try { return JSON.parse(localStorage.getItem('profiles')) || [{ id: 1, name: "デフォルト" }]; }
    catch(e) { return [{ id: 1, name: "デフォルト" }]; }
}
function saveProfiles() {
    localStorage.setItem('profiles', JSON.stringify(profiles));
}
function getActiveProfileId() {
    return parseInt(localStorage.getItem('active-profile-id')) || profiles[0].id;
}
function setActiveProfileId(id) {
    localStorage.setItem('active-profile-id', id);
}

let profiles = loadProfiles();
let activeProfileId = getActiveProfileId();

// 存在しないプロファイルIDが保存されていた場合のフォールバック
if (!profiles.find(p => p.id === activeProfileId)) {
    activeProfileId = profiles[0].id;
    setActiveProfileId(activeProfileId);
}

/* ---- プロファイルキー生成ヘルパー ---- */
function pk(key) { return `p${activeProfileId}-${key}`; }

/* ======================================================
   設定 (アクティブプロファイルスコープ)
====================================================== */
let settings = DEFAULT_PROFILE_SETTINGS();

function loadSettings() {
    const saved = localStorage.getItem(pk('settings'));
    if (saved) settings = { ...DEFAULT_PROFILE_SETTINGS(), ...JSON.parse(saved) };
    else settings = DEFAULT_PROFILE_SETTINGS();
}
function saveState() {
    localStorage.setItem(pk('settings'), JSON.stringify(settings));
    localStorage.setItem(pk('sessions'), JSON.stringify(tabs.map(t => ({
        id: t.id, url: t.url, title: t.title,
        history: t.history, historyIndex: t.historyIndex
    }))));
    localStorage.setItem(pk('last-active'), activeTabId);
}

/* ======================================================
   プロファイルUI
====================================================== */
function renderProfileBar() {}

function openProfileModal() {
    document.getElementById('profile-name-input').value = '';
    document.getElementById('profile-modal').classList.add('open');
    setTimeout(() => document.getElementById('profile-name-input').focus(), 50);
}
function closeProfileModal() {
    document.getElementById('profile-modal').classList.remove('open');
}
function confirmCreateProfile() {
    const name = document.getElementById('profile-name-input').value.trim();
    if (!name) return;
    const newId = Date.now();
    profiles.push({ id: newId, name });
    saveProfiles();
    closeProfileModal();
    switchProfile(newId);
}
document.getElementById('profile-name-input').addEventListener('keydown', e => {
    if (e.key === 'Enter') confirmCreateProfile();
    if (e.key === 'Escape') closeProfileModal();
});

function deleteProfile(id) {
    if (profiles.length <= 1) return;
    if (!confirm(`プロファイル「${profiles.find(p=>p.id===id)?.name}」を削除しますか？`)) return;
    // ストレージ削除
    ['settings','sessions','last-active'].forEach(k => localStorage.removeItem(`p${id}-${k}`));
    profiles = profiles.filter(p => p.id !== id);
    saveProfiles();
    if (activeProfileId === id) {
        activeProfileId = profiles[0].id;
        setActiveProfileId(activeProfileId);
    }
    initProfile();
}

function switchProfile(id) {
    if (id === activeProfileId) return;
    // 現在のタブをリセット
    tabs.forEach(t => { if(t.element) t.element.remove(); });
    tabs = [];
    activeTabId = null;
    document.getElementById('view').innerHTML = '';

    activeProfileId = id;
    setActiveProfileId(id);
    initProfile();
}

/* ======================================================
   ブラウザエンジン
====================================================== */
let tabs = [];
let activeTabId = null;

function setProgress(percent) {
    const bar = document.getElementById('progress-bar');
    bar.style.width = percent + "%";
    if (percent >= 100) setTimeout(() => { bar.style.width = "0%"; }, 400);
}

function getIconUrl(url) {
    if (url === "settings://") return "https://gstatic.com/images/branding/product/1x/settings_32dp.png";
    try { const domain = new URL(url).hostname; return `https://icons.duckduckgo.com/ip3/${domain}.ico`; }
    catch(e) { return "https://icons.duckduckgo.com/ip3/example.com.ico"; }
}

function getEffectiveUrl(url) {
    if (url === "settings://") return url;
    return !settings.activeProxyId ? url : PROXIES[settings.activeProxyId].url + url;
}

function createTabObject(url, id = Date.now(), title = "読み込み中...", history = null, hIndex = 0) {
    const tab = { id, url, title, history: history || [url], historyIndex: hIndex, element: null };
    updateTabElement(tab);
    tabs.push(tab);
    return tab;
}

function updateTabElement(tab) {
    if (tab.element) tab.element.remove();
    const viewArea = document.getElementById('view');
    let el;

    if (tab.url === "settings://") {
        el = document.createElement('div');
        el.className = "page-element settings-page";
        renderSettingsInto(el);
    } else {
        const finalUrl = getEffectiveUrl(tab.url);
        if (settings.viewMode === "iframe") {
            el = document.createElement('iframe');
            el.src = finalUrl;
            el.setAttribute("sandbox", SANDBOX_SETTINGS);
        } else {
            el = document.createElement(settings.viewMode === "object" ? "object" : "embed");
            el.src = finalUrl;
            el.data = finalUrl;
            el.type = "text/html";
        }
        el.className = "page-element";
        setProgress(30);
        el.onload = () => {
            setProgress(100);
            try { tab.title = el.contentDocument.title || new URL(tab.url).hostname; }
            catch(e) { tab.title = tab.url.replace(/https?:\/\//,'').split('/')[0]; }
            renderTabsUI(); updateStarUI();
        };
    }
    el.id = `page-${tab.id}`;
    if (tab.id === activeTabId) el.classList.add('active');
    viewArea.appendChild(el);
    tab.element = el;
}

function switchTab(id) {
    activeTabId = id;
    tabs.forEach(t => {
        const active = t.id === id;
        t.element.classList.toggle('active', active);
        if (active) {
            document.getElementById('url').value = t.url;
            if (t.url === "settings://") renderSettingsInto(t.element);
        }
    });
    updateNavButtons(); updateStarUI(); renderTabsUI(); saveState();
}

function renderTabsUI() {
    const bar = document.getElementById('tabs-bar');
    bar.innerHTML = '';
    tabs.forEach(t => {
        const div = document.createElement('div');
        div.className = `tab ${t.id === activeTabId ? 'active' : ''}`;
        div.innerHTML = `<img src="${getIconUrl(t.url)}"><span class="tab-title">${t.title}</span><span class="close-btn" data-tid="${t.id}">×</span>`;
        div.querySelector('.close-btn').addEventListener('click', e => { e.stopPropagation(); closeTab(t.id); });
        div.addEventListener('click', () => switchTab(t.id));
        bar.appendChild(div);
    });
    const add = document.createElement('button');
    add.textContent = "+";
    add.style = "height:28px; margin-top:5px;";
    add.onclick = () => createNewTab();
    bar.appendChild(add);
}

function go() {
    let url = document.getElementById('url').value;
    if (url !== "settings://" && !url.startsWith('http')) url = "https://" + url;
    const tab = tabs.find(t => t.id === activeTabId);
    if (tab.url !== url) {
        tab.history = tab.history.slice(0, tab.historyIndex + 1);
        tab.history.push(url); tab.historyIndex++; tab.url = url;
        updateTabElement(tab); switchTab(tab.id);
    }
}

function navBack() {
    const t = tabs.find(x => x.id === activeTabId);
    if (t && t.historyIndex > 0) { t.historyIndex--; t.url = t.history[t.historyIndex]; updateTabElement(t); switchTab(t.id); }
}
function navForward() {
    const t = tabs.find(x => x.id === activeTabId);
    if (t && t.historyIndex < t.history.length - 1) { t.historyIndex++; t.url = t.history[t.historyIndex]; updateTabElement(t); switchTab(t.id); }
}
function navReload() { const t = tabs.find(x => x.id === activeTabId); if(t) updateTabElement(t); }
function openSettings() { document.getElementById('url').value = "settings://"; go(); }
function goHome() { document.getElementById('url').value = settings.homeUrl; go(); }

function closeTab(id) {
    if (tabs.length === 1) return;
    const idx = tabs.findIndex(t => t.id === id);
    tabs[idx].element.remove(); tabs.splice(idx, 1);
    switchTab(tabs[Math.max(0, idx - 1)].id);
}
function createNewTab(url = settings.homeUrl) { switchTab(createTabObject(url).id); }
function updateStarUI() {
    const t = tabs.find(x => x.id === activeTabId);
    const isB = settings.bookmarks.some(b => b.url === (t ? t.url : ""));
    document.getElementById('star-btn').classList.toggle('active', isB);
}
function updateNavButtons() {
    const t = tabs.find(x => x.id === activeTabId);
    if (!t) return;
    document.getElementById('btn-back').disabled = (t.historyIndex <= 0);
    document.getElementById('btn-forward').disabled = (t.historyIndex >= t.history.length - 1);
}
function toggleBookmark() {
    const tab = tabs.find(t => t.id === activeTabId);
    if (tab.url === "settings://") return;
    const idx = settings.bookmarks.findIndex(b => b.url === tab.url);
    if (idx > -1) settings.bookmarks.splice(idx, 1);
    else settings.bookmarks.push({ title: tab.title, url: tab.url });
    updateStarUI(); renderBookmarkBar(); saveState();
}
function renderBookmarkBar() {
    const bar = document.getElementById('bookmark-bar'); bar.innerHTML = '';
    settings.bookmarks.forEach(bm => {
        const div = document.createElement('div'); div.className = 'bm-item';
        div.innerHTML = `<img src="${getIconUrl(bm.url)}"><span>${bm.title}</span>`;
        div.onclick = () => { document.getElementById('url').value = bm.url; go(); };
        bar.appendChild(div);
    });
}

function renderSettingsInto(container) {
    let proxyHtml = "";
    for (const id in PROXIES) {
        const p = PROXIES[id]; const isC = settings.activeProxyId == id;
        proxyHtml += `
        <div class="proxy-item">
            <div><strong>${p.name}</strong><br><small>${p.info}</small></div>
            <div>${isC ? '<span class="status-connected">接続中</span>' : ''}
            <button onclick="toggleProxy(${id})">${isC ? '切断' : '接続'}</button></div>
        </div>`;
    }

    let profileHtml = profiles.map(p => `
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
            <span>${p.id === activeProfileId ? '▶ ' : ''}<strong>${p.name}</strong>${p.id === activeProfileId ? ' (現在)' : ''}</span>
            <div style="display:flex; gap:6px;">
                ${p.id !== activeProfileId ? `<button onclick="switchProfile(${p.id})">切替</button>` : ''}
                ${profiles.length > 1 ? `<button onclick="deleteProfile(${p.id})" style="color:#c00; border-color:#c00;">削除</button>` : ''}
            </div>
        </div>`).join('');

    container.innerHTML = `
        <div class="card"><h3>👤 プロファイル管理</h3>
            ${profileHtml}
            <button onclick="openProfileModal()" style="margin-top:8px;">+ 新規プロファイル</button>
        </div>
        <div class="card"><h3>★ ブックマーク</h3>
            ${settings.bookmarks.length === 0 ? '<p style="opacity:0.5">なし</p>' :
              settings.bookmarks.map((b,i) => `
              <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
                <span><img src="${getIconUrl(b.url)}" style="width:12px; margin-right:5px;">${b.title}</span>
                <button onclick="settings.bookmarks.splice(${i},1);saveState();renderSettingsInto(document.querySelector('.settings-page'));renderBookmarkBar();">削除</button>
              </div>`).join('')}
        </div>
        <div class="card"><h3>🌓 表示・モード</h3>
            <button onclick="settings.darkMode=!settings.darkMode; document.body.classList.toggle('dark-mode'); saveState(); renderSettingsInto(document.querySelector('.settings-page'));">ダークモード切替</button>
            <div style="margin-top:10px;">
                表示方式:
                <select onchange="settings.viewMode=this.value; updateViewModeButton(); saveState();" style="margin-left:10px;">
                    <option value="iframe" ${settings.viewMode==='iframe'?'selected':''}>iframe (通常)</option>
                    <option value="embed" ${settings.viewMode==='embed'?'selected':''}>embed (回避モード)</option>
                    <option value="object" ${settings.viewMode==='object'?'selected':''}>object</option>
                </select>
            </div>
        </div>
        <div class="card"><h3>🌐 プロキシ設定</h3>${proxyHtml}</div>
    `;
}

window.toggleProxy = (id) => {
    settings.activeProxyId = (settings.activeProxyId == id) ? null : id; saveState();
    const t = tabs.find(x => x.id === activeTabId);
    if (t && t.url !== "settings://") updateTabElement(t);
    renderSettingsInto(document.querySelector('.settings-page'));
};

function toggleViewMode() {
    settings.viewMode = settings.viewMode === "iframe" ? "embed" : "iframe";
    updateViewModeButton(); saveState();
    const t = tabs.find(x => x.id === activeTabId);
    if (t && t.url !== "settings://") updateTabElement(t);
}
function updateViewModeButton() {
    const btn = document.getElementById('view-mode-btn');
    if (settings.viewMode === "embed") {
        btn.classList.add('embed-mode');
        btn.title = "embedモード (ポップアップ制限回避中)";
    } else {
        btn.classList.remove('embed-mode');
        btn.title = "iframeモード (通常)";
    }
}

function toggleFullscreen() {
    if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(err => console.error(err));
    } else { exitFullscreen(); }
}
function exitFullscreen() { if (document.exitFullscreen) document.exitFullscreen(); }

function initProfile() {
    loadSettings();
    if (settings.darkMode) document.body.classList.add('dark-mode');
    else document.body.classList.remove('dark-mode');
    updateViewModeButton();

    const savedTabs = localStorage.getItem(pk('sessions'));
    if (savedTabs) {
        JSON.parse(savedTabs).forEach(t => createTabObject(t.url, t.id, t.title, t.history, t.historyIndex));
        const lastActive = parseInt(localStorage.getItem(pk('last-active')));
        const target = tabs.find(t => t.id === lastActive) || tabs[0];
        switchTab(target.id);
    } else {
        createNewTab(settings.homeUrl);
    }
    renderProfileBar();
    renderBookmarkBar();
}

document.getElementById("url").addEventListener("keydown", e => { if (e.key === "Enter") go(); });

initProfile();
</script>
</body>
</html>
