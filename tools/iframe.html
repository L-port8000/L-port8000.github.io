function getSandbox() {

    if (!settings.blockDownloads) s += " allow-downloads";

function isAdUrl(url) {
    if (!settings.adBlock) return false;
    try {
        const hostname = new URL(url).hostname.toLowerCase();
        return AD_DOMAINS.some(d => hostname === d || hostname.endsWith('.' + d));
    } catch(e) { return false; }
}

function addHistory(url, title) {
    if (SPECIAL_URLS.includes(url)) return;
    settings.history = settings.history || [];
    settings.history.unshift({ url, title: title || url, time: Date.now() });
    if (settings.history.length > 500) settings.history = settings.history.slice(0, 500);
    saveState();
}

let suggestionData = [];
let suggestionIndex = -1;

function updateSuggestions() {
    const input = document.getElementById('url');
    const container = document.getElementById('url-suggestions');
    const query = input.value.trim().toLowerCase();

    if (!query || SPECIAL_URLS.some(s => query.startsWith(s))) {
        container.classList.remove('show');
        suggestionIndex = -1;
        return;
    }

    const h = settings.history || [];
    suggestionData = h.filter(item =>
        (item.title && item.title.toLowerCase().includes(query)) ||
        (item.url && item.url.toLowerCase().includes(query))
    ).slice(0, 5);

    if (suggestionData.length === 0) {
        container.classList.remove('show');
        suggestionIndex = -1;
        return;
    }

    container.innerHTML = suggestionData.map((item, i) =>
        '<div class="url-suggestion" data-index="' + i + '" onclick="navigateSuggestion(' + i + ')">' +
            '<img src="' + getIconUrl(item.url) + '" onerror="this.style.display=\'none\'">' +
            '<div style="flex:1;overflow:hidden;">' +
                '<div class="sug-title">' + esc(item.title) + '</div>' +
                '<div class="sug-url">' + esc(item.url) + '</div>' +
            '</div>' +
        '</div>'
    ).join('');

    container.classList.add('show');
    suggestionIndex = -1;
}

function navigateSuggestion(i) {
    if (suggestionData[i]) {
        document.getElementById('url').value = suggestionData[i].url;
        document.getElementById('url-suggestions').classList.remove('show');

function takeScreenshot() {
    document.getElementById('screenshot-modal').classList.add('open');

function closeScreenshotModal() {
    document.getElementById('screenshot-modal').classList.remove('open');
}

async function takeViewportScreenshot() {
    closeScreenshotModal();
    try {
        const stream = await navigator.mediaDevices.getDisplayMedia({ preferCurrentTab: true });
        const video = document.createElement('video');
        video.srcObject = stream;
        await video.play();
        const canvas = document.createElement('canvas');
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        canvas.getContext('2d').drawImage(video, 0, 0);
        stream.getTracks().forEach(t => t.stop());
        const link = document.createElement('a');
        link.download = 'screenshot-' + Date.now() + '.png';
        link.href = canvas.toDataURL();
        link.click();
    } catch(e) {
        if (e.name !== 'NotAllowedError') alert('スクリーンショットに失敗しました: ' + e.message);
    }
}

async function takeFullScreenshot() {
    closeScreenshotModal();
    const tab = tabs.find(t => t.id === activeTabId);
    if (!tab || !tab.element || tab.element.tagName !== 'IFRAME') {
        alert('iframeサイトが開かれていません。現在表示中の画面でキャプチャします。');
        takeViewportScreenshot();
        return;
    }

    // Method 1: Canvas drawImage (works for same-origin iframes)
    try {
        const iframe = tab.element;
        const doc = iframe.contentDocument || iframe.contentWindow.document;
        const body = doc.body;
        const html = doc.documentElement;
        const width = Math.max(body.scrollWidth, body.offsetWidth, html.scrollWidth, html.offsetWidth, html.clientWidth);
        const height = Math.max(body.scrollHeight, body.offsetHeight, html.scrollHeight, html.offsetHeight, html.clientHeight);
        if (width === 0 || height === 0) throw new Error('Empty');
        const canvas = document.createElement('canvas');
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#fff';
        ctx.fillRect(0, 0, width, height);
        ctx.drawImage(iframe, 0, 0, width, height);
        const link = document.createElement('a');
        link.download = 'screenshot-full-' + Date.now() + '.png';
        link.href = canvas.toDataURL();
        link.click();
        return;
    } catch(e) {}

    // Method 2: Fetch page through a CORS proxy → same-origin blob iframe → canvas
    try {
        const url = tab.url;
        const proxyUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`;
        const resp = await fetch(proxyUrl);
        const html = await resp.text();
        if (html.length < 100) throw new Error('Empty response');
        const blob = new Blob([html], { type: 'text/html' });
        const blobUrl = URL.createObjectURL(blob);
        const tempFrame = document.createElement('iframe');
        tempFrame.style.cssText = 'position:absolute;left:-9999px;top:0;width:1024px;height:1px;border:none;';
        tempFrame.src = blobUrl;
        document.body.appendChild(tempFrame);
        await new Promise((resolve, reject) => {
            const t = setTimeout(() => reject(new Error('Timeout')), 10000);
            tempFrame.onload = () => { clearTimeout(t); setTimeout(resolve, 1000); };
        });
        const d = tempFrame.contentDocument || tempFrame.contentWindow.document;
        const b = d.body, h = d.documentElement;
        const fw = Math.max(b.scrollWidth, b.offsetWidth, h.scrollWidth, h.offsetWidth, h.clientWidth, 1024);
        const fh = Math.max(b.scrollHeight, b.offsetHeight, h.scrollHeight, h.offsetHeight, h.clientHeight, 1);
        tempFrame.style.width = fw + 'px';
        tempFrame.style.height = fh + 'px';
        await new Promise(r => setTimeout(r, 300));
        const canvas = document.createElement('canvas');
        canvas.width = fw;
        canvas.height = fh;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#fff';
        ctx.fillRect(0, 0, fw, fh);
        ctx.drawImage(tempFrame, 0, 0, fw, fh);
        tempFrame.remove();
        URL.revokeObjectURL(blobUrl);
        const link = document.createElement('a');
        link.download = 'screenshot-full-' + Date.now() + '.png';
        link.href = canvas.toDataURL();
        link.click();
        return;
    } catch(e) {}

    // Method 3: Open in popup → getDisplayMedia (user selects the popup)
    try {
        const popup = window.open(tab.url, '_blank', 'width=1024,height=768,scrollbars=yes');
        if (!popup) {
            alert('ポップアップがブロックされました。現在表示中の画面でキャプチャします。');
            takeViewportScreenshot();
            return;
        }
        await new Promise(r => setTimeout(r, 3000));
        alert('新しいウィンドウが開きました。\n画面選択ダイアログでそのウィンドウを選択して「共有」をクリックしてください。');
        const stream = await navigator.mediaDevices.getDisplayMedia();
        const video = document.createElement('video');
        video.srcObject = stream;
        await video.play();
        const canvas = document.createElement('canvas');
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        canvas.getContext('2d').drawImage(video, 0, 0);
        stream.getTracks().forEach(t => t.stop());
        try { popup.close(); } catch(e) {}
        const link = document.createElement('a');
        link.download = 'screenshot-full-' + Date.now() + '.png';
        link.href = canvas.toDataURL();
        link.click();
    } catch(e) {
        if (e.name !== 'NotAllowedError') alert('スクリーンショットに失敗しました: ' + e.message);
    }
}

let tabs = [], activeTabId = null;
let clockTimer = null;

function setProgress(p) {
    const bar = document.getElementById('progress-bar');
    bar.style.width = p + "%";
    if (p >= 100) setTimeout(() => { bar.style.width = "0%"; }, 400);
}

function esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function getIconUrl(url) {
    if (url === "settings://") return "https://gstatic.com/images/branding/product/1x/settings_32dp.png";
    if (url === "newtab://") return "data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><text y='18' font-size='16'>🏠</text></svg>";
    try { const domain = new URL(url).hostname; return `https://icons.duckduckgo.com/ip3/${domain}.ico`; }
    catch(e) { return "https://icons.duckduckgo.com/ip3/example.com.ico"; }
}

function normalizeTorUrl(url) {
    if (settings.torEnabled && url.includes(".onion")) return url.replace(".onion", settings.torGateway);
    return url;
}

function getEffectiveUrl(url) {
    if (SPECIAL_URLS.includes(url)) return url;
    let target = normalizeTorUrl(url);
    return !settings.activeProxyId ? target : PROXIES[settings.activeProxyId].url + target;
}

function createTabObject(url, id = Date.now(), title = "読み込み中...", history = null, hIndex = 0) {
    if (url === "newtab://") title = "新しいタブ";
    const tab = { id, url, title, history: history || [url], historyIndex: hIndex, element: null };
    updateTabElement(tab);
    tabs.push(tab);
    return tab;
}

function updateTabElement(tab) {
    if (tab.element) tab.element.remove();
    const viewArea = document.getElementById('view');
    let el;

    if (tab.url === "settings://") {
        el = document.createElement('div');
        el.className = "page-element settings-page";
        tab.title = "設定";
        renderSettingsInto(el);
    } else if (tab.url === "newtab://") {
        el = document.createElement('div');
        el.className = "page-element newtab-page";
        tab.title = "新しいタブ";
        renderNewtabInto(el);
    } else if (tab.url === "history://") {
        el = document.createElement('div');
        el.className = "page-element settings-page";
        tab.title = "履歴";
        renderHistoryInto(el);
    } else if (tab.url === "cookie://") {
        el = document.createElement('div');
        el.className = "page-element settings-page";
        tab.title = "Cookie管理";
        renderCookiesInto(el);
    } else {
        const finalUrl = getEffectiveUrl(tab.url);
        if (settings.viewMode === "iframe") {
            el = document.createElement('iframe');
            el.src = finalUrl;
            el.setAttribute("sandbox", getSandbox());
        } else {
            el = document.createElement(settings.viewMode === "object" ? "object" : "embed");
            el.src = finalUrl; el.data = finalUrl; el.type = "text/html";
        }
        el.className = "page-element";
        setProgress(30);
        el.onload = () => {
            setProgress(100);
            try { tab.title = el.contentDocument.title || new URL(tab.url).hostname; }
            catch(e) { tab.title = tab.url.replace(/https?:\/\//, '').split('/')[0]; }
            updateStarUI(); saveState(); renderTabsUI();
        };
    }
    el.id = `page-${tab.id}`;
    if (tab.id === activeTabId) el.classList.add('active');
    viewArea.appendChild(el);
    tab.element = el;
}

function switchTab(id) {
    const prev = tabs.find(t => t.id === activeTabId);
    if (prev && prev.element) prev.element._st = prev.element.scrollTop;
    activeTabId = id;
    tabs.forEach(t => {
        const active = t.id === id;
        t.element.classList.toggle('active', active);
        if (active) {
            document.getElementById('url').value = t.url;
            requestAnimationFrame(() => { if (t.element) t.element.scrollTop = t.element._st || 0; });
        }
    });
    updateNavButtons(); updateStarUI(); renderTabsUI(); saveState();
}

function go() {
    let url = document.getElementById('url').value.trim();
    if (SPECIAL_URLS.includes(url)) {
    } else if (!url.startsWith('http')) {
        if (url.includes('.') && !url.includes(' ')) url = "https://" + url;
        else url = "https://www.google.com/search?q=" + encodeURIComponent(url);
    }
    const tab = tabs.find(t => t.id === activeTabId);
    if (tab.url !== url || SPECIAL_URLS.includes(url)) {
        if (tab.url !== url) {
            tab.history = tab.history.slice(0, tab.historyIndex + 1);
            tab.history.push(url); tab.historyIndex++; tab.url = url;
            if (isAdUrl(url)) { alert('広告サイトのためブロックしました: ' + url); tab.url = tab.history[tab.historyIndex - 1] || tab.url; updateTabElement(tab); switchTab(tab.id); return; }
            addHistory(url, tab.title);
        }
        updateTabElement(tab); switchTab(tab.id);
    }
}

document.getElementById("url").addEventListener("input", updateSuggestions);
document.getElementById("url").addEventListener("focus", updateSuggestions);
document.getElementById("url").addEventListener("keydown", e => {
    const container = document.getElementById('url-suggestions');
    const items = container.querySelectorAll('.url-suggestion');
    if (e.key === "Enter") {
        if (suggestionIndex >= 0 && items[suggestionIndex]) {
            e.preventDefault();
            items[suggestionIndex].click();
        } else {
            go();
        }
        container.classList.remove('show');
    } else if (e.key === "ArrowDown") {
        e.preventDefault();
        suggestionIndex = Math.min(suggestionIndex + 1, items.length - 1);
        items.forEach((el, i) => el.classList.toggle('highlighted', i === suggestionIndex));
    } else if (e.key === "ArrowUp") {
        e.preventDefault();
        suggestionIndex = Math.max(suggestionIndex - 1, -1);
        items.forEach((el, i) => el.classList.toggle('highlighted', i === suggestionIndex));
    } else if (e.key === "Escape") {
        container.classList.remove('show');
        suggestionIndex = -1;
    }
});

function navBack() {
    const t = tabs.find(x => x.id === activeTabId);
    if (t && t.historyIndex > 0) { t.historyIndex--; t.url = t.history[t.historyIndex]; updateTabElement(t); switchTab(t.id); }
}
function navForward() {
    const t = tabs.find(x => x.id === activeTabId);
    if (t && t.historyIndex < t.history.length - 1) { t.historyIndex++; t.url = t.history[t.historyIndex]; updateTabElement(t); switchTab(t.id); }
}
function navReload() { const t = tabs.find(x => x.id === activeTabId); if (t && t.url !== "newtab://") updateTabElement(t); }

function goHome() { document.getElementById('url').value = settings.homeUrl; go(); }

function updateNavButtons() {
    const t = tabs.find(x => x.id === activeTabId); if (!t) return;
    document.getElementById('btn-back').disabled = (t.historyIndex <= 0);
    document.getElementById('btn-forward').disabled = (t.historyIndex >= t.history.length - 1);
}

function createNewTab(url) {
    if (!url) url = settings.homeUrl || "newtab://";
    switchTab(createTabObject(url).id);
    saveState();
}

function closeTab(id, e) {
    if (e) e.stopPropagation();
    if (tabs.length === 1) {
        tabs[0].url = settings.homeUrl || "newtab://";
        tabs[0].history = [tabs[0].url];
        tabs[0].historyIndex = 0;
        updateTabElement(tabs[0]);
        switchTab(tabs[0].id);
        renderTabsUI();
        return;
    }
    const idx = tabs.findIndex(t => t.id === id);
    tabs[idx].element.remove(); tabs.splice(idx, 1);
    switchTab(tabs[Math.max(0, idx - 1)].id);
    renderTabsUI(); saveState();
}

                <span class="nt-cat-label">${esc(cat.name)}</span>
            </div>
            <div class="nt-links">
                ${linksHtml}
            </div>
        </div>`;
    }

    container.innerHTML = `
        <div class="nt-header">
            <div class="nt-clock" id="nt-clock">${timeStr}</div>
            <div class="nt-date"  id="nt-date">${dateStr}</div>
        </div>
        <div class="nt-search-row">
            <input id="nt-search" type="text" placeholder="ツールを検索...">
            <button onclick="window.ntSearch()">検索</button>
        </div>
        <div class="nt-body">
            <div class="nt-top-bar">
                <h3>ツール &amp; リンク</h3>
            </div>
            <div class="nt-categories">${catsHtml}</div>
        </div>`;

    startClock();

    const si = container.querySelector('#nt-search');
    if (si) {
        si.addEventListener('input', window.ntSearch);
        si.addEventListener('keydown', e => { if (e.key === 'Enter') window.ntSearch(); });
    }
}

function startClock() {
    if (clockTimer) clearInterval(clockTimer);
    clockTimer = setInterval(() => {
        const c = document.getElementById('nt-clock');
        const d = document.getElementById('nt-date');
        if (!c) { clearInterval(clockTimer); clockTimer = null; return; }
        const now = new Date();
        c.textContent = now.toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' });
        if (d) d.textContent = now.toLocaleDateString('ja-JP', { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' });
    }, 1000);
}

window.ntOpen = function(catId, linkId) {
    const cat  = DEFAULT_NT_LINKS().find(c => c.id === catId);
    const link = cat && cat.links.find(l => l.id === linkId);
    if (link) openInNewTab(link.url);
};

window.ntSearch = function() {
    const input = document.getElementById('nt-search');
    if (!input) return;
    const query = input.value.toLowerCase();
    const categories = document.querySelectorAll('.nt-cat');
    categories.forEach(cat => {
        const links = cat.querySelectorAll('.nt-link');
        let visibleCount = 0;
        links.forEach(link => {
            const titleSpan = link.querySelector('span');
            if (titleSpan) {
                const title = titleSpan.textContent.toLowerCase();
                if (title.includes(query)) {
                    link.style.display = 'flex';
                    visibleCount++;
                } else {
                    link.style.display = 'none';
                }
            }
        });
        cat.style.display = visibleCount > 0 ? 'block' : 'none';
    });
};

/* ======================================================
   設定ページ
====================================================== */
function renderSettingsInto(container) {
    let proxyHtml = '';
    for (const id in PROXIES) {
        const p = PROXIES[id], isC = settings.activeProxyId == id;
        proxyHtml += `<div class="proxy-item">
            <div><strong>${esc(p.name)}</strong><br><small>${esc(p.info)}</small></div>
            <div>${isC ? '<span class="status-connected">接続中</span>' : ''}
            <button onclick="toggleProxy(${id})">${isC ? '切断' : '接続'}</button></div>
        </div>`;
    }

    const profileHtml = profiles.map(p => `
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
            <span>${p.id === activeProfileId ? '✅ ' : ''}<strong>${esc(p.name)}</strong>${p.id === activeProfileId ? ' (現在)' : ''}</span>
            <div style="display:flex; gap:6px;">
                ${p.id !== activeProfileId ? `<button onclick="switchProfile(${p.id})">切替</button>` : ''}
                ${profiles.length > 1 ? `<button onclick="deleteProfile(${p.id})" style="color:#c00; border-color:#c00;">削除</button>` : ''}
            </div>
        </div>`).join('');

    const bmsHtml = settings.bookmarks.length === 0
        ? '<p style="opacity:0.5">なし</p>'
        : settings.bookmarks.map((b,i) => `
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
            <span><img src="${getIconUrl(b.url)}" style="width:12px; margin-right:5px;">${esc(b.title)}</span>
            <button onclick="settings.bookmarks.splice(${i},1);saveState();renderSettingsInto(document.querySelector('.settings-page'));renderBookmarkBar();">削除</button>
          </div>`).join('');

    container.innerHTML = `
        <div class="card"><h3>👤 プロファイル管理</h3>
            ${profileHtml}
            <button onclick="openProfileModal()" style="margin-top:8px;">＋ 新規プロファイル</button>
        </div>
        <div class="card"><h3>🔖 ブックマーク</h3>${bmsHtml}</div>
        <div class="card"><h3>🎨 表示・ロード</h3>
            <button onclick="settings.darkMode=!settings.darkMode; document.body.classList.toggle('dark-mode'); saveState(); renderSettingsInto(document.querySelector('.settings-page'));">ダークモード切替</button>
            <div style="margin-top:10px;">
                表示モード:
                <select onchange="settings.viewMode=this.value; updateViewModeButton(); saveState();" style="margin-left:10px;">
                    <option value="iframe"  ${settings.viewMode==='iframe' ?'selected':''}>iframe (通常)</option>
                    <option value="embed"   ${settings.viewMode==='embed'  ?'selected':''}>embed (回避モード)</option>
                    <option value="object"  ${settings.viewMode==='object' ?'selected':''}>object</option>
                </select>
            </div>
            <div style="margin-top:12px;">
                <label style="display:flex;align-items:center;gap:8px;cursor:pointer;">
                    <input type="checkbox" ${settings.autoLoadTabs ? 'checked' : ''} onchange="settings.autoLoadTabs=this.checked;saveState();">
                    起動時に前のタブを復元する
                </label>
            </div>
        </div>
        <div class="card"><h3>🔒 セキュリティ</h3>
            <div style="margin-bottom:8px;">
                <label style="display:flex;align-items:center;gap:8px;cursor:pointer;">
                    <input type="checkbox" ${settings.adBlock ? 'checked' : ''} onchange="settings.adBlock=this.checked;saveState();">
                    広告ブロッカー
                </label>
            </div>
            <div style="margin-bottom:8px;">
                <label style="display:flex;align-items:center;gap:8px;cursor:pointer;">
                    <input type="checkbox" ${!settings.blockDownloads ? 'checked' : ''} onchange="settings.blockDownloads=!this.checked;saveState();">
                    ダウンロードを許可
                </label>
            </div>
            <div>
                <label style="display:flex;align-items:center;gap:8px;cursor:pointer;">
                    <input type="checkbox" ${!settings.blockPopups ? 'checked' : ''} onchange="settings.blockPopups=!this.checked;saveState();">
                    ポップアップを許可
                </label>
            </div>
        </div>
        <div class="card"><h3>📜 履歴/Cookie</h3>
            <button onclick="settings.history=settings.history||[]; document.getElementById('url').value='history://'; go();" style="margin-right:8px;">📋 履歴を表示</button>
            <button onclick="document.getElementById('url').value='cookie://'; go();">🍪 Cookie管理</button>
        </div>
        <div class="card"><h3>🌐 プロキシ設定</h3>${proxyHtml}</div>`;
}

window.toggleProxy = (id) => {
    settings.activeProxyId = (settings.activeProxyId == id) ? null : id; saveState();
    const t = tabs.find(x => x.id === activeTabId);
    if (t && !SPECIAL_URLS.includes(t.url)) updateTabElement(t);
    renderSettingsInto(document.querySelector('.settings-page'));
};

document.addEventListener('click', e => {
    const sc = document.getElementById('url-suggestions');
    const input = document.getElementById('url');
    if (sc && input && !sc.contains(e.target) && e.target !== input) {
        sc.classList.remove('show');
    }
});

/* ======================================================
   初期化
====================================================== */
function initProfile() {
    loadSettings();
    document.body.classList.toggle('dark-mode', !!settings.darkMode);
    updateViewModeButton();

    try {
        const savedTabs = localStorage.getItem(pk('sessions'));
        if (settings.autoLoadTabs && savedTabs) {
            const list = JSON.parse(savedTabs);
            if (list.length > 0) {
                list.forEach(t => createTabObject(t.url, t.id, t.title, t.history ?? [t.url], t.historyIndex ?? 0));
                const lastActive = parseInt(localStorage.getItem(pk('last-active')));
                switchTab((tabs.find(t => t.id === lastActive) || tabs[0]).id);
                renderBookmarkBar();
                return;
            }
        }
    } catch(e) { console.error(e); }

    createNewTab(settings.homeUrl || "newtab://");
    renderBookmarkBar();
}

initProfile();
</script>
</body>
</html>
