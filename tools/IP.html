<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>你的IP</title>
  <style>
    body { font-family: sans-serif; }
    .box { margin: 10px 0; }
  </style>
</head>
<body>
  <h2>你的IP</h2>

  <div class="box">
    <strong>HTTP (IPv4):</strong>
    <span id="http-ipv4">取得中...</span>
  </div>

  <div class="box">
    <strong>HTTP (IPv6):</strong>
    <span id="http-ipv6">取得中...</span>
  </div>

  <div class="box">
    <strong>HTTPS (IPv4):</strong>
    <span id="https-ipv4">取得中...</span>
  </div>

  <div class="box">
    <strong>HTTPS (IPv6):</strong>
    <span id="https-ipv6">取得中...</span>
  </div>

  <script>
    fetch('http://icanhazip.com')
      .then(res => res.text())
      .then(data => {
        document.getElementById('http-ipv4').textContent = data.trim();
      })
      .catch(() => {
        document.getElementById('http-ipv4').textContent = '取得失敗';
      });

    fetch('http://ipv6.icanhazip.com')
      .then(res => res.text())
      .then(data => {
        document.getElementById('http-ipv6').textContent = data.trim();
      })
      .catch(() => {
        document.getElementById('http-ipv6').textContent = 'なし';
      });

    fetch('https://icanhazip.com')
      .then(res => res.text())
      .then(data => {
        document.getElementById('https-ipv4').textContent = data.trim();
      })
      .catch(() => {
        document.getElementById('https-ipv4').textContent = '取得失敗';
      });

    fetch('https://ipv6.icanhazip.com')
      .then(res => res.text())
      .then(data => {
        document.getElementById('https-ipv6').textContent = data.trim();
      })
      .catch(() => {
        document.getElementById('https-ipv6').textContent = 'なし';
      });
  </script>
</body>
</html>
