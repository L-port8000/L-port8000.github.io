let d={a:[{id:"a1",n:"ユーザー",i:"@user",fw:100,fg:50,av:"",hd:""}],ac:"a1",t:[],th:"light"};
let curTImg="", curAImg="", curHImg="", editId=null, profId=null;

function op(tid=null){
  editId=tid; document.getElementById("pov").style.display="flex";
  let a=d.a.find(x=>x.id===d.ac)||d.a[0];

  let o={tx,im:curTImg,rp:v("irp"),rt:v("irt"),fv:v("ifv"),vw:v("ivw")};
  if(editId){ Object.assign(d.t.find(x=>x.id===editId),o) }else{ d.t.push({id:Date.now()+"",aid:d.ac,ts:Date.now(),...o}) }

function dt(){if(confirm("削除？")){d.t=d.t.filter(x=>x.id!==editId);clp();sd();rt();if(profId)up(profId);}}
function v(id){return document.getElementById(id).value||0}
function rt(target="tl", aid=null){
  let tl=document.getElementById(target); tl.innerHTML="";
  let list=aid?d.t.filter(x=>x.aid===aid):d.t;
  [...list].sort((a,b)=>b.ts-a.ts).forEach(t=>{

    tl.appendChild(e);
  });

function up(aid){
  profId=aid; let a=d.a.find(x=>x.id===aid); sv('p');
  document.getElementById("ph-title").innerText=a.n;
  document.getElementById("p-name").innerText=a.n;

  document.getElementById("p-av").style.backgroundImage=a.av?`url(${a.av})`:"";
  document.getElementById("p-himg").style.backgroundImage=a.hd?`url(${a.hd})`:"";
  rt("p-tl", aid);
}
function oep(){
  let a=d.a.find(x=>x.id===profId);
  document.getElementById("eov").style.display="flex";
  document.getElementById("en").value=a.n; document.getElementById("ei").value=a.i;
  document.getElementById("efg").value=a.fg; document.getElementById("efw").value=a.fw;
  curAImg=a.av; curHImg=a.hd;
}
function upd(){
  let a=d.a.find(x=>x.id===profId);
  Object.assign(a,{n:document.getElementById("en").value,i:document.getElementById("ei").value,fg:v("efg"),fw:v("efw"),av:curAImg,hd:curHImg});

function da(){if(confirm("アカウントを削除しますか？")){d.t=d.t.filter(x=>x.aid!==profId);d.a=d.a.filter(x=>x.id!==profId);if(d.ac===profId)d.ac=d.a[0].id;cle();sd();sv('h');ra();rt()}}
function cle(){document.getElementById("eov").style.display="none"}
function ca(){
  let id="a"+Date.now(); d.a.push({id,n:document.getElementById("an").value||"名無し",i:document.getElementById("ai").value||"@user",fw:0,fg:0,av:"",hd:""});
  sd();ra();
}

  let l=document.getElementById("alst"); l.innerHTML="<h3>アカウント切り替え</h3>";
  let curA = d.a.find(x=>x.id===d.ac) || d.a[0];
  document.getElementById("h-av").style.backgroundImage=curA.av?`url(${curA.av})`:"";
  d.a.forEach(a=>{
    let e=document.createElement("div"); e.className="acc-item"+(d.ac===a.id?" act":""); e.onclick=()=>{d.ac=a.id;sd();ra();rt()};
    e.innerHTML=`<div class="av av-m" style="background-image:url(${a.av})"></div><div><div class="tn">${a.n}</div><div class="tid">${a.i}</div></div>${sCHK}`;
    l.appendChild(e);

}
