        .acc-info { flex: 1 }

</head>

<script>
let d={a:[{id:"a1",n:"ユーザー",i:"@user",fw:0,fg:0,av:"",hd:"",likes:[],reposts:[]}],ac:"a1",t:[],th:"light"};
let curTImg="", curAImg="", curHImg="", profId=null, replyId=null, editPostId=null, openMenuId=null;
const DB_NAME = "TwimemoDB", STORE_NAME = "AppData";

function openDB() {
    return new Promise((res, rej) => {
        const req = indexedDB.open(DB_NAME, 2);
        req.onupgradeneeded = e => { if(!e.target.result.objectStoreNames.contains(STORE_NAME)) e.target.result.createObjectStore(STORE_NAME); };
        req.onsuccess = e => res(e.target.result);
        req.onerror = rej;
    });
}
async function sd() { const db = await openDB(); const tx = db.transaction(STORE_NAME, "readwrite"); tx.objectStore(STORE_NAME).put(d, "mainData"); }
async function ld() {
    const db = await openDB();
    const tx = db.transaction(STORE_NAME, "readonly");
    const req = tx.objectStore(STORE_NAME).get("mainData");
    req.onsuccess = () => { if (req.result) d = req.result; d.a.forEach(a => { if(!a.likes) a.likes=[]; if(!a.reposts) a.reposts=[]; }); st(d.th || "light"); ra(); rt(); };
}

function fmt(n){ n=Number(n)||0; return n>=10000?(n/1000).toFixed(1)+"K":n.toLocaleString(); }

function sv(v){
    window.scrollTo(0,0);
    document.querySelectorAll(".v").forEach(x=>x.classList.remove("a"));
    document.getElementById("v"+v).classList.add("a");
    document.querySelectorAll(".ni").forEach(x=>x.classList.remove("a"));
    const n = document.getElementById("n"+v); if(n) n.classList.add("a");
    closeMenus();
}

function ra() {
    const l = document.getElementById("alst"); l.innerHTML = "";
    const curA = d.a.find(x => x.id === d.ac) || d.a[0];
    document.getElementById("h-av").style.backgroundImage = curA.av ? `url(${curA.av})` : "";
    d.a.forEach(a => {
        let e = document.createElement("div"); e.className = "acc-list-item" + (d.ac === a.id ? " active" : "");
        e.onclick = () => { d.ac = a.id; sd(); ra(); rt(); };
        e.innerHTML = `<div class="av av-m" style="background-image:url(${a.av});width:50px;height:50px;border-radius:8px"></div><div class="acc-info" style="flex:1"><div class="acc-name">${a.n}</div><div class="acc-id">${a.i}</div></div>${d.ac === a.id ? '<svg viewBox="0 0 24 24" style="width:20px;height:20px;fill:var(--p)"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>' : ''}`;
        l.appendChild(e);
    });
}

function swTab(tab) {
    document.querySelectorAll(".ph-tab").forEach(x => x.classList.remove("a"));
    document.querySelectorAll(".tab-content").forEach(x => x.classList.remove("a"));
    
    if(tab === 'posts') {
        document.querySelectorAll(".ph-tab")[0].classList.add("a");
        document.getElementById("posts-tab").classList.add("a");
    } else {
        document.querySelectorAll(".ph-tab")[1].classList.add("a");

    }
}

                <div class="tm-i" onclick="event.stopPropagation()"><svg class="tm-svg" viewBox="0 0 24 24"><path d="M1.75 10c0-4.42 3.58-8 8-8h4.37c.33.03.61.28.61.62v2.3c0 .43-.39.73-.81.69-1.53-.17-3.05-.2-4.17-.2-3.31 0-6 2.69-6 6s2.69 6 6 6h10.5l-4.28-4.29c-.19-.19-.19-.51 0-.7.2-.2.51-.2.7 0l5.14 5.14c.2.2.2.51 0 .7l-5.14 5.14c-.1.1-.23.15-.35.15s-.25-.05-.35-.15c-.19-.19-.19-.51 0-.7l4.28-4.29H9.75c-4.42 0-8-3.58-8-8z"/></svg> ${fmt(t.rp)}</div>
                <div class="tm-i" onclick="event.stopPropagation();toggleRepost('${t.id}')" style="${(t.repostBy || []).includes(d.ac) ? 'color:var(--p)' : ''}"><svg class="tm-svg" viewBox="0 0 24 24"><path d="M4.5 3.88l4.43 4.42c.19.19.19.51 0 .71-.19.19-.51.19-.7 0L5.5 6.27V15c0 1.66 1.34 3 3 3h6c.28 0 .5.22.5.5s-.22.5-.5.5h-6c-2.21 0-4-1.79-4-4V6.27L1.77 8.51c-.19.19-.51.19-.7 0-.19-.2-.19-.52 0-.71l4.43-4.42c.19-.2.51-.2.7 0zm15 16.24l-4.43-4.42c-.19-.2-.19-.52 0-.71s.51-.2.71 0l2.72 2.73V9c0-1.66-1.34-3-3-3h-6c-.28 0-.5-.22-.5-.5s.22-.5.5-.5h6c2.21 0 4 1.79 4 4v8.73l2.73-2.73c.19-.19.51-.19.7 0 .2.2.2.52 0 .71l-4.43 4.42c-.2.2-.51.2-.7 0z"/></svg> ${fmt(repostCount)}</div>
                <div class="tm-i" onclick="event.stopPropagation();toggleLike('${t.id}')" style="${(t.likeBy || []).includes(d.ac) ? 'color:#e74c3c' : ''}"><svg class="tm-svg" viewBox="0 0 24 24"><path d="M16.697 5.5c-1.222-.06-2.679.351-3.827 1.36-.11.1-.28.1-.39 0-1.148-1.009-2.605-1.42-3.827-1.36-2.224.11-4.153 1.902-4.403 4.14-.305 2.728 1.479 5.481 4.096 7.302l2.816 1.938c.15.103.351.103.501 0l2.816-1.938c2.617-1.821 4.401-4.574 4.096-7.302-.25-2.238-2.179-4.03-4.403-4.14z"/></svg> ${fmt(likeCount)}</div>
                <div class="tm-i"><svg class="tm-svg" viewBox="0 0 24 24"><path d="M8.75 21V3h2v18h-2zM18 21V8.5h2V21h-2zM4 21l.004-10h2L6 21H4zm9.248 0v-7h2v7h-2z"/></svg> ${fmt(t.vw)}</div>
            </div>
        </div>`;
    return e;
}

function rt(target="tl", aid=null) {
    const tl = document.getElementById(target); tl.innerHTML = "";
    const list = aid ? d.t.filter(x => x.aid === aid && !x.reId) : d.t.filter(x => !x.reId);
    [...list].sort((a,b)=>b.ts - a.ts).forEach(t => {
        tl.appendChild(createTweet(t));
    });
}

function rtReply(aid) {
    const rtl = document.getElementById("p-rp-tl"); rtl.innerHTML = "";
    const allPosts = d.t.filter(x => x.aid === aid);
    [...allPosts].sort((a,b)=>b.ts - a.ts).forEach(post => {
        rtl.appendChild(createTweet(post));
    });
}

function toggleLike(tid) {
    const t = d.t.find(x => x.id === tid);
    if(!t) return;
    if(!t.likeBy) t.likeBy = [];
    if(t.likeBy.includes(d.ac)) {
        t.likeBy = t.likeBy.filter(x => x !== d.ac);
        t.fv = Math.max(0, (t.fv || 0) - 1);
    } else {
        t.likeBy.push(d.ac);
        t.fv = (t.fv || 0) + 1;
    }
    sd(); rt(); rtProfile();
}

function toggleRepost(tid) {
    const t = d.t.find(x => x.id === tid);
    if(!t) return;
    if(!t.repostBy) t.repostBy = [];
    if(t.repostBy.includes(d.ac)) {
        t.repostBy = t.repostBy.filter(x => x !== d.ac);
        t.rt = Math.max(0, (t.rt || 0) - 1);
    } else {
        t.repostBy.push(d.ac);
        t.rt = (t.rt || 0) + 1;
    }
    sd(); rt(); rtProfile();
}

function rtProfile() {
    if(!profId) return;
    rt("p-tl", profId);
    rtReply(profId);
}

function toggleMenu(tid) {
    const menu = document.getElementById("menu-"+tid);
    if(openMenuId && openMenuId !== tid) {
        const oldMenu = document.getElementById("menu-"+openMenuId);
        if(oldMenu) oldMenu.style.display = "none";
    }
    menu.style.display = menu.style.display === "none" ? "block" : "none";
    openMenuId = menu.style.display === "block" ? tid : null;
}

function editPost(tid) {
    const post = d.t.find(x => x.id === tid);
    if(!post || post.aid !== d.ac) return;
    editPostId = tid;
    document.getElementById("p-btn").innerText = "保存";
    document.getElementById("ti").value = post.tx;
    document.getElementById("irp").value = post.rp || 0;
    document.getElementById("irt").value = post.rt || 0;
    document.getElementById("ifv").value = post.fv || 0;
    document.getElementById("ivw").value = post.vw || 0;
    if(post.im) {
        curTImg = post.im;
        document.getElementById("p-pre").src = post.im;
        document.getElementById("p-pre").style.display = "block";
    }
    document.getElementById("pov").style.display = "flex";
    updatePostAv();
    closeMenus();
}

function closeMenus() {
    document.querySelectorAll(".dropdown-menu").forEach(m => m.style.display = "none");
    openMenuId = null;
}

function showDetail(tid) {
    const t = d.t.find(x => x.id === tid); if(!t) return;
    const a = d.a.find(x => x.id === t.aid) || d.a[0];
    replyId = t.id;
    sv('d');
    closeMenus();
    
    const backBtn = document.getElementById("back-btn");
    if (t.reId) {
        backBtn.onclick = () => showDetail(t.reId);
    } else {
        backBtn.onclick = () => sv('h');
    }

    const likeCount = (t.likeBy || []).length;
    const repostCount = (t.repostBy || []).length;

    document.getElementById("d-cont").innerHTML = `
        <div class="dtw">
            <div style="display:flex;gap:12px;align-items:center;margin-bottom:12px;justify-content:space-between">
                <div style="display:flex;gap:12px;align-items:center;flex:1">
                    <div class="av av-m" style="background-image:url(${a.av})"></div>
                    <div><b>${a.n}</b><br><small>${a.i}</small></div>
                </div>
                ${t.aid === d.ac ? `<button class="menu-btn detail-menu-btn" onclick="event.stopPropagation();toggleMenu('detail-${t.id}')">⋯</button><div id="menu-detail-${t.id}" class="dropdown-menu" style="display:none;"><button onclick="event.stopPropagation();editPost('${t.id}')">編集</button><button class="danger" onclick="event.stopPropagation();dt('${t.id}')">削除</button></div>` : ''}
            </div>
            <div style="font-size:19px;line-height:1.4">${t.tx}</div>
            ${t.im?`<img src="${t.im}" class="t-img">`:""}
            <div style="color:var(--l);margin:12px 0;padding:12px 0;border-top:1px solid var(--bd);border-bottom:1px solid var(--bd)">
                ${new Date(t.ts).toLocaleString()} ・ <b>${fmt(t.vw)}</b> 表示
            </div>
            <div style="display:flex;gap:20px;padding-bottom:12px;border-bottom:1px solid var(--bd)">
                <span><b>${fmt(repostCount)}</b> 再投稿</span> <span><b>${fmt(likeCount)}</b> いいね</span>
            </div>
        </div>
    `;
    const rps = d.t.filter(x => x.reId === tid);
    const rtl = document.getElementById("d-rp-tl"); rtl.innerHTML = "";
    rps.forEach(r => {
        rtl.appendChild(createTweet(r, true));
    });
}

function op(){ editPostId = null; replyId = null; document.getElementById("p-btn").innerText="ツイート"; document.getElementById("pov").style.display="flex"; updatePostAv(); closeMenus(); }
function op_rp(){ editPostId = null; document.getElementById("p-btn").innerText="返信"; document.getElementById("pov").style.display="flex"; updatePostAv(); closeMenus(); }
function updatePostAv(){ const a=d.a.find(x=>x.id===d.ac); document.getElementById("post-av").style.backgroundImage=a.av?`url(${a.av})`:""; }

function pt() {
    const tx = document.getElementById("ti").value;
    
    if(editPostId) {
        const post = d.t.find(x => x.id === editPostId);
        if(post && post.aid === d.ac) {
            post.tx = tx;
            post.im = curTImg;
            post.rp = document.getElementById("irp").value || 0;
            post.rt = document.getElementById("irt").value || 0;
            post.fv = document.getElementById("ifv").value || 0;
            post.vw = document.getElementById("ivw").value || 0;
            post.ts = Date.now();
        }
    } else {
        const nt = {
            id: Date.now().toString(),
            aid: d.ac,
            ts: Date.now(),
            tx,
            im: curTImg,
            rp: document.getElementById("irp").value || 0,
            rt: document.getElementById("irt").value || 0,
            fv: document.getElementById("ifv").value || 0,
            vw: document.getElementById("ivw").value || 0,
            reId: replyId,
            likeBy: [],
            repostBy: []
        };
        
        if(replyId) {
            const target = d.t.find(x => x.id === replyId);
            if(target) target.rp = (Number(target.rp) || 0) + 1;
        }

        d.t.push(nt);
    }

    clp(); sd(); 
    if(replyId) showDetail(replyId); else rt();
}

async function compress(base64, size=600, quality=0.95) {
    return new Promise(res => {
        const img = new Image();
        img.onload = () => {
            const canvas = document.createElement('canvas');
            let w=img.width, h=img.height, scale = Math.min(size/w, size/h, 1);
            canvas.width = w*scale; canvas.height = h*scale;
            canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
            res(canvas.toDataURL('image/jpeg', quality));
        };
        img.src = base64;
    });
}

function pvw(i, m) {
    const f = i.files[0]; if(!f) return; const r = new FileReader();
    r.onload = async e => {
        let res = e.target.result;
        if(m==='hd') {
            res = await compress(e.target.result, 1200, 0.98);
        } else if(m==='t') {
            res = await compress(e.target.result, 800, 0.9);
        } else if(m==='av') {
            res = await compress(e.target.result, 400, 0.9);
        }
        
        if(m==='t'){ curTImg=res; document.getElementById("p-pre").src=res; document.getElementById("p-pre").style.display="block" }
        if(m==='av') curAImg=res; if(m==='hd') curHImg=res;
    };
    r.readAsDataURL(f);
}

function up(aid) {
    profId = aid; const a = d.a.find(x => x.id === aid); sv('p');
    document.getElementById("ph-title").innerText = a.n;
    document.getElementById("p-name").innerText = a.n;
    document.getElementById("p-id").innerText = a.i;
    document.getElementById("p-av").style.backgroundImage = a.av ? `url(${a.av})` : "";
    document.getElementById("p-himg").style.backgroundImage = a.hd ? `url(${a.hd})` : "";
    document.getElementById("p-fw").innerText = fmt(a.fw); document.getElementById("p-fg").innerText = fmt(a.fg);
    swTab('posts');
    rt("p-tl", aid);
    rtReply(aid);
}

function oep() {
    const a = d.a.find(x => x.id === profId);
    document.getElementById("eov").style.display = "flex";
    document.getElementById("en").value = a.n; document.getElementById("ei").value = a.i;
    document.getElementById("efg").value = a.fg; document.getElementById("efw").value = a.fw;
    curAImg = a.av; curHImg = a.hd;
}

function upd() {
    const a = d.a.find(x => x.id === profId);
    Object.assign(a, { n: document.getElementById("en").value, i: document.getElementById("ei").value, fg: document.getElementById("efg").value, fw: document.getElementById("efw").value, av: curAImg, hd: curHImg });
    cle(); sd(); ra(); up(profId);
}

function ca() { 
    const n = document.getElementById("an").value;
    const i = document.getElementById("ai").value;
    if(!n || !i) { alert("名前とIDを入力してください"); return; }
    const id="a"+Date.now(); 
    d.a.push({id, n, i, fw:0, fg:0, av:"", hd:"", likes:[], reposts:[]}); 
    document.getElementById("an").value = "";
    document.getElementById("ai").value = "";
    sd(); 
    ra(); 
}

function st(t){ 
    d.th=t; 
    document.body.setAttribute("data-theme", t); 
    document.getElementById("light-btn").classList.toggle("active", t==="light");
    document.getElementById("dark-btn").classList.toggle("active", t==="dark");
    sd(); 
}

function clp(){ 
    document.getElementById("pov").style.display="none"; 
    editPostId = null; 
    curTImg=""; 
    document.getElementById("ti").value=""; 
    document.getElementById("p-pre").style.display="none"; 
    ["irp","irt","ifv","ivw"].forEach(id=>document.getElementById(id).value=0); 
    closeMenus(); 
}

function cle(){ document.getElementById("eov").style.display="none" }
function dt(tid) { if(confirm("削除しますか？")){ d.t = d.t.filter(x=>x.id!==tid); sd(); sv('h'); rt(); closeMenus(); } }


function da(){ 
    if(confirm("消去？")){ 
        const deletedAccountId = profId;
        

        d.t = d.t.filter(x => x.aid !== deletedAccountId);
        

        d.t.forEach(post => {
            if(post.likeBy) post.likeBy = post.likeBy.filter(x => x !== deletedAccountId);
            if(post.repostBy) post.repostBy = post.repostBy.filter(x => x !== deletedAccountId);
        });
        

        d.a = d.a.filter(x => x.id !== deletedAccountId);
        

        if(d.ac === deletedAccountId) {
            d.ac = d.a.length > 0 ? d.a[0].id : "a1";
        }
        

        sd();
        

        sv('h');
        ra();
        rt();
    } 
}

function cd(){ if(confirm("全データ消去？")){ indexedDB.deleteDatabase(DB_NAME); location.reload(); } }
function edat(){ const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([JSON.stringify(d)],{type:"application/json"})); a.download="twimemo_db.json"; a.click(); }
function idat(e){ const r=new FileReader(); r.onload=ev=>{d=JSON.parse(ev.target.result); d.a.forEach(a => { if(!a.likes) a.likes=[]; if(!a.reposts) a.reposts=[]; }); sd(); location.reload();}; r.readAsText(e.target.files[0]); }

ld();
</script>
