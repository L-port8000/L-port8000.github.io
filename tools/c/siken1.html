<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ローカルメモ帳</title>
    <style>
        :root {

            --bg-color: #f5f5f5;
            --sidebar-bg: #ffffff;
            --editor-bg: #ffffff;
            --border-color: #ddd;
            --primary: #1a73e8;
            --primary-hover: #1557b0;
            --text-main: #333;
            --text-sub: #666;
            --sidebar-width: 300px;
        }

        @media (prefers-color-scheme: dark) {
            :root {

                --bg-color: #121212;
                --sidebar-bg: #1e1e1e;
                --editor-bg: #1e1e1e;
                --border-color: #333;
                --primary: #8ab4f8;
                --primary-hover: #aecbfa;
                --text-main: #e8eaed;
                --text-sub: #9aa0a6;
            }
        }

        body, html {
            margin: 0; padding: 0; height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color); color: var(--text-main);
            overflow: hidden;
        }

        .container { display: flex; height: 100vh; position: relative; }
        

        .sidebar { 
            width: var(--sidebar-width); 
            min-width: 50px;
            background-color: var(--sidebar-bg); 
            border-right: 1px solid var(--border-color); 
            display: flex; 
            flex-direction: column;
            transition: width 0.2s ease;
            position: relative;
        }
        .sidebar.collapsed { width: 0px; min-width: 0px; border-right: none; overflow: hidden; }
        .sidebar-header { padding: 15px; border-bottom: 1px solid var(--border-color); display: flex; flex-direction: column; gap: 10px; min-width: 250px; }


        .btn { padding: 8px 12px; background-color: var(--primary); color: #000; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; font-weight: bold; white-space: nowrap; }
        @media (prefers-color-scheme: dark) { .btn { color: #121212; } }
        .btn:hover { background-color: var(--primary-hover); }
        .btn-outline { background-color: transparent; color: var(--text-main); border: 1px solid var(--border-color); }
        .btn-danger { background-color: #f28b82; color: #121212; }


        .note-list { flex: 1; overflow-y: auto; list-style: none; margin: 0; padding: 0; min-width: 250px; }
        .note-item { padding: 15px; border-bottom: 1px solid var(--border-color); cursor: pointer; }
        .note-item:hover { background-color: rgba(255,255,255,0.05); }
        .note-item.active { background-color: rgba(138, 180, 248, 0.15); border-left: 4px solid var(--primary); }
        .note-item-title { font-weight: bold; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .note-item-date { font-size: 12px; color: var(--text-sub); }

        .resizer { width: 4px; cursor: col-resize; background-color: transparent; transition: background-color 0.2s; z-index: 10; }
        .resizer:hover { background-color: var(--primary); }


        .editor { flex: 1; display: flex; flex-direction: column; background: var(--editor-bg); position: relative; }
        
        .toggle-sidebar {
            position: absolute; left: 10px; top: 15px; z-index: 100;
            background: var(--sidebar-bg); color: var(--text-main);
            border: 1px solid var(--border-color); border-radius: 4px;
            padding: 5px 8px; cursor: pointer;
        }


        .editor-content-wrapper {
            padding: 60px 5% 20px 5%;
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-y: auto;
        }

        .editor-content { 
            display: none; 
            flex-direction: column; 
            width: 100%; 
            max-width: 800px;
            height: 100%;
        }

        .editor-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; gap: 15px; }
        
        #noteTitle { 
            background: transparent; color: var(--text-main);
            font-size: 24px; border: none; outline: none; width: 100%; font-weight: bold; 
        }

        #noteBody { 
            flex: 1; 
            background: transparent; color: var(--text-main);
            border: none; outline: none; 
            font-size: 16px; line-height: 1.8; 
            min-height: 300px;
            padding-bottom: 100px;
            word-break: break-all;
        }
        #noteBody img { max-width: 100%; height: auto; border-radius: 8px; margin: 10px 0; }
        #noteBody:empty:before { content: attr(placeholder); color: var(--text-sub); }

        .editor-placeholder { flex: 1; display: flex; align-items: center; justify-content: center; color: var(--text-sub); }


        @media (max-width: 768px) {
            :root { --sidebar-width: 80vw; }
            .sidebar { position: absolute; left: 0; top: 0; height: 100%; z-index: 150; box-shadow: 5px 0 15px rgba(0,0,0,0.3); }
            .sidebar.collapsed { transform: translateX(-100%); }
            .editor-content-wrapper { padding: 60px 20px 20px 20px; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <button class="btn" onclick="createNewNote()">＋ 新しいメモ</button>
            <div class="file-controls">
                <button class="btn btn-outline" onclick="exportToFile()">JSON保存</button>
                <button class="btn btn-outline" onclick="document.getElementById('fileInput').click()">読込</button>
                <input type="file" id="fileInput" accept=".json" onchange="importFromFile(event)">
            </div>
        </div>
        <ul class="note-list" id="noteList"></ul>
    </div>

    <div class="resizer" id="resizer"></div>

    <div class="editor">
        <button class="toggle-sidebar" onclick="toggleSidebar()">☰</button>
        <div class="editor-content-wrapper">
            <div class="editor-placeholder" id="editorPlaceholder">メモを選択してください</div>
            <div class="editor-content" id="editorContent">
                <div class="editor-header">
                    <input type="text" id="noteTitle" placeholder="タイトル" oninput="updateCurrentNote()">
                    <button class="btn btn-danger" onclick="deleteCurrentNote()">削除</button>
                </div>
                <div id="noteBody" contenteditable="true" oninput="updateCurrentNote()" placeholder="ここに内容を入力（画像をペースト可）..."></div>
            </div>
        </div>
    </div>
</div>

<script>
    const DB_NAME = 'NotesAppDB_V2';
    const STORE_NAME = 'notes';
    let db;
    let notes = [];
    let currentNoteId = null;

    const initDB = () => {
        return new Promise((resolve) => {
            const request = indexedDB.open(DB_NAME, 1);
            request.onupgradeneeded = (e) => {
                e.target.result.createObjectStore(STORE_NAME, { keyPath: 'id' });
            };
            request.onsuccess = (e) => { db = e.target.result; resolve(); };
        });
    };

    const dbSaveAll = async (notesArray) => {
        const tx = db.transaction(STORE_NAME, 'readwrite');
        const store = tx.objectStore(STORE_NAME);
        await store.clear();
        notesArray.forEach(n => store.put(n));
    };

    const dbGetAll = () => {
        return new Promise((resolve) => {
            const tx = db.transaction(STORE_NAME, 'readonly');
            tx.objectStore(STORE_NAME).getAll().onsuccess = (e) => resolve(e.target.result);
        });
    };

    window.onload = async () => {
        await initDB();
        notes = await dbGetAll();
        notes.sort((a, b) => new Date(b.date) - new Date(a.date));
        renderList();
        if (window.innerWidth <= 768) sidebar.classList.add('collapsed');
    };

    function renderList() {
        const listEl = document.getElementById('noteList');
        listEl.innerHTML = '';
        notes.forEach(note => {
            const li = document.createElement('li');
            li.className = `note-item ${note.id === currentNoteId ? 'active' : ''}`;
            li.onclick = () => selectNote(note.id);
            li.innerHTML = `
                <div class="note-item-title">${note.title || '（無題）'}</div>
                <div class="note-item-date">${note.date}</div>
            `;
            listEl.appendChild(li);
        });
    }

    async function createNewNote() {
        const newNote = { id: Date.now().toString(), title: '', body: '', date: new Date().toLocaleString() };
        notes.unshift(newNote);
        await dbSaveAll(notes);
        selectNote(newNote.id);
        if (window.innerWidth <= 768) sidebar.classList.add('collapsed');
    }

    function selectNote(id) {
        currentNoteId = id;
        const note = notes.find(n => n.id === id);
        if (note) {
            document.getElementById('editorPlaceholder').style.display = 'none';
            document.getElementById('editorContent').style.display = 'flex';
            document.getElementById('noteTitle').value = note.title;
            document.getElementById('noteBody').innerHTML = note.body;
        }
        renderList();
        if (window.innerWidth <= 768) sidebar.classList.add('collapsed');
    }

    async function updateCurrentNote() {
        if (!currentNoteId) return;
        const idx = notes.findIndex(n => n.id === currentNoteId);
        if (idx > -1) {
            notes[idx].title = document.getElementById('noteTitle').value;
            notes[idx].body = document.getElementById('noteBody').innerHTML;
            notes[idx].date = new Date().toLocaleString();
            await dbSaveAll(notes);
            renderList();
        }
    }

    async function deleteCurrentNote() {
        if (!confirm('削除しますか？')) return;
        notes = notes.filter(n => n.id !== currentNoteId);
        currentNoteId = null;
        await dbSaveAll(notes);
        document.getElementById('editorPlaceholder').style.display = 'flex';
        document.getElementById('editorContent').style.display = 'none';
        renderList();
    }

    function toggleSidebar() {
        sidebar.classList.toggle('collapsed');
    }

    document.getElementById('noteBody').addEventListener('paste', (e) => {
        const items = (e.clipboardData || e.originalEvent.clipboardData).items;
        for (let item of items) {
            if (item.kind === 'file') {
                const blob = item.getAsFile();
                const reader = new FileReader();
                reader.onload = (event) => {
                    const img = document.createElement('img');
                    img.src = event.target.result;
                    document.execCommand('insertElement', false, img);
                };
                reader.readAsDataURL(blob);
            }
        }
    });

    function exportToFile() {
        const blob = new Blob([JSON.stringify(notes, null, 2)], {type: 'application/json'});
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = `notes_backup.json`; a.click();
    }

    function importFromFile(event) {
        const reader = new FileReader();
        reader.onload = async (e) => {
            const imported = JSON.parse(e.target.result);
            notes = confirm('既存のメモを消去して上書きしますか？') ? imported : [...imported, ...notes];
            await dbSaveAll(notes);
            renderList();
        };
        reader.readAsText(event.target.files[0]);
    }
</script>
</body>
</html>
