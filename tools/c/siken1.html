<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ローカルメモ帳</title>
    <style>
        :root {
            --bg-color: #f5f5f5;
            --sidebar-bg: #ffffff;
            --border-color: #000000;
            --primary: #1a73e8;
            --primary-hover: #1557b0;
            --text-main: #333;
            --text-sub: #666;
        }

        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
        }

        .container {
            display: flex;
            height: 100vh;
        }

        .sidebar {
            width: 300px;
            background-color: var(--sidebar-bg);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
        }

        .sidebar-header {
            padding: 15px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .btn {
            padding: 8px 12px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: background 0.2s;
        }

        .btn:hover { background-color: var(--primary-hover); }
        .btn-outline { background-color: white; color: var(--text-main); border: 1px solid #ccc; }
        .btn-outline:hover { background-color: #f0f0f0; }
        .btn-danger { background-color: #dc3545; }
        .btn-danger:hover { background-color: #c82333; }

        .file-controls {
            display: flex;
            gap: 5px;
        }
        .file-controls button { flex: 1; font-size: 12px; }

        .note-list {
            flex: 1;
            overflow-y: auto;
            list-style: none;
            margin: 0;
            padding: 0;
        }

        .note-item {
            padding: 15px;
            border-bottom: 1px solid var(--border-color);
            cursor: pointer;
            transition: background 0.2s;
        }

        .note-item:hover { background-color: #f8f9fa; }
        .note-item.active { background-color: #e8f0fe; border-left: 4px solid var(--primary); padding-left: 11px; }
        .note-item-title { font-weight: bold; margin-bottom: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .note-item-date { font-size: 12px; color: var(--text-sub); }

        .editor {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: white;
            padding: 20px;
        }

        .editor-placeholder {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-sub);
            font-size: 18px;
        }

        .editor-content {
            display: none;
            flex-direction: column;
            height: 100%;
        }

        .editor-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        #noteTitle {
            font-size: 24px;
            font-weight: bold;
            border: none;
            outline: none;
            width: 100%;
            margin-right: 15px;
        }

        #noteBody {
            flex: 1;
            resize: none;
            border: none;
            outline: none;
            font-size: 16px;
            line-height: 1.6;
            font-family: inherit;
        }

        #fileInput { display: none; }
    </style>
</head>
<body>

<div class="container">
    <div class="sidebar">
        <div class="sidebar-header">
            <button class="btn" onclick="createNewNote()">＋ 新しいメモを追加</button>
            <div class="file-controls">
                <button class="btn btn-outline" onclick="exportToFile()">ファイルに保存</button>
                <button class="btn btn-outline" onclick="document.getElementById('fileInput').click()">読み込み</button>
                <input type="file" id="fileInput" accept=".json" onchange="importFromFile(event)">
            </div>
        </div>
        <ul class="note-list" id="noteList">
            </ul>
    </div>

    <div class="editor">
        <div class="editor-placeholder" id="editorPlaceholder">
            左のリストからメモを選択するか、新しく追加してください
        </div>
        <div class="editor-content" id="editorContent">
            <div class="editor-header">
                <input type="text" id="noteTitle" placeholder="タイトルなし" oninput="updateCurrentNote()">
                <button class="btn btn-danger" onclick="deleteCurrentNote()">削除</button>
            </div>
            <textarea id="noteBody" placeholder="ここにメモを入力..." oninput="updateCurrentNote()"></textarea>
        </div>
    </div>
</div>

<script>
    let notes = [];
    let currentNoteId = null;

    window.onload = () => {
        const savedNotes = localStorage.getItem('myLocalNotes');
        if (savedNotes) {
            notes = JSON.parse(savedNotes);
        }
        renderList();
    };

    function saveToLocalStorage() {
        localStorage.setItem('myLocalNotes', JSON.stringify(notes));
    }

    function createNewNote() {
        const newNote = {
            id: Date.now().toString(),
            title: '',
            body: '',
            date: new Date().toLocaleString()
        };
        notes.unshift(newNote);
        saveToLocalStorage();
        selectNote(newNote.id);
    }

    function renderList() {
        const listEl = document.getElementById('noteList');
        listEl.innerHTML = '';

        notes.forEach(note => {
            const li = document.createElement('li');
            li.className = `note-item ${note.id === currentNoteId ? 'active' : ''}`;
            li.onclick = () => selectNote(note.id);

            const title = document.createElement('div');
            title.className = 'note-item-title';
            title.textContent = note.title || '（タイトルなし）';

            const date = document.createElement('div');
            date.className = 'note-item-date';
            date.textContent = note.date;

            li.appendChild(title);
            li.appendChild(date);
            listEl.appendChild(li);
        });
    }

    function selectNote(id) {
        currentNoteId = id;
        const note = notes.find(n => n.id === id);
        
        if (note) {
            document.getElementById('editorPlaceholder').style.display = 'none';
            document.getElementById('editorContent').style.display = 'flex';
            document.getElementById('noteTitle').value = note.title;
            document.getElementById('noteBody').value = note.body;
        }
        renderList();
    }

    function updateCurrentNote() {
        if (!currentNoteId) return;
        
        const noteIndex = notes.findIndex(n => n.id === currentNoteId);
        if (noteIndex > -1) {
            notes[noteIndex].title = document.getElementById('noteTitle').value;
            notes[noteIndex].body = document.getElementById('noteBody').value;
            notes[noteIndex].date = new Date().toLocaleString();
            saveToLocalStorage();
            renderList();
        }
    }

    function deleteCurrentNote() {
        if (confirm('このメモを削除してもよろしいですか？')) {
            notes = notes.filter(n => n.id !== currentNoteId);
            currentNoteId = null;
            saveToLocalStorage();
            
            document.getElementById('editorPlaceholder').style.display = 'flex';
            document.getElementById('editorContent').style.display = 'none';
            renderList();
        }
    }

    function exportToFile() {
        if (notes.length === 0) {
            alert('保存するメモがありません。');
            return;
        }
        const dataStr = JSON.stringify(notes, null, 2);
        const blob = new Blob([dataStr], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        
        const a = document.createElement('a');
        a.href = url;
        a.download = `notes_backup_${new Date().toISOString().split('T')[0]}.json`;
        a.click();
        
        URL.revokeObjectURL(url);
    }

    function importFromFile(event) {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const importedNotes = JSON.parse(e.target.result);
                if (Array.isArray(importedNotes)) {
                    if(notes.length > 0 && !confirm('現在のメモを上書きして読み込みますか？
（キャンセルすると現在のメモに追加されます）')) {
                        notes = [...importedNotes, ...notes];
                    } else {
                        notes = importedNotes;
                    }
                    saveToLocalStorage();
                    currentNoteId = null;
                    document.getElementById('editorPlaceholder').style.display = 'flex';
                    document.getElementById('editorContent').style.display = 'none';
                    renderList();
                    alert('読み込みが完了しました。');
                } else {
                    alert('無効なファイル形式です。');
                }
            } catch (error) {
                alert('ファイルの読み込みに失敗しました。');
            }
        };
        reader.readAsText(file);
        event.target.value = '';
    }
</script>

</body>
</html>
