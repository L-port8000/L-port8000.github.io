<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>MP4クリーナー（解析モニター付き）</title>
    <style>
        body { font-family: 'Helvetica Neue', Arial, sans-serif; background: #1a1a1a; color: #eee; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .panel { background: #23272a; padding: 30px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); width: 100%; max-width: 600px; text-align: center; }
        h1 { color: #7289da; font-size: 1.5rem; margin-top: 0; margin-bottom: 10px; }
        input[type="file"] { margin: 10px 0 20px; padding: 10px; background: #111; border-radius: 8px; border: 1px solid #444; width: 90%; color: #fff; }
        .btn-primary { padding: 12px 30px; border: none; border-radius: 8px; background: #2ecc71; color: white; cursor: pointer; font-weight: bold; font-size: 16px; transition: 0.2s; width: 100%; }
        .btn-primary:hover { background: #27ae60; }
        .btn-primary:disabled { background: #555; cursor: not-allowed; }
        #status { margin-top: 20px; font-weight: bold; color: #f1c40f; font-size: 0.9em; white-space: pre-wrap; line-height: 1.5; }
        
        /* エラー解析用の黒い画面（ログモニター） */
        #logConsole { margin-top: 20px; background: #000; color: #0f0; padding: 15px; border-radius: 8px; font-family: monospace; font-size: 0.8rem; height: 200px; overflow-y: auto; text-align: left; white-space: pre-wrap; word-wrap: break-word; border: 1px solid #444; }
        
        #downloadLink { display: inline-block; margin-top: 20px; padding: 10px 20px; background: #3498db; color: #fff; text-decoration: none; border-radius: 8px; font-weight: bold; display: none; }
    </style>
    <script src="https://unpkg.com/@ffmpeg/ffmpeg@0.12.10/dist/umd/ffmpeg.js"></script>
    <script src="https://unpkg.com/@ffmpeg/util@0.12.1/dist/umd/index.js"></script>
</head>
<body>

<div class="panel">
    <h1>解析モニター付きクリーナー</h1>
    <input type="file" id="uploader" accept="video/mp4,video/x-m4v,video/*">
    <button id="cleanBtn" class="btn-primary" onclick="cleanVideo()" disabled>処理を開始する</button>
    
    <div id="status">動画を選択してください。</div>
    <a id="downloadLink" href="#" download="cleaned.mp4">⬇️ 保存する</a>
    
    <div id="logConsole">システム待機中...</div>
</div>

<script>
    const { FFmpeg } = window.FFmpegWASM;
    const { fetchFile, toBlobURL } = window.FFmpegUtil;
    let ffmpeg = null;
    
    const uploader = document.getElementById('uploader');
    const cleanBtn = document.getElementById('cleanBtn');
    const statusDiv = document.getElementById('status');
    const downloadLink = document.getElementById('downloadLink');
    const logConsole = document.getElementById('logConsole');

    // ログを黒い画面に書き出す関数
    function addLog(text) {
        console.log(text);
        logConsole.innerText += `\n${text}`;
        logConsole.scrollTop = logConsole.scrollHeight; // 自動スクロール
    }

    uploader.addEventListener('change', () => {
        if (uploader.files.length > 0) {
            cleanBtn.disabled = false;
            statusDiv.style.color = "#f1c40f";
            statusDiv.innerText = "動画が選択されました。";
            logConsole.innerText = "準備完了。";
            downloadLink.style.display = 'none';
        }
    });

    async function cleanVideo() {
        const file = uploader.files[0];
        if (!file) return;

        cleanBtn.disabled = true;
        statusDiv.innerText = "エンジンを準備中...";
        addLog("▶ 処理開始...");

        try {
            if (!ffmpeg) {
                ffmpeg = new FFmpeg();
                
                // エンジンからの報告をすべてログ画面に流す
                ffmpeg.on('log', ({ message }) => {
                    addLog(`[FFmpeg] ${message}`);
                });

                const coreURL = 'https://unpkg.com/@ffmpeg/core@0.12.6/dist/umd';
                const ffmpegURL = 'https://unpkg.com/@ffmpeg/ffmpeg@0.12.10/dist/umd';

                addLog("▶ 外部プログラム(WASM)をダウンロード中...");
                await ffmpeg.load({
                    coreURL: await toBlobURL(`${coreURL}/ffmpeg-core.js`, 'text/javascript'),
                    wasmURL: await toBlobURL(`${coreURL}/ffmpeg-core.wasm`, 'application/wasm'),
                    classWorkerURL: await toBlobURL(`${ffmpegURL}/814.ffmpeg.js`, 'text/javascript')
                });
                addLog("▶ プログラムの準備完了！");
            }

            addLog(`▶ ファイル読み込み中: ${file.name} (${(file.size / 1024 / 1024).toFixed(2)} MB)`);
            await ffmpeg.writeFile('input.mp4', await fetchFile(file));

            statusDiv.innerText = "不要なデータを削除しています...";
            addLog("▶ 解析＆変換コマンドを実行します");
            
            await ffmpeg.exec([
                '-i', 'input.mp4',
                '-map', '0:v:0',      
                '-map', '0:a:0?',     
                '-map_metadata', '-1',
                '-c', 'copy',         
                'output.mp4'
            ]);

            addLog("▶ コマンド実行完了。データを抽出します。");
            const data = await ffmpeg.readFile('output.mp4');

            const videoBlob = new Blob([data.buffer], { type: 'video/mp4' });
            const videoUrl = URL.createObjectURL(videoBlob);
            
            downloadLink.href = videoUrl;
            downloadLink.download = file.name.replace(/\.[^/.]+$/, "") + "_cleaned.mp4";
            downloadLink.style.display = 'inline-block';
            
            statusDiv.style.color = "#2ecc71";
            statusDiv.innerText = "クリーニング完了！";
            addLog("▶ すべての処理が正常に終了しました！");

        } catch (error) {
            // undefinedにならないように、エラーの全貌を強制的に文字化する
            const errorMsg = error instanceof Error ? error.message : JSON.stringify(error) || String(error);
            addLog(`❌ エラー発生: ${errorMsg}`);
            statusDiv.style.color = "#e74c3c";
            statusDiv.innerText = `エラーで停止しました。`;
            console.error("完全なエラー情報:", error);
        } finally {
            cleanBtn.disabled = false;
        }
    }
</script>

</body>
</html>
