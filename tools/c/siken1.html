<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ローカルメモ帳</title>
    <style>
        :root {
            --bg-color: #f5f5f5;
            --sidebar-bg: #ffffff;
            --editor-bg: #ffffff;
            --border-color: #ddd;
            --primary: #1a73e8;
            --primary-hover: #1557b0;
            --text-main: #333;
            --text-sub: #666;
            --sidebar-width: 300px;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #121212;
                --sidebar-bg: #1e1e1e;
                --editor-bg: #1e1e1e;
                --border-color: #333;
                --primary: #8ab4f8;
                --primary-hover: #aecbfa;
                --text-main: #e8eaed;
                --text-sub: #9aa0a6;
            }
        }

        body, html {
            margin: 0; padding: 0; height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color); color: var(--text-main);
            overflow: hidden;
        }

        .container { display: flex; height: 100vh; position: relative; }
        
        .sidebar { 
            width: var(--sidebar-width); 
            background-color: var(--sidebar-bg); 
            border-right: 1px solid var(--border-color); 
            display: flex; 
            flex-direction: column;
            transition: transform 0.3s ease;
            position: relative;
            z-index: 200;
        }
        .sidebar.collapsed { transform: translateX(-100%); position: absolute; height: 100%; }

        .sidebar-header { padding: 15px; border-bottom: 1px solid var(--border-color); display: flex; flex-direction: column; gap: 10px; }
        .note-list { flex: 1; overflow-y: auto; list-style: none; margin: 0; padding: 0; }
        .note-item { padding: 15px; border-bottom: 1px solid var(--border-color); cursor: pointer; }
        .note-item.active { background-color: rgba(138, 180, 248, 0.15); border-left: 4px solid var(--primary); }

        .btn { padding: 8px 12px; background-color: var(--primary); color: #000; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .btn-danger { background-color: #f28b82; }

        .editor { flex: 1; display: flex; flex-direction: column; background: var(--editor-bg); position: relative; }
        
        .toggle-sidebar {
            position: fixed; left: 10px; top: 10px; z-index: 300;
            background: var(--primary); color: #000;
            border: none; border-radius: 50%; width: 40px; height: 40px;
            cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,0.3);
            display: flex; align-items: center; justify-content: center; font-size: 20px;
        }

        .editor-overlay {
            display: none; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.05); z-index: 100;
        }
        body:not(.sidebar-collapsed) .editor-overlay { display: block; }

        .editor-content-wrapper {
            padding: 70px 40px 20px 40px; flex: 1;
            display: flex; flex-direction: column; align-items: center; overflow-y: auto;
        }

        .editor-content { display: none; flex-direction: column; width: 100%; max-width: 750px; height: 100%; }

        #noteTitle { 
            background: transparent; color: var(--text-main);
            font-size: 24px; border: none; outline: none; width: 100%; font-weight: bold; margin-bottom: 20px;
        }

        #noteBody { 
            flex: 1; background: transparent; color: var(--text-main);
            border: none; outline: none; font-size: 16px; line-height: 1.8; 
            padding-right: 15px; padding-bottom: 200px;
        }
        #noteBody img { max-width: 100%; height: auto; border-radius: 8px; display: block; margin: 10px 0; }

        @media (max-width: 768px) {
            :root { --sidebar-width: 80vw; }
            .editor-content-wrapper { padding: 70px 20px 20px 20px; }
        }
    </style>
</head>
<body class="sidebar-collapsed">

<div class="container">
    <button class="toggle-sidebar" onclick="toggleSidebar()">☰</button>

    <div class="sidebar collapsed" id="sidebar">
        <div class="sidebar-header">
            <button class="btn" onclick="createNewNote()">＋ 新しいメモ</button>
            <div style="display:flex; gap:5px;">
                <button class="btn" style="flex:1; font-size:10px;" onclick="exportToFile()">JSON保存</button>
                <button class="btn" style="flex:1; font-size:10px;" onclick="document.getElementById('fileInput').click()">読込</button>
            </div>
            <input type="file" id="fileInput" accept=".json" style="display:none;" onchange="importFromFile(event)">
        </div>
        <ul class="note-list" id="noteList"></ul>
    </div>

    <div class="editor">
        <div class="editor-overlay" onclick="toggleSidebar()"></div>
        <div class="editor-content-wrapper">
            <div id="editorPlaceholder" style="color:var(--text-sub); margin-top:100px;">メモを選択してください</div>
            <div class="editor-content" id="editorContent">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
                    <input type="text" id="noteTitle" placeholder="タイトル" oninput="updateCurrentNote()">
                    <button class="btn btn-danger" onclick="deleteCurrentNote()">削除</button>
                </div>
                <div id="noteBody" contenteditable="true" oninput="updateCurrentNote()" placeholder="内容を入力..."></div>
            </div>
        </div>
    </div>
</div>

<script>
    const DB_NAME = 'NotesAppDB_V4';
    const STORE_NAME = 'notes';
    let db, notes = [], currentNoteId = null;


    const initDB = () => {
        return new Promise((resolve) => {
            const request = indexedDB.open(DB_NAME, 1);
            request.onupgradeneeded = (e) => e.target.result.createObjectStore(STORE_NAME, { keyPath: 'id' });
            request.onsuccess = (e) => { db = e.target.result; resolve(); };
        });
    };

    const dbSaveNote = async (note) => {
        return new Promise((resolve) => {
            const tx = db.transaction(STORE_NAME, 'readwrite');
            const store = tx.objectStore(STORE_NAME);
            const request = store.put(note);
            request.onsuccess = () => resolve();
        });
    };

    const dbDeleteNote = async (id) => {
        return new Promise((resolve) => {
            const tx = db.transaction(STORE_NAME, 'readwrite');
            const store = tx.objectStore(STORE_NAME);
            const request = store.delete(id);
            request.onsuccess = () => resolve();
        });
    };

    const dbGetAll = () => {
        return new Promise((resolve) => {
            const tx = db.transaction(STORE_NAME, 'readonly');
            tx.objectStore(STORE_NAME).getAll().onsuccess = (e) => resolve(e.target.result);
        });
    };


    function toggleSidebar() {
        const sidebar = document.getElementById('sidebar');
        sidebar.classList.toggle('collapsed');
        document.body.classList.toggle('sidebar-collapsed', sidebar.classList.contains('collapsed'));
    }

    window.onload = async () => {
        await initDB();
        notes = await dbGetAll();
        notes.sort((a, b) => new Date(b.date) - new Date(a.date));
        renderList();
    };

    function renderList() {
        const listEl = document.getElementById('noteList');
        listEl.innerHTML = '';
        notes.forEach(note => {
            const li = document.createElement('li');
            li.className = `note-item ${note.id === currentNoteId ? 'active' : ''}`;
            li.onclick = () => selectNote(note.id);
            li.innerHTML = `<div style="font-weight:bold;">${note.title || '（無題）'}</div><div style="font-size:11px; color:var(--text-sub)">${note.date}</div>`;
            listEl.appendChild(li);
        });
    }

    async function createNewNote() {
        const newNote = { id: Date.now().toString(), title: '', body: '', date: new Date().toLocaleString() };
        notes.unshift(newNote);
        await dbSaveNote(newNote);
        selectNote(newNote.id);
        if (!document.body.classList.contains('sidebar-collapsed')) toggleSidebar();
    }

    function selectNote(id) {
        currentNoteId = id;
        const note = notes.find(n => n.id === id);
        if (note) {
            document.getElementById('editorPlaceholder').style.display = 'none';
            document.getElementById('editorContent').style.display = 'flex';
            document.getElementById('noteTitle').value = note.title;
            document.getElementById('noteBody').innerHTML = note.body;
        }
        renderList();
        if (!document.body.classList.contains('sidebar-collapsed')) toggleSidebar();
    }


    let timer;
    async function updateCurrentNote() {
        if (!currentNoteId) return;
        clearTimeout(timer);
        timer = setTimeout(async () => {
            const idx = notes.findIndex(n => n.id === currentNoteId);
            if (idx > -1) {
                notes[idx].title = document.getElementById('noteTitle').value;
                notes[idx].body = document.getElementById('noteBody').innerHTML;
                notes[idx].date = new Date().toLocaleString();
                await dbSaveNote(notes[idx]);
                renderList();
            }
        }, 300);
    }

    async function deleteCurrentNote() {
        if (!confirm('削除しますか？')) return;
        await dbDeleteNote(currentNoteId);
        notes = notes.filter(n => n.id !== currentNoteId);
        currentNoteId = null;
        document.getElementById('editorPlaceholder').style.display = 'block';
        document.getElementById('editorContent').style.display = 'none';
        renderList();
    }


    document.getElementById('noteBody').addEventListener('paste', async (e) => {
        const items = (e.clipboardData || e.originalEvent.clipboardData).items;
        for (let item of items) {
            if (item.kind === 'file') {
                e.preventDefault();
                const blob = item.getAsFile();
                const reader = new FileReader();
                reader.onload = async (event) => {
                    const img = document.createElement('img');
                    img.src = event.target.result;
                    

                    const selection = window.getSelection();
                    if (selection.rangeCount) {
                        const range = selection.getRangeAt(0);
                        range.deleteContents();
                        range.insertNode(img);

                        const br = document.createElement('br');
                        img.after(br);
                        range.setStartAfter(br);
                        range.collapse(true);
                    } else {
                        document.getElementById('noteBody').appendChild(img);
                    }
                    
                    await updateCurrentNote();
                };
                reader.readAsDataURL(blob);
            }
        }
    });

    function exportToFile() {
        const blob = new Blob([JSON.stringify(notes, null, 2)], {type: 'application/json'});
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = `notes_backup.json`; a.click();
    }

    function importFromFile(event) {
        const reader = new FileReader();
        reader.onload = async (e) => {
            const imported = JSON.parse(e.target.result);
            for(let n of imported) await dbSaveNote(n);
            notes = await dbGetAll();
            renderList();
        };
        reader.readAsText(event.target.files[0]);
    }
</script>
</body>
</html>
