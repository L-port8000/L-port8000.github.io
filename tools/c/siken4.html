<html lang="ja"><head><meta charset="UTF-8">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,'Hiragino Sans','Hiragino Kaku Gothic ProN',sans-serif;background:#000;}
:root{--bg:#1c1c1e;--card:#2c2c2e;--sub:#ebebf5aa;--blue:#0a84ff;--sep:#38383a;--red:#ff453a;}
.phone{width:100%;max-width:393px;margin:0 auto;background:var(--bg);color:#fff;min-height:820px;position:relative;overflow:hidden;}
.sb{display:flex;justify-content:space-between;align-items:center;padding:15px 20px 4px;font-size:15px;font-weight:700;}
.sb .icons{display:flex;gap:5px;align-items:center;font-size:13px;font-weight:500;}
.nav{display:flex;justify-content:space-between;align-items:center;padding:4px 16px 8px;}
.nav .back{color:var(--blue);font-size:16px;display:flex;align-items:center;gap:2px;cursor:pointer;}
.nav .title{font-size:17px;font-weight:600;text-align:center;flex:1;}
.nav .right{color:var(--blue);font-size:15px;min-width:44px;text-align:right;}
.seg-wrap{margin:4px 16px 0;}
.seg-bg{background:#3a3a3c;border-radius:9px;padding:2px;display:flex;}
.seg-btn{flex:1;padding:6px 0;border:none;border-radius:7px;font-size:15px;font-weight:500;cursor:pointer;background:transparent;color:#8e8e93;transition:all .15s;}
.seg-btn.active{background:#636366;color:#fff;}
.scroll-body{overflow-y:auto;padding-bottom:40px;}
.sec-head{padding:12px 16px 4px;}
.sec-lbl{font-size:12px;color:var(--sub);}
.sec-sub{font-size:13px;color:var(--sub);margin-top:1px;}
.sec-big{font-size:36px;font-weight:700;letter-spacing:-1.5px;line-height:1.1;margin-top:1px;}
.chart-wrap{padding:2px 0 2px 8px;}
.sep{height:.5px;background:var(--sep);}
.cat-row{display:flex;gap:14px;padding:8px 16px 6px;flex-wrap:wrap;}
.cat-item{display:flex;align-items:flex-start;gap:5px;}
.cat-dot{width:8px;height:8px;border-radius:2px;flex-shrink:0;margin-top:3px;}
.cat-name{font-size:11px;font-weight:500;}
.cat-time{font-size:13px;font-weight:500;color:#fff;margin-top:1px;}
.total-row{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;}
.update-txt{padding:6px 16px;font-size:12px;color:var(--sub);}
.apps-hdr{display:flex;justify-content:space-between;align-items:center;padding:10px 16px 4px;}
.apps-hdr .t{font-size:15px;}
.apps-hdr a{color:var(--blue);font-size:14px;cursor:pointer;}
.app-row{display:flex;align-items:center;gap:12px;padding:9px 16px;border-bottom:.5px solid var(--sep);}
.app-row:last-child{border-bottom:none;}
.app-icon{width:38px;height:38px;border-radius:9px;overflow:hidden;flex-shrink:0;background:#3a3a3c;display:flex;align-items:center;justify-content:center;font-size:20px;}
.app-icon img{width:100%;height:100%;object-fit:cover;}
.app-info{flex:1;min-width:0;}
.app-name{font-size:15px;}
.bar-wrap{height:2px;background:#ffffff15;border-radius:1px;margin-top:5px;}
.bar-fill{height:2px;border-radius:1px;background:#636366;}
.app-time{font-size:13px;color:var(--sub);white-space:nowrap;}
.chev{color:#ffffff25;font-size:20px;line-height:1;}
/* Settings */
.spanel{position:absolute;top:0;left:0;right:0;bottom:0;background:var(--bg);z-index:100;overflow-y:auto;transform:translateX(-100%);transition:transform .28s cubic-bezier(.4,0,.2,1);}
.spanel.open{transform:translateX(0);}
.s-sec{margin:12px 16px 0;}
.s-lbl{font-size:12px;color:var(--sub);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px;padding:0 4px;}
.s-card{background:var(--card);border-radius:10px;overflow:hidden;}
.s-row{display:flex;align-items:center;padding:9px 13px;gap:10px;border-bottom:.5px solid var(--sep);}
.s-row:last-child{border-bottom:none;}
.s-row label{font-size:13px;color:var(--sub);min-width:84px;flex-shrink:0;}
.s-row input,.s-row select{flex:1;background:#ffffff10;border:.5px solid #ffffff20;border-radius:7px;color:#fff;padding:4px 9px;font-size:13px;min-width:0;outline:none;}
.s-row input[type=number]{flex:none;width:70px;}
.apply-btn{display:block;width:calc(100% - 32px);margin:14px 16px;background:var(--blue);color:#fff;border:none;border-radius:12px;padding:12px;font-size:16px;font-weight:600;cursor:pointer;}
.app-s-row{display:grid;grid-template-columns:40px 1fr 60px 18px;gap:7px;align-items:center;padding:9px 13px;border-bottom:.5px solid var(--sep);}
.app-s-row:last-child{border-bottom:none;}
.app-s-icon-btn{width:36px;height:36px;border-radius:8px;overflow:hidden;background:#3a3a3c;display:flex;align-items:center;justify-content:center;font-size:18px;cursor:pointer;border:.5px dashed #ffffff30;flex-shrink:0;}
.app-s-icon-btn img{width:100%;height:100%;object-fit:cover;}
.app-s-inputs{display:flex;flex-direction:column;gap:4px;min-width:0;}
.app-s-inputs input,.app-s-inputs select{background:#ffffff10;border:.5px solid #ffffff20;border-radius:6px;color:#fff;padding:3px 7px;font-size:12px;width:100%;outline:none;}
.del-btn{color:var(--red);font-size:17px;cursor:pointer;text-align:center;}
.add-btn{background:#ffffff10;border:.5px solid #ffffff30;border-radius:8px;color:var(--blue);font-size:14px;padding:8px;cursor:pointer;margin:7px 16px 0;width:calc(100% - 32px);}
.h-grid{display:grid;grid-template-columns:1fr 1fr;gap:5px;padding:9px 13px;}
.h-cell{display:flex;align-items:center;gap:5px;}
.h-cell label{color:var(--sub);font-size:12px;width:32px;flex-shrink:0;}
.h-cell input{background:#ffffff10;border:.5px solid #ffffff20;border-radius:5px;color:#fff;padding:3px 6px;font-size:12px;width:52px;outline:none;}
.w-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;padding:9px 13px;}
.w-cell{display:flex;flex-direction:column;align-items:center;gap:3px;}
.w-cell span{font-size:11px;color:var(--sub);}
.w-cell input{background:#ffffff10;border:.5px solid #ffffff20;border-radius:5px;color:#fff;padding:3px 2px;font-size:11px;width:100%;text-align:center;outline:none;}
</style>
</head><body>
<div class="phone" id="phone">
  <div class="sb">
    <span id="clockDisp">16:57</span>
    <span class="icons">
      <svg width="16" height="11" viewBox="0 0 16 11" fill="white"><rect x="0" y="3" width="2.5" height="8" rx=".8"/><rect x="4.3" y="1.5" width="2.5" height="9.5" rx=".8"/><rect x="8.6" y="0" width="2.5" height="11" rx=".8"/><rect x="12.9" y="0" width="2.5" height="11" rx=".8" opacity=".28"/></svg>
      4G
      <svg width="25" height="12" viewBox="0 0 25 12" fill="none"><rect x=".5" y=".5" width="22" height="11" rx="2.5" stroke="white" stroke-opacity=".35"/><rect x="1.5" y="1.5" width="17" height="9" rx="1.8" fill="white"/><rect x="24" y="3.5" width="1.5" height="5" rx=".75" fill="white" opacity=".4"/></svg>
    </span>
  </div>
  <div class="nav">
    <div class="back" onclick="openSettings()">
      <svg width="9" height="15" viewBox="0 0 9 15" fill="none"><path d="M7.5 1.5L1.5 7.5l6 6" stroke="#0a84ff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      設定
    </div>
    <div class="title" id="deviceTitle">すべてのデバイス</div>
    <div class="right">デバイス</div>
  </div>
  <div class="seg-wrap">
    <div class="seg-bg">
      <button class="seg-btn" id="btnW" onclick="switchTab('week')">週</button>
      <button class="seg-btn active" id="btnD" onclick="switchTab('day')">日</button>
    </div>
  </div>

  <div class="scroll-body">
    <!-- WEEK -->
    <div id="tabWeek" style="display:none;">
      <div class="sec-head">
        <div class="sec-lbl">スクリーンタイム</div>
        <div class="sec-sub">1日の平均</div>
        <div class="sec-big" id="wAvg">8時間58分</div>
      </div>
      <div class="chart-wrap"><canvas id="wChart" height="95"></canvas></div>
      <div class="cat-row" id="wLegend"></div>
      <div class="sep"></div>
      <div class="total-row">
        <span style="font-size:15px;color:var(--sub);">スクリーンタイムの合計</span>
        <span style="font-size:15px;font-weight:600;" id="wTotal">44時間53分</span>
      </div>
      <div class="sep"></div>
      <div class="update-txt" id="wUpdate">前回のアップデート：今日 16:56</div>
      <div class="sep"></div>
      <div class="apps-hdr"><span class="t">よく使われたもの</span><a>カテゴリを表示</a></div>
      <div id="appListW"></div>
    </div>

    <!-- DAY -->
    <div id="tabDay">
      <div class="sec-head">
        <div class="sec-lbl">スクリーンタイム</div>
        <div class="sec-sub" id="todayLbl">今日、10月31日</div>
        <div class="sec-big" id="dTotal">5時間51分</div>
      </div>
      <div class="chart-wrap"><canvas id="wChartD" height="80"></canvas></div>
      <div style="height:.5px;background:var(--sep);margin:2px 16px;"></div>
      <div class="chart-wrap"><canvas id="dChart" height="105"></canvas></div>
      <div class="cat-row" id="dLegend"></div>
      <div class="sep"></div>
      <div class="update-txt" id="dUpdate">前回のアップデート：今日 16:56</div>
      <div class="sep"></div>
      <div class="apps-hdr"><span class="t">よく使われたもの</span><a>カテゴリを表示</a></div>
      <div id="appListD"></div>
    </div>
  </div>

  <!-- Settings -->
  <div class="spanel" id="spanel">
    <div class="sb"><span id="sClock">16:57</span><span class="icons">4G <svg width="25" height="12" viewBox="0 0 25 12" fill="none"><rect x=".5" y=".5" width="22" height="11" rx="2.5" stroke="white" stroke-opacity=".35"/><rect x="1.5" y="1.5" width="17" height="9" rx="1.8" fill="white"/><rect x="24" y="3.5" width="1.5" height="5" rx=".75" fill="white" opacity=".4"/></svg></span></div>
    <div class="nav">
      <div class="back" onclick="closeSettings()"><svg width="9" height="15" viewBox="0 0 9 15" fill="none"><path d="M7.5 1.5L1.5 7.5l6 6" stroke="#0a84ff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg> 戻る</div>
      <div class="title">スクリーンタイム設定</div>
      <div></div>
    </div>
    <div style="overflow-y:auto;padding-bottom:40px;">
      <div class="s-sec">
        <div class="s-lbl">デバイス名・日時</div>
        <div class="s-card">
          <div class="s-row"><label>デバイス名</label><input id="cfg_device" value="すべてのデバイス"></div>
          <div class="s-row"><label>今日の日付</label><input id="cfg_date" value="10月31日"></div>
          <div class="s-row">
            <label>今日の曜日</label>
            <select id="cfg_day">
              <option value="0">日曜日</option><option value="1">月曜日</option>
              <option value="2">火曜日</option><option value="3">水曜日</option>
              <option value="4">木曜日</option><option value="5">金曜日</option>
              <option value="6" selected>土曜日</option>
            </select>
          </div>
          <div class="s-row">
            <label>現在の時刻</label>
            <input type="number" min="0" max="23" id="cfg_hour" value="16">
            <span style="color:var(--sub);font-size:13px;flex-shrink:0;">時まで表示</span>
          </div>
          <div class="s-row"><label>更新時刻</label><input id="cfg_update" value="今日 16:56"></div>
        </div>
      </div>

      <div class="s-sec">
        <div class="s-lbl">今日の時間帯別（分）</div>
        <div class="s-card"><div class="h-grid" id="hourlyGrid"></div></div>
      </div>
      <div class="s-sec">
        <div class="s-lbl">先週の曜日別合計（分）※空欄=自動生成</div>
        <div class="s-card"><div class="w-grid" id="weeklyGrid"></div></div>
      </div>
      <div class="s-sec">
        <div class="s-lbl">アプリ（アイコン・名前・カテゴリ・使用分）</div>
        <div class="s-card" id="appSList"></div>
        <button class="add-btn" onclick="addApp()">＋ アプリを追加</button>
      </div>
      <button class="apply-btn" onclick="applyAll()">適用する</button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script>
const DAYS=['日','月','火','水','木','金','土'];
const CAT_LIST=[
  {key:'game',  label:'ゲーム',                  color:'#ff9f0a',r:0.55},
  {key:'social',label:'ソーシャルネットワーキング',color:'#30d158',r:0.12},
  {key:'work',  label:'仕事効率化',               color:'#0a84ff',r:0.11},
  {key:'read',  label:'読書および辞書/辞典',       color:'#bf5af2',r:0.10},
  {key:'other', label:'その他',                  color:'#636366',r:0.12}
];

const avgLinePlugin={
  id:'avgLine',
  afterDraw(chart){
    const p=chart.options?.plugins?.avgLine;
    if(!p||p.value==null||p.value<=0)return;
    const {ctx,chartArea:ca,scales}=chart;
    const yp=scales.y.getPixelForValue(p.value);
    if(yp<ca.top||yp>ca.bottom)return;
    ctx.save();
    ctx.beginPath();ctx.setLineDash([3,3]);
    ctx.strokeStyle='rgba(255,255,255,0.38)';ctx.lineWidth=0.8;
    ctx.moveTo(ca.left,yp);ctx.lineTo(ca.right,yp);ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle='rgba(235,235,245,0.52)';
    ctx.font='9px -apple-system,sans-serif';
    ctx.textAlign='right';ctx.textBaseline='bottom';
    ctx.fillText('平均',ca.right-3,yp-1);
    ctx.restore();
  }
};

let S={
  device:'すべてのデバイス',
  date:'10月31日',
  update:'今日 16:56',
  currentDay:6,   // 0=日〜6=土
  currentHour:16, // 表示する最終時刻
  hourly:[0,0,0,3,0,2,5,12,18,32,42,58,50,38,28,22,36,40,48,32,24,16,10,4],
  weekly:[null,null,null,null,null,null,null],
  apps:[
    {name:'DQウォーク',mins:210,img:null,cat:'game'},
    {name:'Yahoo!',    mins:38, img:null,cat:'social'},
    {name:'Google',    mins:25, img:null,cat:'work'},
    {name:'LINE',      mins:13, img:null,cat:'social'},
    {name:'Pokémon GO',mins:10, img:null,cat:'game'},
  ]
};

// キャッシュ：applyAll時にリセット
let _cachedWeekly=null;

function fmtM(m){
  m=Math.round(m);if(m<=0)return '0分';
  if(m<60)return m+'分';
  const h=Math.floor(m/60),mm=m%60;
  return mm>0?`${h}時間${mm}分`:`${h}時間`;
}
function totalAppMins(){return S.apps.reduce((a,b)=>a+b.mins,0);}

// 週データを解決（当日以前のみ、以降はnull→0）
function resolveWeekly(){
  if(_cachedWeekly)return _cachedWeekly;
  const tm=totalAppMins();
  const cd=S.currentDay;
  const result=S.weekly.map((v,i)=>{
    if(i>cd)return 0; // 未来曜日：データなし
    if(i===cd)return tm; // 今日：現在の使用量
    // 過去曜日：入力値 or 自動生成
    if(v!==null&&v!==undefined&&v!=='')return Number(v);
    return Math.max(30,tm+Math.round((Math.random()-0.5)*60));
  });
  _cachedWeekly=result;
  return result;
}

// 時間帯データ（currentHour以降は0）
function resolveHourly(){
  return S.hourly.map((v,i)=>i>S.currentHour?0:v);
}

let charts={wChart:null,wChartD:null,dChart:null};

function buildWeekChart(canvasId,weekly,avgVal,legendId,barH){
  const el=document.getElementById(canvasId);if(!el)return;
  if(charts[canvasId])charts[canvasId].destroy();
  const cd=S.currentDay;
  const nonZero=weekly.filter(v=>v>0);
  const weekMax=nonZero.length?Math.max(...nonZero):300;
  const yMax=weekMax*1.28;

  const datasets=CAT_LIST.map(c=>({
    data:weekly.map(v=>Math.round(v*c.r)),
    backgroundColor:weekly.map((v,i)=>{
      if(v===0)return 'transparent';
      return i===cd?c.color:'#3a3a3c';
    }),
    stack:'s',barThickness:barH||22,borderWidth:0,borderRadius:0,
  }));

  charts[canvasId]=new Chart(el.getContext('2d'),{
    type:'bar',plugins:[avgLinePlugin],
    data:{labels:DAYS,datasets},
    options:{
      responsive:true,maintainAspectRatio:false,
      plugins:{
        legend:{display:false},tooltip:{enabled:false},
        avgLine:{value:avgVal}
      },
      scales:{
        x:{ticks:{color:'#ebebf5aa',font:{size:11}},grid:{display:false},border:{display:false}},
        y:{
          position:'right',min:0,max:yMax,
          grid:{display:false},border:{display:false},
          ticks:{
            color:'#ebebf5aa',font:{size:9},maxTicksLimit:3,
            callback:v=>{
              if(v===0)return '0';
              const h=Math.floor(v/60);
              if(h>=1&&v%60===0)return h+'時間';
              return null;
            }
          }
        }
      }
    }
  });

  if(legendId){
    const todayV=weekly[cd];
    document.getElementById(legendId).innerHTML=CAT_LIST.slice(0,3).map(c=>`
      <div class="cat-item">
        <div class="cat-dot" style="background:${c.color};"></div>
        <div>
          <div class="cat-name" style="color:${c.color};">${c.label}</div>
          <div class="cat-time">${fmtM(todayV*c.r)}</div>
        </div>
      </div>`).join('');
  }
}

function buildDayChart(){
  const el=document.getElementById('dChart');if(!el)return;
  if(charts.dChart)charts.dChart.destroy();
  const hourly=resolveHourly();

  charts.dChart=new Chart(el.getContext('2d'),{
    type:'bar',
    data:{
      labels:Array.from({length:24},(_,i)=>[0,6,12,18].includes(i)?i+'時':''),
      datasets:CAT_LIST.map(c=>({
        data:hourly.map(v=>Math.round(v*c.r)),
        backgroundColor:hourly.map((v,i)=>v>0?c.color:'transparent'),
        stack:'s',barThickness:10,borderWidth:0,borderRadius:0,
      }))
    },
    options:{
      responsive:true,maintainAspectRatio:false,
      plugins:{legend:{display:false},tooltip:{enabled:false}},
      scales:{
        x:{ticks:{color:'#ebebf5aa',font:{size:10},maxRotation:0},grid:{display:false},border:{display:false}},
        y:{
          position:'right',min:0,max:68,border:{display:false},
          grid:{
            color:ctx=>{const v=ctx.tick?.value;return(v===30||v===60)?'#ffffff18':'transparent';},
            drawTicks:false,
          },
          ticks:{
            color:'#ebebf5aa',font:{size:9},
            values:[0,30,60],
            callback:v=>{
              if(v===0)return '0';if(v===30)return '30分';if(v===60)return '60分';return null;
            }
          }
        }
      }
    }
  });

  const appM=S.apps.reduce((acc,a)=>{const k=a.cat||'other';acc[k]=(acc[k]||0)+a.mins;return acc;},{});
  document.getElementById('dLegend').innerHTML=CAT_LIST.filter(c=>appM[c.key]).map(c=>`
    <div class="cat-item">
      <div class="cat-dot" style="background:${c.color};"></div>
      <div>
        <div class="cat-name" style="color:${c.color};">${c.label}</div>
        <div class="cat-time">${fmtM(appM[c.key])}</div>
      </div>
    </div>`).join('');
}

function renderApps(){
  const maxM=S.apps.reduce((a,b)=>Math.max(a,b.mins),1);
  ['W','D'].forEach(s=>{
    const el=document.getElementById('appList'+s);if(!el)return;
    el.innerHTML=S.apps.map(a=>{
      const pct=Math.round(a.mins/maxM*100);
      const ico=a.img?`<img src="${a.img}" alt="">`:(a.name.charAt(0));
      return `<div class="app-row">
        <div class="app-icon">${ico}</div>
        <div class="app-info">
          <div class="app-name">${a.name}</div>
          <div class="bar-wrap"><div class="bar-fill" style="width:${pct}%;"></div></div>
        </div>
        <div class="app-time">${fmtM(a.mins)}</div>
        <div class="chev">›</div>
      </div>`;
    }).join('');
  });
}

function renderAll(){
  const weekly=resolveWeekly();
  // 過去＋今日のみ合計（未来は0なので自動除外）
  const pastWeekly=weekly.filter(v=>v>0);
  const weekTotal=pastWeekly.reduce((a,b)=>a+b,0);
  const weekAvg=pastWeekly.length?Math.round(weekTotal/pastWeekly.length):0;

  document.getElementById('deviceTitle').textContent=S.device;
  document.getElementById('wAvg').textContent=fmtM(weekAvg);
  document.getElementById('wTotal').textContent=fmtM(weekTotal);
  document.getElementById('dTotal').textContent=fmtM(totalAppMins());
  document.getElementById('todayLbl').textContent='今日、'+S.date;
  document.getElementById('wUpdate').textContent='前回のアップデート：'+S.update;
  document.getElementById('dUpdate').textContent='前回のアップデート：'+S.update;

  buildWeekChart('wChart', weekly, weekAvg, 'wLegend',  22);
  buildWeekChart('wChartD',weekly, weekAvg, null,       20);
  buildDayChart();
  renderApps();
}

function switchTab(t){
  const w=t==='week';
  document.getElementById('tabWeek').style.display=w?'block':'none';
  document.getElementById('tabDay').style.display=w?'none':'block';
  document.getElementById('btnW').classList.toggle('active',w);
  document.getElementById('btnD').classList.toggle('active',!w);
  setTimeout(()=>{
    const weekly=resolveWeekly();
    const pastW=weekly.filter(v=>v>0);
    const avg=pastW.length?Math.round(pastW.reduce((a,b)=>a+b,0)/pastW.length):0;
    if(w)buildWeekChart('wChart',weekly,avg,'wLegend',22);
    else{buildWeekChart('wChartD',weekly,avg,null,20);buildDayChart();}
  },30);
}

/* ── Settings ── */
function buildSettings(){
  document.getElementById('cfg_device').value=S.device;
  document.getElementById('cfg_date').value=S.date;
  document.getElementById('cfg_day').value=String(S.currentDay);
  document.getElementById('cfg_hour').value=String(S.currentHour);
  document.getElementById('cfg_update').value=S.update;
  document.getElementById('hourlyGrid').innerHTML=
    Array.from({length:24},(_,i)=>
      `<div class="h-cell"><label>${i}時</label><input type="number" min="0" max="120" id="hh_${i}" value="${S.hourly[i]}"></div>`
    ).join('');
  document.getElementById('weeklyGrid').innerHTML=
    DAYS.map((d,i)=>
      `<div class="w-cell"><span>${d}</span><input type="number" min="0" id="ww_${i}" value="${S.weekly[i]||''}"></div>`
    ).join('');
  buildAppSettings();
}

function buildAppSettings(){
  document.getElementById('appSList').innerHTML=S.apps.map((a,i)=>`
    <div class="app-s-row" id="asr_${i}">
      <div class="app-s-icon-btn" onclick="pickIcon(${i})">
        ${a.img?`<img src="${a.img}">`:(a.name.charAt(0))}
        <input type="file" accept="image/*" id="fi_${i}" style="display:none;" onchange="handleImg(${i},this)">
      </div>
      <div class="app-s-inputs">
        <input type="text" id="aname_${i}" value="${a.name}" placeholder="アプリ名">
        <select id="acat_${i}">
          <option value="game"   ${a.cat==='game'?'selected':''}>???? ゲーム</option>
          <option value="social" ${a.cat==='social'?'selected':''}>???? ソーシャル</option>
          <option value="work"   ${a.cat==='work'?'selected':''}>???? 仕事効率化</option>
          <option value="read"   ${a.cat==='read'?'selected':''}>???? 読書</option>
          <option value="other"  ${a.cat==='other'?'selected':''}>???? その他</option>
        </select>
      </div>
      <input type="number" min="0" id="amin_${i}" value="${a.mins}"
        style="background:#ffffff10;border:.5px solid #ffffff20;border-radius:6px;color:#fff;padding:4px 7px;font-size:12px;outline:none;">
      <div class="del-btn" onclick="delApp(${i})">×</div>
    </div>`).join('');
}

function pickIcon(i){document.getElementById('fi_'+i).click();}
function handleImg(i,inp){
  const f=inp.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=e=>{
    S.apps[i].img=e.target.result;
    const btn=document.querySelector(`#asr_${i} .app-s-icon-btn`);
    btn.innerHTML=`<img src="${e.target.result}"><input type="file" accept="image/*" id="fi_${i}" style="display:none;" onchange="handleImg(${i},this)">`;
  };
  r.readAsDataURL(f);
}
function addApp(){S.apps.push({name:'新しいアプリ',mins:0,img:null,cat:'other'});buildAppSettings();}
function delApp(i){S.apps.splice(i,1);buildAppSettings();}

function applyAll(){
  S.device=document.getElementById('cfg_device').value;
  S.date=document.getElementById('cfg_date').value;
  S.currentDay=parseInt(document.getElementById('cfg_day').value);
  S.currentHour=parseInt(document.getElementById('cfg_hour').value);
  S.update=document.getElementById('cfg_update').value;
  for(let i=0;i<24;i++)S.hourly[i]=parseInt(document.getElementById('hh_'+i)?.value||0);
  for(let i=0;i<7;i++){
    const v=document.getElementById('ww_'+i)?.value;
    S.weekly[i]=(v===''||v==null)?null:parseInt(v);
  }
  S.apps=S.apps.map((a,i)=>({
    ...a,
    name:document.getElementById('aname_'+i)?.value||a.name,
    mins:parseInt(document.getElementById('amin_'+i)?.value||0),
    cat:document.getElementById('acat_'+i)?.value||a.cat,
  }));
  _cachedWeekly=null; // キャッシュリセット
  closeSettings();
  renderAll();
}

function openSettings(){buildSettings();document.getElementById('spanel').classList.add('open');}
function closeSettings(){document.getElementById('spanel').classList.remove('open');}

function tick(){
  const n=new Date(),h=String(n.getHours()).padStart(2,'0'),m=String(n.getMinutes()).padStart(2,'0'),t=h+':'+m;
  document.getElementById('clockDisp').textContent=t;
  document.getElementById('sClock').textContent=t;
}
tick();setInterval(tick,15000);
setTimeout(()=>{switchTab('day');renderAll();},120);
</script>
