<!--
  ============================================================================
  aua.html — api.unwall.app 専用の構造再現リーダー
  (Unwall.html / Unwall_files/a_jM4h.html の解析結果にもとづく)

  このページは "api.unwall.app" だけを使う。CORS プロキシも貼り付けも無し。

    親 (このページ)
      │  GET https://api.unwall.app/bootstrap         → 統計
      │  GET https://api.unwall.app/fetch?url=...     → {html, finalUrl, challenge, browserRendered}
      │  ※ api.unwall.app は Access-Control-Allow-Origin: * を返すので
      │     ブラウザから直接 fetch できる（自前バックエンド不要）
      ▼
    iframe sandbox="allow-same-origin allow-scripts allow-forms"
           allow="autoplay" title="Article content"
      │  srcdoc = 受け取った html に data-unwall の CSS/JS を注入したもの
      │  ※ サーバ応答の html は「取得済み + asset URL を
      │     api.unwall.app/asset?url=... に書き換え済み」だが、
      │        復号/隠し CSS・DOM 掃除・親子ブリッジは本家ではクライアント側の
      │        Reader/engine チャンクが注入する。ここで同じものを注入する。
      ▼
    postMessage: unwall-scroll / unwall-hover-top /
                 unwall-homepage-ready / unwall-navigate /
                 unwall-prisa-challenge
  ============================================================================
-->
<style>
  :root{
    --bg:#0b0d12; --panel:#12161f; --panel2:#171c27; --line:#232a38;
    --fg:#e8e6e1; --muted:#8a8b9e; --accent:#3f95ff; --ok:#3ddc97; --warn:#ffb454; --err:#ff6b6b;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%}
  body{
    background:
      radial-gradient(1000px 600px at 50% -20%, rgba(63,149,255,.22), transparent 60%),
      linear-gradient(180deg,#0b0d12,#0f1117 60%,#0f1117);
    color:var(--fg);

  }
  header.app-bar{
    display:flex;gap:10px;align-items:center;flex-wrap:wrap;
    padding:10px 16px;background:rgba(11,13,18,.86);backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);position:relative;z-index:10;
  }

  }
  button.primary{background:linear-gradient(180deg,#3f95ff,#2f7de0);border-color:#2f7de0;color:#04101f}
  button:hover{filter:brightness(1.08)}
  button:disabled{opacity:.5;cursor:default}
  .chk{display:inline-flex;align-items:center;gap:6px;font-size:.76rem;color:var(--muted);white-space:nowrap}
  .chk input{width:auto}

  .stage{position:relative;flex:1;display:flex;flex-direction:column;padding:14px;min-height:0}
  .toolbar{
    display:flex;align-items:center;gap:10px;padding:8px 12px;border:1px solid var(--line);
    border-radius:12px 12px 0 0;background:var(--panel2);font-size:.78rem;color:var(--muted);flex-wrap:wrap
  }
  .dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
  .dot.on{background:var(--ok);box-shadow:0 0 8px var(--ok)}
  .dot.wait{background:var(--warn)}
  .dot.err{background:var(--err)}
  .frame-host{flex:1;border:1px solid var(--line);border-top:0;border-radius:0 0 12px 12px;overflow:hidden;background:#fff;min-height:60vh}
  #article{width:100%;height:100%;border:0;display:block;background:#fff}

  #floatbar{
    position:absolute;top:58px;left:50%;transform:translateX(-50%) translateY(-12px);
    opacity:0;transition:.18s;pointer-events:none;z-index:5;
    background:#0d1119;border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:.75rem;color:var(--muted)
  }
  #floatbar.show{opacity:1;transform:translateX(-50%) translateY(0)}

  #notice{
    margin:14px 14px 0;padding:12px 14px;border-radius:12px;border:1px solid var(--line);
    background:#141a25;font-size:.85rem;display:none
  }
  #notice.err{border-color:#5b2a2a;background:#1e1414;color:#ffc9c9}
  #notice.warn{border-color:#5b4a2a;background:#1e1a12;color:#ffe0a8}
  #notice b{color:#fff}

  #log{
    font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.7rem;line-height:1.5;
    background:#0d1119;border:1px solid var(--line);border-radius:12px;padding:8px 10px;margin:14px;
    max-height:150px;overflow:auto;color:var(--muted)
  }
  #log .m{color:var(--accent)} #log .n{color:var(--ok)} #log .e{color:var(--err)}

  /* ================= 最大画面モード ================= */
  #btn-max{padding:7px 12px;font-size:.78rem}
  /* 最大画面時：ヘッダ・URLバー・ログ等を隠して iframe を全画面に */
  body.maximized{overflow:hidden}
  body.maximized > header.app-bar,
  body.maximized > .bar,
  body.maximized > #notice{display:none}
  body.maximized .stage{padding:0;height:100vh}
  body.maximized .toolbar,
  body.maximized #log,
  body.maximized #floatbar{display:none}
  body.maximized .frame-host{border:0;border-radius:0;min-height:100vh}

  /* 上部中央のホバー感知ゾーン（iframe の上に重ねる親側の要素） */
  #restore-zone{position:fixed;top:0;left:50%;transform:translateX(-50%);
    width:280px;max-width:80vw;height:28px;z-index:9998;display:none}
  body.maximized #restore-zone{display:block}

  /* 上から降りてくる「元の画面に戻す」専用バー */
  #restore-wrap{position:fixed;top:0;left:50%;z-index:9999;
    transform:translateX(-50%) translateY(-130%);
    opacity:0;pointer-events:none;
    transition:transform .22s cubic-bezier(.2,.8,.2,1),opacity .22s}
  #restore-wrap.show{transform:translateX(-50%) translateY(0);opacity:1;pointer-events:auto}
  #restore-bar{display:inline-flex;align-items:center;gap:8px;cursor:pointer;
    background:linear-gradient(180deg,#3f95ff,#2f7de0);color:#04101f;border:0;
    border-radius:0 0 14px 14px;padding:9px 20px;font-weight:700;font-size:.82rem;font-family:inherit;
    box-shadow:0 10px 26px rgba(0,0,0,.5)}
  #restore-bar:hover{filter:brightness(1.07)}
  #restore-bar .rb-arrow{font-size:1rem;line-height:1}

<script type="text/plain" id="tpl-runtime">
<script data-unwall="site-runtime">
(function(){
  var SITE_ORIGIN = "__SITE_ORIGIN__";
  function $(sel,root){return (root||document).querySelectorAll(sel);}
  function kill(el){ if(el&&el!==document.body&&el!==document.documentElement){ try{el.remove();}catch(e){} } }

  /* --- consent / CMP / cookie wall --- */
  var CONSENT=[
    "#didomi-host","#didomi-popup","#didomi-notice","[id^='didomi-']","[class*='didomi']",
    "#onetrust-banner-sdk","#onetrust-consent-sdk","#onetrust-pc-sdk",
    "#CybotCookiebotDialog","#CybotCookiebotDialogBodyUnderlay",
    "[id^='sp_message_container']","#qc-cmp2-container","#qc-cmp2-main",
    "#pmConsentWall",".pmConsentWall","[id*='consentWall']","[class*='consentWall']",
    "[class*='consent-banner' i]","[class*='cookie-banner' i]"
  ];
  function stripConsent(){
    CONSENT.forEach(function(s){ $(s).forEach(kill); });
    document.documentElement.classList.remove("sp-message-open","popin-gdpr-no-scroll","gdpr-no-scroll");
    if(document.body) document.body.classList.remove("popin-gdpr-no-scroll","gdpr-no-scroll","no-scroll","overflow-hidden","lock-scroll");
  }

  /* --- Drupal のエラーメッセージ領域 (paywall 失敗が表面化する) --- */
  function stripDrupal(){
    $("[data-drupal-messages],[data-drupal-message-type='error']").forEach(kill);
    if(document.body) document.body.classList.remove("modal-no-scroll");
  }

  /* --- Brightspot の購読者バッジ --- */
  function stripPremiumBadges(){
    $(".Promo-category > a[href='#']").forEach(function(a){
      if(/exclusivo\s+suscriptor/i.test(a.textContent||"")) kill(a.parentElement||a);
    });
  }

  /* --- Google ワンタップ / GSI --- */
  var GSI=["#credential_picker_container","div[id*='credential_picker' i]","[class*='credential_picker' i]",
    "iframe[src*='accounts.google.com/gsi/iframe/select']","iframe[title*='Google' i]","iframe[title*='Iniciar sesi' i]",
    "script[src*='gsi/client' i]","meta[name='google-signin-client_id' i]"];
  function stripGsi(){ GSI.forEach(function(s){ $(s).forEach(kill); }); }

  /* --- 通知 / push プロンプト --- */
  function stripPush(){
    $("#onesignal-slidedown-container,.onesignal-slidedown-container,[id^='onesignal-'],[class*='onesignal' i],[class*='push-notification' i]").forEach(function(el){
      kill(el.closest("#onesignal-slidedown-container,section,aside,div")||el);
    });
    $(".cleverpush-confirm,.cleverpush-confirm-wrap,[class*='cleverpush']").forEach(kill);
  }

  /* --- 広告ユニット / コメントゲート --- */
  function stripAds(){
    $("[data-mini-ad-unit='true'],[ow-ad-unit-root='true'],[class*='megabanner' i],[class*='robapaginas' i],[class*='parentAds' i],iframe[title='ad content']").forEach(function(el){
      kill(el.closest("[ow-ad-unit-root='true'],[data-mini-ad-unit='true'],section,aside,div")||el);
    });
    $("#comments,.comments-login,[id*='comments' i],[class*='comments' i]").forEach(function(el){
      var t=(el.textContent||"").replace(/\s+/g," ").toLowerCase();
      if(/quieres comentar|sign in to comment|log in to comment|comments are for subscribers/.test(t))
        kill(el.closest("#comments,.comments-login,section,aside,div")||el);
    });
  }

  /* --- 画面全体を覆う差し込みモーダル (newsletter/app/anti-adblock) --- */
  function stripInterstitials(){
    var vw=innerWidth,vh=innerHeight; if(!vw||!vh) return;
    $("body > div,body > section,body > aside").forEach(function(el){
      var cs; try{cs=getComputedStyle(el);}catch(e){return;}
      if(cs.position!=="fixed"||cs.display==="none"||cs.visibility==="hidden") return;
      if(!(parseInt(cs.zIndex,10)>=10)) return;
      var r=el.getBoundingClientRect();
      if(r.width<vw*0.9||r.height<vh*0.9) return;
      if((el.textContent||"").trim().length>400) return;
      if(el.querySelectorAll("a[href]").length>5) return;
      if(el.querySelector("main,article")) return;
      kill(el);
    });
  }

  function runAll(){ try{stripDrupal();stripConsent();stripPremiumBadges();stripGsi();stripPush();stripAds();stripInterstitials();}catch(e){} }
  runAll();

  /* --- 遅延生成される DOM を監視して掃除 (debounce) --- */
  var pending=false;
  try{
    new MutationObserver(function(){
      if(pending) return; pending=true;
      setTimeout(function(){ pending=false; runAll(); },120);
    }).observe(document.documentElement,{childList:true,subtree:true});
  }catch(e){}
  setInterval(stripInterstitials,800);
  setTimeout(function(){ try{/* 監視は 30 秒で停止 (UnWall と同じ流儀) */}catch(e){} },30000);
})();

(function(){

  try{ window.__realLocation=window.__realLocation||{href:location.href,origin:location.origin,hostname:location.hostname,pathname:location.pathname}; }catch(e){}

  /* ---- scroll / hover を親へ通知 ---- */
  var last=0;
  function bestScrollTop(){
    var root=document.scrollingElement||document.documentElement||document.body; if(!root) return 0;
    var best=root,bestRange=Math.max(0,(root.scrollHeight||0)-(root.clientHeight||0));
    var nodes=document.querySelectorAll("main,article,section,div");
    for(var i=0;i<nodes.length;i++){var el=nodes[i]; if(!el||el===document.body) continue;
      var range=Math.max(0,(el.scrollHeight||0)-(el.clientHeight||0));
      if(range>bestRange){best=el;bestRange=range;}}
    if(best===root) return window.scrollY||document.documentElement.scrollTop||document.body.scrollTop||0;
    return best.scrollTop||0;
  }
  function reportScroll(){var y=bestScrollTop(); if(y===last) return;
    msg({type:"unwall-scroll",scrollY:y,direction:y<last?"up":"down"}); last=y;}
  window.addEventListener("scroll",reportScroll,{passive:true});
  document.addEventListener("scroll",reportScroll,{passive:true,capture:true});
  setInterval(reportScroll,350);
  var touchY=null;
  document.addEventListener("touchstart",function(e){touchY=e.touches[0].clientY;},{passive:true});

  var origin=SITE_ORIGIN||window.location.origin;

    try{var p=new URL(url);var h=(p.hostname||"").toLowerCase();var bare=h.replace(/^www\./,"");
      var segs=(p.pathname||"/").split("/").filter(Boolean);
      if(segs.length>1){var f=segs[0].toLowerCase(); if(f===h||f===bare) p.pathname="/"+segs.slice(1).join("/");}

    }catch(e){return url;}

    var a=e.target.closest&&e.target.closest("a[href]"); if(!a) return;
    var href=a.getAttribute("href"); if(!href||/^(javascript:|mailto:|tel:|#|data:)/i.test(href)) return;

@@ES@@
</script>

<script>
/* =========================================================================
   aua.html — 親アプリ側ロジック（api.unwall.app 専用）
   ========================================================================= */
const $ = (s)=>document.querySelector(s);
const frame   = $("#article"),
      statusEl= $("#status"),
      dot     = $("#dot"),
      logEl   = $("#log"),
      floatbar= $("#floatbar"),
      notice  = $("#notice");

const ENDSCRIPT = "</" + "script>";
const TPL_STYLES  = $("#tpl-styles").textContent;
const TPL_RUNTIME = $("#tpl-runtime").textContent.replaceAll("@@ES@@", ENDSCRIPT);
const TPL_BRIDGE  = $("#tpl-bridge").textContent.replaceAll("@@ES@@", ENDSCRIPT);

const API = "https://api.unwall.app";
// 本家 src/config.js の MOBILE_EDITION_UA と同じ系統（狭い画面で publisher のモバイル版を要求）
const MOBILE_UA = "Mozilla/5.0 (Linux; Android 10; K) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/133.0.0.0 Mobile Safari/537.36";

function setStatus(t, cls){ statusEl.textContent = t; dot.className = "dot" + (cls ? " "+cls : ""); }
function showNotice(html, cls){ if(!html){ notice.style.display="none"; return; } notice.className = cls||""; notice.innerHTML = html; notice.style.display="block"; }
function log(kind, text){
  logEl.insertAdjacentHTML("afterbegin",
    `<div><span style="color:#5a6070">${new Date().toLocaleTimeString()}</span> <span class="${kind}">${text}</span></div>`);
}

/* --- 親ガード: iframe から逃げ出してくる publisher script を除去（Unwall.html と同趣旨） --- */
(function parentGuard(){
  const allowed = (el)=>{
    if(!el.src) return false;
    try{
      const u = new URL(el.src, location.href);
      if(u.protocol==="blob:" || u.protocol==="data:") return true;
      return u.origin === location.origin || u.origin === API;
    }catch(e){ return false; }
  };
  new MutationObserver(function(records){
    for(const r of records) for(const n of r.addedNodes){
      if(n.nodeType===1 && n.tagName==="SCRIPT" && !allowed(n)){
        n.type = "javascript/blocked"; try{ n.remove(); }catch(e){}
        log("e","逃げ出した script を除去: "+(n.src||"(inline)"));
      }
    }
  }).observe(document, {childList:true, subtree:true});
})();

/* =========================================================================
   1) api.unwall.app/bootstrap — 統計を表示
   ========================================================================= */
(async function bootstrap(){
  try{
    const res = await fetch(API + "/bootstrap", { credentials:"same-origin" });
    if(!res.ok) throw new Error("HTTP "+res.status);
    const b = await res.json();
    const walls = (b.wallsCleared||0).toLocaleString();
    $("#st-walls").textContent = walls;
    $("#st-sites").textContent = (b.testedDomains && b.testedDomains.length) || "—";
    $("#st-status").textContent = "API 接続 OK";
    log("n", `bootstrap OK — wallsCleared=${walls}, testedDomains=${(b.testedDomains||[]).length}`);
  }catch(e){
    $("#st-status").textContent = "API に接続できません";
    log("e", "bootstrap 失敗: "+e.message);
  }
})();

/* =========================================================================
   2) 前処理 — 本家 Reader/engine が担う注入をブラウザ内で再現
   ========================================================================= */
function preprocess(html, targetUrl){
  const inject   = $("#opt-inject").checked;
  const strip    = $("#opt-stripscripts").checked;

  let origin = "";
  try{ origin = new URL(targetUrl).origin; }catch(e){ origin = ""; }

  // publisher の <script> と inline on* を除去（安全側。外すと本家同様に実行）
  if(strip){
    html = html.replace(/<script\b[^>]*>[\s\S]*?<\/script>/gi, "")
               .replace(/<script\b[^>]*\/>/gi, "")
               .replace(/\son[a-z]+\s*=\s*"[^"]*"/gi, "")
               .replace(/\son[a-z]+\s*=\s*'[^']*'/gi, "");
  }

  let head = "";
  // 相対 URL（アンカー等）を上流サイト基準で解決。画像/CSS は既に
  // api.unwall.app/asset?url=... の絶対 URL に書き換え済み。
  if(targetUrl) head += `<base href="${targetUrl}">`;

  let bridge = "";
  if(inject){
    head += TPL_STYLES;
    head += TPL_RUNTIME.replaceAll("__SITE_ORIGIN__", origin);
    head += `<script data-unwall="globals-bootstrap">try{if(!Array.isArray(window.dataLayer))window.dataLayer=[];globalThis.dataLayer=window.dataLayer;}catch(e){}try{window.gigya=window.gigya||{};if(!window.gigya.thisScript)window.gigya.thisScript={globalConf:{}};}catch(e){}<` + `/script>`;
    bridge = TPL_BRIDGE.replaceAll("__SITE_ORIGIN__", origin);
  }

  if(/<head[^>]*>/i.test(html))      html = html.replace(/<head([^>]*)>/i, `<head$1>${head}`);
  else if(/<html[^>]*>/i.test(html)) html = html.replace(/<html([^>]*)>/i, `<html$1><head>${head}</head>`);
  else                               html = `<head>${head}</head>` + html;

  if(bridge){
    if(/<\/body>/i.test(html)) html = html.replace(/<\/body>/i, `${bridge}</body>`);
    else                       html = html + bridge;
  }
  return html;
}

/* =========================================================================
   3) api.unwall.app/fetch で取得 → srcdoc へ
   ========================================================================= */
let lastUrl = "";
async function openArticle(url){
  if(!url) return;
  lastUrl = url;
  setStatus("取得中… api.unwall.app/fetch", "wait");
  showNotice("");
  const params = new URLSearchParams({ url });
  if($("#opt-mobile").checked){
    params.set("headers", JSON.stringify({ "User-Agent": MOBILE_UA }));
  }
  try{
    const res = await fetch(API + "/fetch?" + params, { credentials:"same-origin" });
    if(!res.ok){
      let msg = "HTTP "+res.status;
      try{ const j = await res.json(); if(j && j.error) msg += " — " + j.error; }catch(e){}
      throw new Error(msg);
    }
    const data = await res.json();
    const html  = data.html || "";
    const finalUrl = data.finalUrl || url;
    $("#finalUrl").textContent = finalUrl;
    log("n", `fetch OK — ${(html.length/1024|0)} KB, finalUrl=${finalUrl}, challenge=${!!data.challenge}, browserRendered=${!!data.browserRendered}`);

    if(!html){ setStatus("応答に html がありません","err"); return; }

    // base は finalUrl（リダイレクト後）を使う
    frame.srcdoc = preprocess(html, finalUrl);
    setStatus("描画中…", "wait");
    log("m", `iframe.srcdoc を設定 (${(frame.srcdoc.length/1024|0)} KB)`);

    if(data.challenge){
      setStatus("bot challenge の可能性","err");
      showNotice(`<b>⚠ challenge = true</b> — サイトが bot 判定を返しました。本文が不完全な可能性があります。`, "warn");
    }else if(data.browserRendered){
      showNotice(`<b>ℹ browserRendered = true</b> — サーバ側でヘッドレスブラウザ描画された HTML です。`, "warn");
    }
  }catch(err){
    setStatus("取得失敗: "+err.message, "err");
    log("e", "fetch 失敗: "+err.message);
    showNotice(`<b>取得に失敗しました</b><br>${err.message}<br>
      <span style="color:var(--muted)">このページは api.unwall.app 専用です。API が停止しているか、
      レート制限（120 req/60s）の可能性があります。</span>`, "err");
  }
}

/* =========================================================================
   最大画面モード（上部中央ホバーで「元の画面に戻す」バーが降りてくる）
   ========================================================================= */
let maxed = false, hideTimer = null, hoveringRestore = false;
const restoreWrap = document.getElementById("restore-wrap");
const restoreZone = document.getElementById("restore-zone");
const btnMax      = document.getElementById("btn-max");

function revealRestore(on){
  if(!maxed){ restoreWrap.classList.remove("show"); return; }
  if(on){ clearTimeout(hideTimer); restoreWrap.classList.add("show"); }
  else  scheduleHideRestore();
}
function scheduleHideRestore(){
  if(hoveringRestore) return;
  clearTimeout(hideTimer);
  hideTimer = setTimeout(function(){ if(!hoveringRestore) restoreWrap.classList.remove("show"); }, 400);
}
function setMaximized(on){
  maxed = !!on;
  document.body.classList.toggle("maximized", maxed);
  restoreWrap.classList.remove("show");
  btnMax.textContent = maxed ? "⛶ 元の画面" : "⛶ 最大画面";
  try{
    if(maxed){
      if(document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(function(){});
    }else{
      if(document.fullscreenElement && document.exitFullscreen) document.exitFullscreen().catch(function(){});
    }
  }catch(e){}
}
btnMax.addEventListener("click", function(){ setMaximized(!maxed); });
document.getElementById("restore-bar").addEventListener("click", function(){ setMaximized(false); });
document.addEventListener("keydown", function(e){ if(e.key === "Escape" && maxed) setMaximized(false); });
// ブラウザのフルスクリーンが Esc 等で解除されたら通常画面に戻す
document.addEventListener("fullscreenchange", function(){
  if(!document.fullscreenElement && maxed) setMaximized(false);
});
// 上部中央の感知ゾーン：iframe の上に重なる親側要素なので、iframe が空でも反応する
restoreZone.addEventListener("mouseenter", function(){ revealRestore(true); });
restoreZone.addEventListener("mouseleave", function(){ revealRestore(false); });
restoreWrap.addEventListener("mouseenter", function(){ hoveringRestore = true; clearTimeout(hideTimer); });
restoreWrap.addEventListener("mouseleave", function(){ hoveringRestore = false; scheduleHideRestore(); });

/* =========================================================================
   4) iframe → 親 の postMessage（本家と同一プロトコル）
   ========================================================================= */
const KINDS = { "unwall-scroll":1, "unwall-hover-top":1, "unwall-homepage-ready":1,
                "unwall-navigate":1, "unwall-prisa-challenge":1 };
window.addEventListener("message", (ev)=>{
  const d = ev.data || {};
  if(!KINDS[d.type]) return;
  switch(d.type){
    case "unwall-scroll":
      if(typeof d.scrollY==="number" && d.scrollY>=0) $("#scrollY").textContent = d.scrollY;
      break;
    case "unwall-hover-top":
      $("#hoverTop").textContent = String(!!d.near);
      if(maxed) revealRestore(!!d.near);
      else      floatbar.classList.toggle("show", !!d.near);
      break;
    case "unwall-homepage-ready":
      setStatus("読み込み完了", "on");
      log("n","unwall-homepage-ready (bridge 稼働)");
      break;
    case "unwall-navigate":
      log("m","unwall-navigate → "+d.url);
      $("#url").value = d.url;
      openArticle(d.url);
      break;
    case "unwall-prisa-challenge":
      setStatus("bot challenge 検出","err");
      showNotice(`<b>⚠ unwall-prisa-challenge</b> — 上流 WAF のチャレンジを検出しました。`, "warn");
      break;
  }
});

/* --- UI 配線 --- */
$("#btn-open").onclick = ()=>{
  const url = $("#url").value.trim();
  if(!url){ setStatus("URL を入力してください","err"); return; }
  openArticle(url);
};
$("#url").addEventListener("keydown", (e)=>{ if(e.key==="Enter") $("#btn-open").click(); });
$("#btn-clear").onclick = ()=>{
  frame.removeAttribute("srcdoc"); frame.srcdoc=""; setStatus("待機中");
  $("#scrollY").textContent="0"; $("#hoverTop").textContent="false"; $("#finalUrl").textContent="—";
  showNotice("");
};

/* --- ディープリンク: ?url=... または #url=... を起動時に開く --- */
(function deepLink(){
  let target = "";
  try{
    const qs = new URLSearchParams(location.search);
    target = qs.get("url") || qs.get("u") || "";
    if(!target && location.hash){
      const hs = new URLSearchParams(location.hash.slice(1));
      target = hs.get("url") || hs.get("u") || "";
    }
  }catch(e){}
  if(target){ $("#url").value = target; openArticle(target); }
})();

log("m","aua.html 起動 — api.unwall.app 専用モード");
</script>
</body>
</html>
