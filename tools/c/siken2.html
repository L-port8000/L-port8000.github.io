<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <title>Proxy Scanner</title>
    <link rel="icon" href=".../icon.png" type="image/png">
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #1a1a1a; color: #eee; margin: 0; display: flex; height: 100vh; overflow: hidden; }
        .sidebar { width: 300px; background: #252525; border-right: 1px solid #333; display: flex; flex-direction: column; }
        .search-box { padding: 15px; border-bottom: 1px solid #333; }
        #countrySearch { width: 100%; padding: 8px; border-radius: 4px; border: 1px solid #444; background: #1a1a1a; color: white; box-sizing: border-box; }
        .country-list { flex: 1; overflow-y: auto; }
        .country-item { padding: 10px 15px; cursor: pointer; border-bottom: 1px solid #333; transition: 0.2s; font-size: 0.9em; display: flex; justify-content: space-between; align-items: center; }
        .country-item:hover { background: #333; }
        .country-item.active { background: #00bbff; color: white; font-weight: bold; }
        .count-badge { background: #444; padding: 2px 8px; border-radius: 12px; font-size: 0.75em; color: #fff; white-space: nowrap; }
        .online-count { color: #00ff88; font-weight: bold; }
        .main-content { flex: 1; display: flex; flex-direction: column; padding: 20px; overflow-y: auto; }
        .controls { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; position: sticky; top: -20px; background: #1a1a1a; padding: 10px 0; z-index: 100; border-bottom: 1px solid #333; }
        .button-row { display: flex; align-items: center; gap: 20px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }
        .item { padding: 12px; border-radius: 8px; background: #2a2a2a; border-left: 5px solid #444; }
        .item.online { border-left-color: #00ff88; background: #1e3a2e; }
        .item.offline { border-left-color: #ff4444; opacity: 0.5; }
        .item.checking { border-left-color: #00bbff; animation: pulse 1s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
        .ip { font-weight: bold; display: block; font-family: 'Consolas', monospace; }
        .info { font-size: 0.75em; color: #aaa; }
        .latency { float: right; color: #00ff88; font-weight: bold; font-size: 0.85em; }
        .timestamp-label { font-size: 0.85em; color: #00bbff; margin-top: 5px; font-weight: bold; }
        button { background: #00bbff; color: white; border: none; padding: 10px 25px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        button:disabled { background: #555; cursor: not-allowed; }
        .counter { font-size: 0.9em; color: #00bbff; }
    </style>
</head>
<body>

<div class="sidebar">
    <div class="search-box">
        <input type="text" id="countrySearch" placeholder="国名を検索..." oninput="filterCountries()">
    </div>
    <div id="countryList" class="country-list">
        </div>
</div>

<div class="main-content">
    <div class="controls">
        <h2 id="currentViewTitle" style="margin:0; font-size: 1.2em;">Loading...</h2>
        <div class="button-row">
            <button id="scanBtn" onclick="startScan()">このリストをスキャン</button>
            <div id="statusSummary" class="counter">-</div>
        </div>
        <div id="lastScanTime" class="timestamp-label"></div>
    </div>
    <div id="results" class="grid"></div>
</div>

let targetList = [];
let scanTimestamps = {};
let currentSelectedCountry = "ALL";

// --- ストレージ・初期化ロジック ---

function saveToStorage() {
    localStorage.setItem('proxyScanData_v3', JSON.stringify({ list: targetList, timestamps: scanTimestamps }));
}

function loadFromStorage() {
    const saved = localStorage.getItem('proxyScanData_v3');
    if (saved) {
        const parsed = JSON.parse(saved);
        // 新しく initialData に追加された項目がある場合、それをマージする（簡易的な差分チェック）
        const savedIps = new Set(parsed.list.map(t => `${t.ip}:${t.port}`));
        initialData.forEach(item => {
            if (!savedIps.has(`${item.ip}:${item.port}`)) {
                parsed.list.push({ ...item, status: 'waiting', latency: null });
            }
        });
        targetList = parsed.list;
        scanTimestamps = parsed.timestamps || {};
    } else {
        targetList = initialData.map(t => ({ ...t, status: 'waiting', latency: null }));
    }
}

function initApp() {
    loadFromStorage();
    const listEl = document.getElementById('countryList');
    listEl.innerHTML = ''; // クリア

    // ALL項目作成
    const allDiv = document.createElement('div');
    allDiv.className = 'country-item';
    allDiv.id = 'item-ALL';
    allDiv.onclick = () => selectCountry('ALL');
    allDiv.innerHTML = `<span>ALL</span><span class="count-badge" id="badge-ALL">0/0</span>`;
    listEl.appendChild(allDiv);

    // 国リスト抽出と作成
    const countries = [...new Set(targetList.map(t => t.country))].sort();
    countries.forEach(country => {
        const div = document.createElement('div');
        div.className = 'country-item';
        div.id = `item-${country}`;
        div.onclick = () => selectCountry(country);
        div.innerHTML = `<span>${country}</span><span class="count-badge" id="badge-${country}">0/0</span>`;
        listEl.appendChild(div);
    });
    
    updateAllBadges();
    selectCountry('ALL');
}

// バッジ数字（オンライン/全体）の動的計算
function updateAllBadges() {
    const uniqueCountries = ['ALL', ...new Set(targetList.map(t => t.country))];
    uniqueCountries.forEach(c => {
        const badge = document.getElementById(`badge-${c}`);
        if (!badge) return;

        const filtered = (c === 'ALL') ? targetList : targetList.filter(t => t.country === c);
        const total = filtered.length;
        const online = filtered.filter(t => t.status === 'online').length;
        
        badge.innerHTML = `<span class="online-count">${online}</span> / ${total}`;
    });
}

function selectCountry(country) {
    currentSelectedCountry = country;
    document.querySelectorAll('.country-item').forEach(el => el.classList.remove('active'));
    
    const activeItem = document.getElementById(`item-${country}`);
    if (activeItem) activeItem.classList.add('active');

    document.getElementById('currentViewTitle').innerText = (country === 'ALL') ? "All Proxies" : `Proxies in ${country}`;
    
    const time = scanTimestamps[country];
    document.getElementById('lastScanTime').innerText = time ? `最終測定 (${country}): ${time}` : `最終測定 (${country}): 未測定`;

    renderGrid();
}

function renderGrid() {
    const resultsDiv = document.getElementById('results');
    resultsDiv.innerHTML = '';
    
    const displayList = (currentSelectedCountry === 'ALL') 
        ? targetList 
        : targetList.filter(t => t.country === currentSelectedCountry);

    displayList.forEach(t => {
        const div = document.createElement('div');
        div.className = `item ${t.status || ''}`;
        let content = `<span class="ip">${t.ip}:${t.port}</span><span class="info">${t.country}</span>`;
        if (t.status === 'online') content = `<span class="latency">${t.latency}ms</span>` + content;
        div.innerHTML = content;
        resultsDiv.appendChild(div);
    });
    
    const onlineCount = displayList.filter(r => r.status === 'online').length;
    document.getElementById('statusSummary').innerText = `${displayList.length} 件表示中 (内 ${onlineCount}件 ONLINE)`;
}

function getNowStr() {
    return new Date().toLocaleString('ja-JP', { year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit' });
}

async function checkPort(target) {
    return new Promise((resolve) => {
        const img = new Image();
        const start = Date.now();
        let isResolved = false;
        const finalize = (status) => {
            if (isResolved) return;
            isResolved = true;
            img.src = "";
            resolve({ status, latency: Date.now() - start });
        };
        img.onload = () => finalize('online');
        img.onerror = () => finalize('online');
        img.src = `http://${target.ip}:${target.port}/favicon.ico?t=${start}`;
        setTimeout(() => finalize('offline'), 3000);
    });
}

async function startScan() {
    const btn = document.getElementById('scanBtn');
    btn.disabled = true;

    const displayIndices = [];
    const affectedCountries = new Set();

    targetList.forEach((t, idx) => {
        if (currentSelectedCountry === 'ALL' || t.country === currentSelectedCountry) {
            displayIndices.push(idx);
            affectedCountries.add(t.country);
            targetList[idx].status = 'checking';
        }
    });

    renderGrid();

    const CONCURRENCY = 50;
    const queue = [...displayIndices];
    const activePromises = [];

    while (queue.length > 0 || activePromises.length > 0) {
        while (queue.length > 0 && activePromises.length < CONCURRENCY) {
            const index = queue.shift();
            const p = checkPort(targetList[index]).then(res => {
                targetList[index].status = res.status;
                targetList[index].latency = res.latency;
                activePromises.splice(activePromises.indexOf(p), 1);
                renderGrid();
                updateAllBadges(); 
            });
            activePromises.push(p);
        }
        if (activePromises.length > 0) await Promise.race(activePromises);
    }

    const now = getNowStr();
    if (currentSelectedCountry === 'ALL') {
        scanTimestamps['ALL'] = now;
        affectedCountries.forEach(c => scanTimestamps[c] = now);
    } else {
        scanTimestamps[currentSelectedCountry] = now;
    }

    saveToStorage();
    selectCountry(currentSelectedCountry);
    btn.disabled = false;
}

function filterCountries() {
    const term = document.getElementById('countrySearch').value.toLowerCase();
    document.querySelectorAll('.country-item').forEach(item => {
        item.style.display = item.innerText.toLowerCase().includes(term) ? 'flex' : 'none';
    });
}

initApp();
</script>
</body>
</html>
