<html lang="ja">
<head>

 <style>
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; padding:0; height:100%; overflow:hidden; overscroll-behavior:none;
    background:#fafafa; color:#171717;
    font-family:'Segoe UI','Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif; }
  #app{ position:fixed; inset:0; display:flex; flex-direction:column; }

  #toolbar{ flex:0 0 auto; display:flex; align-items:center; gap:8px; padding:8px 10px;
    background:#fff; border-bottom:1px solid #e5e5e5; overflow-x:auto; overflow-y:hidden; white-space:nowrap; scrollbar-width:thin; }
  #toolbar::-webkit-scrollbar{ height:5px; }
  #toolbar::-webkit-scrollbar-thumb{ background:#e5e5e5; border-radius:4px; }
  .group{ display:flex; align-items:center; gap:6px; padding:0 8px; border-right:1px solid #e5e5e5; flex:0 0 auto; }
  .group:last-child{ border-right:none; }

  .tbtn{ flex:0 0 auto; min-width:40px; height:40px; padding:0 8px; display:flex; align-items:center; justify-content:center;
    background:transparent; border:1px solid transparent; border-radius:10px; color:#171717; font-size:16px; cursor:pointer;
    transition:background .12s ease, transform .08s ease; user-select:none; font-family:inherit; }
  .tbtn:hover{ background:#f0f0f0; }
  .tbtn:active{ transform:scale(0.92); }
  .tbtn.active{ background:#171717; color:#fff; border-color:#171717; }
  .tbtn:disabled{ opacity:.3; cursor:default; }
  .tbtn:disabled:hover{ background:transparent; }
  .tbtn svg{ width:19px; height:19px; display:block; }

  .swatch{ width:26px; height:26px; border-radius:50%; border:2px solid #e5e5e5; cursor:pointer; flex:0 0 auto; padding:0; }
  .swatch.selected{ border-color:#171717; box-shadow:0 0 0 2px #fff inset; }

  .lbl{ font-size:11px; color:#737373; flex:0 0 auto; }
  #colorCustom{ width:30px; height:30px; border:none; border-radius:8px; background:none; cursor:pointer; padding:0; }
  #strokeRange{ width:80px; accent-color:#171717; }
  .numInput{ width:64px; font-size:12px; padding:4px 6px; border:1px solid #e5e5e5; border-radius:6px; }
  #dimGroup{ display:none; }

  #boardWrap{ position:relative; flex:1 1 auto; overflow:hidden; background:#fafafa; }
  #board{ position:absolute; inset:0; display:block; touch-action:none; -webkit-touch-callout:none; }

  #textEditor{ position:absolute; z-index:20; display:none; background:#fff; color:inherit;
    border:1px dashed #171717; outline:none; resize:none; overflow:hidden;
    font-family:'Segoe UI','Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif;
    line-height:1.3; padding:0; margin:0; min-width:20px; white-space:pre; }

  .sizePanel{ position:absolute; z-index:30; display:none; transform:translateX(-50%);
    background:rgba(23,23,23,0.88); color:#fff; font-size:11px; line-height:1;
    padding:5px 7px; border-radius:7px; white-space:nowrap; user-select:none;
    gap:5px; align-items:center; }
  .sizePanel .spLbl{ color:#d4d4d4; font-size:10px; }
  .sizePanel input{ width:54px; font-size:11px; padding:4px 4px; border:1px solid rgba(255,255,255,0.3);
    border-radius:4px; background:rgba(255,255,255,0.14); color:#fff; font-family:inherit; }
  .sizePanel input:focus{ background:#fff; color:#171717; outline:none; }
  #toast{ position:fixed; left:50%; bottom:72px; transform:translateX(-50%); z-index:90; display:none;
    background:rgba(23,23,23,0.92); color:#fff; font-size:13px; padding:10px 18px; border-radius:999px; pointer-events:none; }
  #progressOverlay{ position:fixed; inset:0; z-index:100; display:none; align-items:center; justify-content:center;
    background:rgba(23,23,23,0.45); }
  #progressBox{ background:#fff; border-radius:14px; padding:18px 22px; width:280px; box-shadow:0 20px 60px rgba(0,0,0,.30); }
  #progressMsg{ font-size:13px; font-weight:600; margin-bottom:10px; }
  #progressBarWrap{ height:8px; background:#e5e5e5; border-radius:999px; overflow:hidden; }
  #progressBar{ height:100%; width:0%; background:#171717; border-radius:999px; transition:width .12s ease; }
  #progressPct{ margin-top:8px; font-size:12px; color:#737373; text-align:right; }

  #zoomBar{ position:absolute; right:14px; bottom:14px; z-index:10; display:flex; align-items:center; gap:2px;
    background:#fff; border:1px solid #e5e5e5; border-radius:999px; padding:4px; box-shadow:0 4px 16px rgba(0,0,0,.10); }
  #zoomBar button{ width:34px; height:34px; border-radius:50%; border:none; background:transparent; color:#171717; font-size:16px; cursor:pointer; }
  #zoomBar button:hover{ background:#f0f0f0; }
  #zoomLabel{ font-size:12px; color:#737373; width:56px; text-align:center; cursor:pointer; user-select:none; }
  #zoomInput{ display:none; width:62px; font-size:12px; padding:4px 6px; text-align:center;
    border:1px solid #d4d4d4; border-radius:8px; font-family:inherit; }
  #zoomInput:focus{ outline:none; border-color:#171717; }

  #hint{ position:absolute; left:50%; top:46%; transform:translate(-50%,-50%);
    color:#737373; font-size:14px; text-align:center; pointer-events:none; line-height:1.9; z-index:1; }

  #contextMenu{ position:fixed; z-index:60; display:none; width:180px;
    background:#fff; border:1px solid #e5e5e5; border-radius:12px; box-shadow:0 8px 28px rgba(0,0,0,.16); padding:4px; }
  #contextMenu button{ display:block; width:100%; padding:10px 12px; background:none; border:none; border-radius:8px;
    color:#171717; text-align:left; cursor:pointer; font-size:14px; font-family:inherit; }
  #contextMenu button:hover{ background:#f0f0f0; }
  #contextMenu button.danger{ color:#dc2626; }
  #contextMenu button.danger:hover{ background:#fef2f2; }

  #cropModal{ position:fixed; inset:0; z-index:70; display:none; align-items:center; justify-content:center; background:rgba(0,0,0,0.5); }
  .cropPanel{ background:#fff; border-radius:16px; padding:16px; box-shadow:0 20px 60px rgba(0,0,0,.35); }
  .cropHead{ display:flex; align-items:center; justify-content:space-between; gap:24px; margin-bottom:8px; }
  .cropHead .t{ font-size:14px; font-weight:600; }
  .cropHead .s{ font-size:12px; color:#737373; }
  #cropStage{ position:relative; border:1px solid #d4d4d4; border-radius:8px; background:#e5e5e5; overflow:visible; touch-action:none; user-select:none; }
  #cropImg{ position:absolute; inset:0; width:100%; height:100%; border-radius:8px; pointer-events:none; }
  #cropBox{ position:absolute; border:2px solid #3b82f6; box-shadow:0 0 0 9999px rgba(0,0,0,0.5); cursor:move; }
  .ch{ position:absolute; z-index:2; width:16px; height:16px; border-radius:50%;
    background:#3b82f6; border:2px solid #fff; cursor:move; }
  .cropBtns{ margin-top:12px; display:flex; justify-content:flex-end; gap:8px; }
  .cropBtns button{ padding:8px 16px; border-radius:10px; border:1px solid #e5e5e5; background:#fff; font-size:14px; cursor:pointer; font-family:inherit; }
  .cropBtns button.primary{ background:#171717; color:#fff; border-color:#171717; }
  .cropBtns button:hover{ filter:brightness(0.96); }
</style>
</head>
<body>
<div id="app">
  <div id="toolbar">
    <div class="group">
      <button class="tbtn" data-tool="select" title="選択 (V) / 空白ドラッグで複数選択">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3l7.07 16.97 2.51-7.39 7.39-2.51L3 3z"/></svg>
      </button>
      <button class="tbtn" data-tool="pan" title="手のひら (H) / 2本指で移動">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 11V6a2 2 0 0 0-2-2a2 2 0 0 0-2 2"/><path d="M14 10V4a2 2 0 0 0-2-2a2 2 0 0 0-2 2v2"/><path d="M10 10.5V6a2 2 0 0 0-2-2a2 2 0 0 0-2 2v8"/><path d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-5.99-2.34l-3.6-3.6a2 2 0 0 1 2.83-2.82L7 15"/></svg>
      </button>
    </div>
    <div class="group">
      <button class="tbtn" data-tool="pen" title="ペン (P)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/><path d="m15 5 4 4"/></svg>
      </button>
      <button class="tbtn" data-tool="rect" title="四角形 (R) / Shiftで正方形">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="6" width="16" height="12" rx="1.5"/></svg>
      </button>
      <button class="tbtn" data-tool="ellipse" title="円 (O) / Shiftで正円">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/></svg>
      </button>
      <button class="tbtn" data-tool="line" title="直線 (L)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 19 19 5"/><circle cx="5" cy="19" r="1.4" fill="currentColor" stroke="none"/><circle cx="19" cy="5" r="1.4" fill="currentColor" stroke="none"/></svg>
      </button>
      <button class="tbtn" data-tool="arrow" title="矢印 (A)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 19 7 7"/><path d="M15 7H7v8"/></svg>
      </button>
      <button class="tbtn" data-tool="text" title="テキスト (T)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 7 4 4 20 4 20 7"/><line x1="9" y1="20" x2="15" y2="20"/><line x1="12" y1="4" x2="12" y2="20"/></svg>
      </button>
      <button class="tbtn" data-tool="eraser" title="消しゴム (E)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m7 21-4.3-4.3c-1-1-1-2.5 0-3.4l9.6-9.6c1-1 2.5-1 3.4 0l5.6 5.6c1 1 1 2.5 0 3.4L13 21"/><path d="M22 21H7"/><path d="m5 11 9 9"/></svg>
      </button>
      <button class="tbtn" id="btnImage" title="画像を挿入">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.1-3.1a2 2 0 0 0-2.8 0L6 21"/></svg>
      </button>
    </div>
    <div class="group">
      <span id="swatches" style="display:flex; gap:4px;"></span>
      <input type="color" id="colorCustom" value="#171717" title="色を選択">
      <span class="lbl">太さ</span>
      <input type="number" id="strokeNumber" class="numInput" min="0" max="48" value="3" title="太さ（数値）">
      <input type="range" id="strokeRange" min="0" max="24" value="3">
    </div>
    <div class="group">
      <button class="tbtn" id="btnFill" title="塗りつぶし ON/OFF">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m19 11-8-8-8.6 8.6a2 2 0 0 0 0 2.8l5.2 5.2c.8.8 2 .8 2.8 0L19 11Z"/><path d="m5 2 5 5"/><path d="M2 13h15"/><path d="M22 20a2 2 0 1 1-4 0c0-1.6 1.7-2.4 2-4 .3 1.6 2 2.4 2 4Z"/></svg>
      </button>
      <input type="color" id="fillColor" value="#e5e5e5" title="塗りつぶしの色">
      <button class="tbtn" id="btnLock" title="縦横比を固定（選択中の図形）">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
      </button>
    </div>
    <div class="group">
      <button class="tbtn" id="btnUndo" title="元に戻す (Ctrl+Z)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
      </button>
      <button class="tbtn" id="btnRedo" title="やり直す (Ctrl+Y)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/></svg>
      </button>
    </div>
    <div class="group" id="dimGroup">
      <span class="lbl">角度</span>
      <input type="number" id="dimRot" class="numInput" min="-360" max="360">
    </div>
    <div class="group">
      <button class="tbtn" id="btnPNG" title="PNGとして保存">PNG</button>
      <button class="tbtn" id="btnSave" title="データ(JSON)を保存">保存</button>
      <button class="tbtn" id="btnLoad" title="データ(JSON)を読み込み">読込</button>
    </div>
  </div>

  <div id="boardWrap">
    <canvas id="board"></canvas>
    <div id="hint">ここに描いたり、図形を配置したりできます<br>空白をドラッグ＝複数選択 / 2本指＝拡大縮小・移動<br>長押し（右クリック）＝メニュー（画像は切り抜きも可能）</div>
    <textarea id="textEditor" spellcheck="false"></textarea>
    <div class="sizePanel" id="sizePanel">
      <span class="spLbl">W</span><input id="spW" type="number" min="1" step="1">
      <span class="spLbl">H</span><input id="spH" type="number" min="1" step="1">
    </div>
    <div class="sizePanel" id="sizePanelLine">
      <span class="spLbl">長さ</span><input id="spL" type="number" min="1" step="1">
    </div>
    <div id="toast"></div>

  <div id="progressOverlay">
    <div id="progressBox">
      <div id="progressMsg">処理中…</div>
      <div id="progressBarWrap"><div id="progressBar"></div></div>
      <div id="progressPct">0%</div>
    </div>
  </div>
    <div id="zoomBar">
      <button id="zoomOut" title="縮小">－</button>
      <span id="zoomLabel" title="クリックで100%に戻す / 長押し（右クリック）で倍率を入力（1〜1000%）">100%</span>
      <input id="zoomInput" type="number" min="1" max="1000" step="1" title="倍率を入力（1〜1000%）">
      <button id="zoomIn" title="拡大">＋</button>
    </div>
  </div>

  <div id="contextMenu"></div>

  <div id="cropModal">
    <div class="cropPanel" id="cropPanel">
      <div class="cropHead">
        <span class="t">画像を切り抜く</span>
        <span class="s" id="cropSize"></span>
      </div>
      <div id="cropStage">
        <img id="cropImg" draggable="false">
        <div id="cropBox"></div>
        <div class="ch" id="chNW"></div>
        <div class="ch" id="chNE"></div>
        <div class="ch" id="chSW"></div>
        <div class="ch" id="chSE"></div>
      </div>
      <div class="cropBtns">
        <button id="cropCancel">キャンセル</button>
        <button id="cropOk" class="primary">決定</button>
      </div>
    </div>
  </div>

  <input type="file" id="jsonInput" accept=".json,application/json" hidden>
  <input type="file" id="imgInput" accept="image/*" hidden>
</div>

<script>
(function(){
"use strict";

/* ================= DOM ================= */
var canvas = document.getElementById('board');
var ctx = canvas.getContext('2d');
var wrap = document.getElementById('boardWrap');
var hintEl = document.getElementById('hint');
var textEditor = document.getElementById('textEditor');
var sizePanel = document.getElementById('sizePanel');
var sizePanelLine = document.getElementById('sizePanelLine');
var spW = document.getElementById('spW');
var spH = document.getElementById('spH');
var spL = document.getElementById('spL');
var toastEl = document.getElementById('toast');
var toastTimer = null;
function toast(msg){
  toastEl.textContent = msg;
  toastEl.style.display = 'block';
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ toastEl.style.display = 'none'; }, 1600);
}
var progressOverlay = document.getElementById('progressOverlay');
var progressMsg = document.getElementById('progressMsg');
var progressBar = document.getElementById('progressBar');
var progressPct = document.getElementById('progressPct');
function showProgress(msg){
  progressMsg.textContent = msg || '処理中…';
  setProgress(0);
  progressOverlay.style.display = 'flex';
}
function setProgress(p){
  p = clamp(p, 0, 100);
  progressBar.style.width = p + '%';
  progressPct.textContent = Math.round(p) + '%';
}
function hideProgress(){ progressOverlay.style.display = 'none'; }
function nextTick(cb){ requestAnimationFrame(function(){ setTimeout(cb, 0); }); }
var ctxMenuEl = document.getElementById('contextMenu');
var zoomLabel = document.getElementById('zoomLabel');
var dimGroup = document.getElementById('dimGroup');
var dimRot = document.getElementById('dimRot');
var cropModal = document.getElementById('cropModal');
var cropPanel = document.getElementById('cropPanel');
var cropStage = document.getElementById('cropStage');
var cropImg = document.getElementById('cropImg');
var cropBox = document.getElementById('cropBox');
var cropSizeEl = document.getElementById('cropSize');
var dpr = Math.max(1, window.devicePixelRatio || 1);

/* ================= state ================= */
var SWATCHES = ['#171717','#ef4444','#f97316','#eab308','#22c55e','#06b6d4','#3b82f6','#a855f7'];

var elements = [];
var selectedIds = [];
var scale = 1, panX = 0, panY = 0;
var tool = 'select';
var color = '#171717';
var strokeWidth = 3;
var fillEnabled = false;
var fillColor = '#e5e5e5';

var draft = null;
var marquee = null;          // {x1,y1,x2,y2}
var history = [];
var historyIndex = -1;
var clipboard = null;
var pasteCount = 0;

var MIN_SCALE = 0.01;   // 1%
var MAX_SCALE = 10;     // 1000%

var editing = null;     // テキスト編集中の情報 {id or null, worldX, worldY}

var pointers = new Map();
var gesture = { mode:'none' };
var lpTimer = null;
var ctxMenuInfo = null;      // {x, y, elId}
var cropState = null;        // {id, src, nw, nh, dispScale, rect}
var cropDrag = null;
var idCounter = 0;

var imageCache = new Map();

/* ================= helpers ================= */
function genId(){ return 'el' + (++idCounter) + '_' + Date.now().toString(36); }
function clamp(v, a, b){ return Math.max(a, Math.min(b, v)); }
function dist(a, b){ return Math.hypot(a.x - b.x, a.y - b.y); }
function deepClone(v){ return JSON.parse(JSON.stringify(v)); }
function byId(id){ for (var i = 0; i < elements.length; i++) if (elements[i].id === id) return elements[i]; return null; }
function selectedEls(){ return elements.filter(function(e){ return selectedIds.indexOf(e.id) >= 0; }); }
function singleSel(){ return selectedIds.length === 1 ? byId(selectedIds[0]) : null; }

function worldToScreen(x, y){ return { x: x * scale + panX, y: y * scale + panY }; }
function screenToWorld(x, y){ return { x: (x - panX) / scale, y: (y - panY) / scale }; }

function getImageEl(src){
  var img = imageCache.get(src);
  if (!img) {
    img = new Image();
    img.onload = render;
    img.src = src;
    imageCache.set(src, img);
  }
  return img;
}

function rotatePt(p, c, a){
  var dx = p.x - c.x, dy = p.y - c.y;
  var cs = Math.cos(a), sn = Math.sin(a);
  return { x: c.x + dx * cs - dy * sn, y: c.y + dx * sn + dy * cs };
}

/* ================= bbox / hit ================= */
function getBBox(el){
  if (el.type === 'rect' || el.type === 'ellipse' || el.type === 'text' || el.type === 'image') return { x: el.x, y: el.y, w: el.w, h: el.h };
  if (el.type === 'line' || el.type === 'arrow') return { x: Math.min(el.x1, el.x2), y: Math.min(el.y1, el.y2), w: Math.abs(el.x2 - el.x1) || 1, h: Math.abs(el.y2 - el.y1) || 1 };
  var minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  el.points.forEach(function(p){ minX = Math.min(minX, p.x); minY = Math.min(minY, p.y); maxX = Math.max(maxX, p.x); maxY = Math.max(maxY, p.y); });
  return { x: minX, y: minY, w: Math.max(1, maxX - minX), h: Math.max(1, maxY - minY) };
}
function getGroupBBox(list){
  var minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  list.forEach(function(el){
    var b = getBBox(el);
    minX = Math.min(minX, b.x); minY = Math.min(minY, b.y);
    maxX = Math.max(maxX, b.x + b.w); maxY = Math.max(maxY, b.y + b.h);
  });
  return { x: minX, y: minY, w: Math.max(1, maxX - minX), h: Math.max(1, maxY - minY) };
}
function distToSeg(p, a, b){
  var dx = b.x - a.x, dy = b.y - a.y;
  var l2 = dx * dx + dy * dy;
  var t = l2 === 0 ? 0 : clamp(((p.x - a.x) * dx + (p.y - a.y) * dy) / l2, 0, 1);
  return Math.hypot(p.x - (a.x + t * dx), p.y - (a.y + t * dy));
}
function hitTest(world){
  var pad = 8 / scale;
  for (var i = elements.length - 1; i >= 0; i--){
    var el = elements[i];
    if (el.type === 'line' || el.type === 'arrow'){
      if (distToSeg(world, {x:el.x1,y:el.y1}, {x:el.x2,y:el.y2}) <= pad) return el;
    } else if (el.type === 'freehand'){
      for (var j = 0; j < el.points.length - 1; j++){
        if (distToSeg(world, el.points[j], el.points[j+1]) <= pad) return el;
      }
    } else {
      var b = getBBox(el);
      if (world.x >= b.x - pad && world.x <= b.x + b.w + pad && world.y >= b.y - pad && world.y <= b.y + b.h + pad) return el;
    }
  }
  return null;
}
function hitTestMarquee(m){
  var x1 = Math.min(m.x1, m.x2), y1 = Math.min(m.y1, m.y2);
  var x2 = Math.max(m.x1, m.x2), y2 = Math.max(m.y1, m.y2);
  return elements.filter(function(el){
    var b = getBBox(el);
    return !(b.x + b.w < x1 || b.x > x2 || b.y + b.h < y1 || b.y > y2);
  }).map(function(el){ return el.id; });
}

var ROT_OFFSET = 38;   // 回転ハンドルまでの距離（世界px）
var ROT_HIT = 26;      // 回転ハンドルのヒット半径（世界px）
function rotHandlePos(el){
  var b = getBBox(el);
  return { x: b.x + b.w / 2, y: b.y - ROT_OFFSET / scale };
}
function getHandle(el, world){
  if (dist(world, rotHandlePos(el)) < ROT_HIT / scale) return { id: 'rotate' };
  var b = getBBox(el);
  if (el.type === 'line' || el.type === 'arrow'){
    // 直線・矢印は端点のみをハンドルとして扱う
    var eps = [ { id:'p1', x:el.x1, y:el.y1 }, { id:'p2', x:el.x2, y:el.y2 } ];
    for (var j = 0; j < eps.length; j++) if (dist(world, eps[j]) < 18 / scale) return eps[j];
    return null;
  }
  var corners = [
    { id:'nw', x:b.x, y:b.y }, { id:'ne', x:b.x+b.w, y:b.y },
    { id:'sw', x:b.x, y:b.y+b.h }, { id:'se', x:b.x+b.w, y:b.y+b.h }
  ];
  for (var i = 0; i < corners.length; i++){
    if (el.type === 'freehand') continue;
    if (dist(world, corners[i]) < 14 / scale) return corners[i];
  }
  return null;
}
function getGroupHandle(world){
  if (selectedIds.length < 2) return null;
  var b = getGroupBBox(selectedEls());
  var rc = { x: b.x + b.w/2, y: b.y - ROT_OFFSET/scale };
  if (dist(world, rc) < ROT_HIT / scale) return { id: 'rotate' };
  var corners = [
    { id:'nw', x:b.x, y:b.y }, { id:'ne', x:b.x+b.w, y:b.y },
    { id:'sw', x:b.x, y:b.y+b.h }, { id:'se', x:b.x+b.w, y:b.y+b.h }
  ];
  for (var i = 0; i < corners.length; i++) if (dist(world, corners[i]) < 14 / scale) return corners[i];
  return null;
}
function normRect(x1, y1, x2, y2){ return { x: Math.min(x1,x2), y: Math.min(y1,y2), w: Math.abs(x2-x1), h: Math.abs(y2-y1) }; }

/* ================= history / local persistence ================= */
function snapshot(){ return deepClone(elements); }
/* 元のバージョンと同じ保存場所（localStorage キー 'freeboard-data'、形式 { elements: [...] }） */
function saveToLocalStorage(){
  try { localStorage.setItem('freeboard-data', JSON.stringify({ elements: elements })); }
  catch (e) { /* 容量不足・非対応環境は無視 */ }
}
function loadFromLocalStorage(){
  try {
    var raw = localStorage.getItem('freeboard-data');
    if (raw){
      var data = JSON.parse(raw);
      if (data && Array.isArray(data.elements)) elements = data.elements;
    }
  } catch (e) { /* 壊れたデータは無視 */ }
}
function commitState(next, sel){
  elements = next;
  selectedIds = sel || selectedIds;
  history = history.slice(0, historyIndex + 1);
  history.push(snapshot());
  if (history.length > 100) history.shift();
  historyIndex = history.length - 1;
  saveToLocalStorage();
  updateUI();
  render();
}
function undo(){
  if (historyIndex <= 0) return;
  historyIndex--;
  elements = deepClone(history[historyIndex]);
  selectedIds = [];
  saveToLocalStorage();
  updateUI(); render();
}
function redo(){
  if (historyIndex >= history.length - 1) return;
  historyIndex++;
  elements = deepClone(history[historyIndex]);
  selectedIds = [];
  saveToLocalStorage();
  updateUI(); render();
}

/* ================= drawing ================= */
function drawElement(c, el){
  c.save();
  c.lineJoin = 'round'; c.lineCap = 'round';
  if (el.type === 'rect' || el.type === 'ellipse' || el.type === 'text' || el.type === 'image'){
    var cx = el.x + el.w / 2, cy = el.y + el.h / 2;
    var rot = el.rotation || 0;
    c.translate(cx, cy); c.rotate(rot); c.translate(-cx, -cy);
  }
  if (el.type === 'rect'){
    if (el.fill){ c.fillStyle = el.fillColor || el.color; c.fillRect(el.x, el.y, el.w, el.h); }
    if (el.strokeWidth > 0){ c.strokeStyle = el.color; c.lineWidth = el.strokeWidth; c.strokeRect(el.x, el.y, el.w, el.h); }
  } else if (el.type === 'ellipse'){
    c.beginPath();
    c.ellipse(el.x + el.w/2, el.y + el.h/2, Math.abs(el.w/2), Math.abs(el.h/2), 0, 0, Math.PI*2);
    if (el.fill){ c.fillStyle = el.fillColor || el.color; c.fill(); }
    if (el.strokeWidth > 0){ c.strokeStyle = el.color; c.lineWidth = el.strokeWidth; c.stroke(); }
  } else if (el.type === 'line' || el.type === 'arrow'){
    c.strokeStyle = el.color; c.lineWidth = el.strokeWidth;
    c.beginPath(); c.moveTo(el.x1, el.y1); c.lineTo(el.x2, el.y2); c.stroke();
    if (el.type === 'arrow'){
      var ang = Math.atan2(el.y2 - el.y1, el.x2 - el.x1);
      var hl = 10 + el.strokeWidth * 1.5;
      c.fillStyle = el.color;
      c.beginPath();
      c.moveTo(el.x2, el.y2);
      c.lineTo(el.x2 - hl * Math.cos(ang - Math.PI/6), el.y2 - hl * Math.sin(ang - Math.PI/6));
      c.lineTo(el.x2 - hl * Math.cos(ang + Math.PI/6), el.y2 - hl * Math.sin(ang + Math.PI/6));
      c.closePath(); c.fill();
    }
  } else if (el.type === 'text'){
    c.fillStyle = el.color;
    c.font = el.fontSize + "px 'Segoe UI','Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif";
    c.textBaseline = 'top';
    el.text.split('\n').forEach(function(line, i){ c.fillText(line, el.x, el.y + i * el.fontSize * 1.3); });
  } else if (el.type === 'freehand'){
    c.strokeStyle = el.color; c.lineWidth = el.strokeWidth;
    c.beginPath();
    el.points.forEach(function(p, i){ if (i === 0) c.moveTo(p.x, p.y); else c.lineTo(p.x, p.y); });
    c.stroke();
  } else if (el.type === 'image'){
    var img = imageCache.get(el.src);
    if (img && img.complete && img.naturalWidth > 0){
      c.drawImage(img, el.x, el.y, el.w, el.h);
    } else {
      c.strokeStyle = '#a3a3a3'; c.lineWidth = 1; c.strokeRect(el.x, el.y, el.w, el.h);
    }
  }
  c.restore();
}

function drawHandles(c, box){
  var hs = 10 / scale;
  [[box.x, box.y], [box.x+box.w, box.y], [box.x, box.y+box.h], [box.x+box.w, box.y+box.h]].forEach(function(p){
    c.fillStyle = '#fff'; c.strokeStyle = '#171717'; c.lineWidth = 1.5 / scale;
    c.fillRect(p[0]-hs/2, p[1]-hs/2, hs, hs);
    c.strokeRect(p[0]-hs/2, p[1]-hs/2, hs, hs);
  });
}

function render(){
  var w = canvas.width / dpr, h = canvas.height / dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, w, h);
  ctx.fillStyle = '#fff';
  ctx.fillRect(0, 0, w, h);
  // グリッド
  // 倍率に応じてグリッド間隔を自動調整（1%〜1000%でも見やすく）
  var gridWorld = 32;
  while (gridWorld * scale < 14) gridWorld *= 5;
  while (gridWorld * scale > 160) gridWorld /= 5;
  var sp = gridWorld * scale;
  if (sp >= 14 && sp <= 400){
    var ox = panX % sp; if (ox < 0) ox += sp;
    var oy = panY % sp; if (oy < 0) oy += sp;
    ctx.fillStyle = '#e5e5e5';
    for (var gx = ox; gx < w; gx += sp) for (var gy = oy; gy < h; gy += sp){
      ctx.beginPath(); ctx.arc(gx, gy, 1.2, 0, Math.PI*2); ctx.fill();
    }
  }

  ctx.save();
  ctx.translate(panX, panY);
  ctx.scale(scale, scale);
  // 編集中のテキストはテキストボックス側で表示するため、キャンバスには描かない（二重表示の防止）
  var editingId = (editing && editing.id) ? editing.id : null;
  elements.forEach(function(el){ if (el.id !== editingId) drawElement(ctx, el); });
  if (draft) drawElement(ctx, draft);

  // 選択枠
  var sel = selectedEls();
  var i, el, b;
  if (sel.length > 1){
    b = getGroupBBox(sel);
    ctx.save();
    ctx.strokeStyle = '#171717'; ctx.lineWidth = 1 / scale;
    ctx.setLineDash([6/scale, 4/scale]);
    ctx.strokeRect(b.x, b.y, b.w, b.h);
    ctx.setLineDash([]);
    drawHandles(ctx, b);
    // 複数選択用の回転ハンドル
    var rcm = { x: b.x + b.w/2, y: b.y - ROT_OFFSET/scale };
    ctx.beginPath();
    ctx.moveTo(b.x + b.w/2, b.y);
    ctx.lineTo(rcm.x, rcm.y + 12/scale);
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(rcm.x, rcm.y, 12/scale, 0, Math.PI*2);
    ctx.fillStyle = '#fff'; ctx.fill();
    ctx.lineWidth = 2/scale; ctx.stroke();
    ctx.restore();
  } else if (sel.length === 1){
    el = sel[0];
    b = getBBox(el);
    ctx.save();
    ctx.strokeStyle = '#171717'; ctx.lineWidth = 1 / scale;
    ctx.setLineDash([6/scale, 4/scale]);
    ctx.strokeRect(b.x, b.y, b.w, b.h);
    ctx.setLineDash([]);
    if (el.type === 'line' || el.type === 'arrow'){
      // 直線・矢印は端点の位置にハンドルを表示（端をドラッグで伸縮）
      var hs3 = 10 / scale;
      [[el.x1, el.y1], [el.x2, el.y2]].forEach(function(p){
        ctx.fillStyle = '#fff'; ctx.strokeStyle = '#171717'; ctx.lineWidth = 1.5 / scale;
        ctx.fillRect(p[0] - hs3/2, p[1] - hs3/2, hs3, hs3);
        ctx.strokeRect(p[0] - hs3/2, p[1] - hs3/2, hs3, hs3);
      });
    } else if (el.type !== 'freehand') drawHandles(ctx, b);
    // 回転ハンドル（大きめ）
    var rc = rotHandlePos(el);
    ctx.beginPath();
    ctx.moveTo(b.x + b.w/2, b.y);
    ctx.lineTo(rc.x, rc.y + 12/scale);
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(rc.x, rc.y, 12/scale, 0, Math.PI*2);
    ctx.fillStyle = '#fff'; ctx.fill();
    ctx.lineWidth = 2/scale; ctx.stroke();
    // 回転アイコン
    ctx.beginPath();
    ctx.arc(rc.x, rc.y, 6/scale, -Math.PI*0.2, Math.PI*1.2);
    ctx.lineWidth = 1.6/scale; ctx.stroke();
    ctx.restore();
  }

  // 矩形選択中
  if (marquee){
    var mx = Math.min(marquee.x1, marquee.x2), my = Math.min(marquee.y1, marquee.y2);
    var mw = Math.abs(marquee.x2 - marquee.x1), mh = Math.abs(marquee.y2 - marquee.y1);
    ctx.save();
    ctx.fillStyle = 'rgba(23,23,23,0.07)';
    ctx.fillRect(mx, my, mw, mh);
    ctx.strokeStyle = '#171717'; ctx.lineWidth = 1/scale;
    ctx.setLineDash([4/scale, 3/scale]);
    ctx.strokeRect(mx, my, mw, mh);
    ctx.restore();
  }
  ctx.restore();

  // HTMLオーバーレイ更新
  var zp = scale * 100;
  zoomLabel.textContent = (zp < 10 ? zp.toFixed(1) : Math.round(zp)) + '%';
  hintEl.style.display = elements.length === 0 && !draft ? 'block' : 'none';
  updateSizePanel();
  updateDimInputs();
}

/* ================= size panel（図形押下時の縦横表示・その場編集） ================= */
function updateSizePanel(){
  var single = singleSel();
  if (!single){ sizePanel.style.display = 'none'; sizePanelLine.style.display = 'none'; return; }
  var b = getBBox(single);
  var s = worldToScreen(b.x + b.w/2, b.y + b.h + 14/scale);
  var isLine = single.type === 'line' || single.type === 'arrow';
  sizePanel.style.display = isLine ? 'none' : 'flex';
  sizePanelLine.style.display = isLine ? 'flex' : 'none';
  if (isLine){
    sizePanelLine.style.left = s.x + 'px';
    sizePanelLine.style.top = s.y + 'px';
    if (document.activeElement !== spL) spL.value = Math.round(Math.hypot(single.x2 - single.x1, single.y2 - single.y1));
  } else {
    sizePanel.style.left = s.x + 'px';
    sizePanel.style.top = s.y + 'px';
    if (document.activeElement !== spW) spW.value = Math.round(single.w);
    if (document.activeElement !== spH) spH.value = Math.round(single.h);
  }
}
function commitDims(){ commitState(deepClone(elements), selectedIds.slice()); }
spW.addEventListener('change', function(){
  var single = singleSel();
  if (!single || single.type === 'line' || single.type === 'arrow') return;
  var v = parseFloat(spW.value);
  if (isNaN(v) || v <= 0){ render(); return; }
  var k = v / single.w;
  if (single.type === 'image' || single.type === 'text') single.h = single.h * k;
  if (single.type === 'text') single.fontSize = clamp((single.fontSize || 20) * k, 4, 2000);
  single.w = v;
  commitDims();
});
spH.addEventListener('change', function(){
  var single = singleSel();
  if (!single || single.type === 'line' || single.type === 'arrow') return;
  var v = parseFloat(spH.value);
  if (isNaN(v) || v <= 0){ render(); return; }
  var k = v / single.h;
  if (single.type === 'image' || single.type === 'text') single.w = single.w * k;
  if (single.type === 'text') single.fontSize = clamp((single.fontSize || 20) * k, 4, 2000);
  single.h = v;
  commitDims();
});
spL.addEventListener('change', function(){
  var single = singleSel();
  if (!single || (single.type !== 'line' && single.type !== 'arrow')) return;
  var v = parseFloat(spL.value);
  if (isNaN(v) || v <= 0){ render(); return; }
  var cur = Math.hypot(single.x2 - single.x1, single.y2 - single.y1);
  if (cur <= 0) return;
  var k = v / cur;
  single.x2 = single.x1 + (single.x2 - single.x1) * k;
  single.y2 = single.y1 + (single.y2 - single.y1) * k;
  commitDims();
});
[spW, spH, spL].forEach(function(inp){
  inp.addEventListener('keydown', function(e){
    if (e.key === 'Enter' || e.key === 'Escape') inp.blur();
  });
});

/* ================= dimension inputs ================= */
function elementAngle(el){
  if (el.type === 'line' || el.type === 'arrow') return Math.atan2(el.y2 - el.y1, el.x2 - el.x1);
  return el.rotation || 0;
}
function updateDimInputs(){
  var sel = selectedEls();
  dimGroup.style.display = sel.length ? 'flex' : 'none';
  if (sel.length && document.activeElement !== dimRot)
    dimRot.value = Math.round(elementAngle(sel[0]) * 180 / Math.PI);
}
function applyRot(deg){
  var sel = selectedEls();
  if (!sel.length) return;
  var target = deg * Math.PI / 180;
  if (sel.length === 1){
    var single = sel[0];
    var base = single.rotation || 0;
    if (single.type === 'line' || single.type === 'freehand'){
      var b = getBBox(single);
      var c = { x: b.x + b.w/2, y: b.y + b.h/2 };
      var d = target - base;
      if (single.type === 'line'){
        var p1 = rotatePt({x:single.x1, y:single.y1}, c, d);
        var p2 = rotatePt({x:single.x2, y:single.y2}, c, d);
        single.x1 = p1.x; single.y1 = p1.y; single.x2 = p2.x; single.y2 = p2.y;
      } else {
        single.points = single.points.map(function(p){ return rotatePt(p, c, d); });
      }
    } else {
      single.rotation = target;
    }
    commitState(deepClone(elements), selectedIds.slice());
    return;
  }
  // 複数選択：グループ全体を同じ角度へ回転（先頭の要素の角度が入力値になる）
  var gbox = getGroupBBox(sel);
  var gc = { x: gbox.x + gbox.w/2, y: gbox.y + gbox.h/2 };
  var delta = target - elementAngle(sel[0]);
  sel.forEach(function(el){ rotateElInPlace(el, el, gc, delta); });
  commitState(deepClone(elements), selectedIds.slice());
}
dimRot.addEventListener('change', function(){ applyRot(parseFloat(dimRot.value) || 0); });

/* ================= UI update ================= */
function updateUI(){
  var btns = document.querySelectorAll('.tbtn[data-tool]');
  for (var i = 0; i < btns.length; i++){
    btns[i].classList.toggle('active', btns[i].getAttribute('data-tool') === tool);
  }
  var sws = document.querySelectorAll('.swatch');
  for (var j = 0; j < sws.length; j++) sws[j].classList.toggle('selected', sws[j].dataset.c === color);
  var single = singleSel();
  document.getElementById('btnFill').classList.toggle('active', single && (single.type === 'rect' || single.type === 'ellipse') && single.fill ? true : fillEnabled);
  document.getElementById('btnLock').classList.toggle('active', !!(single && single.lockAspect));
  document.getElementById('btnLock').disabled = !selectedEls().some(function(e){ return e.type === 'rect' || e.type === 'ellipse'; });
  syncToolFromSelection();
  canvas.style.cursor = tool === 'pan' ? 'grab' : (tool === 'select' ? 'default' : 'crosshair');
}
/* 選択された図形の色・太さをツールバーへ同期 */
function syncToolFromSelection(){
  var sel = selectedEls();
  if (!sel.length) return;
  var el = sel[sel.length - 1];
  if ('color' in el){
    color = el.color;
    document.getElementById('colorCustom').value = color;
  }
  if ('strokeWidth' in el){
    strokeWidth = el.strokeWidth;
    strokeNumber.value = strokeWidth;
    strokeRange.value = Math.min(strokeWidth, 24);
  }
}
function setTool(t){
  closeEditor(true);
  tool = t;
  updateUI(); render();
}
document.querySelectorAll('.tbtn[data-tool]').forEach(function(btn){
  btn.addEventListener('click', function(){ setTool(btn.getAttribute('data-tool')); });
});

/* swatches */
var swWrap = document.getElementById('swatches');
SWATCHES.forEach(function(c){
  var b = document.createElement('button');
  b.className = 'swatch';
  b.style.background = c;
  b.dataset.c = c;
  b.title = c;
  b.addEventListener('click', function(){
    color = c;
    document.getElementById('colorCustom').value = c;
    applyColorToSelection();
    updateUI();
  });
  swWrap.appendChild(b);
});
function applyColorToSelection(){
  var els = selectedEls();
  var changed = false;
  els.forEach(function(el){ if ('color' in el){ el.color = color; changed = true; } });
  if (changed) commitState(deepClone(elements), selectedIds.slice());
  else render();
}
document.getElementById('colorCustom').addEventListener('input', function(e){
  color = e.target.value;
  applyColorToSelection();
  updateUI();
});

var strokeNumber = document.getElementById('strokeNumber');
var strokeRange = document.getElementById('strokeRange');
function setStrokeWidth(v){
  strokeWidth = clamp(Math.round(v), 0, 48);
  strokeNumber.value = strokeWidth;
  strokeRange.value = Math.min(strokeWidth, 24);
  selectedEls().forEach(function(el){ if ('strokeWidth' in el) el.strokeWidth = strokeWidth; });
  render();
}
strokeNumber.addEventListener('change', function(){ setStrokeWidth(strokeNumber.value); commitState(deepClone(elements), selectedIds.slice()); });
strokeRange.addEventListener('input', function(){ setStrokeWidth(strokeRange.value); });
strokeRange.addEventListener('change', function(){ commitState(deepClone(elements), selectedIds.slice()); });

document.getElementById('btnFill').addEventListener('click', function(){
  var els = selectedEls().filter(function(e){ return e.type === 'rect' || e.type === 'ellipse'; });
  if (els.length){
    els.forEach(function(el){ el.fill = !el.fill; if (el.fill && !el.fillColor) el.fillColor = fillColor; });
    commitState(deepClone(elements), selectedIds.slice());
  } else {
    fillEnabled = !fillEnabled;
  }
  updateUI(); render();
});
document.getElementById('fillColor').addEventListener('change', function(e){
  fillColor = e.target.value;
  selectedEls().filter(function(x){ return x.type === 'rect' || x.type === 'ellipse'; }).forEach(function(el){ el.fillColor = fillColor; });
  commitState(deepClone(elements), selectedIds.slice());
});
document.getElementById('btnLock').addEventListener('click', function(){
  var single = singleSel();
  if (!single) return;
  if (single.type !== 'rect' && single.type !== 'ellipse') return;
  single.lockAspect = !single.lockAspect;
  commitState(deepClone(elements), selectedIds.slice());
});

/* ================= text editor ================= */
function textUnits(text){
  var lines = text.split('\n');
  var m = 1;
  lines.forEach(function(line){
    var u = 0;
    for (var i = 0; i < line.length; i++){
      var code = line.charCodeAt(i);
      var wide = (code >= 0x2e80 && code <= 0xa4cf) || (code >= 0xac00 && code <= 0xd7a3) ||
        (code >= 0xf900 && code <= 0xfaff) || (code >= 0xff00 && code <= 0xffef) ||
        (code >= 0x1100 && code <= 0x115f) || (code >= 0x20000 && code <= 0x3fffd);
      u += wide ? 1 : 0.55;
    }
    m = Math.max(m, u);
  });
  return m;
}
function textFontFor(text){
  var u = textUnits(text || 'あ');
  return clamp(20 * Math.pow(u / 4, 0.6), 20, 180);
}
/* 現在の編集フォントサイズ（世界px）。既存要素の編集時はその大きさを保持する */
var editFontSize = 20;
function autoGrowEditor(){
  textEditor.style.width = 'auto';
  textEditor.style.height = 'auto';
  textEditor.style.width = Math.max(20, textEditor.scrollWidth + 2) + 'px';
  textEditor.style.height = Math.max(editFontSize * 1.3 * scale, textEditor.scrollHeight) + 'px';
}
function applyEditorFont(){
  textEditor.style.fontSize = (editFontSize * scale) + 'px';
  autoGrowEditor();
}
function openEditor(screenPos, world, el){
  closeEditor(true);
  editFontSize = (el && el.fontSize) ? el.fontSize : textFontFor('あ');
  textEditor.style.display = 'block';
  textEditor.style.left = screenPos.x + 'px';
  textEditor.style.top = screenPos.y + 'px';
  textEditor.style.color = el ? el.color : color;
  textEditor.value = el ? el.text : '';
  editing = el ? { id: el.id, worldX: el.x, worldY: el.y } : { id: null, worldX: world.x, worldY: world.y };
  applyEditorFont();
  render(); // 編集対象をキャンバスから隠して二重表示を防ぐ
  setTimeout(function(){ textEditor.focus(); }, 0);
}
textEditor.addEventListener('input', function(){
  // 新規入力のみ、テキストボックスが広がるのに合わせて文字も大きくする
  if (editing && !editing.id) editFontSize = textFontFor(textEditor.value);
  applyEditorFont();
});
function closeEditor(commit){
  if (textEditor.style.display === 'none') return;
  textEditor.style.display = 'none';
  var prevEditing = editing;
  editing = null;
  if (commit && prevEditing){
    var text = textEditor.value.replace(/\s+$/, '');
    if (!text){
      if (prevEditing.id){
        // 編集していたテキストを空にした → 削除しない（元のまま）
      }
      if (tool === 'text') setTool('select');
      render();
      return;
    }
    // 編集中に使っていたフォントサイズをそのまま確定（見た目のズレを防ぐ）
    var fs = editFontSize;
    ctx.save();
    ctx.font = fs + "px 'Segoe UI','Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif";
    var lines = text.split('\n');
    var w = fs;
    lines.forEach(function(line){ w = Math.max(w, ctx.measureText(line).width); });
    ctx.restore();
    var h = fs * 1.3 * lines.length;
    if (prevEditing.id){
      var el = byId(prevEditing.id);
      if (el && el.type === 'text'){ el.text = text; el.w = w; el.h = h; el.fontSize = fs; }
    } else {
      var ne = { id: genId(), type: 'text', x: prevEditing.worldX, y: prevEditing.worldY, w: w, h: h, text: text, color: color, strokeWidth: 0, fontSize: fs, rotation: 0 };
      elements.push(ne);
      selectedIds = [ne.id];
    }
    commitState(deepClone(elements), selectedIds.slice());
    if (tool === 'text') setTool('select');
    return;
  }
  textEditor.value = '';
  if (tool === 'text') setTool('select');
  render();
}
textEditor.addEventListener('keydown', function(e){
  e.stopPropagation();
  if (e.key === 'Escape'){ textEditor.value = ''; textEditor.blur(); }
});
textEditor.addEventListener('blur', function(){ closeEditor(true); });

/* ================= images ================= */
document.getElementById('imgInput').addEventListener('change', function(e){
  var f = e.target.files && e.target.files[0];
  if (!f) return;
  e.target.value = '';
  showProgress('画像を読み込み中…');
  var reader = new FileReader();
  reader.onprogress = function(ev){ if (ev.lengthComputable) setProgress(clamp(ev.loaded / ev.total * 80, 2, 80)); };
  reader.onload = function(){
    setProgress(88);
    var src = reader.result;
    var img = getImageEl(src);
    var add = function(){
      var rect = wrap.getBoundingClientRect();
      var center = screenToWorld(rect.width / 2, rect.height / 2);
      var w = img.naturalWidth, h = img.naturalHeight;
      var maxDim = 400 / scale;
      var s = Math.min(maxDim / w, maxDim / h, 1);
      w *= s; h *= s;
      var el = { id: genId(), type: 'image', x: center.x - w/2, y: center.y - h/2, w: w, h: h, src: src, color: '#171717', strokeWidth: 0, lockAspect: true };
      elements.push(el);
      selectedIds = [el.id];
      commitState(deepClone(elements), selectedIds.slice());
      setProgress(100);
      setTimeout(hideProgress, 300);
    };
    if (img.complete && img.naturalWidth > 0) add();
    else img.onload = add;
  };
  reader.onerror = function(){ hideProgress(); toast('画像を読み込めませんでした。'); };
  reader.readAsDataURL(f);
});

/* ================= crop ================= */
function openCrop(el){
  if (el.type !== 'image') return;
  var img = getImageEl(el.src);
  var nw = img.naturalWidth || Math.round(el.w);
  var nh = img.naturalHeight || Math.round(el.h);
  cropState = { id: el.id, src: el.src, nw: nw, nh: nh, dispScale: 1, rect: { x: 0, y: 0, w: nw, h: nh } };
  cropImg.src = el.src;
  layoutCrop();
  cropModal.style.display = 'flex';
}
function layoutCrop(){
  if (!cropState) return;
  var c = cropState;
  var maxW = Math.min(window.innerWidth - 48, 560);
  var maxH = Math.min(window.innerHeight - 200, 420);
  c.dispScale = Math.min(maxW / c.nw, maxH / c.nh, 1);
  cropStage.style.width = (c.nw * c.dispScale) + 'px';
  cropStage.style.height = (c.nh * c.dispScale) + 'px';
  drawCropRect();
}
function drawCropRect(){
  if (!cropState) return;
  var c = cropState, d = c.dispScale, r = c.rect;
  cropBox.style.left = (r.x * d) + 'px';
  cropBox.style.top = (r.y * d) + 'px';
  cropBox.style.width = (r.w * d) + 'px';
  cropBox.style.height = (r.h * d) + 'px';
  var H = 16;
  var corners = {
    chNW: { x: r.x * d - H/2, y: r.y * d - H/2 },
    chNE: { x: (r.x + r.w) * d - H/2, y: r.y * d - H/2 },
    chSW: { x: r.x * d - H/2, y: (r.y + r.h) * d - H/2 },
    chSE: { x: (r.x + r.w) * d - H/2, y: (r.y + r.h) * d - H/2 }
  };
  for (var k in corners){
    document.getElementById(k).style.left = corners[k].x + 'px';
    document.getElementById(k).style.top = corners[k].y + 'px';
  }
  cropSizeEl.textContent = Math.round(r.w) + ' × ' + Math.round(r.h) + ' px';
}
function startCropDrag(mode){
  return function(e){
    e.preventDefault(); e.stopPropagation();
    cropDrag = { mode: mode, sx: e.clientX, sy: e.clientY, rect: deepClone(cropState.rect) };
  };
}
cropBox.addEventListener('pointerdown', startCropDrag('move'));
document.getElementById('chNW').addEventListener('pointerdown', startCropDrag('nw'));
document.getElementById('chNE').addEventListener('pointerdown', startCropDrag('ne'));
document.getElementById('chSW').addEventListener('pointerdown', startCropDrag('sw'));
document.getElementById('chSE').addEventListener('pointerdown', startCropDrag('se'));
window.addEventListener('pointermove', function(e){
  if (!cropDrag || !cropState) return;
  var d = cropState.dispScale;
  var dxN = (e.clientX - cropDrag.sx) / d;
  var dyN = (e.clientY - cropDrag.sy) / d;
  var r = deepClone(cropDrag.rect);
  var c = cropState;
  if (cropDrag.mode === 'move'){
    r.x = clamp(r.x + dxN, 0, c.nw - r.w);
    r.y = clamp(r.y + dyN, 0, c.nh - r.h);
  } else {
    if (cropDrag.mode.indexOf('e') >= 0) r.w = clamp(cropDrag.rect.w + dxN, 10, c.nw - cropDrag.rect.x);
    if (cropDrag.mode.indexOf('s') >= 0) r.h = clamp(cropDrag.rect.h + dyN, 10, c.nh - cropDrag.rect.y);
    if (cropDrag.mode.indexOf('w') >= 0){
      var nx = clamp(cropDrag.rect.x + dxN, 0, cropDrag.rect.x + cropDrag.rect.w - 10);
      r.w = cropDrag.rect.x + cropDrag.rect.w - nx;
      r.x = nx;
    }
    if (cropDrag.mode.indexOf('n') >= 0){
      var ny = clamp(cropDrag.rect.y + dyN, 0, cropDrag.rect.y + cropDrag.rect.h - 10);
      r.h = cropDrag.rect.y + cropDrag.rect.h - ny;
      r.y = ny;
    }
  }
  cropState.rect = r;
  drawCropRect();
});
window.addEventListener('pointerup', function(){ cropDrag = null; });
function closeCrop(){ cropModal.style.display = 'none'; cropState = null; cropDrag = null; }
document.getElementById('cropCancel').addEventListener('click', closeCrop);
cropModal.addEventListener('pointerdown', function(e){ if (e.target === cropModal) closeCrop(); });
document.getElementById('cropOk').addEventListener('click', function(){
  if (!cropState) return;
  showProgress('画像を切り抜き中…');
  nextTick(function(){
    var img = getImageEl(cropState.src);
    if (!img.complete || img.naturalWidth === 0){ hideProgress(); return; }
    var el = byId(cropState.id);
    if (!el || el.type !== 'image'){ hideProgress(); closeCrop(); return; }
    var nw = img.naturalWidth, nh = img.naturalHeight;
    var rc = cropState.rect;
    var out = document.createElement('canvas');
    out.width = Math.max(1, Math.round(rc.w));
    out.height = Math.max(1, Math.round(rc.h));
    var oc = out.getContext('2d');
    oc.drawImage(img, rc.x, rc.y, rc.w, rc.h, 0, 0, out.width, out.height);
    setProgress(55);
    nextTick(function(){
      var src = out.toDataURL('image/png');
      el.src = src;
      el.x = el.x + (rc.x / nw) * el.w;
      el.y = el.y + (rc.y / nh) * el.h;
      el.w = (rc.w / nw) * el.w;
      el.h = (rc.h / nh) * el.h;
      commitState(deepClone(elements), selectedIds.slice());
      closeCrop();
      setProgress(100);
      setTimeout(hideProgress, 300);
    });
  });
});

/* ================= context menu ================= */
function showContextMenu(x, y, elId){
  var el = byId(elId);
  if (!el) return;
  ctxMenuInfo = { x: x, y: y, elId: elId };
  var html = '';
  if (el.type === 'image') html += '<button data-a="crop">画像を切り抜く</button>';
  html += '<button data-a="dup">複製</button>';
  html += '<button data-a="del" class="danger">削除</button>';
  ctxMenuEl.innerHTML = html;
  ctxMenuEl.style.display = 'block';
  var vw = window.innerWidth, vh = window.innerHeight;
  var left = Math.min(x, vw - 190), top = Math.min(y, vh - 150);
  ctxMenuEl.style.left = Math.max(4, left) + 'px';
  ctxMenuEl.style.top = Math.max(4, top) + 'px';
}
function hideContextMenu(){ ctxMenuEl.style.display = 'none'; ctxMenuInfo = null; }
ctxMenuEl.addEventListener('click', function(e){
  var btn = e.target.closest('button');
  if (!btn) return;
  var a = btn.getAttribute('data-a');
  var id = ctxMenuInfo ? ctxMenuInfo.elId : null;
  hideContextMenu();
  if (a === 'crop'){ var el = byId(id); if (el) openCrop(el); }
  else if (a === 'dup'){
    var src = byId(id); if (!src) return;
    var c = deepClone(src);
    c.id = genId();
    var off = 24 / scale;
    if (c.type === 'rect' || c.type === 'ellipse' || c.type === 'text' || c.type === 'image'){ c.x += off; c.y += off; }
    else if (c.type === 'line' || c.type === 'arrow'){ c.x1 += off; c.y1 += off; c.x2 += off; c.y2 += off; }
    else c.points = c.points.map(function(p){ return { x: p.x + off, y: p.y + off }; });
    elements.push(c);
    selectedIds = [c.id];
    commitState(deepClone(elements), selectedIds.slice());
  }
  else if (a === 'del'){
    var delId = id;
    elements = elements.filter(function(x){ return x.id !== delId; });
    selectedIds = selectedIds.filter(function(x){ return x !== delId; });
    commitState(deepClone(elements), selectedIds.slice());
  }
});
document.addEventListener('pointerdown', function(e){
  if (ctxMenuEl.style.display === 'block' && !ctxMenuEl.contains(e.target)) hideContextMenu();
});

/* ================= element edit ops ================= */
function moveEl(el, snap, dx, dy){
  if (el.type === 'rect' || el.type === 'ellipse' || el.type === 'text' || el.type === 'image'){ el.x = snap.x + dx; el.y = snap.y + dy; }
  else if (el.type === 'line' || el.type === 'arrow'){ el.x1 = snap.x1 + dx; el.y1 = snap.y1 + dy; el.x2 = snap.x2 + dx; el.y2 = snap.y2 + dy; }
  else el.points = snap.points.map(function(p){ return { x: p.x + dx, y: p.y + dy }; });
}
function rotateElInPlace(el, base, c, d){
  if (el.type === 'rect' || el.type === 'ellipse' || el.type === 'text' || el.type === 'image'){
    el.rotation = (base.rotation || 0) + d;
  } else if (el.type === 'line' || el.type === 'arrow'){
    var p1 = rotatePt({x: base.x1, y: base.y1}, c, d);
    var p2 = rotatePt({x: base.x2, y: base.y2}, c, d);
    el.x1 = p1.x; el.y1 = p1.y; el.x2 = p2.x; el.y2 = p2.y;
  } else if (el.type === 'freehand'){
    el.points = base.points.map(function(p){ return rotatePt(p, c, d); });
  }
}

/* ================= pointer handling ================= */
function pointerPos(e){
  var r = canvas.getBoundingClientRect();
  return { x: e.clientX - r.left, y: e.clientY - r.top };
}

function createDraftElement(t, p){
  if (t === 'rect' || t === 'ellipse') return { id: genId(), type: t, x: p.x, y: p.y, w: 0, h: 0, color: color, strokeWidth: strokeWidth, fill: fillEnabled, fillColor: fillColor, rotation: 0, lockAspect: false };
  if (t === 'line' || t === 'arrow') return { id: genId(), type: t, x1: p.x, y1: p.y, x2: p.x, y2: p.y, color: color, strokeWidth: strokeWidth };
  if (t === 'pen') return { id: genId(), type: 'freehand', points: [p], color: color, strokeWidth: strokeWidth };
  return null;
}
function finalizeDraft(){
  if (!draft) return;
  var ok = true;
  if (draft.type === 'rect' || draft.type === 'ellipse'){
    if (draft.w < 0){ draft.x += draft.w; draft.w = -draft.w; }
    if (draft.h < 0){ draft.y += draft.h; draft.h = -draft.h; }
    if (draft.w < 2 && draft.h < 2) ok = false;
  }
  if ((draft.type === 'line' || draft.type === 'arrow') && Math.hypot(draft.x2 - draft.x1, draft.y2 - draft.y1) < 2) ok = false;
  if (draft.type === 'freehand' && draft.points.length < 2) ok = false;
  if (ok){
    elements.push(draft);
    if (draft.type !== 'freehand') selectedIds = [draft.id];
    commitState(deepClone(elements), selectedIds.slice());
    if (tool !== 'pen') setTool('select');
  }
  draft = null;
}

canvas.addEventListener('pointerdown', function(e){
  canvas.setPointerCapture(e.pointerId);
  var screen = pointerPos(e);
  var world = screenToWorld(screen.x, screen.y);

  if (lpTimer){ clearTimeout(lpTimer); lpTimer = null; }
  hideContextMenu();

  pointers.set(e.pointerId, screen);

  closeEditor(true);

  // 2本指 → ピンチズーム（+移動）
  if (pointers.size === 2){
    var pts = Array.from(pointers.values());
    var c = { x: (pts[0].x + pts[1].x) / 2, y: (pts[0].y + pts[1].y) / 2 };
    var d0 = Math.max(1, Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y));
    gesture = { mode: 'pinch', pinch: { startDist: d0, startScale: scale, startWorld: screenToWorld(c.x, c.y) } };
    draft = null;
    marquee = null;
    render();
    return;
  }
  if (pointers.size > 2) return;

  if (tool === 'text'){
    var th = hitTest(world);
    if (th && th.type === 'text'){
      selectedIds = [th.id];
      updateUI();
      openEditor(worldToScreen(th.x, th.y), world, th);
    } else {
      openEditor(screen, world, null);
    }
    return;
  }

  if (tool === 'eraser'){
    var eh = hitTest(world);
    if (eh){
      var eid = eh.id;
      elements = elements.filter(function(x){ return x.id !== eid; });
      selectedIds = selectedIds.filter(function(x){ return x !== eid; });
      commitState(deepClone(elements), selectedIds.slice());
    }
    return;
  }

  if (tool === 'pan' || e.button === 1){
    gesture = { mode: 'pan', startScreen: screen, panStartX: panX, panStartY: panY };
    canvas.style.cursor = 'grabbing';
    return;
  }

  if (tool === 'select'){
    // 複数選択のグループハンドル
    if (selectedIds.length > 1){
      var gh = getGroupHandle(world);
      if (gh){
        if (gh.id === 'rotate'){
          var gbox0 = getGroupBBox(selectedEls());
          var gc0 = { x: gbox0.x + gbox0.w/2, y: gbox0.y + gbox0.h/2 };
          gesture = { mode: 'rotate', groupRotate: true, center: gc0, initialAngle: Math.atan2(world.y - gc0.y, world.x - gc0.x), snapshot: snapshot() };
        } else {
          gesture = { mode: 'resize', groupResize: true, handle: gh.id, snapshot: snapshot() };
        }
        return;
      }
    }
    var hit = hitTest(world);
    var startLongPress = function(id){
      if (e.pointerType !== 'touch' && e.pointerType !== 'pen') return;
      var sx = screen.x, sy = screen.y;
      lpTimer = setTimeout(function(){
        lpTimer = null;
        var r = canvas.getBoundingClientRect();
        showContextMenu(r.left + sx, r.top + sy, id);
      }, 500);
    };
    if (hit && selectedIds.indexOf(hit.id) >= 0){
      var h = getHandle(hit, world);
      if (h && h.id === 'rotate'){
        var b = getBBox(hit);
        var cc = { x: b.x + b.w/2, y: b.y + b.h/2 };
        gesture = { mode: 'rotate', activeId: hit.id, initialAngle: Math.atan2(world.y - cc.y, world.x - cc.x), center: cc, snapshot: snapshot() };
        return;
      }
      if (h){
        gesture = { mode: 'resize', activeId: hit.id, handle: h.id, snapshot: snapshot() };
        return;
      }
      gesture = { mode: 'move', start: world, startScreen: screen, snapshot: snapshot() };
      startLongPress(hit.id);
      return;
    }
    if (hit){
      selectedIds = [hit.id];
      updateUI();
      gesture = { mode: 'move', start: world, startScreen: screen, snapshot: snapshot() };
      startLongPress(hit.id);
      render();
      return;
    }
    // 空白 → 矩形選択
    marquee = { x1: world.x, y1: world.y, x2: world.x, y2: world.y };
    gesture = { mode: 'marquee' };
    render();
    return;
  }

  // 描画
  gesture = { mode: 'draw', start: world };
  draft = createDraftElement(tool, world);
});

canvas.addEventListener('pointermove', function(e){
  var screen = pointerPos(e);
  var world = screenToWorld(screen.x, screen.y);

  if (pointers.has(e.pointerId)) pointers.set(e.pointerId, screen);

  if (lpTimer && gesture.mode === 'move' && dist(screen, gesture.startScreen) > 10){
    clearTimeout(lpTimer); lpTimer = null;
  }

  if (gesture.mode === 'pinch'){
    if (pointers.size >= 2 && gesture.pinch){
      var pts = Array.from(pointers.values());
      var d = Math.max(1, Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y));
      var c = { x: (pts[0].x + pts[1].x) / 2, y: (pts[0].y + pts[1].y) / 2 };
      var ns = clamp(gesture.pinch.startScale * (d / gesture.pinch.startDist), MIN_SCALE, MAX_SCALE);
      scale = ns;
      panX = c.x - gesture.pinch.startWorld.x * ns;
      panY = c.y - gesture.pinch.startWorld.y * ns;
      render();
    }
    return;
  }

  if (gesture.mode === 'pan'){
    panX = gesture.panStartX + (screen.x - gesture.startScreen.x);
    panY = gesture.panStartY + (screen.y - gesture.startScreen.y);
    render();
    return;
  }

  if (gesture.mode === 'marquee' && marquee){
    if (dist(screen, pointerPos(e)) >= 0){
      marquee.x2 = world.x; marquee.y2 = world.y;
      render();
    }
    return;
  }

  if (gesture.mode === 'draw' && draft){
    if (draft.type === 'rect' || draft.type === 'ellipse'){
      var x2 = world.x, y2 = world.y;
      if (e.shiftKey){
        var ddx = x2 - gesture.start.x, ddy = y2 - gesture.start.y;
        var size = Math.max(Math.abs(ddx), Math.abs(ddy));
        x2 = gesture.start.x + Math.sign(ddx || 1) * size;
        y2 = gesture.start.y + Math.sign(ddy || 1) * size;
      }
      var n = normRect(gesture.start.x, gesture.start.y, x2, y2);
      draft.x = n.x; draft.y = n.y; draft.w = n.w; draft.h = n.h;
    } else if (draft.type === 'line' || draft.type === 'arrow'){
      draft.x2 = world.x; draft.y2 = world.y;
    } else if (draft.type === 'freehand'){
      var last = draft.points[draft.points.length - 1];
      if (!last || dist(last, world) > 1 / scale) draft.points.push({ x: world.x, y: world.y });
    }
    render();
    return;
  }

  if (gesture.mode === 'move' && gesture.snapshot){
    var dx = world.x - gesture.start.x, dy = world.y - gesture.start.y;
    gesture.snapshot.forEach(function(snap){
      if (selectedIds.indexOf(snap.id) < 0) return;
      var el = byId(snap.id);
      if (el) moveEl(el, snap, dx, dy);
    });
    render();
    return;
  }

  if (gesture.mode === 'resize' && gesture.snapshot){
    var i, snap, el;
    if (gesture.groupResize){
      var selList = gesture.snapshot.filter(function(x){ return selectedIds.indexOf(x.id) >= 0; });
      var box = getGroupBBox(selList);
      var gx1 = box.x, gy1 = box.y, gx2 = box.x + box.w, gy2 = box.y + box.h;
      var hd = gesture.handle;
      if (hd === 'nw'){ gx1 = world.x; gy1 = world.y; }
      if (hd === 'ne'){ gx2 = world.x; gy1 = world.y; }
      if (hd === 'sw'){ gx1 = world.x; gy2 = world.y; }
      if (hd === 'se'){ gx2 = world.x; gy2 = world.y; }
      var nn = normRect(gx1, gy1, gx2, gy2);
      // 複数選択は必ず縦横比固定（等倍）
      var s = Math.max(0.01, (nn.w / box.w + nn.h / box.h) / 2);
      var anchor =
        hd === 'nw' ? { x: box.x + box.w, y: box.y + box.h } :
        hd === 'ne' ? { x: box.x, y: box.y + box.h } :
        hd === 'sw' ? { x: box.x + box.w, y: box.y } :
        { x: box.x, y: box.y };
      var newW = box.w * s, newH = box.h * s;
      var bxx = (hd === 'nw' || hd === 'sw') ? anchor.x - newW : anchor.x;
      var byy = (hd === 'nw' || hd === 'ne') ? anchor.y - newH : anchor.y;
      gesture.snapshot.forEach(function(snapEl){
        if (selectedIds.indexOf(snapEl.id) < 0) return;
        var t = byId(snapEl.id);
        if (!t) return;
        if (t.type === 'rect' || t.type === 'ellipse' || t.type === 'text' || t.type === 'image'){
          t.x = bxx + (snapEl.x - box.x) * s;
          t.y = byy + (snapEl.y - box.y) * s;
          t.w = Math.max(1, snapEl.w * s);
          t.h = Math.max(1, snapEl.h * s);
          if (t.type === 'text') t.fontSize = clamp((snapEl.fontSize || 20) * s, 4, 2000);
        } else if (t.type === 'line' || t.type === 'arrow'){
          t.x1 = bxx + (snapEl.x1 - box.x) * s; t.y1 = byy + (snapEl.y1 - box.y) * s;
          t.x2 = bxx + (snapEl.x2 - box.x) * s; t.y2 = byy + (snapEl.y2 - box.y) * s;
        } else if (t.type === 'freehand'){
          t.points = snapEl.points.map(function(p){ return { x: bxx + (p.x - box.x) * s, y: byy + (p.y - box.y) * s }; });
        }
      });
      render();
      return;
    }
    if (gesture.activeId){
      el = byId(gesture.activeId);
      if (!el) return;
      if (el.type === 'line' || el.type === 'arrow'){
        if (gesture.handle === 'p1'){ el.x1 = world.x; el.y1 = world.y; }
        if (gesture.handle === 'p2'){ el.x2 = world.x; el.y2 = world.y; }
        render();
        return;
      }
      if (el.type === 'rect' || el.type === 'ellipse' || el.type === 'text' || el.type === 'image'){
        var snapEl0 = gesture.snapshot.find(function(x){ return x.id === gesture.activeId; });
        var b0 = snapEl0 ? getBBox(snapEl0) : getBBox(el);
        var rx1 = b0.x, ry1 = b0.y, rx2 = b0.x + b0.w, ry2 = b0.y + b0.h;
        if (gesture.handle === 'nw'){ rx1 = world.x; ry1 = world.y; }
        if (gesture.handle === 'ne'){ rx2 = world.x; ry1 = world.y; }
        if (gesture.handle === 'sw'){ rx1 = world.x; ry2 = world.y; }
        if (gesture.handle === 'se'){ rx2 = world.x; ry2 = world.y; }
        // 画像とテキストは常に縦横比固定（テキストは文字が歪まないように）
        if (el.type === 'image' || el.type === 'text' || e.shiftKey || el.lockAspect){
          var ratio = b0.h !== 0 ? b0.w / b0.h : 1;
          var nwv = Math.abs(rx2 - rx1), nhv = Math.abs(ry2 - ry1);
          if (nwv / (ratio || 1) > nhv) nhv = nwv / (ratio || 1); else nwv = nhv * ratio;
          rx2 = rx1 + Math.sign(rx2 - rx1 || 1) * nwv;
          ry2 = ry1 + Math.sign(ry2 - ry1 || 1) * nhv;
        }
        var nr = normRect(rx1, ry1, rx2, ry2);
        el.x = nr.x; el.y = nr.y; el.w = Math.max(1, nr.w); el.h = Math.max(1, nr.h);
        // テキストは枠の拡大率に合わせて文字サイズも拡大縮小
        if (el.type === 'text' && snapEl0 && b0.h > 0){
          var k = el.h / b0.h;
          el.fontSize = clamp((snapEl0.fontSize || 20) * k, 4, 2000);
        }
        render();
      }
      return;
    }
    return;
  }

  if (gesture.mode === 'rotate'){
    var cur2 = Math.atan2(world.y - gesture.center.y, world.x - gesture.center.x);
    var dlt2 = cur2 - gesture.initialAngle;
    if (gesture.groupRotate){
      // 複数選択：グループ全体を回転
      gesture.snapshot.forEach(function(base){
        if (selectedIds.indexOf(base.id) < 0) return;
        var el = byId(base.id);
        if (el) rotateElInPlace(el, base, gesture.center, dlt2);
      });
    } else {
      var rel = byId(gesture.activeId);
      if (rel){
        var base = gesture.snapshot.find(function(x){ return x.id === gesture.activeId; });
        if (base) rotateElInPlace(rel, base, gesture.center, dlt2);
      }
    }
    render();
    return;
  }
});

function endPointer(e){
  if (e && pointers.has(e.pointerId)) pointers.delete(e.pointerId);
  if (lpTimer){ clearTimeout(lpTimer); lpTimer = null; }

  if (gesture.mode === 'pinch'){
    if (pointers.size < 2) gesture = { mode: 'none' };
    render();
    return;
  }
  if (gesture.mode === 'draw' && draft){
    finalizeDraft();
    gesture = { mode: 'none' };
    return;
  }
  if (gesture.mode === 'marquee' && marquee){
    var ids = hitTestMarquee(marquee);
    selectedIds = ids;
    marquee = null;
    gesture = { mode: 'none' };
    updateUI();
    render();
    return;
  }
  if (gesture.mode === 'move' || gesture.mode === 'resize' || gesture.mode === 'rotate'){
    if (gesture.snapshot && JSON.stringify(gesture.snapshot) !== JSON.stringify(elements)){
      commitState(deepClone(elements), selectedIds.slice());
    }
  }
  if (gesture.mode === 'pan') canvas.style.cursor = tool === 'pan' ? 'grab' : 'default';
  gesture = { mode: 'none' };
  render();
}
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', endPointer);

canvas.addEventListener('dblclick', function(e){
  var screen = pointerPos(e);
  var world = screenToWorld(screen.x, screen.y);
  var hit = hitTest(world);
  if (hit && hit.type === 'text'){
    selectedIds = [hit.id];
    updateUI();
    openEditor(worldToScreen(hit.x, hit.y), world, hit);
  }
});

canvas.addEventListener('contextmenu', function(e){
  e.preventDefault();
  var screen = pointerPos(e);
  var world = screenToWorld(screen.x, screen.y);
  var hit = hitTest(world);
  if (hit){
    if (selectedIds.indexOf(hit.id) < 0){ selectedIds = [hit.id]; updateUI(); }
    var r = canvas.getBoundingClientRect();
    showContextMenu(r.left + screen.x, r.top + screen.y, hit.id);
  }
});

canvas.addEventListener('wheel', function(e){
  e.preventDefault();
  var screen = pointerPos(e);
  var before = screenToWorld(screen.x, screen.y);
  scale = clamp(scale * (e.deltaY < 0 ? 1.1 : 0.9), MIN_SCALE, MAX_SCALE);
  panX = screen.x - before.x * scale;
  panY = screen.y - before.y * scale;
  render();
}, { passive: false });

/* ================= zoom buttons ================= */
function zoomAtCenter(f){
  var r = wrap.getBoundingClientRect();
  var c = { x: r.width / 2, y: r.height / 2 };
  var before = screenToWorld(c.x, c.y);
  scale = clamp(scale * f, MIN_SCALE, MAX_SCALE);
  panX = c.x - before.x * scale;
  panY = c.y - before.y * scale;
  render();
}
document.getElementById('zoomIn').addEventListener('click', function(){ zoomAtCenter(1.2); });
document.getElementById('zoomOut').addEventListener('click', function(){ zoomAtCenter(1 / 1.2); });

/* 倍率を中心基準で設定 */
function setZoom(pct){
  var ns = clamp(pct / 100, MIN_SCALE, MAX_SCALE);
  var r = wrap.getBoundingClientRect();
  var c = { x: r.width / 2, y: r.height / 2 };
  var before = screenToWorld(c.x, c.y);
  scale = ns;
  panX = c.x - before.x * scale;
  panY = c.y - before.y * scale;
  render();
}

/* ズーム倍率のインライン入力（長押し / 右クリック） */
var zoomInput = document.getElementById('zoomInput');
var zoomLpTimer = null;
function openZoomInput(){
  zoomLabel.style.display = 'none';
  zoomInput.style.display = 'block';
  zoomInput.value = Math.round(scale * 1000) / 10;
  zoomInput.focus();
  zoomInput.select();
}
function closeZoomInput(apply){
  if (zoomInput.style.display === 'none') return;
  if (apply){
    var v = parseFloat(zoomInput.value);
    if (!isNaN(v) && v > 0) setZoom(v);
  }
  zoomInput.style.display = 'none';
  zoomLabel.style.display = 'block';
  render();
}
zoomInput.addEventListener('blur', function(){ closeZoomInput(true); });
zoomInput.addEventListener('keydown', function(e){
  e.stopPropagation();
  if (e.key === 'Enter') closeZoomInput(true);
  if (e.key === 'Escape') closeZoomInput(false);
});
zoomLabel.addEventListener('click', function(){
  if (zoomLpTimer){ clearTimeout(zoomLpTimer); zoomLpTimer = null; }
  scale = 1; panX = 0; panY = 0; render();
});
zoomLabel.addEventListener('contextmenu', function(e){ e.preventDefault(); openZoomInput(); });
zoomLabel.addEventListener('pointerdown', function(e){
  if (e.pointerType !== 'touch' && e.pointerType !== 'pen') return;
  zoomLpTimer = setTimeout(function(){ zoomLpTimer = null; openZoomInput(); }, 500);
});
zoomLabel.addEventListener('pointerup', function(){ if (zoomLpTimer){ clearTimeout(zoomLpTimer); zoomLpTimer = null; } });
zoomLabel.addEventListener('pointercancel', function(){ if (zoomLpTimer){ clearTimeout(zoomLpTimer); zoomLpTimer = null; } });

/* ================= clipboard ================= */
function copySelection(){
  var els = selectedEls();
  if (!els.length) return;
  clipboard = deepClone(els);
  pasteCount = 0;
}
function cutSelection(){
  copySelection();
  var ids = selectedIds.slice();
  elements = elements.filter(function(x){ return ids.indexOf(x.id) < 0; });
  selectedIds = [];
  commitState(deepClone(elements), selectedIds.slice());
}
function pasteToCenter(){
  if (!clipboard || !clipboard.length) return;
  var cb = getGroupBBox(clipboard);
  var r = wrap.getBoundingClientRect();
  var center = screenToWorld(r.width / 2, r.height / 2);
  pasteCount++;
  var off = pasteCount === 1 ? 0 : 24 / scale;
  var ddx = center.x - (cb.x + cb.w/2) + off;
  var ddy = center.y - (cb.y + cb.h/2) + off;
  var newIds = [];
  clipboard.forEach(function(src){
    var c = deepClone(src);
    c.id = genId();
    if (c.type === 'rect' || c.type === 'ellipse' || c.type === 'text' || c.type === 'image'){ c.x += ddx; c.y += ddy; }
    else if (c.type === 'line' || c.type === 'arrow'){ c.x1 += ddx; c.y1 += ddy; c.x2 += ddx; c.y2 += ddy; }
    else c.points = c.points.map(function(p){ return { x: p.x + ddx, y: p.y + ddy }; });
    elements.push(c);
    newIds.push(c.id);
  });
  selectedIds = newIds;
  commitState(deepClone(elements), selectedIds.slice());
}

/* ================= keyboard ================= */
window.addEventListener('keydown', function(e){
  var tag = document.activeElement ? document.activeElement.tagName : '';
  if (tag === 'TEXTAREA' || tag === 'INPUT') return;
  var k = e.key.toLowerCase();
  if (k === 'escape'){ hideContextMenu(); closeCrop(); return; }
  if ((e.ctrlKey || e.metaKey) && k === 'z'){ e.preventDefault(); if (e.shiftKey) redo(); else undo(); return; }
  if ((e.ctrlKey || e.metaKey) && k === 'y'){ e.preventDefault(); redo(); return; }
  if ((e.ctrlKey || e.metaKey) && k === 'c'){ e.preventDefault(); copySelection(); return; }
  if ((e.ctrlKey || e.metaKey) && k === 'x'){ e.preventDefault(); cutSelection(); return; }
  if ((e.ctrlKey || e.metaKey) && k === 'v'){ e.preventDefault(); pasteToCenter(); return; }
  if ((e.key === 'Delete' || e.key === 'Backspace') && selectedIds.length){
    e.preventDefault();
    var ids = selectedIds.slice();
    elements = elements.filter(function(x){ return ids.indexOf(x.id) < 0; });
    selectedIds = [];
    commitState(deepClone(elements), selectedIds.slice());
    return;
  }
  var map = { v:'select', h:'pan', p:'pen', r:'rect', o:'ellipse', l:'line', a:'arrow', t:'text', e:'eraser' };
  if (map[k] && !e.ctrlKey && !e.metaKey && !e.altKey) setTool(map[k]);
});

/* ================= save / load / export ================= */
document.getElementById('btnSave').addEventListener('click', function(){
  if (!elements.length){ toast('ボードに要素がありません。'); return; }
  showProgress('データ(JSON)を保存中…');
  nextTick(function(){
    // 要素ごとに分割して文字列化し、実進捗を表示（重いファイルでもUIを詰まらせない）
    var parts = [];
    var n = elements.length;
    var i = 0;
    var step = function(){
      var end = Math.min(n, i + 20);
      for (; i < end; i++) parts.push(JSON.stringify(elements[i]));
      setProgress(8 + (i / n) * 72);
      if (i < n){ nextTick(step); return; }
      setProgress(84);
      nextTick(function(){
        var text = '{"version":1,"elements":[' + parts.join(',') + ']}';
        setProgress(92);
        nextTick(function(){
          var blob = new Blob([text], { type: 'application/json' });
          var url = URL.createObjectURL(blob);
          var a = document.createElement('a');
          a.href = url;
          a.download = 'freeboard-' + Date.now() + '.json';
          a.click();
          setProgress(100);
          setTimeout(function(){ URL.revokeObjectURL(url); hideProgress(); }, 1200);
        });
      });
    };
    step();
  });
});
document.getElementById('btnLoad').addEventListener('click', function(){ document.getElementById('jsonInput').click(); });
document.getElementById('jsonInput').addEventListener('change', function(e){
  var f = e.target.files && e.target.files[0];
  if (!f) return;
  e.target.value = '';
  showProgress('データを読み込み中…');
  var reader = new FileReader();
  reader.onprogress = function(ev){ if (ev.lengthComputable) setProgress(clamp(ev.loaded / ev.total * 55, 2, 55)); };
  reader.onload = function(){
    setProgress(60);
    nextTick(function(){
      try {
        var data = JSON.parse(reader.result);
        var list = Array.isArray(data.elements) ? data.elements : [];
        selectedIds = [];
        commitState(list, []);
        setProgress(100);
        setTimeout(hideProgress, 300);
      } catch (err) {
        hideProgress();
        toast('ファイルを読み込めませんでした。');
      }
    });
  };
  reader.onerror = function(){ hideProgress(); toast('ファイルを読み込めませんでした。'); };
  reader.readAsText(f);
});
document.getElementById('btnPNG').addEventListener('click', function(){
  if (!elements.length){ toast('ボードに要素がありません。'); return; }
  showProgress('PNGを書き出し中…');
  nextTick(function(){
    var box = getGroupBBox(elements);
    var pad = 40;
    var off = document.createElement('canvas');
    off.width = Math.ceil(box.w + pad * 2);
    off.height = Math.ceil(box.h + pad * 2);
    // ブラウザの最大サイズを超えないよう縮小
    var maxDim = 16384;
    var gs = 1;
    if (off.width > maxDim || off.height > maxDim) gs = Math.min(maxDim / off.width, maxDim / off.height);
    off.width = Math.max(1, Math.ceil(off.width * gs));
    off.height = Math.max(1, Math.ceil(off.height * gs));
    var oc = off.getContext('2d');
    oc.fillStyle = '#fff';
    oc.fillRect(0, 0, off.width, off.height);
    oc.scale(gs, gs);
    oc.translate(-box.x + pad, -box.y + pad);
    setProgress(10);
    var i = 0;
    var n = elements.length;
    var step = function(){
      // 要素ごとに分割して描画し、実進捗を表示
      var end = Math.min(n, i + 5);
      for (; i < end; i++) drawElement(oc, elements[i]);
      setProgress(10 + (i / n) * 75);
      if (i < n){ nextTick(step); return; }
      setProgress(90);
      nextTick(function(){
        off.toBlob(function(blob){
          if (!blob){ hideProgress(); toast('PNGを保存できませんでした。'); return; }
          setProgress(96);
          nextTick(function(){
            setProgress(100);
            var url = URL.createObjectURL(blob);
            var a = document.createElement('a');
            a.href = url;
            a.download = 'freeboard-' + Date.now() + '.png';
            a.click();
            setTimeout(function(){ URL.revokeObjectURL(url); hideProgress(); }, 1200);
          });
        }, 'image/png');
      });
    };
    step();
  });
});

/* ================= resize / init ================= */
function resizeCanvas(){
  dpr = Math.max(1, window.devicePixelRatio || 1);
  var r = wrap.getBoundingClientRect();
  canvas.width = Math.max(1, Math.round(r.width * dpr));
  canvas.height = Math.max(1, Math.round(r.height * dpr));
  canvas.style.width = r.width + 'px';
  canvas.style.height = r.height + 'px';
  render();
}
window.addEventListener('resize', function(){ resizeCanvas(); if (cropState) layoutCrop(); });

loadFromLocalStorage();
history = [snapshot()];
historyIndex = 0;
updateUI();
resizeCanvas();
})();
</script>
