<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>フリーボード</title>
<style>
  :root{
    --base:#ffffff;
    --mantle:#ffffff;
    --crust:#fafafa;
    --surface0:#e5e5e5;
    --surface1:#eeeeee;
    --surface2:#d4d4d4;
    --text:#171717;
    --subtext0:#737373;
    --overlay0:#a3a3a3;
    --lavender:#171717;
    --mauve:#171717;
    --pink:#ec4899;
    --red:#ef4444;
    --peach:#f97316;
    --yellow:#eab308;
    --green:#22c55e;
    --teal:#06b6d4;
    --sky:#3b82f6;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
  html,body{
    margin:0; padding:0; height:100%; overflow:hidden;
    background:var(--crust); color:var(--text);
    font-family:'Segoe UI','Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif;
    overscroll-behavior:none;
  }
  #app{ position:fixed; inset:0; display:flex; flex-direction:column; }

  /* ---------- Toolbar ---------- */
  #toolbar{
    flex:0 0 auto;
    display:flex; align-items:center; gap:6px;
    padding:8px 10px;
    background:var(--mantle);
    border-bottom:1px solid var(--surface0);
    overflow-x:auto; overflow-y:hidden;
    white-space:nowrap;
    scrollbar-width:thin;
  }
  #toolbar::-webkit-scrollbar{ height:5px; }
  #toolbar::-webkit-scrollbar-thumb{ background:var(--surface1); border-radius:4px; }

  .group{
    display:flex; align-items:center; gap:4px;
    padding:0 6px;
    border-right:1px solid var(--surface0);
    flex:0 0 auto;
  }
  .group:last-child{ border-right:none; }

  .tbtn{
    flex:0 0 auto;
    width:40px; height:40px;
    display:flex; align-items:center; justify-content:center;
    background:transparent; border:1px solid transparent; border-radius:10px;
    color:var(--text); font-size:18px; cursor:pointer;
    transition:background .12s ease, border-color .12s ease, transform .08s ease;
    user-select:none;
  }
  .tbtn:hover{ background:var(--surface0); }
  .tbtn:active{ transform:scale(0.92); }
  .tbtn.active{ background:var(--mauve); color:var(--crust); border-color:var(--mauve); }
  .tbtn:disabled{ opacity:.35; cursor:default; }
  .tbtn:disabled:hover{ background:transparent; }

  .swatch{
    width:26px; height:26px; border-radius:50%;
    border:2px solid var(--surface1); cursor:pointer; flex:0 0 auto;
    padding:0;
  }
  .swatch.selected{ border-color:var(--text); box-shadow:0 0 0 2px var(--crust) inset; }

  #colorCustom{
    width:30px; height:30px; border:none; border-radius:8px; background:none;
    cursor:pointer; padding:0; flex:0 0 auto;
  }

  #strokeRange{ width:80px; accent-color:var(--mauve); }
  .lbl{ font-size:11px; color:var(--subtext0); flex:0 0 auto; }

  /* ---------- Canvas area ---------- */
  #boardWrap{ position:relative; flex:1 1 auto; overflow:hidden; }
  #board{ position:absolute; inset:0; display:block; touch-action:none; }

  #textEditor{
    position:absolute; z-index:20; display:none;
    background:transparent; color:inherit;
    border:1px dashed var(--lavender);
    outline:none; resize:none; overflow:hidden;
    font-family:'Segoe UI','Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif;
    line-height:1.3; padding:2px; min-width:40px; min-height:1.3em;
    white-space:pre;
  }

  /* ---------- Zoom controls ---------- */
  #zoomBar{
    position:absolute; right:14px; bottom:14px; z-index:10;
    display:flex; align-items:center; gap:2px;
    background:var(--mantle); border:1px solid var(--surface0);
    border-radius:999px; padding:4px; box-shadow:0 4px 16px rgba(0,0,0,.10);
  }
  #zoomBar button{
    width:34px; height:34px; border-radius:50%; border:none;
    background:transparent; color:var(--text); font-size:16px; cursor:pointer;
  }
  #zoomBar button:hover{ background:var(--surface0); }
  #zoomLabel{
    font-size:12px; color:var(--subtext0); width:48px; text-align:center; cursor:pointer;
    user-select:none;
  }

  #hint{
    position:absolute; left:50%; top:46%; transform:translate(-50%,-50%);
    color:var(--subtext0); font-size:14px; text-align:center; pointer-events:none;
    line-height:1.8; z-index:1;
  }

  /* ---------- Context menu ---------- */
  #contextMenu{
    position:fixed; z-index:50; display:none;
    background:var(--mantle); border:1px solid var(--surface0); border-radius:10px;
    box-shadow:0 8px 28px rgba(0,0,0,.14); padding:6px; min-width:200px;
  }
  #contextMenu button{
    display:flex; align-items:center; gap:10px; width:100%;
    padding:9px 10px; background:none; border:none; border-radius:6px;
    color:var(--text); text-align:left; cursor:pointer; font-size:14px;
    font-family:inherit;
  }
  #contextMenu button:hover{ background:var(--surface0); }
</style>
</head>
<body>
<div id="app">
  <div id="toolbar">
    <div class="group">
      <button class="tbtn" data-tool="select" title="選択 (V) / ドラッグで範囲選択・Shiftで追加選択">↖</button>
      <button class="tbtn" data-tool="pan" title="手のひらツール (H)">✋</button>
    </div>
    <div class="group">
      <button class="tbtn" data-tool="pen" title="ペン (P)">✎</button>
      <button class="tbtn" data-tool="rect" title="四角形 (R)">▭</button>
      <button class="tbtn" data-tool="ellipse" title="円 (O)">◯</button>
      <button class="tbtn" data-tool="line" title="直線 (L)">╱</button>
      <button class="tbtn" data-tool="arrow" title="矢印 (A)">➜</button>
      <button class="tbtn" data-tool="text" title="テキスト (T)"><b>T</b></button>
      <button class="tbtn" id="btnImage" title="画像を挿入">🖼</button>
      <button class="tbtn" data-tool="eraser" title="消しゴム (E)">⌫</button>
    </div>
    <div class="group">
      <span id="swatches" style="display:flex; gap:4px;"></span>
      <input type="color" id="colorCustom" value="#cdd6f4" title="色をカスタム選択">
      <span class="lbl">太さ</span>
      <input type="range" id="strokeRange" min="0" max="24" value="3">
    </div>
    <div class="group">
      <button class="tbtn" id="btnFillToggle" title="塗りつぶし ON/OFF">▦</button>
      <input type="color" id="fillColor" value="#e5e5e5" title="塗りつぶしの色">
      <button class="tbtn" id="btnLockAspect" title="縦横比を固定（選択中の図形・画像に適用）">🔗</button>
    </div>
    <div class="group">
      <button class="tbtn" id="btnUndo" title="元に戻す (Ctrl+Z)">↺</button>
      <button class="tbtn" id="btnRedo" title="やり直す (Ctrl+Y)">↻</button>
      <button class="tbtn" id="btnDuplicate" title="複製 (Ctrl+D / Ctrl+C→Ctrl+V)">⧉</button>
      <button class="tbtn" id="btnCopyImage" title="画像をクリップボードにコピー（他のアプリに貼り付け可能）">📋</button>
      <button class="tbtn" id="btnDelete" title="選択を削除 (Delete / Ctrl+X で切り取り)">🗑</button>
    </div>
    <div class="group">
      <button class="tbtn" id="btnClear" title="全消去">🧹</button>
      <button class="tbtn" id="btnExport" title="PNGとして保存">⬇</button>
    </div>
  </div>

  <div id="boardWrap">
    <canvas id="board"></canvas>
    <div id="hint">ここに描いたり、図形を配置したり<br>画像をドラッグ&ドロップ・貼り付けできます</div>
    <textarea id="textEditor" spellcheck="false"></textarea>
    <div id="zoomBar">
      <button id="zoomOut" title="縮小">－</button>
      <span id="zoomLabel" title="クリックでリセット">100%</span>
      <button id="zoomIn" title="拡大">＋</button>
    </div>
  </div>
  <div id="contextMenu">
    <button data-action="cut">✂️ 切り取り <span style="margin-left:auto;color:var(--subtext0);font-size:11px;">Ctrl+X</span></button>
    <button data-action="copy">📄 コピー <span style="margin-left:auto;color:var(--subtext0);font-size:11px;">Ctrl+C</span></button>
    <button data-action="paste">📋 貼り付け <span style="margin-left:auto;color:var(--subtext0);font-size:11px;">Ctrl+V</span></button>
    <button data-action="duplicate">⧉ 複製 <span style="margin-left:auto;color:var(--subtext0);font-size:11px;">Ctrl+D</span></button>
    <button data-action="copyImage">🖼 画像をクリップボードにコピー</button>
    <button data-action="delete">🗑 削除</button>
  </div>
  <input type="file" id="fileInput" accept="image/*" multiple hidden>
</div>
<script>
(function(){
"use strict";

var COLORS = {
  base:'#ffffff', mantle:'#ffffff', crust:'#fafafa',
  surface0:'#e5e5e5', surface1:'#eeeeee', surface2:'#d4d4d4',
  text:'#171717', subtext0:'#737373', overlay0:'#a3a3a3',
  lavender:'#171717', mauve:'#171717', pink:'#ec4899',
  red:'#ef4444', peach:'#f97316', yellow:'#eab308',
  green:'#22c55e', teal:'#06b6d4', sky:'#3b82f6', purple:'#a855f7'
};
var SWATCH_COLORS = [COLORS.text, COLORS.red, COLORS.peach, COLORS.yellow, COLORS.green, COLORS.teal, COLORS.sky, COLORS.purple];

var canvas = document.getElementById('board');
var ctx = canvas.getContext('2d');
var boardWrap = document.getElementById('boardWrap');
var hintEl = document.getElementById('hint');
var textEditor = document.getElementById('textEditor');
var fileInput = document.getElementById('fileInput');
var contextMenuEl = document.getElementById('contextMenu');
var dpr = Math.max(1, window.devicePixelRatio || 1);

var state = {
  tool: 'select',
  elements: [],
  selectedIds: [],
  scale: 1,
  panX: 0,
  panY: 0,
  color: COLORS.text,
  strokeWidth: 3,
  fillEnabled: false,
  fillColor: '#e5e5e5'
};

var history = [];
var historyIndex = -1;
var idCounter = 1;

var pointers = new Map();
var dragMode = null;
var dragHandle = null;
var dragStart = null;
var dragStartScreen = null;
var panStart = null;
var elStartSnapshot = null;
var currentDraft = null;
var lastPinchDist = null;
var lastPinchCenter = null;
var spacePressed = false;
var marqueeRect = null;
var marqueeAdditive = false;
var elementClipboard = null;
var pasteCascadeCount = 0;
var longPressTimer = null;
var contextMenuWorldPos = null;

var LONG_PRESS_MS = 550;
var MOVE_THRESHOLD = 6;

/* ---------------- utility ---------------- */
function genId(){ return 'el' + (idCounter++) + '_' + Date.now().toString(36); }
function clamp(v, min, max){ return Math.max(min, Math.min(max, v)); }
function dist(a, b){ return Math.hypot(a.x - b.x, a.y - b.y); }
function mid(a, b){ return { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 }; }
function getElementById(id){
  for (var i = 0; i < state.elements.length; i++){
    if (state.elements[i].id === id) return state.elements[i];
  }
  return null;
}
function cloneEl(el){
  var rest = {};
  for (var k in el){ if (k !== 'img') rest[k] = el[k]; }
  return JSON.parse(JSON.stringify(rest));
}
function getSelectedElements(){
  return state.elements.filter(function(el){ return state.selectedIds.indexOf(el.id) >= 0; });
}

function worldToScreen(x, y){ return { x: x * state.scale + state.panX, y: y * state.scale + state.panY }; }
function screenToWorld(x, y){ return { x: (x - state.panX) / state.scale, y: (y - state.panY) / state.scale }; }
function getPointerPos(e){
  var rect = canvas.getBoundingClientRect();
  return { x: e.clientX - rect.left, y: e.clientY - rect.top };
}

/* ---------------- bbox / hit test ---------------- */
function getBBox(el){
  switch (el.type){
    case 'rect': case 'ellipse': case 'image': case 'text':
      return { x: el.x, y: el.y, w: el.w, h: el.h };
    case 'line': case 'arrow':
      return {
        x: Math.min(el.x1, el.x2), y: Math.min(el.y1, el.y2),
        w: Math.abs(el.x2 - el.x1) || 1, h: Math.abs(el.y2 - el.y1) || 1
      };
    case 'freehand': {
      var minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
      for (var i = 0; i < el.points.length; i++){
        var p = el.points[i];
        minX = Math.min(minX, p.x); minY = Math.min(minY, p.y);
        maxX = Math.max(maxX, p.x); maxY = Math.max(maxY, p.y);
      }
      return { x: minX, y: minY, w: (maxX - minX) || 1, h: (maxY - minY) || 1 };
    }
  }
  return { x: 0, y: 0, w: 0, h: 0 };
}

function distToSegment(p, a, b){
  var dx = b.x - a.x, dy = b.y - a.y;
  var lenSq = dx * dx + dy * dy;
  var t = lenSq === 0 ? 0 : clamp(((p.x - a.x) * dx + (p.y - a.y) * dy) / lenSq, 0, 1);
  var cx = a.x + t * dx, cy = a.y + t * dy;
  return Math.hypot(p.x - cx, p.y - cy);
}

function hitElement(el, world){
  var pad = 8 / state.scale;
  if (el.type === 'line' || el.type === 'arrow'){
    return distToSegment(world, { x: el.x1, y: el.y1 }, { x: el.x2, y: el.y2 }) < pad;
  }
  if (el.type === 'freehand'){
    for (var i = 0; i < el.points.length - 1; i++){
      if (distToSegment(world, el.points[i], el.points[i + 1]) < pad) return true;
    }
    return false;
  }
  var b = getBBox(el);
  return world.x >= b.x - pad && world.x <= b.x + b.w + pad &&
         world.y >= b.y - pad && world.y <= b.y + b.h + pad;
}

function hitTestTopmost(world){
  for (var i = state.elements.length - 1; i >= 0; i--){
    if (hitElement(state.elements[i], world)) return i;
  }
  return -1;
}

function getHandles(el){
  var b = getBBox(el);
  if (el.type === 'line' || el.type === 'arrow'){
    return [{ id: 'p1', x: el.x1, y: el.y1 }, { id: 'p2', x: el.x2, y: el.y2 }];
  }
  if (el.type === 'text'){
    return [{ id: 'br', x: b.x + b.w, y: b.y + b.h }];
  }
  if (el.type === 'freehand'){
    return [];
  }
  return [
    { id: 'nw', x: b.x, y: b.y }, { id: 'n', x: b.x + b.w / 2, y: b.y }, { id: 'ne', x: b.x + b.w, y: b.y },
    { id: 'e', x: b.x + b.w, y: b.y + b.h / 2 }, { id: 'se', x: b.x + b.w, y: b.y + b.h }, { id: 's', x: b.x + b.w / 2, y: b.y + b.h },
    { id: 'sw', x: b.x, y: b.y + b.h }, { id: 'w', x: b.x, y: b.y + b.h / 2 }
  ];
}

function hitHandle(el, screenPos){
  var handles = getHandles(el);
  for (var i = 0; i < handles.length; i++){
    var s = worldToScreen(handles[i].x, handles[i].y);
    if (Math.hypot(s.x - screenPos.x, s.y - screenPos.y) < 16) return handles[i];
  }
  return null;
}

/* ---------------- element creation / edit ---------------- */
function createDraftElement(tool, world){
  var base = { id: genId(), color: state.color, strokeWidth: state.strokeWidth };
  if (tool === 'rect') return Object.assign(base, { type: 'rect', x: world.x, y: world.y, w: 0, h: 0, fill: state.fillEnabled, fillColor: state.fillColor, lockAspect: false });
  if (tool === 'ellipse') return Object.assign(base, { type: 'ellipse', x: world.x, y: world.y, w: 0, h: 0, fill: state.fillEnabled, fillColor: state.fillColor, lockAspect: false });
  if (tool === 'line') return Object.assign(base, { type: 'line', x1: world.x, y1: world.y, x2: world.x, y2: world.y });
  if (tool === 'arrow') return Object.assign(base, { type: 'arrow', x1: world.x, y1: world.y, x2: world.x, y2: world.y });
  if (tool === 'pen') return Object.assign(base, { type: 'freehand', points: [{ x: world.x, y: world.y }] });
  return null;
}

function updateDraftElement(d, start, world){
  if (d.type === 'rect' || d.type === 'ellipse'){
    d.x = start.x; d.y = start.y; d.w = world.x - start.x; d.h = world.y - start.y;
  } else if (d.type === 'line' || d.type === 'arrow'){
    d.x2 = world.x; d.y2 = world.y;
  } else if (d.type === 'freehand'){
    var last = d.points[d.points.length - 1];
    if (!last || Math.hypot(world.x - last.x, world.y - last.y) > 1.2 / state.scale){
      d.points.push({ x: world.x, y: world.y });
    }
  }
}

function finalizeDraft(d){
  if (d.type === 'rect' || d.type === 'ellipse'){
    if (d.w < 0){ d.x += d.w; d.w = -d.w; }
    if (d.h < 0){ d.y += d.h; d.h = -d.h; }
    if (d.w < 2 && d.h < 2) return false;
  }
  if ((d.type === 'line' || d.type === 'arrow') && Math.hypot(d.x2 - d.x1, d.y2 - d.y1) < 2) return false;
  if (d.type === 'freehand' && d.points.length < 2) return false;
  state.elements.push(d);
  if (d.type !== 'freehand') setSelection([d.id]);
  return true;
}

function moveElement(el, snap, dx, dy){
  if (el.type === 'rect' || el.type === 'ellipse' || el.type === 'image' || el.type === 'text'){
    el.x = snap.x + dx; el.y = snap.y + dy;
  } else if (el.type === 'line' || el.type === 'arrow'){
    el.x1 = snap.x1 + dx; el.y1 = snap.y1 + dy; el.x2 = snap.x2 + dx; el.y2 = snap.y2 + dy;
  } else if (el.type === 'freehand'){
    el.points = snap.points.map(function(p){ return { x: p.x + dx, y: p.y + dy }; });
  }
}

function offsetElement(el, dx, dy){
  if (el.type === 'rect' || el.type === 'ellipse' || el.type === 'image' || el.type === 'text'){
    el.x += dx; el.y += dy;
  } else if (el.type === 'line' || el.type === 'arrow'){
    el.x1 += dx; el.y1 += dy; el.x2 += dx; el.y2 += dy;
  } else if (el.type === 'freehand'){
    el.points = el.points.map(function(p){ return { x: p.x + dx, y: p.y + dy }; });
  }
}

function attachImageIfNeeded(el){
  if (el.type === 'image' && el.src){
    var img = new Image();
    img.onload = render;
    img.src = el.src;
    el.img = img;
  }
}

function resizeByHandle(el, handleId, world, snap){
  if (el.type === 'line' || el.type === 'arrow'){
    if (handleId === 'p1'){ el.x1 = world.x; el.y1 = world.y; }
    else { el.x2 = world.x; el.y2 = world.y; }
    return;
  }
  if (el.type === 'text'){
    var newH = Math.max(10, world.y - snap.y);
    var scaleF = newH / snap.h;
    el.fontSize = Math.max(6, snap.fontSize * scaleF);
    el.h = newH;
    ctx.font = el.fontSize + "px 'Segoe UI',sans-serif";
    var lines = el.text.split('\n');
    var maxW = 0;
    for (var i = 0; i < lines.length; i++) maxW = Math.max(maxW, ctx.measureText(lines[i]).width);
    el.w = maxW;
    return;
  }
  var x = snap.x, y = snap.y, x2 = snap.x + snap.w, y2 = snap.y + snap.h;
  if (handleId.indexOf('n') >= 0) y = world.y;
  if (handleId.indexOf('s') >= 0) y2 = world.y;
  if (handleId.indexOf('w') >= 0) x = world.x;
  if (handleId.indexOf('e') >= 0) x2 = world.x;

  if (el.lockAspect && snap.w > 0 && snap.h > 0){
    var ratio = snap.w / snap.h;
    var isCorner = handleId.length === 2;
    if (isCorner){
      var newW = x2 - x, newHgt = y2 - y;
      var signW = newW < 0 ? -1 : 1, signH = newHgt < 0 ? -1 : 1;
      if (Math.abs(newW) / ratio > Math.abs(newHgt)){
        newHgt = (Math.abs(newW) / ratio) * signH;
      } else {
        newW = (Math.abs(newHgt) * ratio) * signW;
      }
      if (handleId.indexOf('n') >= 0) y = y2 - newHgt; else y2 = y + newHgt;
      if (handleId.indexOf('w') >= 0) x = x2 - newW; else x2 = x + newW;
    } else if (handleId === 'n' || handleId === 's'){
      var hH = y2 - y;
      var wW = Math.abs(hH) * ratio;
      var cx = snap.x + snap.w / 2;
      x = cx - wW / 2; x2 = cx + wW / 2;
    } else if (handleId === 'e' || handleId === 'w'){
      var wW2 = x2 - x;
      var hH2 = Math.abs(wW2) / ratio;
      var cy = snap.y + snap.h / 2;
      y = cy - hH2 / 2; y2 = cy + hH2 / 2;
    }
  }

  el.x = Math.min(x, x2); el.y = Math.min(y, y2);
  el.w = Math.abs(x2 - x); el.h = Math.abs(y2 - y);
}

/* ---------------- selection ---------------- */
function setSelection(ids){
  state.selectedIds = ids.slice();
  updateSelectionUI();
}

function updateSelectionUI(){
  var hasSel = state.selectedIds.length > 0;
  var single = state.selectedIds.length === 1 ? getElementById(state.selectedIds[0]) : null;
  document.getElementById('btnDelete').disabled = !hasSel;
  document.getElementById('btnDuplicate').disabled = !hasSel;
  document.getElementById('btnCopyImage').disabled = !(single && single.type === 'image');
  updateInspectorUI(single);
}

function updateInspectorUI(single){
  if (single === undefined) single = state.selectedIds.length === 1 ? getElementById(state.selectedIds[0]) : null;
  var fillBtn = document.getElementById('btnFillToggle');
  var fillColorInput = document.getElementById('fillColor');
  var lockBtn = document.getElementById('btnLockAspect');

  var fillApplicable = !!(single && (single.type === 'rect' || single.type === 'ellipse'));
  var currentFill = fillApplicable ? !!single.fill : state.fillEnabled;
  fillBtn.classList.toggle('active', currentFill);
  fillColorInput.value = (fillApplicable && single.fillColor) ? single.fillColor : state.fillColor;

  var lockApplicable = !!(single && (single.type === 'rect' || single.type === 'ellipse' || single.type === 'image'));
  lockBtn.disabled = !lockApplicable;
  lockBtn.classList.toggle('active', lockApplicable && !!single.lockAspect);
}

function deleteSelected(){
  if (!state.selectedIds.length) return;
  var ids = state.selectedIds;
  state.elements = state.elements.filter(function(el){ return ids.indexOf(el.id) === -1; });
  setSelection([]);
  pushHistory();
  render();
}

function duplicateSelection(){
  var els = getSelectedElements();
  if (!els.length) return;
  var offset = 24 / state.scale;
  var newIds = [];
  els.forEach(function(src){
    var clone = cloneEl(src);
    clone.id = genId();
    offsetElement(clone, offset, offset);
    attachImageIfNeeded(clone);
    state.elements.push(clone);
    newIds.push(clone.id);
  });
  setSelection(newIds);
  pushHistory();
  render();
}

function copySelection(){
  var els = getSelectedElements();
  if (!els.length) return;
  elementClipboard = els.map(cloneEl);
  pasteCascadeCount = 0;
  if (els.length === 1 && els[0].type === 'image') copyImageToSystemClipboard(els[0]);
}

function cutSelection(){
  var els = getSelectedElements();
  if (!els.length) return;
  elementClipboard = els.map(cloneEl);
  pasteCascadeCount = 0;
  if (els.length === 1 && els[0].type === 'image') copyImageToSystemClipboard(els[0]);
  deleteSelected();
}

function pasteFromClipboard(targetWorldPos){
  if (!elementClipboard || !elementClipboard.length) return;
  var dx = 0, dy = 0;
  if (targetWorldPos){
    var minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    elementClipboard.forEach(function(e){
      var b = getBBox(e);
      minX = Math.min(minX, b.x); minY = Math.min(minY, b.y);
      maxX = Math.max(maxX, b.x + b.w); maxY = Math.max(maxY, b.y + b.h);
    });
    var cx = (minX + maxX) / 2, cy = (minY + maxY) / 2;
    dx = targetWorldPos.x - cx; dy = targetWorldPos.y - cy;
  } else {
    pasteCascadeCount++;
    dx = (24 / state.scale) * pasteCascadeCount;
    dy = dx;
  }
  var newIds = [];
  elementClipboard.forEach(function(src){
    var clone = JSON.parse(JSON.stringify(src));
    clone.id = genId();
    offsetElement(clone, dx, dy);
    attachImageIfNeeded(clone);
    state.elements.push(clone);
    newIds.push(clone.id);
  });
  setSelection(newIds);
  pushHistory();
  render();
}

function copyImageToSystemClipboard(el){
  if (!el || el.type !== 'image') return;
  if (!navigator.clipboard || typeof window.ClipboardItem === 'undefined'){
    alert('このブラウザは画像のクリップボードコピーに対応していません。');
    return;
  }
  var draw = function(image){
    var c = document.createElement('canvas');
    c.width = image.naturalWidth || Math.round(el.w) || 1;
    c.height = image.naturalHeight || Math.round(el.h) || 1;
    var cctx = c.getContext('2d');
    cctx.drawImage(image, 0, 0, c.width, c.height);
    c.toBlob(function(blob){
      if (!blob) return;
      navigator.clipboard.write([ new ClipboardItem({ 'image/png': blob }) ]).catch(function(err){
        console.warn('clipboard write failed', err);
        alert('クリップボードへのコピーに失敗しました（ブラウザの権限設定をご確認ください）。');
      });
    }, 'image/png');
  };
  if (el.img && el.img.complete && el.img.naturalWidth > 0){
    draw(el.img);
  } else if (el.src){
    var tmp = new Image();
    tmp.onload = function(){ draw(tmp); };
    tmp.src = el.src;
  }
}

/* ---------------- rendering ---------------- */
function drawElement(cx, el){
  cx.save();
  cx.lineJoin = 'round'; cx.lineCap = 'round';
  switch (el.type){
    case 'rect':
      if (el.fill){ cx.fillStyle = el.fillColor || el.color; cx.fillRect(el.x, el.y, el.w, el.h); }
      if (el.strokeWidth > 0){
        cx.strokeStyle = el.color; cx.lineWidth = el.strokeWidth;
        cx.strokeRect(el.x, el.y, el.w, el.h);
      }
      break;
    case 'ellipse':
      cx.beginPath();
      cx.ellipse(el.x + el.w / 2, el.y + el.h / 2, Math.abs(el.w / 2), Math.abs(el.h / 2), 0, 0, Math.PI * 2);
      if (el.fill){ cx.fillStyle = el.fillColor || el.color; cx.fill(); }
      if (el.strokeWidth > 0){
        cx.strokeStyle = el.color; cx.lineWidth = el.strokeWidth;
        cx.stroke();
      }
      break;
    case 'line':
      if (el.strokeWidth > 0){
        cx.strokeStyle = el.color; cx.lineWidth = el.strokeWidth;
        cx.beginPath(); cx.moveTo(el.x1, el.y1); cx.lineTo(el.x2, el.y2); cx.stroke();
      }
      break;
    case 'arrow': {
      cx.strokeStyle = el.color; cx.fillStyle = el.color; cx.lineWidth = el.strokeWidth;
      cx.beginPath(); cx.moveTo(el.x1, el.y1); cx.lineTo(el.x2, el.y2); cx.stroke();
      var angle = Math.atan2(el.y2 - el.y1, el.x2 - el.x1);
      var headLen = 8 + el.strokeWidth * 2;
      cx.beginPath();
      cx.moveTo(el.x2, el.y2);
      cx.lineTo(el.x2 - headLen * Math.cos(angle - Math.PI / 6), el.y2 - headLen * Math.sin(angle - Math.PI / 6));
      cx.lineTo(el.x2 - headLen * Math.cos(angle + Math.PI / 6), el.y2 - headLen * Math.sin(angle + Math.PI / 6));
      cx.closePath(); cx.fill();
      break;
    }
    case 'freehand':
      cx.strokeStyle = el.color; cx.lineWidth = el.strokeWidth;
      cx.beginPath();
      for (var i = 0; i < el.points.length; i++){
        var p = el.points[i];
        if (i === 0) cx.moveTo(p.x, p.y); else cx.lineTo(p.x, p.y);
      }
      cx.stroke();
      break;
    case 'text':
      cx.fillStyle = el.color;
      cx.font = el.fontSize + "px 'Segoe UI','Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif";
      cx.textBaseline = 'top';
      var lines2 = el.text.split('\n');
      for (var j = 0; j < lines2.length; j++){
        cx.fillText(lines2[j], el.x, el.y + j * el.fontSize * 1.3);
      }
      break;
    case 'image':
      if (el.img && el.img.complete && el.img.naturalWidth > 0){
        cx.drawImage(el.img, el.x, el.y, el.w, el.h);
      } else {
        cx.strokeStyle = COLORS.overlay0; cx.strokeRect(el.x, el.y, el.w, el.h);
      }
      break;
  }
  cx.restore();
}

function drawSelection(cx, el, showHandles){
  var b = getBBox(el);
  var pad = 4 / state.scale;
  cx.save();
  cx.strokeStyle = COLORS.lavender;
  cx.lineWidth = 1.5 / state.scale;
  cx.setLineDash([6 / state.scale, 4 / state.scale]);
  cx.strokeRect(b.x - pad, b.y - pad, b.w + pad * 2, b.h + pad * 2);
  cx.setLineDash([]);
  if (showHandles){
    var handles = getHandles(el);
    var hs = 9 / state.scale;
    for (var i = 0; i < handles.length; i++){
      var h = handles[i];
      cx.fillStyle = COLORS.mantle;
      cx.strokeStyle = COLORS.lavender;
      cx.lineWidth = 1.5 / state.scale;
      cx.fillRect(h.x - hs / 2, h.y - hs / 2, hs, hs);
      cx.strokeRect(h.x - hs / 2, h.y - hs / 2, hs, hs);
    }
  }
  cx.restore();
}

function drawMarquee(cx){
  if (!marqueeRect) return;
  var x = Math.min(marqueeRect.x1, marqueeRect.x2);
  var y = Math.min(marqueeRect.y1, marqueeRect.y2);
  var w = Math.abs(marqueeRect.x2 - marqueeRect.x1);
  var h = Math.abs(marqueeRect.y2 - marqueeRect.y1);
  cx.save();
  cx.fillStyle = 'rgba(23,23,23,0.06)';
  cx.fillRect(x, y, w, h);
  cx.strokeStyle = COLORS.lavender;
  cx.lineWidth = 1 / state.scale;
  cx.setLineDash([4 / state.scale, 3 / state.scale]);
  cx.strokeRect(x, y, w, h);
  cx.restore();
}

function drawGrid(cx, w, h){
  var spacing = 32 * state.scale;
  if (spacing < 10) return;
  var offsetX = state.panX % spacing; if (offsetX < 0) offsetX += spacing;
  var offsetY = state.panY % spacing; if (offsetY < 0) offsetY += spacing;
  cx.fillStyle = COLORS.surface0;
  for (var x = offsetX; x < w; x += spacing){
    for (var y = offsetY; y < h; y += spacing){
      cx.beginPath();
      cx.arc(x, y, 1.3, 0, Math.PI * 2);
      cx.fill();
    }
  }
}

function render(){
  var w = canvas.width / dpr, h = canvas.height / dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, w, h);
  ctx.fillStyle = COLORS.base;
  ctx.fillRect(0, 0, w, h);
  drawGrid(ctx, w, h);
  ctx.save();
  ctx.translate(state.panX, state.panY);
  ctx.scale(state.scale, state.scale);
  for (var i = 0; i < state.elements.length; i++) drawElement(ctx, state.elements[i]);
  if (currentDraft) drawElement(ctx, currentDraft);
  var selectedEls = getSelectedElements();
  var showHandles = selectedEls.length === 1;
  for (var j = 0; j < selectedEls.length; j++) drawSelection(ctx, selectedEls[j], showHandles);
  if (dragMode === 'marquee') drawMarquee(ctx);
  ctx.restore();

  hintEl.style.display = state.elements.length === 0 ? 'block' : 'none';
  updateZoomLabel();
}

function resizeCanvas(){
  var rect = boardWrap.getBoundingClientRect();
  canvas.width = Math.max(1, rect.width * dpr);
  canvas.height = Math.max(1, rect.height * dpr);
  canvas.style.width = rect.width + 'px';
  canvas.style.height = rect.height + 'px';
  render();
}

/* ---------------- zoom / pan ---------------- */
function zoomAt(pt, factor){
  var newScale = clamp(state.scale * factor, 0.1, 8);
  var worldBefore = screenToWorld(pt.x, pt.y);
  state.scale = newScale;
  var after = worldToScreen(worldBefore.x, worldBefore.y);
  state.panX += pt.x - after.x;
  state.panY += pt.y - after.y;
}
function updateZoomLabel(){
  document.getElementById('zoomLabel').textContent = Math.round(state.scale * 100) + '%';
}

/* ---------------- tool switching ---------------- */
function setTool(tool){
  if (textEditor.style.display === 'block') commitTextEditor();
  hideContextMenu();
  state.tool = tool;
  setSelection([]);
  updateToolbarUI();
  render();
  canvas.style.cursor = tool === 'pan' ? 'grab' : (tool === 'select' ? 'default' : 'crosshair');
}
function updateToolbarUI(){
  var btns = document.querySelectorAll('.tbtn[data-tool]');
  btns.forEach(function(b){ b.classList.toggle('active', b.getAttribute('data-tool') === state.tool); });
}

/* ---------------- text editing ---------------- */
function openTextEditor(screenPos, world, existingEl){
  textEditor.style.display = 'block';
  var fontSizeWorld = existingEl ? existingEl.fontSize : 20;
  var left, top;
  if (existingEl){
    var s = worldToScreen(existingEl.x, existingEl.y);
    left = s.x; top = s.y;
  } else {
    left = screenPos.x; top = screenPos.y;
  }
  textEditor.style.left = left + 'px';
  textEditor.style.top = top + 'px';
  textEditor.style.fontSize = (fontSizeWorld * state.scale) + 'px';
  textEditor.style.color = existingEl ? existingEl.color : state.color;
  textEditor.value = existingEl ? existingEl.text : '';
  textEditor.dataset.mode = existingEl ? 'edit' : 'new';
  textEditor.dataset.worldX = world.x;
  textEditor.dataset.worldY = world.y;
  textEditor.dataset.targetId = existingEl ? existingEl.id : '';
  textEditor.style.height = 'auto';
  setTimeout(function(){ textEditor.focus(); autoGrowEditor(); }, 0);
}
function autoGrowEditor(){
  textEditor.style.width = Math.max(60, textEditor.scrollWidth) + 'px';
  textEditor.style.height = Math.max(24, textEditor.scrollHeight) + 'px';
}
function commitTextEditor(){
  textEditor.style.display = 'none';
  var text = textEditor.value.replace(/\s+$/,'');
  var mode = textEditor.dataset.mode;
  if (!text){
    if (state.tool === 'text') { state.tool = 'select'; updateToolbarUI(); }
    render();
    return;
  }
  var fontSize = 20;
  var isEdit = mode === 'edit';
  var targetId = textEditor.dataset.targetId;
  if (isEdit){
    var el = getElementById(targetId);
    if (el) fontSize = el.fontSize;
  }
  ctx.font = fontSize + "px 'Segoe UI',sans-serif";
  var lines = text.split('\n');
  var w = 0;
  for (var i = 0; i < lines.length; i++) w = Math.max(w, ctx.measureText(lines[i]).width);
  var h = fontSize * 1.3 * lines.length;
  if (isEdit){
    var target = getElementById(targetId);
    if (target){ target.text = text; target.w = w; target.h = h; }
  } else {
    var x = parseFloat(textEditor.dataset.worldX), y = parseFloat(textEditor.dataset.worldY);
    var newEl = { id: genId(), type: 'text', x: x, y: y, w: w, h: h, text: text, color: state.color, fontSize: fontSize };
    state.elements.push(newEl);
    setSelection([newEl.id]);
  }
  if (state.tool === 'text'){ state.tool = 'select'; updateToolbarUI(); }
  pushHistory();
  render();
}

/* ---------------- images ---------------- */
function loadImageFile(file){
  var reader = new FileReader();
  reader.onload = function(ev){ addImageFromSrc(ev.target.result); };
  reader.readAsDataURL(file);
}
function addImageFromSrc(src){
  var img = new Image();
  img.onload = function(){
    var center = screenToWorld(canvas.clientWidth / 2, canvas.clientHeight / 2);
    var w = img.width, h = img.height;
    var maxDim = 420 / state.scale;
    if (w > maxDim || h > maxDim){
      var s = Math.min(maxDim / w, maxDim / h);
      w *= s; h *= s;
    }
    var el = { id: genId(), type: 'image', x: center.x - w / 2, y: center.y - h / 2, w: w, h: h, src: src, img: img, lockAspect: true };
    state.elements.push(el);
    setSelection([el.id]);
    pushHistory();
    render();
  };
  img.src = src;
}

/* ---------------- history / persistence ---------------- */
function snapshot(){
  return state.elements.map(function(el){
    var rest = {};
    for (var k in el){ if (k !== 'img') rest[k] = el[k]; }
    return JSON.parse(JSON.stringify(rest));
  });
}
function restoreSnapshot(snap){
  state.elements = snap.map(function(raw){
    var el = {};
    for (var k in raw) el[k] = raw[k];
    if (el.type === 'image' && el.src){
      var img = new Image();
      img.onload = render;
      img.src = el.src;
      el.img = img;
    }
    return el;
  });
}
function pushHistory(){
  history.splice(historyIndex + 1);
  history.push(snapshot());
  if (history.length > 60) history.shift();
  historyIndex = history.length - 1;
  saveToLocalStorage();
}
function undo(){
  if (historyIndex > 0){
    historyIndex--;
    restoreSnapshot(history[historyIndex]);
    setSelection([]);
    render();
    saveToLocalStorage();
  }
}
function redo(){
  if (historyIndex < history.length - 1){
    historyIndex++;
    restoreSnapshot(history[historyIndex]);
    setSelection([]);
    render();
    saveToLocalStorage();
  }
}
function saveToLocalStorage(){
  try { localStorage.setItem('freeboard-data', JSON.stringify({ elements: snapshot() })); }
  catch (e) { /* storage full or unavailable */ }
}
function loadFromLocalStorage(){
  try {
    var raw = localStorage.getItem('freeboard-data');
    if (raw){
      var data = JSON.parse(raw);
      restoreSnapshot(data.elements || []);
    }
  } catch (e) { /* ignore malformed data */ }
}

/* ---------------- export ---------------- */
function exportPNG(){
  if (state.elements.length === 0){ alert('ボードに要素がありません。'); return; }
  var minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  for (var i = 0; i < state.elements.length; i++){
    var b = getBBox(state.elements[i]);
    minX = Math.min(minX, b.x); minY = Math.min(minY, b.y);
    maxX = Math.max(maxX, b.x + b.w); maxY = Math.max(maxY, b.y + b.h);
  }
  var pad = 40;
  minX -= pad; minY -= pad; maxX += pad; maxY += pad;
  var w = Math.ceil(maxX - minX), h = Math.ceil(maxY - minY);
  var off = document.createElement('canvas');
  off.width = w; off.height = h;
  var octx = off.getContext('2d');
  octx.fillStyle = COLORS.base;
  octx.fillRect(0, 0, w, h);
  octx.translate(-minX, -minY);
  for (var j = 0; j < state.elements.length; j++) drawElement(octx, state.elements[j]);
  off.toBlob(function(blob){
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'freeboard-' + Date.now() + '.png';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
  });
}

/* ---------------- context menu ---------------- */
function toggleMenuItem(action, show){
  var btn = contextMenuEl.querySelector('[data-action="' + action + '"]');
  if (btn) btn.style.display = show ? '' : 'none';
}
function openContextMenuAtScreen(clientX, clientY, world){
  contextMenuWorldPos = world;
  var hasSel = state.selectedIds.length > 0;
  var single = state.selectedIds.length === 1 ? getElementById(state.selectedIds[0]) : null;
  toggleMenuItem('cut', hasSel);
  toggleMenuItem('copy', hasSel);
  toggleMenuItem('duplicate', hasSel);
  toggleMenuItem('delete', hasSel);
  toggleMenuItem('copyImage', !!(single && single.type === 'image'));
  toggleMenuItem('paste', !!(elementClipboard && elementClipboard.length));
  contextMenuEl.style.display = 'block';
  var vw = window.innerWidth, vh = window.innerHeight;
  var rect = contextMenuEl.getBoundingClientRect();
  var left = Math.min(clientX, vw - rect.width - 8);
  var top = Math.min(clientY, vh - rect.height - 8);
  contextMenuEl.style.left = Math.max(4, left) + 'px';
  contextMenuEl.style.top = Math.max(4, top) + 'px';
}
function hideContextMenu(){
  contextMenuEl.style.display = 'none';
}

contextMenuEl.addEventListener('click', function(e){
  var btn = e.target.closest('button');
  if (!btn) return;
  var action = btn.getAttribute('data-action');
  hideContextMenu();
  if (action === 'cut') cutSelection();
  else if (action === 'copy') copySelection();
  else if (action === 'duplicate') duplicateSelection();
  else if (action === 'delete') deleteSelected();
  else if (action === 'copyImage'){
    var single = state.selectedIds.length === 1 ? getElementById(state.selectedIds[0]) : null;
    copyImageToSystemClipboard(single);
  } else if (action === 'paste') pasteFromClipboard(contextMenuWorldPos);
});
window.addEventListener('pointerdown', function(e){
  if (contextMenuEl.style.display === 'block' && !contextMenuEl.contains(e.target)) hideContextMenu();
});

/* ---------------- long press (touch context menu) ---------------- */
function startLongPress(pos, pointerType){
  clearLongPress();
  if (pointerType !== 'touch' && pointerType !== 'pen') return;
  longPressTimer = setTimeout(function(){
    longPressTimer = null;
    if (dragMode === 'pending-move' || dragMode === 'pending-marquee'){
      dragMode = null; marqueeRect = null;
      render();
      var world = screenToWorld(pos.x, pos.y);
      var rect = canvas.getBoundingClientRect();
      openContextMenuAtScreen(rect.left + pos.x, rect.top + pos.y, world);
    }
  }, LONG_PRESS_MS);
}
function clearLongPress(){
  if (longPressTimer){ clearTimeout(longPressTimer); longPressTimer = null; }
}

/* ---------------- pointer events ---------------- */
canvas.addEventListener('pointerdown', function(e){
  if (textEditor.style.display === 'block') commitTextEditor();
  hideContextMenu();
  canvas.setPointerCapture(e.pointerId);
  var pos = getPointerPos(e);
  pointers.set(e.pointerId, pos);

  if (pointers.size === 2){
    clearLongPress();
    dragMode = 'pinch';
    var pts = Array.from(pointers.values());
    lastPinchDist = dist(pts[0], pts[1]);
    lastPinchCenter = mid(pts[0], pts[1]);
    currentDraft = null;
    return;
  }
  if (pointers.size > 2) return;

  var world = screenToWorld(pos.x, pos.y);

  if (state.tool === 'pan' || e.button === 1 || spacePressed){
    dragMode = 'pan'; dragStart = pos; panStart = { x: state.panX, y: state.panY };
    canvas.style.cursor = 'grabbing';
    return;
  }

  if (state.tool === 'select'){
    if (state.selectedIds.length === 1){
      var soleEl = getElementById(state.selectedIds[0]);
      if (soleEl){
        var h = hitHandle(soleEl, pos);
        if (h){ dragMode = 'resize'; dragHandle = h.id; elStartSnapshot = cloneEl(soleEl); dragStart = world; return; }
      }
    }
    var idx = hitTestTopmost(world);
    if (idx >= 0){
      var el = state.elements[idx];
      var already = state.selectedIds.indexOf(el.id) >= 0;
      if (e.shiftKey){
        var ids = state.selectedIds.slice();
        if (already) ids.splice(ids.indexOf(el.id), 1);
        else ids.push(el.id);
        setSelection(ids);
        if (state.selectedIds.indexOf(el.id) === -1){ render(); return; }
      } else if (!already){
        setSelection([el.id]);
      }
      elStartSnapshot = {};
      getSelectedElements().forEach(function(se){ elStartSnapshot[se.id] = cloneEl(se); });
      dragMode = 'pending-move';
      dragStart = world;
      dragStartScreen = pos;
      startLongPress(pos, e.pointerType);
      render();
    } else {
      if (!e.shiftKey) setSelection([]);
      marqueeAdditive = e.shiftKey;
      dragMode = 'pending-marquee';
      dragStart = world;
      dragStartScreen = pos;
      marqueeRect = { x1: world.x, y1: world.y, x2: world.x, y2: world.y };
      startLongPress(pos, e.pointerType);
      render();
    }
    return;
  }

  if (state.tool === 'eraser'){
    var idx2 = hitTestTopmost(world);
    if (idx2 >= 0){
      state.elements.splice(idx2, 1);
      pushHistory();
      render();
    }
    return;
  }

  if (state.tool === 'text'){
    openTextEditor(pos, world, null);
    return;
  }

  dragMode = 'draw';
  dragStart = world;
  currentDraft = createDraftElement(state.tool, world);
});

canvas.addEventListener('pointermove', function(e){
  var pos = getPointerPos(e);
  if (pointers.has(e.pointerId)) pointers.set(e.pointerId, pos);

  if (dragMode === 'pinch' && pointers.size >= 2){
    var pts = Array.from(pointers.values());
    var d = dist(pts[0], pts[1]);
    var c = mid(pts[0], pts[1]);
    if (lastPinchDist){
      zoomAt(c, d / lastPinchDist);
      state.panX += c.x - lastPinchCenter.x;
      state.panY += c.y - lastPinchCenter.y;
    }
    lastPinchDist = d; lastPinchCenter = c;
    render();
    return;
  }

  if (dragMode === 'pan'){
    state.panX = panStart.x + (pos.x - dragStart.x);
    state.panY = panStart.y + (pos.y - dragStart.y);
    render();
    return;
  }

  if (dragMode === 'pending-move' || dragMode === 'pending-marquee'){
    if (dist(pos, dragStartScreen) > MOVE_THRESHOLD){
      clearLongPress();
      dragMode = (dragMode === 'pending-move') ? 'move' : 'marquee';
    }
  }

  var world = screenToWorld(pos.x, pos.y);

  if (dragMode === 'draw' && currentDraft){
    updateDraftElement(currentDraft, dragStart, world);
    render();
    return;
  }
  if (dragMode === 'move'){
    var dx = world.x - dragStart.x, dy = world.y - dragStart.y;
    getSelectedElements().forEach(function(se){
      var snap = elStartSnapshot[se.id];
      if (snap) moveElement(se, snap, dx, dy);
    });
    render();
    return;
  }
  if (dragMode === 'resize'){
    var el2 = state.selectedIds.length === 1 ? getElementById(state.selectedIds[0]) : null;
    if (el2){
      resizeByHandle(el2, dragHandle, world, elStartSnapshot);
      render();
    }
    return;
  }
  if (dragMode === 'marquee'){
    marqueeRect.x2 = world.x; marqueeRect.y2 = world.y;
    render();
    return;
  }
});

function finalizeMarquee(){
  if (!marqueeRect) return;
  var rx1 = Math.min(marqueeRect.x1, marqueeRect.x2), ry1 = Math.min(marqueeRect.y1, marqueeRect.y2);
  var rx2 = Math.max(marqueeRect.x1, marqueeRect.x2), ry2 = Math.max(marqueeRect.y1, marqueeRect.y2);
  var hits = state.elements.filter(function(el){
    var b = getBBox(el);
    return !(b.x + b.w < rx1 || b.x > rx2 || b.y + b.h < ry1 || b.y > ry2);
  }).map(function(el){ return el.id; });
  if (marqueeAdditive){
    var merged = state.selectedIds.slice();
    hits.forEach(function(id){ if (merged.indexOf(id) === -1) merged.push(id); });
    setSelection(merged);
  } else {
    setSelection(hits);
  }
}

function endDrag(e){
  pointers.delete(e.pointerId);
  clearLongPress();

  if (dragMode === 'pinch'){
    if (pointers.size < 2){ dragMode = null; lastPinchDist = null; lastPinchCenter = null; }
    return;
  }
  if (dragMode === 'draw' && currentDraft){
    finalizeDraft(currentDraft);
    currentDraft = null;
    if (state.tool !== 'pen'){ state.tool = 'select'; updateToolbarUI(); }
    pushHistory();
  } else if (dragMode === 'move' || dragMode === 'resize'){
    pushHistory();
  } else if (dragMode === 'marquee'){
    finalizeMarquee();
  }
  if (dragMode === 'pan') canvas.style.cursor = state.tool === 'pan' ? 'grab' : 'default';
  dragMode = null; dragHandle = null; elStartSnapshot = null; marqueeRect = null;
  render();
}
canvas.addEventListener('pointerup', endDrag);
canvas.addEventListener('pointercancel', endDrag);

canvas.addEventListener('dblclick', function(e){
  var pos = getPointerPos(e);
  var world = screenToWorld(pos.x, pos.y);
  var idx = hitTestTopmost(world);
  if (idx >= 0 && state.elements[idx].type === 'text'){
    setSelection([state.elements[idx].id]);
    openTextEditor(pos, world, state.elements[idx]);
  }
});

canvas.addEventListener('contextmenu', function(e){
  e.preventDefault();
  clearLongPress();
  dragMode = null; marqueeRect = null;
  var pos = getPointerPos(e);
  var world = screenToWorld(pos.x, pos.y);
  if (state.tool === 'select'){
    var idx = hitTestTopmost(world);
    if (idx >= 0){
      var el = state.elements[idx];
      if (state.selectedIds.indexOf(el.id) === -1){ setSelection([el.id]); render(); }
    }
  }
  openContextMenuAtScreen(e.clientX, e.clientY, world);
});

canvas.addEventListener('wheel', function(e){
  e.preventDefault();
  var pos = getPointerPos(e);
  var factor = e.deltaY < 0 ? 1.1 : 0.9;
  zoomAt(pos, factor);
  render();
}, { passive: false });

/* ---------------- drag & drop / paste ---------------- */
canvas.addEventListener('dragover', function(e){ e.preventDefault(); });
canvas.addEventListener('drop', function(e){
  e.preventDefault();
  var files = e.dataTransfer.files;
  for (var i = 0; i < files.length; i++){
    if (files[i].type.indexOf('image/') === 0) loadImageFile(files[i]);
  }
});
window.addEventListener('paste', function(e){
  var items = e.clipboardData && e.clipboardData.items;
  if (!items) return;
  for (var i = 0; i < items.length; i++){
    if (items[i].type.indexOf('image/') === 0){
      var file = items[i].getAsFile();
      if (file) loadImageFile(file);
    }
  }
});

/* ---------------- keyboard ---------------- */
window.addEventListener('keydown', function(e){
  var activeTag = document.activeElement && document.activeElement.tagName;
  if (activeTag === 'TEXTAREA' || activeTag === 'INPUT') return;

  if (e.key === 'Escape'){ hideContextMenu(); return; }
  if ((e.key === 'Delete' || e.key === 'Backspace') && state.selectedIds.length){
    deleteSelected(); e.preventDefault(); return;
  }
  if (e.key === ' '){ spacePressed = true; canvas.style.cursor = 'grab'; e.preventDefault(); return; }
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z'){
    e.preventDefault();
    if (e.shiftKey) redo(); else undo();
    return;
  }
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'y'){ e.preventDefault(); redo(); return; }
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'd'){ e.preventDefault(); duplicateSelection(); return; }
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'x'){ e.preventDefault(); cutSelection(); return; }
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'c'){ e.preventDefault(); copySelection(); return; }
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'v'){
    if (elementClipboard && elementClipboard.length){ e.preventDefault(); pasteFromClipboard(null); }
    return;
  }

  var map = { v: 'select', h: 'pan', p: 'pen', r: 'rect', o: 'ellipse', l: 'line', a: 'arrow', t: 'text', e: 'eraser' };
  var k = e.key.toLowerCase();
  if (map[k] && !e.ctrlKey && !e.metaKey && !e.altKey) setTool(map[k]);
});
window.addEventListener('keyup', function(e){
  if (e.key === ' '){ spacePressed = false; canvas.style.cursor = state.tool === 'pan' ? 'grab' : 'default'; }
});

/* ---------------- toolbar wiring ---------------- */
document.querySelectorAll('.tbtn[data-tool]').forEach(function(btn){
  btn.addEventListener('click', function(){ setTool(btn.getAttribute('data-tool')); });
});

var swatchWrap = document.getElementById('swatches');
SWATCH_COLORS.forEach(function(c){
  var b = document.createElement('button');
  b.className = 'swatch';
  b.style.background = c;
  b.title = c;
  b.addEventListener('click', function(){
    state.color = c;
    document.getElementById('colorCustom').value = c;
    applyColorToSelection();
  });
  swatchWrap.appendChild(b);
});
function applyColorToSelection(){
  var els = getSelectedElements();
  var changed = false;
  els.forEach(function(el){ if ('color' in el){ el.color = state.color; changed = true; } });
  if (changed){ pushHistory(); render(); }
}

document.getElementById('colorCustom').addEventListener('input', function(e){
  state.color = e.target.value;
  applyColorToSelection();
});
document.getElementById('strokeRange').addEventListener('input', function(e){
  state.strokeWidth = parseInt(e.target.value, 10);
  var els = getSelectedElements();
  els.forEach(function(el){ if ('strokeWidth' in el) el.strokeWidth = state.strokeWidth; });
  render();
});
document.getElementById('strokeRange').addEventListener('change', function(){
  var els = getSelectedElements().filter(function(el){ return 'strokeWidth' in el; });
  if (els.length) pushHistory();
});

document.getElementById('btnFillToggle').addEventListener('click', function(){
  state.fillEnabled = !state.fillEnabled;
  var els = getSelectedElements().filter(function(el){ return el.type === 'rect' || el.type === 'ellipse'; });
  if (els.length){
    els.forEach(function(el){ el.fill = state.fillEnabled; if (!el.fillColor) el.fillColor = state.fillColor; });
    pushHistory();
  }
  updateInspectorUI();
  render();
});
document.getElementById('fillColor').addEventListener('input', function(e){
  state.fillColor = e.target.value;
  var els = getSelectedElements().filter(function(el){ return el.type === 'rect' || el.type === 'ellipse'; });
  els.forEach(function(el){ el.fillColor = state.fillColor; });
  render();
});
document.getElementById('fillColor').addEventListener('change', function(){
  var els = getSelectedElements().filter(function(el){ return el.type === 'rect' || el.type === 'ellipse'; });
  if (els.length) pushHistory();
});
document.getElementById('btnLockAspect').addEventListener('click', function(){
  var els = getSelectedElements().filter(function(el){ return el.type === 'rect' || el.type === 'ellipse' || el.type === 'image'; });
  if (!els.length) return;
  var newVal = !(els[0].lockAspect);
  els.forEach(function(el){ el.lockAspect = newVal; });
  pushHistory();
  updateInspectorUI();
});

document.getElementById('btnImage').addEventListener('click', function(){ fileInput.click(); });
fileInput.addEventListener('change', function(e){
  var files = e.target.files;
  for (var i = 0; i < files.length; i++) loadImageFile(files[i]);
  fileInput.value = '';
});

document.getElementById('btnUndo').addEventListener('click', undo);
document.getElementById('btnRedo').addEventListener('click', redo);
document.getElementById('btnDuplicate').addEventListener('click', duplicateSelection);
document.getElementById('btnCopyImage').addEventListener('click', function(){
  var single = state.selectedIds.length === 1 ? getElementById(state.selectedIds[0]) : null;
  copyImageToSystemClipboard(single);
});
document.getElementById('btnDelete').addEventListener('click', deleteSelected);
document.getElementById('btnClear').addEventListener('click', function(){
  if (state.elements.length === 0) return;
  if (confirm('ボード上のすべての内容を削除します。よろしいですか？')){
    state.elements = [];
    setSelection([]);
    pushHistory();
    render();
  }
});
document.getElementById('btnExport').addEventListener('click', exportPNG);

document.getElementById('zoomIn').addEventListener('click', function(){
  zoomAt({ x: canvas.clientWidth / 2, y: canvas.clientHeight / 2 }, 1.2);
  render();
});
document.getElementById('zoomOut').addEventListener('click', function(){
  zoomAt({ x: canvas.clientWidth / 2, y: canvas.clientHeight / 2 }, 1 / 1.2);
  render();
});
document.getElementById('zoomLabel').addEventListener('click', function(){
  state.scale = 1; state.panX = 0; state.panY = 0; render();
});

textEditor.addEventListener('input', autoGrowEditor);
textEditor.addEventListener('blur', commitTextEditor);
textEditor.addEventListener('keydown', function(e){
  e.stopPropagation();
  if (e.key === 'Escape'){ textEditor.value = ''; textEditor.blur(); }
});

window.addEventListener('resize', resizeCanvas);

/* ---------------- init ---------------- */
loadFromLocalStorage();
resizeCanvas();
history = [snapshot()];
historyIndex = 0;
updateToolbarUI();
setSelection([]);
document.getElementById('strokeRange').value = state.strokeWidth;
document.getElementById('fillColor').value = state.fillColor;
render();

})();
</script>
</body>
</html>
