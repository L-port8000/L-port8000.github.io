<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <title>o - I Browser</title>
    <link rel="icon" href="../images/browser.html.png">
    <link rel="apple-touch-icon" href="https://site.l-ituki8000.workers.dev/images/browser.html.png">
    <meta name="apple-mobile-web-app-title" content="IBrowser">
    <style>
        :root {
            --bg-color: #f9f9fb;
            --toolbar-bg: #ffffff;
            --text-color: #15141a;
            --border-color: #cfcfd8;
            --accent: #0060df;
            --tor-color: #7d4698;
            --tab-card-bg: #ffffff;
            --app-height: 100vh;
            --safe-area-bottom: env(safe-area-inset-bottom, 0px);
            --safe-area-top: env(safe-area-inset-top, 0px);
        }
        body.dark-mode, html.dark-mode {
            --bg-color: #1c1b22;
            --toolbar-bg: #2b2a33;
            --text-color: #fbfbfe;
            --border-color: #52525e;
            --accent: #00ddff;
            --tor-color: #9d66b8;
            --tab-card-bg: #42414d;
        }
        * { box-sizing: border-box; }
        html { background: var(--bg-color); }
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            height: var(--app-height, 100vh);
            overflow: hidden;
        }

        /* ---- プログレスバー ---- */
        #progress-container { position: absolute; top: 0; left: 0; width: 100%; height: 3px; z-index: 1000; pointer-events: none; }
        #progress-bar { width: 0%; height: 100%; background: var(--accent); transition: width 0.3s ease; }

        /* ---- メインコンテナ ---- */
        #main-container { flex: 1; min-height: 0; position: relative; overflow: hidden; }
        .page-element { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; display: none; background: white; }
        .page-element.active { display: block; }

        /* ---- iframe ラッパー / ズーム ---- */
        .frame-wrap { overflow: hidden; -webkit-overflow-scrolling: touch; }
        .frame-el {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%;
            border: none; background: #fff;
            transform-origin: 0 0;
            will-change: transform;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
        }
        .frame-spacer { pointer-events: none; }

        /* ---- ブックマークバー ---- */
        #bookmark-bar {
            background: var(--toolbar-bg);
            border-top: 1px solid var(--border-color);
            padding: 8px 12px;
            display: none;
            gap: 12px;
            overflow-x: auto;
            white-space: nowrap;
            scrollbar-width: none;
            z-index: 90;
        }
        #bookmark-bar.visible { display: flex; }
        #bookmark-bar::-webkit-scrollbar { display: none; }
        .bm-item {
            display: flex; align-items: center; gap: 6px;
            background: rgba(128,128,128,0.1);
            padding: 6px 12px; border-radius: 16px;
            font-size: 13px; cursor: pointer; flex-shrink: 0;
        }
        .bm-item img { width: 14px; height: 14px; border-radius: 2px; }

        /* ---- ツールバー ---- */
        #toolbar {
            background: var(--toolbar-bg);
            border-top: 1px solid var(--border-color);
            padding: 8px 12px calc(8px + var(--safe-area-bottom));
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 100;
        }
        #url-container {
            flex: 1;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            display: flex;
            align-items: center;
            padding: 8px 16px;
        }
        #url {
            flex: 1; border: none; background: transparent;
            color: var(--text-color); font-size: 16px; outline: none; width: 100%;
        }
        .icon-btn {
            background: transparent; border: none; color: var(--text-color);
            font-size: 20px; cursor: pointer; padding: 4px;
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
        }
        .icon-btn:disabled { opacity: 0.3; }
        #tab-count-btn {
            border: 2px solid var(--text-color);
            border-radius: 6px;
            width: 24px; height: 24px;
            font-size: 13px; font-weight: bold;
        }

        #url-container { position: relative; }
        #url-suggestions {
            position: absolute; bottom: 100%; left: 0; right: 0;
            background: var(--toolbar-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px 12px 0 0;
            max-height: 250px; overflow-y: auto;
            display: none; z-index: 500;
            box-shadow: 0 -4px 16px rgba(0,0,0,0.15);
        }
        #url-suggestions.show { display: block; }

        .toolbar-top #url-suggestions {
            top: 100%; bottom: auto;
            border-radius: 0 0 12px 12px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.15);
        }
        .toolbar-top #toolbar { order: -1; }
        .toolbar-top #bookmark-bar { order: 0; }
        .toolbar-top #main-container { order: 1; }
        .toolbar-top #bookmark-bar { border-top: none; border-bottom: 1px solid var(--border-color); }
        .toolbar-top #toolbar { border-top: none; border-bottom: 1px solid var(--border-color); padding: calc(8px + var(--safe-area-top)) 12px 8px; }
        .toolbar-bottom #toolbar { border-top: 1px solid var(--border-color); border-bottom: none; padding: 8px 12px calc(8px + var(--safe-area-bottom)); }
        .url-suggestion {
            display: flex; align-items: center; gap: 8px;
            padding: 10px 12px; cursor: pointer; font-size: 14px;
            border-bottom: 1px solid var(--border-color);
        }
        .url-suggestion:last-child { border-bottom: none; }
        .url-suggestion:hover, .url-suggestion.highlighted { background: rgba(128,128,128,0.1); }
        .url-suggestion img { width: 14px; height: 14px; flex-shrink: 0; }
        .url-suggestion .sug-title { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 14px; }
        .url-suggestion .sug-url { font-size: 11px; opacity: 0.5; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

        /* ---- メニューオーバーレイ ---- */
        #menu-overlay {
            position: fixed;
            bottom: calc(70px + var(--safe-area-bottom));
            right: 12px;
            background: var(--toolbar-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.2);
            display: none;
            flex-direction: column;
            width: 220px;
            z-index: 200;
            overflow: hidden;
        }
        .menu-item {
            padding: 14px 16px; display: flex; align-items: center; gap: 12px;
            font-size: 15px; cursor: pointer; border-bottom: 1px solid var(--border-color);
        }
        .menu-item:last-child { border-bottom: none; }
        .menu-item:active { background: rgba(128,128,128,0.1); }
        .star-active { color: #f1c40f; }

        /* ---- ズームパネル ---- */
        #zoom-panel {
            position: fixed;
            bottom: calc(70px + var(--safe-area-bottom));
            left: 50%;
            transform: translateX(-50%);
            background: var(--toolbar-bg);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.2);
            display: none;
            align-items: center;
            gap: 2px;
            padding: 6px 8px;
            z-index: 210;
            white-space: nowrap;
        }
        #zoom-panel.show { display: flex; }
        .zoom-btn {
            background: transparent; border: none; color: var(--text-color);
            font-size: 18px; padding: 6px 12px; border-radius: 16px; cursor: pointer;
        }
        .zoom-btn:active { background: rgba(128,128,128,0.18); }
        .zoom-value {
            background: transparent; border: none; color: var(--text-color);
            font-size: 15px; font-weight: 700; min-width: 64px; padding: 6px 2px; cursor: pointer;
        }
        #zoom-fit-btn.off { opacity: 0.3; }
        .toolbar-top #zoom-panel { bottom: auto; top: calc(70px + var(--safe-area-top)); }

        /* ---- タブスイッチャー ---- */
        #tab-switcher {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg-color); z-index: 1000;
            display: none; flex-direction: column;
        }
        #tab-switcher.active { display: flex; }
        #tab-switcher-header {
            padding: 16px; display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid var(--border-color); background: var(--toolbar-bg);
            padding-top: calc(16px + var(--safe-area-top));
        }
        #tab-grid {
            flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 16px;
            padding: 16px; overflow-y: auto;
        }
        .tab-card {
            background: var(--tab-card-bg); border: 1px solid var(--border-color); border-radius: 12px;
            aspect-ratio: 3/4; display: flex; flex-direction: column; overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05); position: relative;
        }
        .tab-card.active { border: 2px solid var(--accent); }
        .tab-card-header {
            padding: 8px 10px; display: flex; align-items: center; gap: 6px;
            font-size: 12px; border-bottom: 1px solid var(--border-color); background: var(--toolbar-bg);
        }
        .tab-card-header img { width: 14px; height: 14px; }
        .tab-card-header span { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .tab-close-x { font-size: 20px; padding: 0 4px; color: var(--text-color); cursor: pointer; }
        .tab-card-body {
            flex: 1; background: rgba(128,128,128,0.05);
            display: flex; align-items: center; justify-content: center;
            color: #888; font-size: 10px; cursor: pointer;
        }

        /* ---- 設定ページ ---- */
        .settings-page {
            padding: 20px; overflow-y: auto;
            background: var(--bg-color) !important;
            color: var(--text-color);
        }

        /* =====================================================
           ニュータブページ（シンプル版）
        ==================================================== */
        .newtab-page {
            background: var(--bg-color) !important;
            overflow-y: auto;
            box-sizing: border-box;
            flex-direction: column;
            align-items: center;
            padding: 36px 20px 40px;
        }
        .page-element.newtab-page.active {
            display: flex;
        }
        .nt-header { text-align: center; margin-bottom: 28px; }
        .nt-clock { font-size: 60px; font-weight: 200; letter-spacing: 3px; line-height: 1; margin-bottom: 6px; }
        .nt-date  { font-size: 13px; opacity: 0.45; }
        .nt-search-row { display: flex; gap: 8px; width: 100%; max-width: 520px; margin: 0 auto 36px; align-self: center; }
        .nt-search-row input {
            flex: 1; padding: 11px 20px; border-radius: 24px;
            border: 1px solid var(--border-color); background: var(--toolbar-bg);
            color: var(--text-color); font-size: 16px; outline: none;
        }
        .nt-search-row input:focus { border-color: var(--accent); }
        .nt-search-row button {
            padding: 11px 22px; border-radius: 24px;
            background: var(--accent); color: #fff; border: none; font-size: 13px;
        }
        .nt-body { width: 100%; max-width: 920px; }
        .nt-top-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
        .nt-top-bar h3 { margin: 0; font-size: 13px; font-weight: 600; opacity: 0.5; text-transform: uppercase; letter-spacing: 1px; }
        .nt-categories { display: flex; flex-direction: column; gap: 22px; }
        .nt-cat-header { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
        .nt-cat-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 1.2px; opacity: 0.4; flex: 1; }
        .nt-links { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
        .nt-link {
            display: flex; align-items: center; gap: 8px;
            padding: 10px 20px; border-radius: 8px; border: 1px solid var(--border-color);
            background: var(--toolbar-bg); cursor: pointer; font-size: 13px;
            transition: border-color 0.15s, background 0.15s; position: relative;
            white-space: nowrap;
        }
        .nt-link:hover { border-color: var(--accent); }
        .nt-link img { width: 14px; height: 14px; flex-shrink: 0; }

        /* ---- 設定・共通カード ---- */
        .card { background: var(--toolbar-bg); padding: 16px; border-radius: 12px; border: 1px solid var(--border-color); margin-bottom: 16px; }
        .card h3 { margin-top: 0; margin-bottom: 12px; font-size: 16px; color: var(--accent); border-bottom: 1px solid var(--border-color); padding-bottom: 8px; }
        .proxy-item { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; padding-bottom: 12px; border-bottom: 1px solid var(--border-color); }
        .proxy-item:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
        .status-connected { color: #28a745; font-weight: bold; font-size: 12px; margin-right: 8px; }
        select, input[type="text"] { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--border-color); background: var(--bg-color); color: var(--text-color); font-size: 16px; margin-bottom: 8px; }
        input[type="range"] { accent-color: var(--accent); }
        button.btn { padding: 8px 16px; border-radius: 8px; border: 1px solid var(--border-color); background: rgba(128,128,128,0.1); color: inherit; font-size: 14px; cursor: pointer; }
        button.btn-primary { background: var(--accent); color: white; border: none; width: 100%; padding: 12px; font-weight: bold; border-radius: 8px; margin-top: 10px; cursor: pointer; }
        button.btn-danger { border-color: #c00; color: #c00; }
        .preset-group { display: flex; flex-wrap: wrap; gap: 8px; }
        .range-row { display: flex; align-items: center; gap: 10px; }
        .range-row input[type="range"] { flex: 1; margin: 0; }
        .range-bound { font-size: 12px; opacity: 0.6; }
        .range-value { text-align: center; font-size: 22px; font-weight: 600; margin: 8px 0 10px; }
        .hint { font-size: 12px; opacity: 0.55; margin: 8px 0 0; line-height: 1.5; }

        /* ---- モーダル ---- */
        .modal-overlay {
            display: none; position: fixed; inset: 0;
            background: rgba(0,0,0,0.5); z-index: 3000;
            align-items: center; justify-content: center;
        }
        .modal-overlay.open { display: flex; }
        .modal-box {
            background: var(--toolbar-bg); padding: 24px; border-radius: 16px;
            border: 1px solid var(--border-color); min-width: 280px; max-width: 360px;
            width: 90%; color: var(--text-color);
        }
        .modal-box h3 { margin: 0 0 16px; font-size: 15px; }
        .modal-box input, .modal-box select { width: 100%; margin-bottom: 12px; }
        .modal-btns { display: flex; gap: 8px; justify-content: flex-end; margin-top: 4px; }
        .modal-ok { background: var(--accent) !important; color: #fff !important; border-color: var(--accent) !important; }

        /* ---- フルスクリーン ---- */
        #fs-close-btn {
            position: fixed; top: 15px; right: 15px; z-index: 9999;
            width: 40px; height: 40px; background: rgba(0,0,0,0.5); color: white;
            border: none; border-radius: 50%; display: none;
            font-size: 24px; line-height: 1; justify-content: center; align-items: center; cursor: pointer;
        }
        :fullscreen #bookmark-bar, :fullscreen #toolbar,
        :-webkit-full-screen #bookmark-bar, :-webkit-full-screen #toolbar,
        .pseudo-fullscreen #bookmark-bar, .pseudo-fullscreen #toolbar { display: none !important; }
        :fullscreen #fs-close-btn, :-webkit-full-screen #fs-close-btn,
        .pseudo-fullscreen #fs-close-btn { display: flex; }
    </style>
</head>
<body>

<div id="progress-container"><div id="progress-bar"></div></div>
<button id="fs-close-btn" onclick="exitFullscreen()">×</button>

<!-- プロファイルモーダル -->
<div id="profile-modal" class="modal-overlay">
    <div class="modal-box">
        <h3>新規プロファイル</h3>
        <input id="profile-name-input" type="text" placeholder="プロファイル名">
        <div class="modal-btns">
            <button class="btn" onclick="closeProfileModal()">キャンセル</button>
            <button class="btn modal-ok" onclick="confirmCreateProfile()">作成</button>
        </div>
    </div>
</div>

<!-- スクリーンショットモーダル -->
<div id="screenshot-modal" class="modal-overlay">
    <div class="modal-box">
        <h3>📷 スクリーンショット</h3>
        <p style="font-size:13px;margin-bottom:16px;opacity:0.7;">キャプチャ方法を選択</p>
        <button class="btn modal-ok" onclick="takeViewportScreenshot();toggleMenu();" style="width:100%;margin-bottom:8px;padding:12px;font-size:14px;">🖥 現在表示中の画面</button>
        <button class="btn" onclick="takeFullScreenshot();toggleMenu();" style="width:100%;padding:12px;font-size:14px;">📄 iframeサイト全体</button>
    </div>
</div>

<!-- ブックマーク名編集モーダル -->
<div id="bookmark-modal" class="modal-overlay">
    <div class="modal-box">
        <h3>ブックマーク名を編集</h3>
        <input id="bm-name-input" type="text" placeholder="ブックマーク名">
        <div class="modal-btns">
            <button class="btn" onclick="closeBookmarkModal()">キャンセル</button>
            <button class="btn modal-ok" onclick="confirmBookmark()">保存</button>
        </div>
    </div>
</div>

<!-- JSON 表示・貼り付けモーダル -->
<div id="json-modal" class="modal-overlay">
    <div class="modal-box" style="max-width:560px;">
        <h3 id="json-modal-title">JSON</h3>
        <textarea id="json-modal-text" spellcheck="false" style="width:100%;height:210px;font-family:monospace;font-size:16px;line-height:1.4;border-radius:8px;border:1px solid var(--border-color);background:var(--bg-color);color:var(--text-color);padding:8px;resize:vertical;"></textarea>
        <div class="modal-btns" style="justify-content:space-between;flex-wrap:wrap;gap:6px;">
            <button class="btn" onclick="copyJSONModal()">📋 コピー</button>
            <div style="display:flex;gap:6px;">
                <button class="btn" onclick="importFromModal()">📥 インポート</button>
                <button class="btn modal-ok" onclick="closeJSONModal()">閉じる</button>
            </div>
        </div>
    </div>
</div>

<!-- タブスイッチャー -->
<div id="tab-switcher">
    <div id="tab-switcher-header">
        <button class="icon-btn" onclick="toggleTabSwitcher()">✕</button>
        <span style="font-weight: bold; font-size: 16px;">開いているタブ</span>
        <button class="icon-btn" onclick="createNewTab(); toggleTabSwitcher();">＋</button>
    </div>
    <div id="tab-grid"></div>
</div>

<!-- メインコンテナ -->
<div id="main-container">
    <div id="view"></div>
</div>

<!-- メニューオーバーレイ -->
<div id="menu-overlay">
    <div class="menu-item" onclick="navForward(); toggleMenu();">
        <span style="width:24px;text-align:center;">▶</span> 進む
    </div>
    <div class="menu-item" onclick="navReload(); toggleMenu();">
        <span style="width:24px;text-align:center;">⟳</span> 更新
    </div>
    <div class="menu-item" onclick="goHome(); toggleMenu();">
        <span style="width:24px;text-align:center;">🏠</span> ホーム
    </div>
    <div class="menu-item" onclick="toggleBookmark(); toggleMenu();">
        <span id="menu-star" style="width:24px;text-align:center;font-size:20px;">★</span> ブックマーク
    </div>
    <div class="menu-item" onclick="toggleZoomPanel(); toggleMenu();">
        <span style="width:24px;text-align:center;">🔍</span> ズーム
    </div>
    <div class="menu-item" onclick="toggleFullscreen(); toggleMenu();">
        <span style="width:24px;text-align:center;">⛶</span> フルスクリーン
    </div>
    <div class="menu-item" onclick="openSettings(); toggleMenu();">
        <span style="width:24px;text-align:center;">⚙️</span> 設定
    </div>
    <div class="menu-item" onclick="takeScreenshot(); toggleMenu();">
        <span style="width:24px;text-align:center;">📷</span> スクリーンショット
    </div>
    <div class="menu-item" onclick="toggleDarkMode(); toggleMenu();">
        <span style="width:24px;text-align:center;">🌓</span> ダークモード
    </div>
</div>

<!-- ズームパネル -->
<div id="zoom-panel">
    <button class="zoom-btn" onclick="zoomStep(-10)">−</button>
    <button class="zoom-value" onclick="setZoom(100)"><span id="zoom-value">100%</span></button>
    <button class="zoom-btn" onclick="zoomStep(10)">＋</button>
    <button class="zoom-btn" id="zoom-fit-btn" onclick="toggleZoomFit()" title="横幅に合わせる（自動フィット）">⇔</button>
    <button class="zoom-btn" onclick="toggleZoomPanel()" title="閉じる">✕</button>
</div>

<!-- ブックマークバー -->
<div id="bookmark-bar"></div>

<!-- ツールバー -->
<div id="toolbar">
    <button class="icon-btn" onclick="navBack()" id="btn-back">◀</button>
    <div id="url-container">
        <input id="url" type="text" placeholder="検索またはアドレス入力" inputmode="url" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
        <div id="url-suggestions"></div>
    </div>
    <button id="tab-count-btn" class="icon-btn" onclick="toggleTabSwitcher()">1</button>
    <button class="icon-btn" onclick="toggleMenu()">⋮</button>
</div>

<script>

let suggestionData = [];
let suggestionIndex = -1;

function updateSuggestions() {
    const input = document.getElementById('url');
    const container = document.getElementById('url-suggestions');
    const query = input.value.trim().toLowerCase();

    if (!query || SPECIAL_URLS.some(s => query.startsWith(s))) {
        container.classList.remove('show');
        suggestionIndex = -1;
        return;
    }

    const h = settings.history || [];
    suggestionData = h.filter(item =>
        (item.title && item.title.toLowerCase().includes(query)) ||
        (item.url && item.url.toLowerCase().includes(query))
    ).slice(0, 5);

    if (suggestionData.length === 0) {
        container.classList.remove('show');
        suggestionIndex = -1;
        return;
    }

    container.innerHTML = suggestionData.map((item, i) =>
        '<div class="url-suggestion" data-index="' + i + '" onclick="navigateSuggestion(' + i + ')">' +
            '<img src="' + getIconUrl(item.url) + '" onerror="this.style.display=\'none\'">' +
            '<div style="flex:1;overflow:hidden;">' +
                '<div class="sug-title">' + esc(item.title) + '</div>' +
                '<div class="sug-url">' + esc(item.url) + '</div>' +
            '</div>' +
        '</div>'
    ).join('');

    container.classList.add('show');
    suggestionIndex = -1;
}

function navigateSuggestion(i) {

async function takeViewportScreenshot() {
    closeScreenshotModal();
    try {
        const stream = await navigator.mediaDevices.getDisplayMedia({ preferCurrentTab: true });
        const video = document.createElement('video');
        video.srcObject = stream;
        await video.play();
        const canvas = document.createElement('canvas');
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        canvas.getContext('2d').drawImage(video, 0, 0);
        stream.getTracks().forEach(t => t.stop());
        const link = document.createElement('a');
        link.download = 'screenshot-' + Date.now() + '.png';
        link.href = canvas.toDataURL();
        link.click();
    } catch(e) {
        if (e.name !== 'NotAllowedError') alert('スクリーンショットに失敗しました: ' + e.message);
    }
}

async function takeFullScreenshot() {
    closeScreenshotModal();
    const tab = tabs.find(t => t.id === activeTabId);
    if (!tab || !tab.frame) {
        alert('iframeサイトが開かれていません。現在表示中の画面でキャプチャします。');
        takeViewportScreenshot();
        return;
    }

    // Method 1: Canvas drawImage (works for same-origin iframes)
    try {
        const iframe = tab.frame;
        const doc = iframe.contentDocument || iframe.contentWindow.document;
        const body = doc.body;
        const html = doc.documentElement;
        const width = Math.max(body.scrollWidth, body.offsetWidth, html.scrollWidth, html.offsetWidth, html.clientWidth);
        const height = Math.max(body.scrollHeight, body.offsetHeight, html.scrollHeight, html.offsetHeight, html.clientHeight);
        if (width === 0 || height === 0) throw new Error('Empty');
        const canvas = document.createElement('canvas');
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#fff';
        ctx.fillRect(0, 0, width, height);
        ctx.drawImage(iframe, 0, 0, width, height);
        const link = document.createElement('a');
        link.download = 'screenshot-full-' + Date.now() + '.png';
        link.href = canvas.toDataURL();
        link.click();
        return;
    } catch(e) {}

    // Method 2: Fetch page through a CORS proxy → same-origin blob iframe → canvas
    try {
        const url = tab.url;
        const proxyUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`;
        const resp = await fetch(proxyUrl);
        const html = await resp.text();
        if (html.length < 100) throw new Error('Empty response');
        const blob = new Blob([html], { type: 'text/html' });
        const blobUrl = URL.createObjectURL(blob);
        const tempFrame = document.createElement('iframe');
        tempFrame.style.cssText = 'position:absolute;left:-9999px;top:0;width:1024px;height:1px;border:none;';
        tempFrame.src = blobUrl;
        document.body.appendChild(tempFrame);
        await new Promise((resolve, reject) => {
            const t = setTimeout(() => reject(new Error('Timeout')), 10000);
            tempFrame.onload = () => { clearTimeout(t); setTimeout(resolve, 1000); };
        });
        const d = tempFrame.contentDocument || tempFrame.contentWindow.document;
        const b = d.body, h = d.documentElement;
        const fw = Math.max(b.scrollWidth, b.offsetWidth, h.scrollWidth, h.offsetWidth, h.clientWidth, 1024);
        const fh = Math.max(b.scrollHeight, b.offsetHeight, h.scrollHeight, h.offsetHeight, h.clientHeight, 1);
        tempFrame.style.width = fw + 'px';
        tempFrame.style.height = fh + 'px';
        await new Promise(r => setTimeout(r, 300));
        const canvas = document.createElement('canvas');
        canvas.width = fw;
        canvas.height = fh;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#fff';
        ctx.fillRect(0, 0, fw, fh);
        ctx.drawImage(tempFrame, 0, 0, fw, fh);
        tempFrame.remove();
        URL.revokeObjectURL(blobUrl);
        const link = document.createElement('a');
        link.download = 'screenshot-full-' + Date.now() + '.png';
        link.href = canvas.toDataURL();
        link.click();
        return;
    } catch(e) {}

    // Method 3: Open in popup → getDisplayMedia (user selects the popup)
    try {
        const popup = window.open(tab.url, '_blank', 'width=1024,height=768,scrollbars=yes');
        if (!popup) {
            alert('ポップアップがブロックされました。現在表示中の画面でキャプチャします。');
            takeViewportScreenshot();
            return;
        }
        await new Promise(r => setTimeout(r, 3000));
        alert('新しいウィンドウが開きました。\n画面選択ダイアログでそのウィンドウを選択して「共有」をクリックしてください。');
        const stream = await navigator.mediaDevices.getDisplayMedia();
        const video = document.createElement('video');
        video.srcObject = stream;
        await video.play();
        const canvas = document.createElement('canvas');
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        canvas.getContext('2d').drawImage(video, 0, 0);
        stream.getTracks().forEach(t => t.stop());
        try { popup.close(); } catch(e) {}
        const link = document.createElement('a');
        link.download = 'screenshot-full-' + Date.now() + '.png';
        link.href = canvas.toDataURL();
        link.click();
    } catch(e) {
        if (e.name !== 'NotAllowedError') alert('スクリーンショットに失敗しました: ' + e.message);
    }
}

/* ======================================================
   ズーム（1% 〜 500%） / 画面の高さ
====================================================== */
function getActiveTab() { return tabs.find(t => t.id === activeTabId); }

function clampZoom(v) {
    v = Number(v);
    if (!isFinite(v) || v <= 0) v = 100;
    return Math.max(1, Math.min(500, Math.round(v)));
}

let zoomRaf = null;
function scheduleZoom() {
    if (zoomRaf) return;
    zoomRaf = requestAnimationFrame(() => { zoomRaf = null; applyZoom(); });
}

/**
 * iframe の表示倍率を適用する。
 *  zoomFit = true : iframe のレイアウト幅を「画面幅 / 倍率」にするので、
 *                   拡大しても横幅はちょうど画面に収まり、中のサイトも再レイアウトされる。
 *  zoomFit = false: 画面幅を固定したまま拡大し、はみ出した分をスクロールできる（拡大鏡モード）。
 */
function applyZoom(tab) {
    // 表示中のタブだけでなく全タブを同じ倍率に揃えるため、常に見えている
    // メインコンテナのサイズを基準にする（非表示タブでも正しく計算できる）。
    const mc = document.getElementById('main-container');
    if (!mc) return;
    const rect = mc.getBoundingClientRect();
    const vw = Math.round(rect.width);
    const vh = Math.round(rect.height);
    if (vw < 1 || vh < 1) return;

    const targets = tab ? [tab] : tabs.slice();
    targets.forEach(t => applyZoomTo(t, vw, vh));
}

function applyZoomTo(tab, vw, vh) {
    if (!tab || !tab.frame || !tab.element) return;
    const wrap = tab.element;
    const frame = tab.frame;
    const z = clampZoom(settings.zoom) / 100;
    const offY = clampOffset(settings.contentOffsetY);
    let availH = vh - offY;
    if (availH < 40) availH = 40;

    frame.style.transformOrigin = '0 0';
    frame.style.transform = 'scale(' + z + ')';
    frame.style.position = 'absolute';
    frame.style.left = '0';
    frame.style.top = offY + 'px';

    if (settings.zoomFit) {
        if (wrap._spacer) wrap._spacer.style.display = 'none';
        frame.style.width  = (vw / z) + 'px';
        frame.style.height = (availH / z) + 'px';
        wrap.style.overflow = 'hidden';
    } else {
        frame.style.width  = vw + 'px';
        frame.style.height = availH + 'px';
        let sp = wrap._spacer;
        if (!sp) {
            sp = document.createElement('div');
            sp.className = 'frame-spacer';
            wrap.appendChild(sp);
            wrap._spacer = sp;
        }
        sp.style.display = 'block';
        sp.style.marginTop = Math.max(0, offY) + 'px';
        sp.style.width  = Math.round(vw * z) + 'px';
        sp.style.height = Math.round(availH * z) + 'px';
        wrap.style.overflow = 'auto';
    }
}

function setZoom(v) {
    settings.zoom = clampZoom(v);
    scheduleZoom();
    updateZoomUI();
    saveSoon();
}

function zoomStep(delta) { setZoom(clampZoom(settings.zoom) + delta); }

function toggleZoomFit() {
    settings.zoomFit = !settings.zoomFit;
    applyZoom();
    updateZoomUI();
    saveState();
}

function toggleZoomPanel() {
    const p = document.getElementById('zoom-panel');
    p.classList.toggle('show');

}

function updateZoomUI() {
    const z = clampZoom(settings.zoom);
    const zv = document.getElementById('zoom-value');
    if (zv) zv.textContent = z + '%';
    const rng = document.getElementById('set-zoom');
    if (rng && String(rng.value) !== String(z)) rng.value = z;
    const lbl = document.getElementById('set-zoom-label');
    if (lbl) lbl.textContent = z + '%';
    const fit = document.getElementById('zoom-fit-btn');
    if (fit) fit.classList.toggle('off', !settings.zoomFit);
}

/* ---- 画面の高さ（±0 基準の px オフセット） ---- */
const OFFSET_MIN = -400;
const OFFSET_MAX = 400;

function clampOffset(v) {
    v = Number(v);
    if (!isFinite(v)) v = 0;
    return Math.max(OFFSET_MIN, Math.min(OFFSET_MAX, Math.round(v)));
}

function fmtOffset(v) {
    v = clampOffset(v);
    if (v > 0) return '＋' + v + 'px';
    if (v < 0) return '−' + Math.abs(v) + 'px';
    return '±0px';
}

function applyAppHeight() {
    const off = clampOffset(settings.heightOffset);
    settings.heightOffset = off;
    document.documentElement.style.setProperty('--app-height', 'calc(100vh + ' + off + 'px)');
}

function setAppHeight(v) {
    settings.heightOffset = clampOffset(v);
    applyAppHeight();
    const lbl = document.getElementById('set-height-label');
    if (lbl) lbl.textContent = fmtOffset(settings.heightOffset);
    const rng = document.getElementById('set-height');
    if (rng && String(rng.value) !== String(settings.heightOffset)) rng.value = settings.heightOffset;
    saveSoon();
}

function heightStep(delta) { setAppHeight(clampOffset(settings.heightOffset) + delta); }

/* ---- iframe(コンテンツ)の上下位置 ---- */
function setContentOffsetY(v) {
    settings.contentOffsetY = clampOffset(v);
    applyZoom();
    const lbl = document.getElementById('set-content-y-label');
    if (lbl) lbl.textContent = fmtOffset(settings.contentOffsetY);
    const rng = document.getElementById('set-content-y');
    if (rng && String(rng.value) !== String(settings.contentOffsetY)) rng.value = settings.contentOffsetY;
    saveSoon();
}

function contentYStep(delta) { setContentOffsetY(clampOffset(settings.contentOffsetY) + delta); }

function resetContentOffsetY() { setContentOffsetY(0); }

/* ---- 二本指ピンチズーム ---- */
let pinchState = null;
let safariPinch = null;

function touchDistance(t1, t2) {
    const dx = t1.clientX - t2.clientX;
    const dy = t1.clientY - t2.clientY;
    return Math.hypot(dx, dy) || 1;
}

function canCustomZoom() {
    const tab = getActiveTab();
    return !!(settings.pinchZoom && tab && tab.frame);
}

function onPinchStart(e) {
    if (e.touches && e.touches.length === 2 && canCustomZoom()) {
        pinchState = { startDist: touchDistance(e.touches[0], e.touches[1]), startZoom: clampZoom(settings.zoom) };
    } else {
        pinchState = null;
    }
}

function onPinchMove(e) {
    if (!pinchState || !e.touches || e.touches.length !== 2) return;
    const d = touchDistance(e.touches[0], e.touches[1]);
    setZoom(pinchState.startZoom * (d / pinchState.startDist));
    if (e.cancelable) e.preventDefault();
}

function onPinchEnd() {
    if (pinchState) saveState();
    pinchState = null;
}

function initZoomGestures() {
    document.addEventListener('touchstart', onPinchStart, { passive: true });
    document.addEventListener('touchmove', onPinchMove, { passive: false });
    document.addEventListener('touchend', onPinchEnd, { passive: true });
    document.addEventListener('touchcancel', onPinchEnd, { passive: true });

    // Safari (iOS) の gesture イベント
    document.addEventListener('gesturestart', e => {
        if (!canCustomZoom()) return;
        safariPinch = { startZoom: clampZoom(settings.zoom), startScale: e.scale || 1 };
        e.preventDefault();
    });
    document.addEventListener('gesturechange', e => {
        if (!safariPinch) return;
        setZoom(safariPinch.startZoom * ((e.scale || 1) / safariPinch.startScale));
        e.preventDefault();
    });
    document.addEventListener('gestureend', () => { if (safariPinch) saveState(); safariPinch = null; });

    // PC / 確認用: Ctrl + ホイール
    window.addEventListener('wheel', e => {
        if (!e.ctrlKey || !canCustomZoom()) return;
        e.preventDefault();
        setZoom(clampZoom(settings.zoom) * (e.deltaY < 0 ? 1.1 : 0.9));
    }, { passive: false });

    window.addEventListener('resize', () => { applyZoom(); });
    window.addEventListener('orientationchange', () => { setTimeout(() => applyZoom(), 250); });
}

function createTabObject(url, id = Date.now(), title = "読み込み中...", history = null, hIndex = 0) {
    if (url === "newtab://") title = "新しいタブ";
    const tab = { id, url, title, history: history || [url], historyIndex: hIndex, element: null, frame: null, spacer: null };
    updateTabElement(tab);
    tabs.push(tab);
    return tab;
}

function updateTabElement(tab) {
    if (tab.element) tab.element.remove();
    tab.frame = null;
    tab.spacer = null;
    const viewArea = document.getElementById('view');
    let el;

    if (tab.url === "settings://") {
        el = document.createElement('div');
        el.className = "page-element settings-page";
        tab.title = "設定";
        renderSettingsInto(el);
    } else if (tab.url === "newtab://") {
        el = document.createElement('div');
        el.className = "page-element newtab-page";
        tab.title = "新しいタブ";
        renderNewtabInto(el);
    } else if (tab.url === "history://") {
        el = document.createElement('div');
        el.className = "page-element settings-page";
        tab.title = "履歴";
        renderHistoryInto(el);
    } else if (tab.url === "cookie://") {
        el = document.createElement('div');
        el.className = "page-element settings-page";
        tab.title = "Cookie管理";
        renderCookiesInto(el);
    } else {
        const finalUrl = getEffectiveUrl(tab.url);
        const wrap = document.createElement('div');
        wrap.className = "page-element frame-wrap";
        let frame;
        if (settings.viewMode === "iframe") {
            frame = document.createElement('iframe');
            frame.setAttribute("sandbox", getSandbox());
        } else {
            frame = document.createElement(settings.viewMode === "object" ? "object" : "embed");
            frame.type = "text/html";
            frame.data = finalUrl;
        }
        frame.className = "frame-el";
        frame.src = finalUrl;
        wrap.appendChild(frame);
        el = wrap;
        tab.frame = frame;
        setProgress(30);
        frame.onload = () => {
            setProgress(100);
            try { tab.title = frame.contentDocument.title || new URL(tab.url).hostname; }
            catch(e) { tab.title = tab.url.replace(/https?:\/\//, '').split('/')[0]; }
            applyZoom(tab);
            updateStarUI(); saveState();
            if (document.getElementById('tab-switcher').classList.contains('active')) renderTabGrid();
        };
    }
    el.id = `page-${tab.id}`;
    if (tab.id === activeTabId) el.classList.add('active');
    viewArea.appendChild(el);
    tab.element = el;
    if (tab.frame) applyZoom(tab);
}

function switchTab(id) {
    const prev = tabs.find(t => t.id === activeTabId);
    if (prev && prev.element) prev.element._st = prev.element.scrollTop;
    activeTabId = id;
    tabs.forEach(t => {
        const active = t.id === id;
        t.element.classList.toggle('active', active);
        if (active) {
            document.getElementById('url').value = t.url;
            requestAnimationFrame(() => {
                if (t.element) t.element.scrollTop = t.element._st || 0;
                applyZoom(t);
            });
        }
    });
    updateNavButtons(); updateStarUI(); saveState();
}

function go() {
    let url = document.getElementById('url').value.trim();
    if (SPECIAL_URLS.includes(url)) {
    } else if (!url.startsWith('http')) {
        if (url.includes('.') && !url.includes(' ')) url = "https://" + url;
        else url = "https://www.google.com/search?q=" + encodeURIComponent(url);
    }
    const tab = tabs.find(t => t.id === activeTabId);
    if (tab.url !== url || SPECIAL_URLS.includes(url)) {
        if (tab.url !== url) {
            tab.history = tab.history.slice(0, tab.historyIndex + 1);
            tab.history.push(url); tab.historyIndex++; tab.url = url;
            if (isAdUrl(url)) { alert('広告サイトのためブロックしました: ' + url); tab.url = tab.history[tab.historyIndex - 1] || tab.url; updateTabElement(tab); switchTab(tab.id); return; }
            addHistory(url, tab.title);
        }
        updateTabElement(tab); switchTab(tab.id);
    }
    document.getElementById('url').blur();
}

document.getElementById("url").addEventListener("input", updateSuggestions);
document.getElementById("url").addEventListener("focus", updateSuggestions);
document.getElementById("url").addEventListener("keydown", e => {
    const container = document.getElementById('url-suggestions');
    const items = container.querySelectorAll('.url-suggestion');
    if (e.key === "Enter") {
        if (suggestionIndex >= 0 && items[suggestionIndex]) {
            e.preventDefault();
            items[suggestionIndex].click();
        } else {
            go();
        }
        container.classList.remove('show');
    } else if (e.key === "ArrowDown") {
        e.preventDefault();
        suggestionIndex = Math.min(suggestionIndex + 1, items.length - 1);
        items.forEach((el, i) => el.classList.toggle('highlighted', i === suggestionIndex));
    } else if (e.key === "ArrowUp") {
        e.preventDefault();
        suggestionIndex = Math.max(suggestionIndex - 1, -1);
        items.forEach((el, i) => el.classList.toggle('highlighted', i === suggestionIndex));
    } else if (e.key === "Escape") {
        container.classList.remove('show');
        suggestionIndex = -1;
    }
});

function navBack() {
    const t = tabs.find(x => x.id === activeTabId);
    if (t && t.historyIndex > 0) { t.historyIndex--; t.url = t.history[t.historyIndex]; updateTabElement(t); switchTab(t.id); }
}
function navForward() {
    const t = tabs.find(x => x.id === activeTabId);
    if (t && t.historyIndex < t.history.length - 1) { t.historyIndex++; t.url = t.history[t.historyIndex]; updateTabElement(t); switchTab(t.id); }
}
function navReload() { const t = tabs.find(x => x.id === activeTabId); if (t && t.url !== "newtab://") updateTabElement(t); }
function openSettings() { document.getElementById('url').value = "settings://"; go(); }
function goHome() { document.getElementById('url').value = settings.homeUrl; go(); }

function updateNavButtons() {
    const t = tabs.find(x => x.id === activeTabId); if (!t) return;
    document.getElementById('btn-back').disabled = (t.historyIndex <= 0);
}

function createNewTab(url) {
    if (!url) url = settings.homeUrl || "newtab://";
    switchTab(createTabObject(url).id);
    saveState();
}

function closeTab(id, e) {
    if (e) e.stopPropagation();
    if (tabs.length === 1) {
        tabs[0].url = settings.homeUrl || "newtab://";
        tabs[0].history = [tabs[0].url];
        tabs[0].historyIndex = 0;
        updateTabElement(tabs[0]);
        switchTab(tabs[0].id);
        renderTabGrid();
        return;
    }
    const idx = tabs.findIndex(t => t.id === id);
    tabs[idx].element.remove(); tabs.splice(idx, 1);
    switchTab(tabs[Math.max(0, idx - 1)].id);
    renderTabGrid(); saveState();
}

/* ======================================================
   タブスイッチャー
====================================================== */
function toggleTabSwitcher() {
    const switcher = document.getElementById('tab-switcher');
    const isActive = switcher.classList.toggle('active');
    if (isActive) renderTabGrid();
}

function renderTabGrid() {
    const grid = document.getElementById('tab-grid');
    grid.innerHTML = '';
    tabs.forEach(t => {
        const card = document.createElement('div');
        card.className = `tab-card ${t.id === activeTabId ? 'active' : ''}`;
        card.innerHTML = `
            <div class="tab-card-header">
                <img src="${getIconUrl(t.url)}" onerror="this.style.display='none'">
                <span>${esc(t.title)}</span>
                <div class="tab-close-x" onclick="closeTab(${t.id}, event)">×</div>
            </div>
            <div class="tab-card-body" onclick="switchTab(${t.id}); toggleTabSwitcher();">
                ${t.url === "settings://" ? "⚙️ 設定" : t.url === "newtab://" ? "🏠 ホーム" : "ページ"}
            </div>`;
        grid.appendChild(card);
    });
}

/* ======================================================
   ブックマーク
====================================================== */
let pendingBookmarkUrl = null;

function renderBookmarkBar() {
    const bar = document.getElementById('bookmark-bar');
    bar.innerHTML = '';
    if (settings.bookmarks.length === 0) { bar.classList.remove('visible'); return; }
    bar.classList.add('visible');
    settings.bookmarks.forEach(bm => {
        const div = document.createElement('div'); div.className = 'bm-item';
        div.innerHTML = `<img src="${getIconUrl(bm.url)}" onerror="this.style.display='none'"><span>${esc(bm.title)}</span>`;
        div.onclick = () => { document.getElementById('url').value = bm.url; go(); };
        bar.appendChild(div);
    });
}

function updateStarUI() {
    const t = tabs.find(x => x.id === activeTabId);
    const bookmarkable = t && !SPECIAL_URLS.includes(t.url);
    const isB = bookmarkable && settings.bookmarks.some(b => b.url === t.url);
    const menuStar = document.getElementById('menu-star');
    if (isB) menuStar.classList.add('star-active');
    else menuStar.classList.remove('star-active');
}

function toggleBookmark() {
    const tab = tabs.find(t => t.id === activeTabId);
    if (!tab || SPECIAL_URLS.includes(tab.url)) return;
    const idx = settings.bookmarks.findIndex(b => b.url === tab.url);
    if (idx > -1) settings.bookmarks.splice(idx, 1);
    else {
        pendingBookmarkUrl = tab.url;
        document.getElementById('bm-name-input').value = tab.title;
        document.getElementById('bookmark-modal').classList.add('open');
        setTimeout(() => document.getElementById('bm-name-input').focus(), 50);
        return;
    }
    updateStarUI(); renderBookmarkBar(); saveState();
}

function closeBookmarkModal() {
    document.getElementById('bookmark-modal').classList.remove('open');
    pendingBookmarkUrl = null;
}

function confirmBookmark() {
    const name = document.getElementById('bm-name-input').value.trim();
    if (!name) return;
    settings.bookmarks.push({ title: name, url: pendingBookmarkUrl });
    pendingBookmarkUrl = null;
    closeBookmarkModal();
    updateStarUI(); renderBookmarkBar(); saveState();
}

document.getElementById('bm-name-input').addEventListener('keydown', e => {
    if (e.key === 'Enter') confirmBookmark();
    if (e.key === 'Escape') closeBookmarkModal();
});

function renderHistoryInto(container) {
    const h = settings.history || [];
    let html = '<h2 style="margin-top:0;">📜 履歴</h2>';
    if (h.length === 0) {
        html += '<p style="opacity:0.5;font-size:14px;">履歴はありません</p>';
    } else {
        html += '<button class="btn" onclick="settings.history=[];saveState();renderHistoryInto(document.querySelector(\'.settings-page\'));" style="margin-bottom:12px;">🗑 すべて削除</button>';
        html += '<div style="display:flex;flex-direction:column;gap:6px;">';
        h.forEach((item, i) => {
            html += '<div style="display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:10px;border:1px solid var(--border-color);background:var(--toolbar-bg);">';
            html += '<div style="flex:1;display:flex;align-items:center;gap:8px;cursor:pointer;overflow:hidden;" onclick="openInNewTab(\'' + esc(item.url) + '\')">';
            html += '<img src="' + getIconUrl(item.url) + '" style="width:16px;height:16px;flex-shrink:0;" onerror="this.style.display=\'none\'">';
            html += '<div style="flex:1;overflow:hidden;"><div style="font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">' + esc(item.title) + '</div>';
            html += '<div style="font-size:12px;opacity:0.5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">' + esc(item.url) + '</div></div>';
            html += '<span style="font-size:11px;opacity:0.4;flex-shrink:0;">' + new Date(item.time).toLocaleString('ja-JP') + '</span>';
            html += '</div>';
            html += '<button style="font-size:12px;padding:4px 8px;flex-shrink:0;" class="btn" onclick="event.stopPropagation();settings.history.splice(' + i + ',1);saveState();renderHistoryInto(document.querySelector(\'.settings-page\'));">削除</button>';
            html += '</div>';
        });
        html += '</div>';
    }
    container.innerHTML = html;
}

function renderCookiesInto(container) {
    const domains = {};
    (settings.history || []).forEach(h => {
        try { const d = new URL(h.url).hostname; domains[d] = (domains[d] || 0) + 1; }
        catch(e) {}
    });
    let html = '<h2 style="margin-top:0;">🍪 Cookie管理</h2>';
    const keys = Object.keys(domains);
    if (keys.length === 0) {
        html += '<p style="opacity:0.5;font-size:14px;">データはありません</p>';
    } else {
        html += '<p style="font-size:13px;opacity:0.6;">訪問したドメインの一覧です。サイトデータを削除するには各ドメインを削除してください。</p>';
        html += '<button class="btn" onclick="if(confirm(\'すべての履歴を削除しますか？\')){settings.history=[];saveState();renderCookiesInto(document.querySelector(\'.settings-page\'));}" style="margin-bottom:12px;">🗑 すべて削除</button>';
        html += '<div style="display:flex;flex-direction:column;gap:4px;">';
        keys.forEach(d => {
            html += '<div style="display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border-radius:10px;border:1px solid var(--border-color);background:var(--toolbar-bg);">';
            html += '<span style="font-size:14px;">' + esc(d) + '</span>';
            html += '<button class="btn" onclick="if(confirm(\'' + esc(d) + ' のデータを削除しますか？\')){settings.history=settings.history.filter(h=>!h.url.includes(\'' + esc(d) + '\'));saveState();renderCookiesInto(document.querySelector(\'.settings-page\'));}">削除</button>';
            html += '</div>';
        });
        html += '</div>';
    }
    container.innerHTML = html;
}

window.openInNewTab = function(url) {
    createNewTab(url);
};

/* ======================================================
   ニュータブページ
====================================================== */
function renderNewtabInto(container) {
    const now = new Date();
    const timeStr = now.toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' });
    const dateStr = now.toLocaleDateString('ja-JP', { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' });

    let catsHtml = '';
    for (const cat of DEFAULT_NT_LINKS()) {
        let linksHtml = '';
        for (const link of cat.links) {
            linksHtml += `
            <div class="nt-link" onclick="window.ntOpen(${cat.id},${link.id})">
                <img src="https://icons.duckduckgo.com/ip3/${(() => { try { return new URL(link.url).hostname; } catch(e) { return 'example.com'; }})()}.ico" onerror="this.style.display='none'">
                <span>${esc(link.title)}</span>
            </div>`;
        }
        catsHtml += `
        <div class="nt-cat" data-catid="${cat.id}">
            <div class="nt-cat-header">
                <span class="nt-cat-label">${esc(cat.name)}</span>
            </div>
            <div class="nt-links">
                ${linksHtml}
            </div>
        </div>`;
    }

    container.innerHTML = `
        <div class="nt-header">
            <div class="nt-clock" id="nt-clock">${timeStr}</div>
            <div class="nt-date" id="nt-date">${dateStr}</div>
        </div>
        <div class="nt-search-row">
            <input id="nt-search" type="text" placeholder="ツールを検索...">
            <button onclick="window.ntSearch()">検索</button>
        </div>
        <div class="nt-body">
            <div class="nt-top-bar">
                <h3>ツール &amp; リンク</h3>
            </div>
            <div class="nt-categories">${catsHtml}</div>
        </div>`;

    startClock();

    const si = container.querySelector('#nt-search');
    if (si) {
        si.addEventListener('input', window.ntSearch);
        si.addEventListener('keydown', e => { if (e.key === 'Enter') window.ntSearch(); });
    }
}

function startClock() {
    if (clockTimer) clearInterval(clockTimer);
    clockTimer = setInterval(() => {
        const c = document.getElementById('nt-clock');
        const d = document.getElementById('nt-date');
        if (!c) { clearInterval(clockTimer); clockTimer = null; return; }
        const now = new Date();
        c.textContent = now.toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' });
        if (d) d.textContent = now.toLocaleDateString('ja-JP', { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' });
    }, 1000);
}

/* ---- ニュータブ グローバル関数 ---- */
window.ntOpen = function(catId, linkId) {
    const cat  = DEFAULT_NT_LINKS().find(c => c.id === catId);
    const link = cat && cat.links.find(l => l.id === linkId);
    if (link) { document.getElementById('url').value = link.url; go(); }
};

window.ntSearch = function() {
    const input = document.getElementById('nt-search');
    if (!input) return;
    const query = input.value.toLowerCase();
    const categories = document.querySelectorAll('.nt-cat');
    categories.forEach(cat => {
        const links = cat.querySelectorAll('.nt-link');
        let visibleCount = 0;
        links.forEach(link => {
            const titleSpan = link.querySelector('span');
            if (titleSpan) {
                const title = titleSpan.textContent.toLowerCase();
                if (title.includes(query)) {
                    link.style.display = 'flex';
                    visibleCount++;
                } else {
                    link.style.display = 'none';
                }
            }
        });
        cat.style.display = visibleCount > 0 ? 'block' : 'none';
    });
};

/* ======================================================
   インポート / エクスポート
====================================================== */
function stamp() {
    const d = new Date();
    const p = n => String(n).padStart(2, '0');
    return `${d.getFullYear()}${p(d.getMonth() + 1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}`;
}

function readJSON(key, fallback) {
    try {
        const v = JSON.parse(localStorage.getItem(key));
        return (v === null || v === undefined) ? fallback : v;
    } catch(e) { return fallback; }
}

function serializeTabs() {
    return tabs.map(t => ({
        id: t.id, url: t.url, title: t.title,
        history: t.history, historyIndex: t.historyIndex,
        active: t.id === activeTabId
    }));
}

/* すべてのプロファイルの保存データを集める（現在のプロファイルはメモリ上の最新値を使う） */
function collectProfileData() {
    const out = {};
    profiles.forEach(p => {
        if (p.id === activeProfileId) {
            out[p.id] = {
                settings: JSON.parse(JSON.stringify(settings)),
                tabs: serializeTabs(),
                lastActive: activeTabId
            };
        } else {
            out[p.id] = {
                settings: readJSON(pkFor(p.id, 'settings'), {}),
                tabs: readJSON(pkFor(p.id, 'sessions'), []),
                lastActive: readJSON(pkFor(p.id, 'last-active'), null)
            };
        }
    });
    return out;
}

function collectExportSections() {
    const el = id => document.getElementById(id);
    return {
        tabs:      !!(el('ex-tabs')      && el('ex-tabs').checked),
        history:   !!(el('ex-history')   && el('ex-history').checked),
        bookmarks: !!(el('ex-bookmarks') && el('ex-bookmarks').checked),
        settings:  !!(el('ex-settings')  && el('ex-settings').checked),
        profiles:  !!(el('ex-profiles')  && el('ex-profiles').checked)
    };
}

function buildExport(sections, kind) {
    sections = sections || collectExportSections();
    const any = sections.tabs || sections.history || sections.bookmarks || sections.settings || sections.profiles;
    if (!any) return null;
    const obj = {
        app: "IBrowser",
        kind: kind || "partial",
        version: 1,
        exportedAt: new Date().toISOString(),
        profile: (profiles.find(p => p.id === activeProfileId) || {}).name || "",
        data: {}
    };
    if (sections.tabs)      obj.data.tabs = serializeTabs();
    if (sections.history)   obj.data.history = settings.history || [];
    if (sections.bookmarks) obj.data.bookmarks = settings.bookmarks || [];
    if (sections.settings) {
        const { history, bookmarks, ...rest } = settings;  // 履歴/ブックマークは専用項目で書き出す
        obj.data.settings = rest;
    }
    if (sections.profiles) {
        obj.activeProfileId = activeProfileId;
        obj.data.profiles = profiles.map(p => ({ id: p.id, name: p.name }));
        obj.data.profilesData = collectProfileData();
    }
    return obj;
}

function allSections() {
    return { tabs: true, history: true, bookmarks: true, settings: true, profiles: true };
}

function downloadText(text, filename) {
    try {
        const blob = new Blob([text], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        a.style.display = 'none';
        document.body.appendChild(a);
        a.click();
        setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 3000);
    } catch(e) {
        alert('ダウンロードに失敗しました。「JSONを表示」からコピーして保存してください。\n' + e.message);
        openJSONModal('エクスポートJSON（コピー用）', text);
    }
}

function exportSelected() {
    const obj = buildExport();
    if (!obj) { alert('エクスポートする項目を1つ以上選択してください'); return; }
    downloadText(JSON.stringify(obj, null, 2), 'ibrowser-data-' + stamp() + '.json');
}

function showSelectedJSON() {
    const obj = buildExport();
    if (!obj) { alert('エクスポートする項目を1つ以上選択してください'); return; }
    openJSONModal('エクスポートJSON（コピー用）', JSON.stringify(obj, null, 2));
}

function exportBackup() {
    const obj = buildExport(allSections(), 'backup');
    downloadText(JSON.stringify(obj, null, 2), 'ibrowser-backup-' + stamp() + '.json');
}

/* ---- 復元 ---- */
function applyProfiles(d, mode, activeId) {
    const replace = mode === 'replace';
    const imported = (d.profiles || []).map(p => ({ id: p.id, name: String(p.name || 'プロファイル') })).filter(p => p.id != null);
    if (replace) profiles = imported.slice();
    else imported.forEach(p => { if (!profiles.some(x => String(x.id) === String(p.id))) profiles.push(p); });
    if (!profiles.length) profiles = [{ id: 1, name: 'デフォルト' }];
    if (!profiles.some(p => String(p.id) === String(activeProfileId))) {
        activeProfileId = profiles[0].id;
        setActiveProfileId(activeProfileId);
    }
    saveProfiles();

    const pdata = d.profilesData || {};
    imported.forEach(p => {
        const pd = pdata[p.id] || pdata[String(p.id)];
        if (!pd) return;
        if (pd.settings) localStorage.setItem(pkFor(p.id, 'settings'), JSON.stringify(pd.settings));
        if (pd.tabs) localStorage.setItem(pkFor(p.id, 'sessions'), JSON.stringify(pd.tabs));
        if (pd.lastActive != null) localStorage.setItem(pkFor(p.id, 'last-active'), JSON.stringify(pd.lastActive));
    });
    if (activeId != null && profiles.some(p => String(p.id) === String(activeId))) setActiveProfileId(activeId);
}

function mergeList(current, incoming, keyFn) {
    const seen = new Set((current || []).map(keyFn));
    const out = (current || []).slice();
    (incoming || []).forEach(item => {
        const k = keyFn(item);
        if (!seen.has(k)) { seen.add(k); out.push(item); }
    });
    return out;
}

function applyPartialImport(d, mode) {
    const replace = (mode === 'replace');
    const done = [];

    if (d.settings && typeof d.settings === 'object') {
        const { history, bookmarks, ...rest } = d.settings;
        settings = { ...settings, ...rest };
        done.push('設定');
    }

    if (Array.isArray(d.bookmarks)) {
        const bms = d.bookmarks.filter(b => b && b.url);
        settings.bookmarks = replace ? bms.slice() : mergeList(settings.bookmarks, bms, b => b.url);
        done.push('ブックマーク ' + bms.length + '件');
    }

    if (Array.isArray(d.history)) {
        const hs = d.history.filter(h => h && h.url);
        let list = replace ? hs.slice() : mergeList(settings.history, hs, h => h.url + '@' + h.time);
        list.sort((a, b) => (b.time || 0) - (a.time || 0));
        settings.history = list.slice(0, 500);
        done.push('履歴 ' + hs.length + '件');
    }

    if (Array.isArray(d.tabs)) {
        const list = d.tabs.filter(t => t && t.url);
        if (replace) {
            tabs.slice().forEach(t => { if (t.element) t.element.remove(); });
            tabs = []; activeTabId = null;
        }
        const base = Date.now();
        let targetId = null;
        list.forEach((t, i) => {
            if (!replace && tabs.some(x => x.url === t.url)) return;
            const id = base + i;
            const created = createTabObject(t.url, id, t.title || t.url, t.history, t.historyIndex || 0);
            if (t.active && targetId === null) targetId = created.id;
        });
        if (!tabs.some(t => t.id === activeTabId)) {
            switchTab(targetId != null ? targetId : tabs[tabs.length - 1].id);
        }
        done.push('タブ ' + list.length + '件');
    }

    saveState();
    setDarkMode(settings.darkMode);
    document.body.classList.remove('toolbar-top', 'toolbar-bottom');
    document.body.classList.add('toolbar-' + (settings.toolbarPos || 'bottom'));
    applyAppHeight();
    renderBookmarkBar();
    applyZoom();
    updateZoomUI();
    const sp = document.querySelector('.settings-page');
    if (sp) renderSettingsInto(sp);
    if (document.getElementById('tab-switcher').classList.contains('active')) renderTabGrid();
    return done;
}

function importFromText(text) {
    let obj;
    try { obj = JSON.parse(text); }
    catch(e) { alert('JSONの形式が不正です'); return false; }
    if (!obj || typeof obj !== 'object' || Array.isArray(obj)) { alert('対応していないJSONです'); return false; }

    const d = obj.data || obj;
    const modeEl = document.getElementById('import-mode');
    const mode = (modeEl && modeEl.value === 'replace') ? 'replace' : 'merge';
    const modeLabel = mode === 'replace' ? '置き換え' : '追加（マージ）';

    // プロファイルを含む（全バックアップ）→ 全体を復元して再読み込み
    if (Array.isArray(d.profiles) && d.profiles.length) {
        const names = d.profiles.map(p => p.name).join(' / ');
        if (!confirm(`プロファイルを含むバックアップを復元します。\n\nプロファイル: ${names}\n件数: ${d.profiles.length}\n動作: ${modeLabel}\n\n現在のデータが上書きされます。よろしいですか？`)) return false;
        applyProfiles(d, mode, obj.activeProfileId);
        alert('復元しました。再読み込みします。');
        location.reload();
        return true;
    }

    // 通常の部分インポート
    const parts = [];
    if (d.settings) parts.push('設定');
    if (Array.isArray(d.bookmarks)) parts.push('ブックマーク ' + d.bookmarks.length + '件');
    if (Array.isArray(d.history)) parts.push('履歴 ' + d.history.length + '件');
    if (Array.isArray(d.tabs)) parts.push('タブ ' + d.tabs.length + '件');
    if (!parts.length) { alert('インポートできるデータが見つかりませんでした'); return false; }

    if (!confirm(`次のデータを「${modeLabel}」でインポートします。\n\n・${parts.join('\n・')}`)) return false;

    const done = applyPartialImport(d, mode);
    alert('インポートしました。\n\n・' + done.join('\n・'));
    return true;
}

function handleImportFile(input) {
    const file = input.files && input.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => { importFromText(String(reader.result || '')); input.value = ''; };
    reader.onerror = () => { alert('ファイルを読み込めませんでした'); input.value = ''; };
    reader.readAsText(file);
}

function openJSONModal(title, text) {

}

function copyJSONModal() {
    const ta = document.getElementById('json-modal-text');
    if (!ta.value) { alert('コピーする内容がありません'); return; }
    ta.focus(); ta.select();
    let ok = false;
    try { ok = document.execCommand('copy'); } catch(e) { ok = false; }
    if (ok) { alert('コピーしました'); return; }
    if (navigator.clipboard) {
        navigator.clipboard.writeText(ta.value)
            .then(() => alert('コピーしました'))
            .catch(() => alert('コピーできませんでした。手動で選択してコピーしてください。'));
    } else {
        alert('コピーできませんでした。手動で選択してコピーしてください。');
    }
}

function importFromModal() {
    const text = document.getElementById('json-modal-text').value.trim();
    if (!text) { alert('JSONが空です'); return; }
    if (importFromText(text)) closeJSONModal();
}

/* ======================================================
   フルスクリーン
====================================================== */
function toggleFullscreen() {
    const docEl = document.documentElement;
    const requestFS = docEl.requestFullscreen || docEl.webkitRequestFullscreen || docEl.mozRequestFullScreen || docEl.msRequestFullscreen;
    if (requestFS) {
        if (!document.fullscreenElement && !document.webkitFullscreenElement) requestFS.call(docEl).catch(() => fallbackPseudoFullscreen());
        else exitFullscreen();
    } else { fallbackPseudoFullscreen(); }
}
function fallbackPseudoFullscreen() { document.body.classList.add('pseudo-fullscreen'); }
function exitFullscreen() {
    const exitFS = document.exitFullscreen || document.webkitExitFullscreen || document.mozCancelFullScreen || document.msExitFullscreen;
    if (exitFS && (document.fullscreenElement || document.webkitFullscreenElement)) exitFS.call(document);
    document.body.classList.remove('pseudo-fullscreen');
}

document.addEventListener('click', e => {
    const menu = document.getElementById('menu-overlay');
    if (menu.style.display === 'flex' && !menu.contains(e.target) && !e.target.closest('#toolbar')) {
        menu.style.display = 'none';
    }
    const sc = document.getElementById('url-suggestions');
    const input = document.getElementById('url');
    if (sc && input && !sc.contains(e.target) && e.target !== input) {
        sc.classList.remove('show');
    }
});

/* ======================================================
   初期化
====================================================== */
function initProfile() {
    loadSettings();
    setDarkMode(settings.darkMode);
    applyAppHeight();

    const savedTabs = localStorage.getItem(pk('sessions'));
    if (savedTabs && JSON.parse(savedTabs).length > 0) {
        JSON.parse(savedTabs).forEach(t => createTabObject(t.url, t.id, t.title, t.history, t.historyIndex));
        const lastActive = parseInt(localStorage.getItem(pk('last-active')));
        switchTab((tabs.find(t => t.id === lastActive) || tabs[0]).id);
    } else {
        createNewTab(settings.homeUrl || "newtab://");
    }
    setToolbarPosition(settings.toolbarPos || 'bottom');
    renderBookmarkBar();
    updateZoomUI();
    applyZoom();
}

initZoomGestures();
initProfile();
</script>
