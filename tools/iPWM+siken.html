<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WebCrypto & Argon2 Password Manager</title>
<script src="https://cdn.jsdelivr.net/npm/argon2-browser@1.18.0/dist/argon2-bundled.min.js"></script>

    <link rel="icon" href="https://site.l-ituki8000.workers.dev/images/ipwm.html.png">
    <link rel="apple-touch-icon" href="https://site.l-ituki8000.workers.dev/images/ipwm.html.png">
    <meta name="apple-mobile-web-app-title" content="iPWM">
<style>
:root {
    --bg: #0f172a; --panel: #1e293b; --text: #f8fafc; --text-muted: #94a3b8;
    --accent: #3b82f6; --accent-hover: #2563eb; --danger: #ef4444; --border: #334155;
    --success: #10b981; --success-hover: #059669;
}

body {
    font-family: system-ui, sans-serif; background: var(--bg); color: var(--text);
    margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh;
}

.container {
    width: 100%; max-width: 500px; background: var(--panel); padding: 2rem;
    border-radius: 12px; box-sizing: border-box; display: none; box-shadow: 0 10px 25px rgba(0,0,0,0.5);
}

h2 { margin-top: 0; border-bottom: 1px solid var(--border); padding-bottom: 10px; }

#loading { text-align: center; color: var(--text-muted); font-size: 1.2rem; }

input, button {
    width: 100%; padding: 10px; margin-top: 10px; border-radius: 6px; box-sizing: border-box;
    border: 1px solid var(--border); background: var(--bg); color: var(--text); font-size: 1rem;
}

input:focus { outline: none; border-color: var(--accent); }

button {
    background: var(--accent); color: white; border: none; cursor: pointer; font-weight: bold; margin-top: 15px;
}
button:hover { background: var(--accent-hover); }

.btn-secondary { background: transparent; border: 1px solid var(--accent); color: var(--accent); }
.btn-secondary:hover { background: rgba(59, 130, 246, 0.1); }
.btn-danger { background: transparent; border: 1px solid var(--danger); color: var(--danger); }
.btn-danger:hover { background: rgba(239, 68, 68, 0.1); }
.btn-success { background: var(--success); border-color: var(--success); }
.btn-success:hover { background: var(--success-hover); }

.error-msg { color: var(--danger); display: none; margin-top: 5px; font-size: 0.85rem; }

.vault-item { background: var(--bg); border: 1px solid var(--border); padding: 15px; border-radius: 6px; margin-top: 10px; }
.flex-row { display: flex; gap: 10px; align-items: center; }
</style>
</head>

<body>

<div id="loading">Loading Argon2 & WebCrypto...</div>

<div id="setup-view" class="container">
    <h2>Set Master Password</h2>
    <p style="font-size: 0.85rem; color: var(--text-muted);">初回セットアップ（Argon2id + AES-GCM 256bit）</p>
    <input type="password" id="setup-pwd" placeholder="Master Password">
    <input type="password" id="setup-pwd-confirm" placeholder="Confirm Password">
    <div id="setup-error" class="error-msg"></div>
    <button onclick="setupMaster()" id="btn-setup">Start Setup</button>
</div>

<div id="login-view" class="container">
    <h2>Unlock Vault</h2>
    <input type="password" id="login-pwd" placeholder="Master Password" onkeydown="if(event.key==='Enter') login()">
    <div id="login-error" class="error-msg">Unlock failed. Password incorrect or data corrupted.</div>
    <button onclick="login()" id="btn-login">Unlock</button>
    
    <div style="margin-top: 30px; border-top: 1px solid var(--border); padding-top: 20px;">
        <p style="font-size: 0.85rem; color: var(--text-muted); margin: 0;">データを復元する</p>
        <button class="btn-secondary" onclick="document.getElementById('import-file').click()">Import JSON Backup</button>
        <input type="file" id="import-file" style="display:none" accept=".json" onchange="importData(event)">
    </div>

</div>

<div id="main-view" class="container" style="max-width: 600px;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
        <h2>My Vault</h2>
        <button class="btn-secondary" style="width: auto; padding: 5px 15px; margin: 0;" onclick="exportData()">Export</button>
    </div>
    
    <input type="text" id="search-input" placeholder="🔍 Search App or Email..." oninput="renderVault()" style="margin-top: 0; margin-bottom: 20px;">
    
    <div id="item-form-container" style="background: var(--panel); border: 1px solid var(--border); padding: 15px; border-radius: 6px; margin-bottom: 20px; transition: border-color 0.3s;">
        <label id="form-label" style="font-size: 0.85rem; color: var(--text-muted); font-weight: bold;">Add New Item</label>
        <div class="flex-row">
            <input type="text" id="new-app" placeholder="App Name">
            <input type="text" id="new-email" placeholder="Email / User">
        </div>
        <input type="text" id="new-pass" placeholder="Password (ex: mySecret123)" style="font-family: monospace;">
        
        <div class="flex-row" style="margin-top: 15px;">
            <button id="btn-save-item" onclick="saveOrUpdateItem()" style="margin-top: 0; flex-grow: 1;">+ Add to Vault</button>
            <button id="btn-cancel-edit" class="btn-secondary" onclick="cancelEdit()" style="display:none; margin-top: 0; width: auto; padding: 0 20px;">Cancel</button>
        </div>
    </div>

    <div id="vault-list"></div>
</div>

<script>
let vault = {
    items: [], folders: [], meta: { version: 1, created: Date.now() }
};

let vaultKey = null;
let editingId = null;

const enc = new TextEncoder();
const dec = new TextDecoder();

window.onload = () => {
    setTimeout(safeInit, 500);
};

function safeInit() {
    try {
        const loading = document.getElementById('loading');
        const cipher = localStorage.getItem('pm_cipher');
        const salt = localStorage.getItem('pm_salt');

        if (loading) loading.style.display = 'none';

        if (cipher && salt) {
            showView('login-view');
        } else {
            showView('setup-view');
        }
    } catch (e) {
        console.error(e);
        fallbackUI();
    }
}

function fallbackUI() {
    document.getElementById('loading').style.display = 'none';
    document.getElementById('setup-view').style.display = 'block';
}

function showView(id) {
    document.querySelectorAll('.container').forEach(v => v.style.display = 'none');
    const el = document.getElementById(id);
    if (el) el.style.display = 'block';
    if (id === 'main-view') renderVault();
}

function toB64(buf) {
    return btoa(String.fromCharCode(...new Uint8Array(buf)));
}

function fromB64(b64) {
    if (!b64) return null;
    return Uint8Array.from(atob(b64), c => c.charCodeAt(0));
}

async function deriveKey(pwd, salt) {
    const result = await argon2.hash({
        pass: pwd, salt: salt, time: 3, mem: 1024 * 32, hashLen: 32, type: argon2.argon2id
    });
    return crypto.subtle.importKey("raw", result.hash, { name: "AES-GCM" }, false, ["encrypt", "decrypt"]);
}

async function saveVault() {
    try {
        if (!vaultKey) return;
        const iv = crypto.getRandomValues(new Uint8Array(12));
        const data = enc.encode(JSON.stringify(vault));
        const cipher = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, vaultKey, data);
        localStorage.setItem("pm_iv", toB64(iv));
        localStorage.setItem("pm_cipher", toB64(cipher));
    } catch (e) {
        console.error(e);
    }
}

async function setupMaster() {
    try {
        const pwd = document.getElementById('setup-pwd').value;
        const conf = document.getElementById('setup-pwd-confirm').value;
        const err = document.getElementById('setup-error');
        const btn = document.getElementById('btn-setup');

        if (pwd.length < 4) { err.innerText = "too short"; err.style.display = "block"; return; }
        if (pwd !== conf) { err.innerText = "not match"; err.style.display = "block"; return; }

        btn.innerText = "Generating Key...";
        btn.disabled = true;

        const salt = crypto.getRandomValues(new Uint8Array(16));
        localStorage.setItem("pm_salt", toB64(salt));

        vaultKey = await deriveKey(pwd, salt);
        vault = { items: [], folders: [], meta: { version: 1, created: Date.now() } };
        await saveVault();
        showView('main-view');

    } catch (e) {
        console.error(e);
        fallbackUI();
    }
}

async function login() {
    const err = document.getElementById('login-error');
    const btn = document.getElementById('btn-login');

    try {
        const pwd = document.getElementById('login-pwd').value;
        const salt = fromB64(localStorage.getItem('pm_salt'));
        const iv = fromB64(localStorage.getItem('pm_iv'));
        const cipher = fromB64(localStorage.getItem('pm_cipher'));

        if (!salt || !iv || !cipher) throw new Error("missing data");

        btn.innerText = "Decrypting...";
        btn.disabled = true;

        const key = await deriveKey(pwd, salt);
        const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv }, key, cipher);

        vault = JSON.parse(dec.decode(plain));
        vaultKey = key; 
        
        if (!vault.items) vault.items = [];
        err.style.display = "none";
        document.getElementById('login-pwd').value = ""; 
        showView('main-view');

    } catch (e) {
        console.error(e);
        err.style.display = "block";
        btn.innerText = "Unlock";
        btn.disabled = false;
    }
}

async function saveOrUpdateItem() {
    const app = document.getElementById('new-app').value;
    const email = document.getElementById('new-email').value;
    const pass = document.getElementById('new-pass').value;
    
    if(!app || !pass) return alert("App Name and Password are required!");
    
    if (editingId) {
        const item = vault.items.find(v => v.id === editingId);
        if (item) {
            item.app = app;
            item.email = email;
            item.pass = pass;
        }
        cancelEdit();
    } else {
        vault.items.push({ id: Date.now(), app, email, pass });
        
        document.getElementById('new-app').value = "";
        document.getElementById('new-email').value = "";
        document.getElementById('new-pass').value = "";
    }

    await saveVault();
    renderVault();
}

function startEdit(id) {
    const item = vault.items.find(v => v.id === id);
    if(!item) return;

    editingId = id;
    
    document.getElementById('new-app').value = item.app || "";
    document.getElementById('new-email').value = item.email || "";
    document.getElementById('new-pass').value = item.pass || "";
    
    document.getElementById('form-label').innerText = "✏️ Edit Item";
    document.getElementById('form-label').style.color = "var(--success)";
    document.getElementById('item-form-container').style.borderColor = "var(--success)";
    
    const btnSave = document.getElementById('btn-save-item');
    btnSave.innerText = "✓ Update Item";
    btnSave.className = "btn-success";
    
    document.getElementById('btn-cancel-edit').style.display = "block";

    document.getElementById('new-app').focus();
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

function cancelEdit() {
    editingId = null;
    
    document.getElementById('new-app').value = "";
    document.getElementById('new-email').value = "";
    document.getElementById('new-pass').value = "";
    
    document.getElementById('form-label').innerText = "Add New Item";
    document.getElementById('form-label').style.color = "var(--text-muted)";
    document.getElementById('item-form-container').style.borderColor = "var(--border)";
    
    const btnSave = document.getElementById('btn-save-item');
    btnSave.innerText = "+ Add to Vault";
    btnSave.className = "";
    
    document.getElementById('btn-cancel-edit').style.display = "none";
}

function renderVault() {
    const list = document.getElementById('vault-list');
    const searchQuery = (document.getElementById('search-input').value || "").toLowerCase();
    list.innerHTML = "";

    const filteredItems = vault.items.filter(v => 
        (v.app && v.app.toLowerCase().includes(searchQuery)) || 
        (v.email && v.email.toLowerCase().includes(searchQuery))
    );

    if (filteredItems.length === 0) {
        list.innerHTML = "<p style='text-align:center;color:#94a3b8;'>No items found</p>";
        return;
    }

    [...filteredItems].reverse().forEach(v => {
        const div = document.createElement("div");
        div.className = "vault-item";
        
        const safeApp = escapeHTML(v.app);
        const safeEmail = escapeHTML(v.email);
        const safePass = escapeHTML(v.pass);

        div.innerHTML = `
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:5px;">
                <strong style="font-size:1.1rem;">${safeApp}</strong>
                <button class="btn-secondary" style="width:auto; padding:3px 12px; margin:0; font-size:0.85rem;" onclick="startEdit(${v.id})">✏️ Edit</button>
            </div>
            <div style="font-size:0.85rem; color:var(--text-muted); margin-bottom:10px;">${safeEmail}</div>
            <div class="flex-row">
                <input type="password" value="${safePass}" id="pwd-${v.id}" readonly style="margin:0; font-family:monospace; flex-grow:1;">
                <button class="btn-secondary" style="width:auto; padding:8px 12px; margin:0;" onclick="toggleVis('pwd-${v.id}')">👁️</button>
                <button class="btn-secondary" style="width:auto; padding:8px 12px; margin:0;" onclick="copyToClip('${safePass}')">Copy</button>
            </div>
        `;
        list.appendChild(div);
    });
}

function toggleVis(id) {
    const input = document.getElementById(id);
    input.type = input.type === 'password' ? 'text' : 'password';
}

function copyToClip(str) {
    navigator.clipboard.writeText(str).then(() => {
        alert("クリップボードにコピーしました");
    });
}

function escapeHTML(str) {
    return (str||'').replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag]));
}

function exportData() {
    const data = {
        salt: localStorage.getItem('pm_salt'),
        iv: localStorage.getItem('pm_iv'),
        cipher: localStorage.getItem('pm_cipher')
    };
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `vault_export_${new Date().getTime()}.json`;
    a.click();
    URL.revokeObjectURL(url);
}

function importData(e) {
    const file = e.target.files[0];
    if (!file) return;
    
    const reader = new FileReader();
    reader.onload = ev => {
        try {
            const data = JSON.parse(ev.target.result);
            if (data.salt && data.iv && data.cipher) {
                localStorage.setItem('pm_salt', data.salt);
                localStorage.setItem('pm_iv', data.iv);
                localStorage.setItem('pm_cipher', data.cipher);
                alert("データをインポートしました。マスターパスワードでロック解除してください。");
                location.reload();
            } else {
                alert("無効なバックアップファイルです。");
            }
        } catch (err) {
            alert("ファイルの読み込みエラー");
        }
    };
    reader.readAsText(file);
}
</script>

</body>
</html>
